5": "1. 마테오 리치와 서광계가 한역한 《기하원본(幾何原本)》 : 고대 그리스 수학자 유클리드의 기하학 원론을 한문으로 번역한 《기하원본》은 조선 실학자들에게 완전히 새로운 논리적 충격을 준 책이었습니다.\n\n2. 점·선·면의 정의에서 출발하는 완벽한 논리 체계 : 황윤석은 결과 공식 위주였던 기존 동양 산학서와 달리, '점은 부분이 없는 것이다'라는 기본 정의와 공리에서 시작해 한 치의 빈틈도 없이 도형의 성질을 증명해 나가는 서양 기하학의 치밀한 논증 방식에 깊이 감탄했습니다.\n\n3. 동양의 구고술과 서양 기하학의 결합 : 그는 《기하원본》의 삼각형·원·비례 정리들을 자신의 산학 체계 속에 흡수하여 천문 측량과 토지 계산의 정확도를 한 단계 끌어올렸습니다.\n\n4. 동서양 수리 논리의 융합 : 좋은 학문이라면 동양과 서양의 경계를 가리지 않고 받아들인 개방적 탐구 정신을 보여줍니다.", "2-46": "1. 오동나무와 명주실의 비율 계산 : 거문고나 가야금의 현(명주실 줄)을 몇 가닥씩 꼬아 만들면 어떤 음이 나는지, 줄의 굵기와 장력, 괘의 간격을 수학적 비율로 정리했습니다.\n\n2. 돌로 만든 타악기 편경(編磬)의 두께 공식 : 특히 기역(ㄱ) 자 모양의 경석(돌) 16개를 매달아 치는 궁중 악기 편경은 돌의 길이가 같더라도 두께가 조금만 두꺼워지면 소리가 높아지는데, 그 두께의 미세한 비율을 소수점 단위로 산출했습니다.\n\n3. 온도·습도에 따른 악기 소리 변화 고려 : 날씨와 계절에 따라 관악기의 공기 밀도와 현악기 줄의 팽팽함이 달라져 음정이 변하는 현상까지 세심하게 기록했습니다.\n\n4. 세종 대 박연의 악학을 잇다 : 조선 초기 박연이 이룩한 아악 정비의 과학적 전통을 18세기 수리 음향학으로 다시 부활시킨 업적입니다.", "2-47": "1. 사람의 생명을 좌우하는 약재 저울(약칭) : 옛 의서(상한론·동의보감 등)에 적힌 처방대로 한약을 지을 때, 중국 한나라·당나라 때의 '1냥'과 18세기 조선의 '1냥' 무게가 서로 달라 약을 너무 과하게 쓰거나 부족하게 쓰는 위험이 있었습니다.\n\n2. 시대별 저울 눈금의 정밀 환산표 작성 : 황윤석은 고대부터 당·송·명·청 및 조선에 이르기까지 시대에 따라 변해온 저울의 무게(수·냥·돈·푼)를 기장 알갱이 무게와 동전(개원통보·상평통보) 무게를 기준으로 정확히 환산해 놓았습니다.\n\n3. 가족과 이웃의 약을 지을 때 실제로 적용 : 이렇게 검증한 정확한 약재 도량형 덕분에 그는 일기 속에서 가족과 고향 사람들의 병을 치료할 때 오차 없는 안전한 처방을 내릴 수 있었습니다.\n\n4. 생명을 살리는 실증 고증학 : 도량형 연구가 단순한 옛날 제도 공부가 아니라 당장 눈앞의 환자를 살리는 실용 의학의 기초였음을 보여줍니다.", "2-48": "1. 불길한 징조에서 천체 현상으로의 인식 전환 : 전통 사회에서 혜성(살별)이나 유성(별똥별), 객성(신성)의 출현은 흔히 전쟁이나 역모의 징조로 여겨졌으나, 황윤석은 이를 일정한 법칙을 가진 천문 현상으로 관찰했습니다.\n\n2. 출현 방위와 이동 경로의 날짜별 추적 : 밤하늘에 혜성이 나타나면 며칠 동안 어느 별자리(28수)에서 시작해 꼬리를 어느 방향으로 드리우며 몇 도씩 이동했는지 일기에 연속해서 기록했습니다.\n\n3. 역사상 혜성·일식 기록의 주기성 분석 : 《문헌비고》와 역대 사서에 기록된 수천 년간의 천문 기록을 모아 천체 현상들이 일정한 수학적 주기를 가지고 되풀이된다는 점에 주목했습니다.\n\n4. 근대 천문학으로 가는 길목 : 하늘의 별자리를 두려움의 대상이 아닌 관측과 계산의 대상으로 바라본 과학적 태도가 잘 드러납니다.", "2-49": "1. 숫자 하나만 틀려도 전체가 무너지는 수표(數表) 작업 : 《이수신편》과 일기에는 삼각함수표에 해당하는 할원표, 역법 계산표, 제곱근표 등 수만 개의 숫자가 빼곡히 적힌 표가 수록되어 있습니다.\n\n2. 역산(거꾸로 계산하기)을 통한 이중·삼중 검산 : 황윤석은 덧셈과 곱셈으로 답을 구한 뒤에는 반드시 뺄셈과 나눗셈으로 거꾸로 역산하여 처음 숫자가 정확히 나오는지 확인한 뒤에야 정서(깨끗이 적음)했습니다.\n\n3. 한자 숫자의 오기 방지 표기 : 베껴 쓰는 과정에서 '일(一)·이(二)·삼(三)'이나 '십(十)·천(千)'이 획 하나 차이로 헷갈리지 않도록 문맥과 자릿수를 명확히 대조하며 세 번씩 교정(삼교)을 보았습니다.\n\n4. 인간 컴퓨터라 불릴 만한 정밀함 : 전자계산기도 없던 시절 오직 산가지와 붓만으로 현대 컴퓨터 계산 결과와 일치하는 수표를 만들어낸 집념이 놀랍습니다.", "2-50": "1. 호남 실학의 학통 형성과 전수 : 황윤석이 구축한 방대한 수리·천문·음운·지리학 연구는 그의 제자들과 호남 유림에게 전수되어 19세기 호남 실학이 꽃피는 든든한 자양분이 되었습니다.\n\n2. 18~19세기 백과전서파 학풍의 선도 : 그의 《이수신편》은 이수광의 《지봉유설》, 이익의 《성호사설》을 이어 서유구의 《임원경제지》, 이규경의 《오주연문장전산고》로 나아가는 조선 후기 백과전서파 학문의 핵심 고리를 이루었습니다.\n\n3. 국어학·과학사·기후사 연구의 일급 사료 : 오늘날 현대 학자들에게도 그의 저술은 18세기 한국어 방언과 음운, 전통 수학사, 소빙하기 기후를 복원하는 데 대체 불가능한 보물창고로 활용되고 있습니다.\n\n4. 시대를 초월한 지식인의 모범 : 지방의 작은 서재에서도 세계적인 수준의 과학·어학 연구를 해낼 수 있음을 보여준 조선 지성사의 자부심입니다.", "3-11": "1. 선비의 필수 문방구와 수험서 : 황윤석의 여행 짐(행장)에는 과거 시험장에서 쓸 최고급 붓 여러 자루, 먹, 휴대용 작은 벼루(휴대연), 답안지용 큰 종이(시지), 그리고 말 안장 위에서도 읽을 수 있는 소형 경서와 운서(시 짓기 발음 사전)가 가장 먼저 챙겨졌습니다.\n\n2. 상비약과 노자(엽전 꾸러미) : 일주일 넘는 노숙과 물갈이 배탈에 대비해 청심환, 불환금정기산, 기응환 같은 상비약 주머니와 주막 숙식비로 쓸 구리 엽전(상평통보) 꾸러미 및 환표(어음)를 깊숙이 넣었습니다.\n\n3. 갈아입을 옷가지와 비옷(유삼) : 봄가을의 큰 일교차와 갑작스러운 소나기에 대비해 기름 먹인 종이 우비(유삼·갈모), 여벌의 버선과 짚신, 미투리를 꼼꼼히 챙겼습니다.\n\n4. 소매 속의 미니 일기장 : 무엇보다 여행 중 매일의 이동 경로와 지출을 적을 휴대용 수첩인 《서행일력(西行日曆)》과 묵통은 언제나 그의 품속에 있었습니다.", "3-12": "1. 험한 길의 든든한 동반자 노비 : 지방 선비가 한양까지 올라갈 때는 무거운 책짐과 침구, 엽전 꾸러미를 지고 말 고삐를 잡으며 주막 심부름을 도맡아 줄 집안의 믿음직한 노비(하인) 한두 명이 반드시 동행했습니다.\n\n2. 조랑말의 컨디션 관리가 여행의 성패 : 하루에 70~100리(약 30~40km)씩 걸어야 하는 말의 발굽(편자)이 상하거나 말이 지치면 시험 날짜에 늦을 수 있었기에, 주막에 닿을 때마다 말에게 따뜻한 콩죽을 쑤어 먹이고 다리를 주물러 주었습니다.\n\n3. 한양 체류 중 하인과 말의 유지비 : 한양에 도착한 뒤에도 하인의 밥값과 말의 사료(마초) 값이 선비 본인의 하숙비 못지않게 많이 들었기 때문에, 장기 체류할 때는 하인과 말을 먼저 고향으로 돌려보내기도 했습니다.\n\n4. 주종을 넘어선 길 위의 고생 : 비바람 치는 고갯길을 함께 넘으며 고생한 노비의 이름과 수고로움이 일기 곳곳에 기록되어 있습니다.", "3-13": "1. 삼남대로를 따라 올라가는 7~8일의 대장정 : 흥덕 구수동을 출발해 정읍, 태인, 전주, 여산, 공주(금강), 천안, 직산, 수원, 과천을 거쳐 한강 남쪽 나루터에 이르기까지 보통 7일에서 9일이 걸렸습니다.\n\n2. 동작진과 노량진 나루터의 장관 : 과천 남태령 고개를 넘어 한강 변에 다다르면 전국 팔도에서 과거를 보러 올라온 유생들과 말, 짐꾼들이 나룻배(진선)를 타기 위해 구름처럼 몰려들어 인산인해를 이루었습니다.\n\n3. 숭례문(남대문) 입성과 도성의 활기 : 나룻배로 한강을 건너 마침내 거대한 숭례문 성문 안으로 들어서면, 기와집이 끝없이 이어진 한양 도성의 번화한 시전 거리와 종루가 지방 선비의 눈앞에 펼쳐졌습니다.\n\n4. 《서행일력》에 담긴 시간별 경로 : 황윤석은 어느 마을에서 몇 리를 걸어 어디서 점심을 먹었는지 18세기 삼남대로의 정밀한 여행 지도를 남겼습니다.", "3-14": "1. 경서 해석 시험인 생원시(生員試) : 소과(사마시)는 두 분야로 나뉘는데, 생원시는 사서오경(대학·논어·맹자·중용 및 시·서·역 등)의 깊은 뜻을 묻는 경학 시험(의·의)이었습니다.\n\n2. 시(詩)와 부(賦)를 짓는 문학 시험 진사시(進士試) : 반면 진사시는 주어진 제목과 운자에 맞춰 아름다운 한시(고시·율시)와 산문시(부·賦)를 짓는 문예 창작 시험이었습니다.\n\n3. 당대 최고 인기였던 '백패 진사' : 18세기 당시에는 문학적 재능을 뽐내는 진사시의 인기가 훨씬 높아서 '젊은 진사, 늙은 생원'이라는 말이 있을 정도였으며, 두 시험에 모두 응시해 합격을 노리는 유생도 많았습니다.\n\n4. 황윤석의 1759년 진사시 합격 : 황윤석은 경학에도 밝았을 뿐 아니라 뛰어난 시재(詩才)를 발휘하여 1759년(영조 35) 31세의 나이로 당당히 진사시에 합격해 '황 진사'의 칭호를 얻었습니다.", "3-15": "1. 시험관(시관)에게 잘 보이는 앞자리 명당 : 과거 시험장(과장)에 만 명 넘는 유생이 몰리다 보니, 시제가 걸리는 게시판(현제판)이 잘 보이고 답안지를 빨리 낼 수 있는 앞쪽 평탄한 자리를 잡는 것이 당락에 큰 영향을 미쳤습니다.\n\n2. 전날 밤부터 벌어지는 선접(先接) 전쟁 : 이 때문에 힘센 하인이나 전문 자리 맡기꾼(선접꾼)들을 전날 밤부터 시험장 문 앞에 줄 세워 두고, 새벽에 문이 열리자마자 달려들어가 말뚝을 박고 자리를 차지하는 치열한 몸싸움이 벌어졌습니다.\n\n3. 같은 고향·문중끼리 뭉치는 '접(接)' 문화 : 지방에서 올라온 선비들은 혼자서는 자리를 지키기 어려워 고향 친구들이나 같은 학파끼리 수십 명씩 무리(접·接)를 지어 천막과 자리를 함께 방어했습니다.\n\n4. 일기에 묘사된 북새통 : 황윤석의 일기에는 과거장 문이 열릴 때 사람들이 넘어지고 갓이 부서지는 살벌한 현장이 사실적으로 그려져 있습니다.", "3-16": "1. 과거장의 상징이었던 거대한 양산 설우산(設雨傘) : 과거 시험은 야외 마당에서 치러졌기 때문에, 뙤약볕과 소나기, 바람을 막기 위해 긴 장대 끝에 기름종이로 만든 거대한 파라솔 모양의 우산(설우산·일산)을 땅에 꽂아 그늘을 만들었습니다.\n\n2. 수천 개의 우산이 펼쳐진 장관 : 시험장 안에 수천 개의 커다란 흰 우산이 빽빽하게 펼쳐진 모습은 조선 후기 풍속화에도 단골로 등장하는 과거장의 진풍경이었습니다.\n\n3. 돗자리 위의 하루 종일 사투 : 우산 아래에 돗자리(자리)를 깔고 앉아 벼루에 먹을 갈고, 아침부터 해 질 녘까지 주변의 소음 속에서 고도의 집중력으로 백일장 같은 글짓기 승부를 벌였습니다.\n\n4. 날씨와의 싸움 : 갑자기 거센 바람이 불어 우산이 날아가거나 먹물이 번져 답안지를 망치는 돌발 상황도 일기에 자주 등장합니다.", "3-17": "1. 새벽부터 밤까지 이어지는 마라톤 시험 : 새벽에 입장해 저녁 늦게 답안지를 내기까지 시험장 밖으로 나갈 수 없었기 때문에, 수험생들은 안에서 먹을 물과 점심거리를 직접 싸 들고 들어가야 했습니다.\n\n2. 소화가 잘되고 상하지 않는 수험생 도시락 : 긴장한 상태에서 체하지 않도록 주로 미숫가루(미수), 말린 밥(건반), 떡, 엿, 꿀물, 구운 고기포(육포) 등 간편하고 기력을 돋우는 음식을 먹거나, 동행한 하인이 작은 화로로 따뜻한 죽을 쑤어 올렸습니다.\n\n3. 수만 명이 모인 곳의 위생과 생리 현상 : 시험장 구석에 임시 뒷간을 마련하거나 휴대용 요강·대나무 통을 이용해야 했으며, 한여름 시험장에서는 더위와 악취로 고생하는 수험생이 속출했습니다.\n\n4. 체력이 곧 실력이었던 과거장 : 뛰어난 글솜씨 못지않게 극한의 야외 환경을 견뎌내는 강인한 체력과 정신력이 필수였습니다.", "3-18": "1. 이불만 한 크기의 두꺼운 최고급 한지 : 조선 후기 과거 답안지(시권·명지)는 일반 공책 크기가 아니라 가로가 1미터가 넘고 세로도 반 미터에 달하는 크고 두꺼운 최상급 닥종이(장지·백지)를 사용했습니다.\n\n2. 종이값만 해도 만만치 않았던 수험 비용 : 채점관의 눈에 잘 띄도록 희고 매끄럽게 다듬질(도침)한 고급 시권 종이는 한 장 가격이 쌀 몇 되 값에 맞먹었으며, 연습용과 예비용까지 여러 장을 사려면 큰돈이 들었습니다.\n\n3. 사전 검인을 받는 관인(官印) 절차 : 부정행위를 막기 위해 수험생은 미리 정해진 규격의 시권 종이를 사서 시험 전에 관청에 가져가 인적 사항을 적고 확인 도장(관인)을 받아야만 시험장에 들고 갈 수 있었습니다.\n\n4. 종가고문서에 현존하는 실물 시권 : 실제로 황윤석과 조상·후손들이 이 거대한 종이에 붓으로 정성껏 작성해 제출했던 실물 시권들이 오늘날 장서각에 그대로 보존되어 있습니다.", "3-19": "1. 수험생의 인적 사항을 풀로 붙여 가리는 봉미(封彌) : 답안지 오른쪽 끝에는 응시자의 성명, 생년(사주), 본관, 거주지, 그리고 아버지·할아버지·증조할아버지·외할아버지의 이름(사조 단자)을 적고 그 부분을 접어 풀로 단단히 봉인했습니다.\n\n2. 번호표(자호)로만 구별하는 블라인드 채점 : 봉인한 부분 위에는 천자문 글자와 숫자로 된 암호 같은 접수 번호(자호)만 적어, 채점관들이 누구의 답안지인지 전혀 모른 채 오직 글의 수준으로만 채점하게 했습니다.\n\n3. 대과에서 필체까지 숨기던 역서(易書) 제도 : 특히 중요한 대과(문과) 시험에서는 채점관이 수험생의 평소 글씨체(필체)를 알아보는 것조차 막기 위해, 서리들이 수험생의 검은 먹 글씨 답안지를 붉은 물감(주초)으로 똑같이 베껴 써서 채점관에게 올렸습니다.\n\n4. 공정성을 향한 제도적 장치 : 오늘날의 대학 입시 블라인드 채점 못지않게 정교했던 조선 시대 시험 관리 시스템을 보여줍니다.", "3-20": "1. 수만 장의 답안지와 채점관의 피로도 : 한 번의 과거 시험에 만 장이 넘는 답안지가 쏟아져 들어오다 보니, 몇 명 안 되는 채점관(시관)들이 모든 답안지를 끝까지 다 정독하기가 물리적으로 불가능에 가까웠습니다.\n\n2. 일찍 낸 답안지(조정·일필)의 유리함 : 이 때문에 시험제가 걸리자마자 순발력 있게 글을 지어 가장 먼저 제출하는 수험생들의 답안지가 채점관들의 정신이 맑을 때 꼼꼼히 읽혀 합격 확률이 높다는 속설과 경쟁이 치열했습니다.\n\n3. 퇴고를 거듭한 황윤석의 정공법 : 반면 황윤석은 무조건 빨리 내기 위해 거칠게 글을 쓰기보다, 정확한 고증과 격조 높은 대구(對句)를 다듬어 완성도 높은 명답안을 제출하는 정공법을 택했습니다.\n\n4. 시권 여백의 제출 시각 표시 : 남아 있는 실물 시권들을 보면 답안지가 몇 번째 묶음으로 접수되었는지 기록된 흔적을 확인할 수 있습니다.", "3-21": "1. 9등급으로 매겨지던 과거 성적표 : 채점관들은 답안지를 읽고 최고 등급인 상상(上上)부터 상중(上中), 상하(上下), 중상, 중중, 중하, 차상(次上), 차중, 차하(次下)까지 세분화된 등급을 매겼습니다.\n\n2. 명문장에 찍어주던 동그라미 비점(批點) : 수험생의 글 중 비유가 기막히거나 경서 인용이 탁월한 구절 옆에는 채점관이 붓으로 붉은 동그라미(권점)나 점(비점)을 연달아 찍으며 감탄을 표시했습니다.\n\n3. 한 줄 평으로 남긴 시관의 심사평(비어) : 답안지 윗부분이나 끝부분에는 '문장이 유려하고 기상이 높다'와 같은 채점관의 짤막한 심사평과 서명(착명)이 적혔습니다.\n\n4. 가문의 가보가 된 장원 시권 : 높은 등급과 찬사를 받아 합격한 답안지는 채점이 끝난 뒤 본인에게 돌려주었으며, 집안에서는 이를 족자나 첩으로 만들어 대대로 가보로 보관했습니다.", "3-22": "1. 합격 소식을 가장 먼저 알리는 문희(聞喜) : 과거 합격자 명단(방)이 발표되면, 발 빠른 하인들이나 광대(창우·재인)들이 합격자의 한양 숙소나 고향 본가로 달려가 가장 먼저 합격의 기쁜 소식을 전하고 상금(노자)을 받았습니다.\n\n2. 합격자 마당에서 펼쳐지는 광대들의 줄타기와 재주 : 진사나 문과에 합격하면 전라도·충청도의 전문 예인 집단인 광대(창우)를 불러 합격 축하 잔치(문희연)에서 줄타기, 땅재주, 소리, 익살극을 펼치게 하는 풍습이 있었습니다.\n\n3. 일기에 적힌 창우 비용 지출 : 황윤석의 일기에도 집안이나 사우 중에 과거 합격자가 나왔을 때 광대(창우)들에게 주었던 축하금과 음식 대접 내역이 생생하게 기록되어 있습니다.\n\n4. 판소리와 민속 예술의 후원자 : 양반가의 이러한 과거 합격 축하 연회는 18세기 호남 판소리 명창과 광대 예술이 발전하는 중요한 경제적 기반이 되었습니다.", "3-23": "1. 임금님이 하사한 백패(白牌)와 어사화 : 진사시 합격자들은 대궐(창경궁·창덕궁 등)에 들어가 국왕에게 흰 종이에 적힌 합격 증서인 백패(白牌)와 술을 하사받고, 복두에 화려한 어사화를 꽂았습니다.\n\n2. 3일간의 화려한 도성 거리 행진 유가(遊街) : 이후 합격자는 말을 타고 앞에 악대(세악수)와 광대를 세운 채 3일 동안 한양 시내의 스승, 친척, 선배 관원들의 집을 돌며 인사하는 거리 퍼레이드(유가)를 벌였습니다.\n\n3. 고향 구수동에서의榮光스러운 문희연 : 한양 행사가 끝나고 고향에 내려오면 조상 사당에 백패를 바쳐 고하고(알묘), 온 마을 사람들과 인근 고을 선비들을 초청해 며칠간 큰 잔치를 열었습니다.\n\n4. 영광 뒤에 숨은 만만치 않은 비용 : 일기와 가계 기록을 보면 이 유가 행렬과 잔치, 악대 비용으로 수십 냥의 큰돈이 들어가 가난한 선비 집안에는 행복한 고민거리가 되기도 했습니다.", "3-24": "1. 같은 해 합격한 100명의 평생 동기 '동년(同年)' : 조선 시대에는 같은 해 과거 시험에 나란히 합격한 동기생들을 '동년(同年)'이라 부르며, 나이나 당파를 떠나 형제처럼 각별한 의리를 지켰습니다.\n\n2. 합격자 앨범 《기사년 사마방목(司馬榜目)》 간행 : 황윤석이 합격한 1759년(기사년) 생원·진사 합격자들도 각자의 이름, 자, 생년, 본관, 거주지, 가족 사항을 모아 오늘날의 졸업앨범 같은 《사마방목》을 인쇄해 한 권씩 나누어 가졌습니다.\n\n3. 경조사를 함께 챙기는 동년계(同年契) : 동기생들은 기금을 모아 동년계를 조직하고, 훗날 관직에 나갔을 때 서로 끌어주거나 부모상·혼사가 있을 때 부조금을 보내며 평생 연락을 이어갔습니다.\n\n4. 전국 인맥의 핵심 축 : 지방 선비였던 황윤석이 팔도의 명사들과 폭넓은 교유망을 맺을 수 있었던 데에는 이 1759년 진사 동기들의 네트워크가 큰 힘이 되었습니다.", "3-25": "1. 조선 최고의 국립대학 성균관(태학) 입학 : 생원·진사시에 합격한 사람은 성균관(成均館) 유생이 되어 명륜당에서 강의를 듣고 기숙사인 동재·서재에서 숙식하며 대과(문과)를 준비할 자격을 얻었습니다.\n\n2. 새벽 북소리에 맞춰 일어나는 엄격한 일과 : 성균관 기숙사에서는 매일 새벽 북소리에 맞춰 일어나 의관을 정제하고, 식당에 줄지어 들어가 밥을 먹으며, 매달 초하루와 보름에는 대성전(공자 사당)에 참배해야 했습니다.\n\n3. 유생 자치회(재회)의 높은 규율 : 기숙사 내부에는 유생 대표인 장의(掌議)를 중심으로 한 엄격한 자치 규율이 있어서, 예의에 어긋나거나 학업을 게을리하면 유생들 스스로 벌을 주었습니다.\n\n4. 전국 엘리트들과의 진검승부 : 황윤석은 성균관과 반촌을 오가며 당대 최고의 수재들과 학문을 겨루고 중앙 학계의 흐름을 직접 호흡했습니다.", "3-26": "1. 밥 두 끼를 먹어야 찍어주는 출석 도장 원점(圓點) : 성균관에서는 유생들의 기숙사 출석을 확인하기 위해, 아침과 저녁 두 끼를 모두 성균관 식당(식당)에서 먹은 날에만 출석부에 둥근 점(원점·圓點) 하나를 찍어주었습니다.\n\n2. 원점 300점을 채워야 주어지는 대과 응시 자격 : 보통 1년에 이 원점을 300점(즉 300일 출석) 이상 채워야만 성균관 유생에게 주어지는 특별한 대과 시험(관시·알성시 등)에 응시할 자격이 주어졌습니다.\n\n3. 일기에 적힌 '식당 출입'과 원점 계산 : 황윤석의 한양 유학 시절 일기를 보면 '오늘 식당에 들어가 원점을 찍었다'거나 '현재까지 원점이 몇 점 모였다'고 꼼꼼하게 세어 나가는 수험생의 일상이 생생히 나옵니다.\n\n4. 재정 부담을 덜어준 국비 장학 식당 : 나라에서 무료로 제공하는 이 성균관 식당 밥은 고향에서 올라온 가난한 지방 유생들에게 식비를 아껴주는 큰 혜택이기도 했습니다.", "3-27": "1. 고향 송금이 끊겼을 때의 아찔한 위기 : 장마나 폭설로 전라도 고향에서 하인이 여비(노자)를 가지고 올라오는 날짜가 늦어지면, 당장 하숙집 밥값과 땔감 값을 내지 못해 곤경에 처하곤 했습니다.\n\n2. 한양에 머무는 호남 동향 선비들과의 상부상조 : 이럴 때 황윤석은 한양에 올라와 있는 호남 출신 친척이나 사우, 혹은 관직에 있는 지인을 찾아가 급전을 잠시 빌려(차용) 급한 불을 껐습니다.\n\n3. 상인 어음(환표)을 통한 자금 융통 : 또는 나중에 고향에서 세금이나 상업 자금으로 올라올 돈과 맞바꾸기로 하고 한양 상인이나 전주 상인에게 어음(환)으로 돈을 먼저 빌려 쓰기도 했습니다.\n\n4. 1푼까지 갚고 기록한 신용 : 돈을 빌린 날과 갚은 날, 이자와 감사의 표시로 보낸 작은 선물까지 일기에 한 치의 오차도 없이 적어두어 그의 철저한 신용을 보여줍니다.", "3-28": "1. 걸어 다니는 서점이자 북큐레이터 서쾌(書儈) : 18세기 한양에는 선비들의 하숙집과 사랑방을 직접 찾아다니며 귀한 중국 서적과 조선의 필사본 책을 구해주고 중개 수수료를 받는 전문 책장수 '서쾌(책거간꾼)'들이 활약했습니다.\n\n2. 황윤석과 서쾌들의 단골 거래 : 책 욕심이 남달랐던 황윤석은 한양에 머물 때마다 이 서쾌들을 통해 시골에서는 구경조차 할 수 없는 최신 역법서, 산학서, 음운학 서적의 목록을 받아보고 구매하거나 며칠간 빌려 보았습니다.\n\n3. 비싼 책은 밤새워 직접 베껴 쓰기(초록) : 책값이 너무 비싸 살 수 없는 경우에는 서쾌나 지인에게 며칠만 빌린 뒤, 잠을 줄여가며 핵심 내용을 자신의 공책에 통째로 필사해 두었습니다.\n\n4. 18세기 한양의 출판·유통사 : 일기 속 서적 구입·대여 기록은 당시 서울에서 어떤 지식과 책들이 얼마의 가격에 유통되었는지 알려주는 귀중한 지표입니다.", "3-29": "1. 밤 10시 종루에서 울려 퍼지는 28번의 종소리(인정) : 매일 밤 10시경(이경)이 되면 종각의 큰 종을 28번 치는 '인정(人定)'과 함께 한양의 4대문과 4소문이 굳게 닫히고 일반 남자들의 밤거리 통행이 전면 금지(야금)되었습니다.\n\n2. 순라꾼의 단속과 유생들의 밤공부 : 거리에는 포도청과 군영의 순라꾼들이 딱딱이를 치며 순찰을 돌았고, 유생들은 하숙방이나 성균관 기숙사에 모여 앉아 호롱불 아래서 밤늦도록 책을 읽거나 시를 지었습니다.\n\n3. 새벽 4시 파루(罷漏) 북소리와 하루의 시작 : 새벽 4시경(오경) 종을 33번 치는 '파루' 소리가 울려야 통행금지가 풀리고 성문이 열렸으며, 부지런한 황윤석은 이 파루 종소리를 들으며 일어나 새벽 독서를 시작했습니다.\n\n4. 소리로 기억되는 18세기 서울의 밤 : 고요한 한양의 밤하늘을 가르던 종소리와 하숙방 창문을 비추던 등불의 정취가 일기 속에 생생히 살아 있습니다.", "3-30": "1. 경화사족(서울 명문가) 중심의 과거와 관직 독점 : 18세기 후반에는 한양 도성에 대대로 거주하는 노론계 유력 가문(경화사족)들이 과거 시험 정보와 핵심 관직을 독점하면서, 실력 있는 지방 사족(향곡 유생)들이 소외되는 현상이 심화되었습니다.\n\n2. 서울 선비들의 텃세와 시골 선비의 자존심 : 일부 서울 유생들이 전라도·경상도에서 올라온 선비들의 사투리나 소박한 옷차림을 은근히 얕잡아 볼 때면, 황윤석은 압도적인 경학·산학 실력과 해박한 지식으로 그들의 코를 납작하게 만들어 주었습니다.\n\n3. 스승 김원행과 홍대용 등 진정한 지성들과의 교감 : 동시에 출신 지역을 가리지 않고 학문적 실력만을 존중했던 미호 김원행, 담헌 홍대용 같은 일류 학자들과는 깊은 존경과 우정을 나누며 학문적 자부심을 지켰습니다.\n\n4. 호남 지성의 당당한 기개 : 서울 중심의 학계에서도 조금도 주눅 들지 않고 당당히 실력으로 인정받았던 호남 선비의 기개가 잘 나타나 있습니다.", "3-31": "1. 국왕이 성균관 공자 사당에 참배한 날 열리는 번개 시험 : 알성시(謁聖試)는 임금이 성균관 문묘(대성전)에 나아가 공자에게 제사를 올린 뒤, 곧바로 명륜당이나 춘당대 마당에서 유생들을 모아 치르는 특별 과거였습니다.\n\n2. 초시·복시 구분 없이 단 하루에 결판나는 단판 승부 : 일반 과거는 지방 예선(초시)과 본선(복시·전시)을 거쳐 몇 달이 걸렸지만, 알성시는 그날 아침에 문제를 내고 저녁에 곧바로 당락을 발표하는 초고속 시험이었습니다.\n\n3. 전국 유생들의 구름 같은 집결 : 단 하루 만에 대과 급제자(홍패)가 될 수 있는 일생일대의 기회였기에, 알성시 소문이 돌면 황윤석을 비롯한 전국의 유생들이 한양으로 총집결했습니다.\n\n4. 일기에 기록된 알성시 도전기 : 황윤석 역시 성균관과 한양에 머물며 알성시와 정시에 응시했던 날의 시험 문제(시제)와 엄청난 인파를 일기에 상세히 남겼습니다.", "3-32": "1. 식당 밥을 거부하는 권당(捲堂)과 기숙사를 비우는 공관(空館) : 성균관 유생들은 나라의 정책이나 인사 처분이 유교적 도리에 어긋난다고 판단되면, 식당에 들어가지 않고 단식 농성을 하는 '권당'이나 아예 짐을 싸서 성균관을 일제히 나가는 '공관'으로 항의했습니다.\n\n2. 임금도 함부로 무시하지 못한 공론(公論)의 힘 : 유생들이 성균관을 비우면 국왕이 직접 승지를 보내 달래고(돈유) 유생들의 요구 사항을 경청해야 했을 만큼 성균관 학생운동의 정치적 무게감은 대단했습니다.\n\n3. 황윤석이 목격한 태학(성균관)의 기개 : 황윤석은 성균관 출입 시절 유생들이 연명으로 상소(태학소)를 올리고 권당을 벌이던 긴박한 논의 과정을 일기에 생생하게 기록했습니다.\n\n4. 지성인 집단의 자부심 : 단순한 수험생이 아니라 국가의 도덕과 여론을 지키는 최후의 보루라는 성균관 유생들의 자긍심을 보여줍니다.", "3-33": "1. 성균관 유생들을 뒷바라지하는 특별 구역 반촌(泮村) : 성균관을 둘러싼 마을인 반촌에는 대대로 성균관의 제사와 유생들의 식사·세탁·하숙을 담당하는 반인(泮人)들이 모여 살았습니다.\n\n2. 합법적으로 소를 잡고 고기를 팔던 현방(懸房) : 유교 국가 조선에서는 농사에 쓰는 소를 함부로 도살하는 것(우금)을 엄격히 금지했으나, 성균관 제사에 쓸 고기와 유생들의 체력 보충을 위해서만 특별히 반촌 사람들의 소 도축과 정육점(현방) 운영을 허락했습니다.\n\n3. 유생들의 최고 보양식 설렁탕과 갈비, 장국밥 : 이 덕분에 성균관 주변 반촌에는 신선한 소고기와 국밥을 파는 식당이 즐비했고, 황윤석을 비롯한 유생들도 공부에 지치면 반촌에서 고깃국으로 원기를 보충했습니다.\n\n4. 한양 식문화의 중심지 : 반촌은 지방 유생들이 가장 많이 하숙하면서도 한양에서 가장 맛있는 소고기 요리를 맛볼 수 있는 독특한 대학가였습니다.", "3-34": "1. 3년마다 자·오·묘·유년에 열리는 정규 시험 식년시(式年試) : 법전에 따라 3년에 한 번씩 정기적으로 열리는 식년시는 생원 100명, 진사 100명, 문과 33명을 뽑는 가장 기본이 되는 과거였습니다.\n\n2. 나라의 경사 때마다 열린 증광시(增廣試)와 별시(別試) : 왕실의 혼례, 세자 책봉, 국왕의 장수 축하 등 큰 경사가 있을 때마다 특별히 열리는 증광시와 별시, 정시(庭試)가 18세기에는 정규 시험보다 더 자주 열렸습니다.\n\n3. 지방 유생들의 잦은 상경 이유 : 특별 시험은 예고 기간이 짧고 한양에서 주로 치러졌기 때문에, 대과 급제를 노리는 지방 선비들은 소식이 들릴 때마다 부랴부랴 짐을 싸서 한양으로 올라오거나 아예 서울에서 장기 하숙을 해야 했습니다.\n\n4. 일기에 촘촘히 적힌 과거 일정 : 황윤석의 일기는 영조·정조 대에 어떤 명목으로 무슨 과거 시험이 열렸는지 빠짐없이 알려주는 수험 연표와 같습니다.", "3-35": "1. 시험관을 등지고 앉아 책 전체를 암송하는 배강(背講) : 구술시험인 강경(講經) 중에서도 가장 어려운 방식은 시험관과 마주 보지 않고 등지고 돌아앉아(배강), 뽑은 대목의 경서 원문과 주자의 주석까지 한 글자도 틀리지 않고 줄줄 외운 뒤 뜻을 설명하는 것이었습니다.\n\n2. 대나무 통에서 제비뽑기로 정하는 시험 범위(추생) : 사서삼경 중 어느 책의 어느 페이지가 나올지 현장에서 대나무 산통의 알을 뽑아 결정했기 때문에, 요행을 바랄 수 없고 책 전체를 통째로 머릿속에 넣어야만 통과할 수 있었습니다.\n\n3. 통(通)·약(略)·조(粗)·불(不)의 냉정한 판정 : 시험관들은 암송의 정확도와 이치 설명에 따라 통(합격 우수), 약(합격 보통), 조(간신히 통과), 불(불합격 탈락)의 성적을 즉석에서 매겼습니다.\n\n4. 강경에 강했던 학자 황윤석 : 평소 경서를 수백 번씩 읽고 뜻을 깊이 파고들었던 황윤석은 글짓기뿐 아니라 이 경서 강독에서도 탄탄한 실력을 발휘했습니다.", "3-36": "1. 왕과 선대 국왕의 이름을 범하면 즉각 실격되는 피휘(避諱) : 유교 사회에서 군주나 부모·조상의 실명(휘·諱)에 쓰인 한자를 글 속에 그대로 쓰는 것은 큰 불경으로 여겨 과거 시험에서 엄격한 금기 사항이었습니다.\n\n2. 획을 하나 빼거나(결획) 다른 글자로 바꾸어 쓰기(대자) : 만약 답안지를 쓰다가 어쩔 수 없이 해당 한자를 써야 할 때는 마지막 한 획을 일부러 쓰지 않고 비워두거나(결획), 뜻이 같은 다른 글자로 바꾸어 써야만 감점이나 실격을 면할 수 있었습니다.\n\n3. 시험장 입장 전 반드시 외워야 했던 금기 글자 목록 : 수험생들은 시험장에 들어가기 전 역대 조선 국왕들과 중국 황제의 피휘 글자 목록은 물론, 심지어 그날 채점관(시관) 집안의 금기 글자까지 미리 숙지하느라 진땀을 뺐습니다.\n\n4. 세심한 주의가 필요했던 수험 규칙 : 글솜씨가 아무리 뛰어나도 글자 하나 실수로 탈락할 수 있었던 당대 과거장의 긴장감을 보여줍니다.", "3-37": "1. 붓글씨 답안지에서 오자(誤字)가 났을 때의 대처법 : 종이값이 비싸고 시험 시간이 촉박해 글자 한두 개를 틀렸다고 큰 답안지(시권) 전체를 새로 쓸 수는 없었습니다.\n\n2. 공식 허용된 수정 표시인 도(塗, 지움)와 주(註, 끼워 넣음) : 법전 규정에 따라 잘못 쓴 글자는 먹으로 깔끔하게 점을 찍거나 줄을 그어 지우고, 빠뜨린 글자는 옆에 작은 글씨로 써넣은 뒤 답안지 끝에 '몇 자 지우고 몇 자 고쳐 썼음(도 몇 자, 주 몇 자)'이라고 명확히 밝혀 적으면 정상 답안으로 인정받았습니다.\n\n3. 채점 후의 글자 위조 방지 목적 : 수험생 스스로 수정한 글자 수를 끝에 적어두게 한 것은 채점 과정에서 제3자가 몰래 글자를 고치거나 덧쓰는 부정행위를 막기 위한 영리한 장치였습니다.\n\n4. 실물 시권에 남아 있는 교정 흔적 : 장서각에 소장된 평해황씨 가문의 실물 시권에서도 이러한 당대의 수정 표기법을 눈으로 직접 확인할 수 있습니다.", "3-38": "1. 시험장 밖에 순식간에 들어서는 거대한 임시 장터 : 과거 시험이 열리는 날이면 성균관이나 춘당대, 훈련원 주변 거리에는 전국에서 몰려든 수만 명의 유생과 하인들을 상대로 한 노점상들이 구름처럼 진을 쳤습니다.\n\n2. 국밥·떡·술 장수부터 붓·종이·우산 장수까지 : 따끈한 장국밥과 막걸리, 합격을 기원하는 엿과 찹쌀떡을 파는 음식 목판 장수는 물론, 깜빡하고 안 가져온 붓·먹·시권 종이나 자리(돗자리), 설우산을 현장에서 빌려주거나 파는 상인들이 대목을 누렸습니다.\n\n3. 낙방생들을 위로하는 선술집의 북적임 : 시험이 끝나고 문이 열리면 긴장이 풀린 수험생들이 거리 주막으로 쏟아져 나와 고향 친구들과 술잔을 기울이며 시험 문제 풀이와 아쉬움을 나누었습니다.\n\n4. 과거 시험이 움직인 한양 경제 : 과거 시험 한 번이 한양 도성의 숙박업, 요식업, 제지·문방구 상권을 어떻게 들썩이게 했는지 일기 속 물가 기록이 잘 보여줍니다.", "3-39": "1. 우체국이 없던 시절의 민간 우편망 '인편(人便)' : 당시에는 일반 백성을 위한 국가 우체국이 없었기 때문에, 한양으로 세금을 내러 오는 고을 아전이나 과거 보러 오는 동향 선비, 혹은 장사꾼(보부상)의 인편이 있을 때마다 편지(가서)를 맡겨 보냈습니다.\n\n2. 한양에서 고창까지 평균 7~10일 소요 : 급한 용무로 집안 노비를 직접 내려보내는 전인(專人)의 경우 6~7일 만에 도착했고, 다른 사람 편에 거쳐 거쳐 가는 편지는 보통 열흘에서 보름 정도가 걸렸습니다.\n\n3. 편지 끝에 꼭 적힌 발송 날짜와 받은 날짜 : 황윤석은 고향에서 아버지나 동생의 편지가 도착하면, 일기에 '어느 달 며칠에 고향에서 부친 편지를 오늘 누구의 인편으로 받아보았다'고 정확히 기록했습니다.\n\n4. 편지 한 통에 담긴 애타는 가족애 : 열흘 전의 고향 소식을 읽으며 부모님의 건강과 농사 걱정에 눈시울을 붉히던 타향 유학생의 마음이 그대로 전해집니다.", "3-40": "1. 지방에서는 구하기 힘든 한양의 명물 '경물(京物)' : 황윤석이 한양 생활을 마치고 고향 구수동으로 내려갈 때면, 아낀 생활비를 털어 종로와 광통교 시전에서 가족들에게 줄 작은 서울 선물을 정성껏 골랐습니다.\n\n2. 부모님을 위한 약재와 돋보기, 비단 주머니 : 연로하신 부모님과 집안 어른들을 위해서는 서울 약령시(구리개)에서 산 좋은 한약재(인삼·청심환 등)나 진귀한 건어물, 옷감을 챙겼습니다.\n\n3. 아내와 여동생, 아이들을 위한 바늘·참빗·색종이와 책 : 안방 식구들을 위해서는 품질 좋은 서울 바늘과 실패, 참빗, 동백기름, 거울을 사고, 어린 아들과 조카들을 위해서는 그림이나 글씨가 있는 책과 붓·먹을 사다 주었습니다.\n\n4. 선물 목록과 가격까지 적힌 자상함 : 누구에게 줄 선물을 몇 푼 주고 샀는지 일기장에 깨알같이 적어둔 대목에서 가장으로서의 자상함이 묻어납니다.", "3-41": "1. 북한강과 한강이 만나는 절경의 석실서원(石室書院) : 황윤석의 스승 미호 김원행이 머물던 석실서원은 한양 동쪽 경기도 양주 미음나루(현 남양주시 와부읍) 한강 변의 아름다운 절벽 위에 자리 잡고 있었습니다.\n\n2. 도보와 나룻배를 이용한 사제지간의 길 : 황윤석은 한양에서 동대문(흥인문) 밖으로 나와 뚝섬과 광나루를 거쳐 걸어가거나 한강 나룻배를 타고 석실서원으로 들어가 스승께 예를 올렸습니다.\n\n3. 서원 기숙사에서의 합숙 강학 : 서원에 도착하면 며칠씩 기숙사에 머물며 스승 김원행의 강의를 직접 듣고, 밤에는 한강 물소리를 들으며 전국에서 모인 동문들과 경학 토론을 벌였습니다.\n\n4. 평생 학문의 방향을 결정지은 성지 : 그에게 석실서원 가는 길은 단순한 외출이 아니라 진리를 구하러 가는 가장 설레고 경건한 순례길이었습니다.", "3-42": "1. 여름밤 하숙방의 불청객 빈대(벽슬)와 모기, 벼룩 : 18세기 한양의 좁은 초가나 오래된 기와집 하숙방에는 여름철이 되면 벽틈에 숨어 있던 빈대와 벼룩, 모기가 기승을 부려 지방 유생들을 밤새 괴롭혔습니다.\n\n2. 쑥 연기를 피우고 자리를 옮기며 버틴 여름밤 : 일기에는 빈대에 물려 온몸이 가려워 잠을 이루지 못하다가 마루로 나와 누운 이야기나, 쑥을 태워 모기를 쫓으며 책을 읽은 고생담이 사실적으로 적혀 있습니다.\n\n3. 귀한 책과 음식을 갉아 먹는 쥐와의 전쟁 : 또한 고향에서 보내온 밑반찬이나 아끼는 서적, 종이를 천장의 쥐가 갉아 먹지 못하도록 단속하는 것도 자취생의 중요한 일과였습니다.\n\n4. 미화되지 않은 진짜 서울살이 : 화려한 궁궐의 역사 뒤편에서 250년 전 서울 자취생들이 실제로 겪었던 생활의 애환을 미소 지으며 읽을 수 있습니다.", "3-43": "1. 타향 하숙방에서 홀로 앓는 서러움 : 가족과 멀리 떨어진 한양 하숙방에서 유행성 감기나 학질(말라리아), 물갈이 배탈로 고열이 나 드러누우면 객지의 외로움이 배가되었습니다.\n\n2. 호남 동향 친구들과 하숙집 주인의 따뜻한 손길 : 이럴 때면 근처에 하숙하던 전라도 고향 사우들과 동생 황주석, 그리고 인정 많은 하숙집 주인이 미음과 죽을 쑤어다 주고 밤새 약탕관을 지켜주었습니다.\n\n3. 스스로 진맥하고 처방전을 써서 구한 약 : 의학에 밝았던 황윤석은 자신의 맥을 직접 짚어보고 증세에 맞는 처방전을 적어 하인이나 벗을 구리개(을지로) 약전 거리로 보내 약재를 사 오게 해 달여 마셨습니다.\n\n4. 고향 부모님께는 걱정하실까 봐 숨긴 효심 : 몸이 다 나은 뒤에야 고향에 편지를 보내 부모님이 타향의 아들 때문에 가슴 졸이지 않도록 배려했습니다.", "3-44": "1. 국왕과 채점관이 던지는 시대적 화두 '책문(策問)' : 과거 시험 중 특히 대과에서는 고전 암기뿐 아니라 국방, 세금(균역법·환곡), 인재 등용, 탕평책 등 당대의 가장 뜨거운 국가 현안에 대한 해결책을 묻는 논술 시험(대책·책문)이 출제되었습니다.\n\n2. 영·정조 대 탕평 정국의 미묘한 가이드라인 : 당시 조정은 당쟁을 엄금하는 탕평책을 펴고 있었기에, 특정 당파의 입장만을 노골적으로 두둔하거나 국왕의 역린을 건드리면 아무리 글을 잘 써도 발탁되기 어려웠습니다.\n\n3. 역사적 고증과 실용적 대안을 결합한 답안 : 황윤석은 옛 성현의 말씀과 중국·조선의 역대 제도 변천사를 정확히 근거로 들면서, 산학과 실무에 기반한 합리적 해법을 제시하는 방식으로 답안을 구성했습니다.\n\n4. 시대를 읽는 지식인의 눈 : 문집과 일기에 남은 그의 과체문(과거 시험용 글)을 보면 당대 지식인들이 국가의 미래를 어떻게 고민했는지 잘 드러납니다.", "3-45": "1. 간이 삼삼하고 깔끔한 한양 음식 vs 풍성하고 깊은 맛의 호남 음식 : 전라도 고창의 풍성한 해산물과 깊은 장맛에 익숙했던 황윤석은 한양에서 처음 맛본 서울 음식들의 조리법과 맛의 차이를 흥미롭게 관찰했습니다.\n\n2. 서울의 명물 설렁탕·냉면·만두와 시절 음식 : 반촌 현방의 진한 소고기 국밥(설렁탕·장국밥), 겨울철 메밀국수와 만두, 봄철 한강에서 잡은 웅어회와 복어국 등 한양 도성에서 유행하던 별미들을 맛보고 기록했습니다.\n\n3. 타향에서 더욱 그리워진 고향 어머니의 손맛 : 하지만 서울 생활이 길어질수록 고향 구수동의 젓갈과 김치, 서해안의 싱싱한 조개와 생선구이가 그리워 고향에서 밑반찬 인편이 오기만을 손꼽아 기다렸습니다.\n\n4. 18세기 미식 기행록 : 오늘날의 지역별 맛집 비교처럼 250년 전 서울과 전라도의 식문화 차이를 생생하게 전해줍니다.", "3-46": "1. 지붕 없는 야외 마당에서 치러진 극한 시험 : 과거 시험장은 수만 명을 수용해야 했기에 지붕이 있는 건물 안이 아니라 궁궐 마당(춘당대)이나 성균관·훈련원의 넓은 노천 마당에서 치러졌습니다.\n\n2. 한여름 폭우에 젖는 답안지와 진흙탕 소동 : 시험 도중 갑자기 장대비가 쏟아지면 우산(설우산) 사이로 빗물이 들이쳐 공들여 쓴 답안지 먹물이 번지고 바닥이 진흙탕으로 변해 수험생들이 아우성을 쳤습니다.\n\n3. 한겨울 혹한 속 언 손을 녹이는 화로 : 반대로 늦가을이나 겨울철 과거에서는 칼바람에 벼루의 먹물이 얼어붙고 손가락이 굳어져, 작은 숯불 화로를 안고 입김을 불어가며 한 글자씩 써 내려가야 했습니다.\n\n4. 일기에 기록된 과장의 날씨 비화 : 황윤석은 어느 해 과거 날에 비가 오거나 추위가 닥쳐 수험생들이 얼마나 고생했는지 현장의 온도를 그대로 전합니다.", "3-47": "1. 서울 학계의 엄청난 장서량과 최신 정보 속도 : 황윤석이 한양의 명문가(경화사족) 사랑방과 학자들을 방문했을 때 가장 부러워하고 놀란 것은 베이징에서 막 들어온 수천 권의 최신 서적과 정밀한 서양 관측 기구들이었습니다.\n\n2. 시골 선비의 해박함에 도리어 깜짝 놀란 서울 학자들 : 그러나 막상 대화를 시작하면, 전라도 흥덕에서 올라온 황윤석이 서울의 전문 학자들도 혀를 내두를 만큼 산학(수학), 역법, 율려, 음운학의 세부 수치와 원전 구절을 줄줄 꿰고 있어 서울 인사들을 경탄하게 만들었습니다.\n\n3. 중인 기술관(산원·천문관·역관)들과의 수준 높은 토론 : 그는 관상감의 천문 관리나 호조의 산학 관리들과도 직접 만나 고난도 수학 문제와 역법 계산법을 토론하며 서로의 지식을 나누었습니다.\n\n4. 지방과 중앙의 지식 교류 : 한양 유학은 황윤석에게 최신 사료를 공급해 준 통로이자, 호남 실학의 저력을 서울 학계에 각인시킨 무대였습니다.", "3-48": "1. 낙방 후 빈털터리가 된 지방 유생들의 비애 : 큰마음을 먹고 한양에 올라왔으나 시험에 떨어지고 체류 기간이 길어지면서 귀향할 여비(노자)마저 바닥나는 유생들이 적지 않았습니다.\n\n2. 타고 온 말이나 아끼던 책을 팔아 여비 마련 : 당장 돈을 빌릴 친척이나 동향인이 없는 유생들은 눈물을 머금고 자신이 타고 올라온 조랑말을 서울 마시장에 팔거나, 아끼던 책과 갓·도포를 전당포나 서쾌에게 처분해 걸어서 내려가기도 했습니다.\n\n3. 동향 선비들의 십시일반 부조 : 황윤석은 고향이나 호남의 후배 유생들이 서울에서 여비가 떨어져 곤란을 겪으면 자신의 주머니 사정이 넉넉지 않아도 밥을 사 주고 노자를 보태주며 챙겼습니다.\n\n4. 따뜻한 동향애의 기록 : 각박한 타향살이 속에서 서로를 보듬어 주던 지방 선비들의 끈끈한 정이 일기에 잘 나타나 있습니다.", "3-49": "1. 20~30대 초반 유학생 시절의 설렘과 초조함 : 젊은 시절 과거를 보러 올라왔을 때의 일기에는 새로운 책과 명사를 만나는 학문적 열정과 함께, 언제쯤 합격해 부모님을 기쁘게 해드릴까 하는 청춘의 고뇌가 생생히 교차합니다.\n\n2. 30대 후반~50대 관원 시절의 원숙함과 책임감 : 반면 38세에 장릉참봉으로 출사한 뒤 종부시·사복시 등 서울 관원으로 생활할 때의 일기에는 국왕을 보좌하고 관청 행정을 챙기는 관료로서의 침착함과 정국을 꿰뚫어 보는 노련한 시각이 담겨 있습니다.\n\n3. 변하지 않은 단 한 가지, 독서와 기록 : 신분이 가난한 유학생에서 어엿한 조정의 관원으로 바뀌었어도, 퇴근 후 등불 아래서 책을 읽고 가계부와 일기를 쓰는 성실한 태도만큼은 조금도 변하지 않았습니다.\n\n4. 한 인간의 성장 드라마 : 한 사람의 청년기가 중년과 노년으로 어떻게 깊어져 가는지 54년의 시간을 따라가며 읽는 재미가 각별합니다.", "3-50": "1. 18세기 서울의 물가·교통·주거를 기록한 가장 정밀한 생활사 : 서울 토박이들은 너무 당연해서 적지 않았던 한양의 하숙비, 밥값, 땔감 값, 나루터 뱃삯, 서적 가격을 지방인의 꼼꼼한 눈으로 매일 기록해 남겼기 때문입니다.\n\n2. 사라진 옛 서울의 골목과 건물 복원 사료 : 성균관 반촌, 광통교, 종로, 남촌, 서대문 밖 등 18세기 한양의 구체적인 지명과 거리 풍경, 사람들의 이동 동선이 시간 단위로 생생히 살아 있습니다.\n\n3. 경향(서울과 지방) 네트워크의 실증 기록 : 한양의 지식과 뉴스가 어떤 경로와 속도로 전라도 시골까지 흘러갔는지 보여주는 가장 완벽한 정보 유통 보고서입니다.\n\n4. 타임머신 같은 독서 경험 : 그의 일기를 펼치면 마치 250년 전 한양 성문 안을 황윤석과 나란히 걸으며 구경하는 듯한 생생한 현장감을 느낄 수 있습니다.", "4-11": "1. 인조와 인열왕후를 모신 파주 장릉(長陵)의 수호 책임자 : 1766년(영조 42) 38세의 황윤석이 처음 제수받은 장릉참봉은 경기도 파주 교하에 위치한 제16대 인조대왕과 인열왕후의 능을 지키는 종9품 관직이었습니다.\n\n2. 매일 아침저녁 봉심(奉審)과 제향 준비 : 참봉의 가장 중요한 일과는 매일 아침 의관을 갖추고 능 위와 정자각, 비각을 돌아보며 석물이나 잔디에 이상이 없는지 살피는 '봉심'과 보름·초하루 및 기신제 제사를 준비하는 일이었습니다.\n\n3. 조용한 재실(齋室)에서의 독서와 연구 : 큰 제사가 없는 평소에는 왕릉 재실이 무척 한적했기 때문에, 당대 학자들은 학문에 전념할 수 있는 능참봉 자리를 오히려 최고의 독서 기회로 여겼습니다.\n\n4. 장릉 재실에서 꽃피운 저술 : 황윤석 역시 장릉참봉 근무 시절의 고요한 시간을 활용해 경학 연구와 《이수신편》 원고 집필을 크게 진척시켰습니다.", "4-12": "1. 왕릉의 생명과도 같았던 금산(禁山) 소나무 숲 : 조선 왕릉 주변의 울창한 소나무 숲(해자 안팎)은 신성한 구역으로 지정되어 나무 한 그루, 풀 한 포기 함부로 베는 것이 국법으로 엄금되었습니다.\n\n2. 수호군(능군) 지휘와 겨울철 도벌 단속 : 황윤석은 왕릉에 소속된 수호군과 산지기들을 지휘하여 밤마다 땔감을 훔쳐 가려는 도벌꾼들을 순찰하게 하고, 봄·가을 건조기에는 산불 예방에 만전을 기했습니다.\n\n3. 폭우나 강풍으로 소나무가 부러졌을 때의 보고 절차 : 비바람에 왕릉 소나무가 한 그루라도 쓰러지면 참봉이 직접 나무의 둘레와 길이를 자로 정확히 재어 예조(禮曹)에 서면으로 보고(첩보)해야 했습니다.\n\n4. 일기에 남은 꼼꼼한 산림 기록 : 그의 일기에는 장릉 숲의 나무 상태와 능역 보수 내역이 치수까지 정확히 기록되어 있어 그의 성실한 근무 태도를 보여줍니다.", "4-13": "1. 임금님의 식탁을 책임지는 사옹원(司饔院) : 황윤석이 역임한 사옹원 봉사는 국왕과 왕실의 수라상 식재료 조달 및 궁중 연회 음식을 관장하는 핵심 내명부·외명부 지원 관청이었습니다.\n\n2. 전국에서 올라오는 진상(進上) 식재료 검수 : 팔도에서 국왕께 바치는 싱싱한 생선, 과일, 건어물, 꿩고기 등이 상하지 않았는지 품질과 수량을 꼼꼼히 검수하여 주방(수라간)으로 넘기는 일을 맡았습니다.\n\n3. 조선 왕실 백자를 굽는 분원(分院) 도자기 관리 : 특히 사옹원은 경기도 광주 번천리 등에서 왕실용 순백자 그릇을 구워 올리는 관요(분원)를 총괄했기에, 궁중에 납품되는 도자기 그릇의 수량과 품질도 함께 점검했습니다.\n\n4. 궁중 식문화의 현장 목격 : 사옹원 근무 덕분에 황윤석은 18세기 궁중에서 실제로 어떤 식재료와 어물이 수라상에 올랐는지 일기에 생생히 남길 수 있었습니다.", "4-14": "1. 궁중의 쌀과 장(간장·된장)을 맡은 사도시(司導寺) : 정6품 사도시 주부로 승진한 황윤석은 대궐 안에서 소비되는 막대한 양의 입쌀, 찹쌀, 콩, 그리고 궁중 장고(醬庫)의 간장·된장·젓갈 출납을 관리했습니다.\n\n2. 수학 실력으로 잡아낸 창고의 눈속임 : 쌀과 콩 수천 석이 드나드는 창고에서는 서리와 창고지기들이 되와 말을 속이거나 장부를 부풀리는 부정이 흔했으나, 산학의 대가인 황윤 앞에서는 어림도 없었습니다.\n\n3. 정확한 부피와 무게 환산 : 그는 창고에 들어오는 공물 쌀의 실제 도량형과 손실분(모곡)을 정밀하게 계산하여 국고의 누수를 막고 투명하게 장부를 마감했습니다.\n\n4. 실학자 관료의 모범 : 책으로만 배운 수학이 아니라 국가 재정과 창고 관리에 즉각 적용된 실용 행정의 사례입니다.", "4-15": "1. 백관의 기강을 잡는 정6품 사헌부 감찰(監察) : 사헌부 감찰은 비록 정6품 실무직이었으나 '전중어사'라 불리며 조정의 모든 문무백관의 비행과 근무 태만을 감찰하고 탄핵할 수 있는 막강한 권한을 가졌습니다.\n\n2. 국가 대제사(제향)와 과거 시험장 부정 감독 : 나라의 큰 제사가 열릴 때 제물과 제관들의 불경을 감시하고, 과거 시험장이나 국고 출납 현장에 입회하여 부정이 없는지 매의 눈으로 살폈습니다.\n\n3. 감찰청 내부의 엄격한 예절과 기강 : 남을 감시하는 기관인 만큼 사헌부 감찰청 내부의 규율과 신참 신고식(면신례), 복장 규정은 어느 관청보다 엄격하기로 유명했습니다.\n\n4. 강직한 선비에게 어울린 직책 : 평소 원칙과 도덕성을 생명처럼 여겼던 황윤석은 사헌부 감찰로서 추호의 사사로움 없이 직무를 수행했습니다.", "4-16": "1. 국왕 직속 특별 사법기관 의금부(義禁府) : 의금부는 역모 사건이나 왕족·고위 관료들의 중대한 범죄를 국왕의 명으로 직접 체포·심문하는 오늘날의 대검찰청 중수부와 같은 기관이었습니다.\n\n2. 왕명을 받들고 죄인을 압송·유배 보내는 도사(都事) : 의금부 도사는 왕명(어명)이 떨어지면 즉각 지방으로 달려가 중죄인을 체포해 압송하거나, 유배지까지 죄인을 호송하고 때로는 사약을 집행하는 삼엄한 임무를 맡았습니다.\n\n3. 일기에 적힌 금부 숙직과 추국 소식 : 황윤석은 의금부 도사를 역임하며 궁중과 조정의 거대한 정치적 옥사들이 어떻게 처리되는지 사법 행정의 최전선에서 지켜보았습니다.\n\n4. 법 집행의 엄정함과 연민 : 국법을 엄정하게 집행하면서도 당쟁의 소용돌이 속에서 희생되는 인물들에 대한 인간적인 고뇌를 일기에 남겼습니다.", "4-17": "1. 왕세손(정조)을 지근거리에서 모신 세손익위사 : 황윤석은 영조 말년 왕세손(훗날의 정조)의 경호와 시강을 보조하는 세손익위사(翊衛司) 관원(부솔·사어 등)으로 근무하며 세손 시절의 정조를 가까이서 뵈었습니다.\n\n2. 밤낮으로 책을 놓지 않던 학구파 세손 : 일기에 기록된 세손(정조)은 정치적 위협 속에서도 흔들리지 않고 매일 강학(서연)에서 신하들과 깊이 있는 경학 토론을 벌이는 총명하고 침착한 청년이었습니다.\n\n3. 정조 즉위 후 윤대관 입시로 이어진 인연 : 세손 시절 익위사에서 성실히 근무했던 이 인연은 훗날 정조가 즉위한 뒤 1778년 선정전 윤대관 입시에서 정조가 황윤석을 반갑게 알아보며 직무를 묻는 장면으로 이어집니다.\n\n4. 두 사료의 감동적 교차 : 황윤석의 일기와 승정원일기 양쪽에 이 날의 만남이 날짜와 대화 내용까지 똑같이 기록되어 있습니다.", "4-18": "1. 해 뜰 녘 묘시(오전 5~7시) 출근, 해 질 녘 유시(오후 5~7시) 퇴근 : 조선 시대 중앙 관청의 기본 근무 시간은 묘시에 출근(사진·仕進)하여 출석부에 서명하고 유시에 퇴근(파사·罷仕)하는 것이 원칙이었습니다.\n\n2. 새벽어둠을 뚫고 출근하던 한양의 거리 : 특히 임금님의 아침 조회(상참·조참)가 있는 날에는 새벽 4시 파루 종소리가 울리자마자 하숙집을 나서 등불을 들고 대궐 문 앞에 대기해야 했습니다.\n\n3. 지각이나 결근 시의 추고(문책) : 정당한 병가(신병 정사) 없이 출근 시간에 늦거나 중요 행사에 빠지면 사헌부의 탄핵을 받거나 승정원을 통해 문책(추고)과 감봉 처분을 받았습니다.\n\n4. 만근에 가까웠던 황윤석의 성실함 : 황윤석의 관직 일기를 보면 눈보라가 치는 날에도 남들보다 먼저 관청에 도착해 업무를 준비하던 모범 공무원의 일상이 그대로 드러납니다.", "4-19": "1. 24시간 불이 꺼지지 않는 관청의 숙직(입번·직숙) : 모든 관청과 궁궐에는 밤사이 발생할 비상사태와 문서 수발, 화재 예방을 위해 관원들이 돌아가며 관청에서 잠을 자는 당직(입번) 제도가 있었습니다.\n\n2. 관청 숙직실의 고요한 독서 시간 : 황윤석은 관청 당직 날이면 저녁에 순찰과 문단속을 마친 뒤, 숙직실 등불 아래서 낮에 못다 읽은 책을 읽거나 고향에 보낼 편지와 그날의 일기를 길게 적었습니다.\n\n3. 동료 관원·서리들과 나누던 밤참(야식) : 추운 겨울밤 당직을 설 때면 함께 당직을 서는 동료 관원이나 하급 관리들에게 따뜻한 국밥이나 메밀국수, 약주를 사 주며 정을 나누기도 했습니다.\n\n4. 관청 밤풍경의 미시사 : 대궐 담장 너머로 들려오는 순라꾼의 딱딱이 소리와 종소리를 들으며 쓴 그의 숙직 일기는 한양 관가의 밤을 그림처럼 보여줍니다.", "4-20": "1. 종9품에서 정6품으로 올라가는 큰 벽 '참하(參下)에서 참상(參上)으로' : 조선 관제에서 7품~9품의 하위 관원(참하관)이 어엿한 중견 관원인 정6품 주부·감찰(참상관)이나 지방 수령으로 승진하는 것을 '출륙(出六, 6품으로 나감)'이라 불렀습니다.\n\n2. 출근 도장 450일~900일을 모아야 하는 사일(仕日) 제도 : 음직(문음) 출신 관원이 이 6품으로 승진하려면 단순히 세월만 보내는 것이 아니라, 실제 관청에 출근해 근무한 일수(사일)를 법정 기준(예: 450일 등)까지 하루하루 꼬박꼬박 채워야만 했습니다.\n\n3. 일기에 매일 카운트다운한 근무 일수 : 황윤석의 일기에는 '오늘 출근하여 사일(근무 일수)이 총 몇 일이 되었다, 6품 승진(출륙)까지 몇 일 남았다'고 날짜를 세며 희망을 품는 대목이 자주 나옵니다.\n\n4. 7년 만에 이룬 정6품 승진의 보람 : 1766년 종9품 참봉으로 시작해 성실히 근무 일수를 채운 끝에 1773년 마침내 정6품 종부시·사도시 주부로 승진하며 당당한 중견 관료가 되었습니다.", "4-21": "1. 음력 6월과 12월에 열리는 인사 평가 포폄(褒貶) : 조선 조정에서는 매년 여름(6월)과 겨울(12월) 두 차례에 걸쳐 각 관청의 최고 책임자(당상관)와 도 관찰사가 소속 관원들의 근무 성적을 상(上)·중(中)·하(下) 3등급으로 매겨 국왕에게 보고했습니다.\n\n2. 여덟 글자로 요약되는 한 줄 성적표(포폄 제목) : 성적표에는 단순히 등급만 적는 것이 아니라 '근무가 성실하고 문서 처리에 밝음(근간명습)' 같은 4자 또는 8자 요약 평어를 함께 적어 인사 기록에 남겼습니다.\n\n3. 연속 상(上) 등급을 받은 모범 관원 : 황윤석은 중앙 관청 재임 시절 뛰어난 문서 작성 능력과 꼼꼼한 회계 처리 덕분에 상관들로부터 거듭 최우수 등급인 '상(上)'을 받았습니다.\n\n4. 사료로 확인되는 인사 기록 : 이 포폄 결과는 승정원일기와 일기 양쪽에 기록되어 있어 당시 공무원 사회의 긴장감 넘치는 평가 풍경을 전해줍니다.", "4-22": "1. 국왕의 어보(도장)가 찍힌 공식 임명장 교지(敎旨) : 관원이 새로운 직책이나 품계에 임명되면 이조(吏曹)에서 작성하고 국왕의 '시명지보(施命之寶)'라는 거대한 붉은 옥새를 찍은 임명장(교지·고신)을 내려주었습니다.\n\n2. 사헌부와 사간원의 자격 심사 '서경(署經)' : 특히 5품 이하의 관원은 교지가 바로 나오는 것이 아니라, 사헌부와 사간원에서 이 사람의 가문(4대조)과 본인의 도덕성에 결격 사유가 없는지 심사해 승인(서경)해야만 정식으로 임명장을 받을 수 있었습니다.\n\n3. 집안의 최고 가보로 보관된 실물 교지들 : 황윤석이 장릉참봉부터 종부시·사복시주부, 진위현령·목천현감·전의현감에 임명될 때마다 받았던 수십 장의 실물 교지가 오늘날까지 고스란히 전해지고 있습니다.\n\n4. 일기와 실물 문서의 완벽한 일치 : 일기에 '오늘 무슨 관직 교지를 받았다'고 적은 바로 그 날짜가 적힌 실물 교지가 한국학중앙연구원 장서각에 그대로 남아 있어 전율을 느끼게 합니다.", "4-23": "1. 사모(모자)와 단령(관복), 각대(허리띠), 목화(신발) : 관원이 대궐에 들어가거나 공식 업무를 볼 때는 머리에 날개 달린 사모를 쓰고, 둥근 깃의 관복(단령)에 품계에 맞는 허리띠를 두르고 검은 가죽 장화(목화)를 신었습니다.\n\n2. 품계를 나타내는 관복 색깔과 흉배 : 영조·정조 대 기준으로 정3품 당상관 이상은 다홍색(홍단령)에 두 마리 학(쌍학) 흉배를, 3품 이하 당하관(황윤석 등)은 푸른색이나 녹색 계열 관복에 한 마리 학(단학) 흉배를 가슴과 등에 달았습니다.\n\n3. 만만치 않았던 관복 마련 비용 : 처음 관직에 나가는 가난한 선비에게는 이 비단 관복과 사모, 허리띠, 가죽신을 한 벌 맞추는 비용이 큰 부담이어서 선배 관원에게 빌려 입거나 세물전(대여점)에서 빌리기도 했습니다.\n\n4. 일기 속 관복 장만기 : 황윤석 역시 관직에 오를 때마다 관복과 사모를 수선하거나 새로 맞추며 지출한 내역을 꼼꼼히 기록해 두었습니다.", "4-24": "1. 절기마다 국왕이 내리는 격려 선물(사물·하사품) : 조선의 국왕은 명절이나 절기마다 현직 관원들에게 계절에 꼭 필요한 물품을 하사하여 신하들의 노고를 위로했습니다.\n\n2. 단오 부채(단오선), 여름 얼음(빙표), 동지 달력(책력) : 더위가 시작되는 단오절에는 전라도·경상도에서 올라온 대나무 합죽선 부채를, 한여름 삼복에는 동빙고·서빙고의 얼음을 타 갈 수 있는 교환권(빙표)을, 동지에는 새해 달력을 나누어 주었습니다.\n\n3. 정초와 연말의 세찬(歲饌)과 내하 약재 : 설날이나 연말에는 관청별로 소고기, 건어물, 떡국 재료 등을 세찬으로 나누어 주었고, 궁중 내의원에서 만든 청심환·소합원 같은 고급 비상약을 하사하기도 했습니다.\n\n4. 고향 부모님께 가장 먼저 보낸 임금님 선물 : 황윤석은 대궐에서 이런 귀한 부채나 달력, 약재를 하사받으면 아껴 두었다가 고향의 부모님과 친척들에게 보내드리며 기쁨을 나누었습니다.", "4-25": "1. 국왕의 행차를 호위하는 수가(隨駕) 행렬 : 영조나 정조가 선대 왕릉을 참배하러 가거나 도성 밖으로 행차(거둥)할 때면, 수백 명의 문무 관원들이 말을 타고 국왕의 어가 앞뒤를 따라가는 '수가' 임무를 수행했습니다.\n\n2. 새벽 2~3시 집합과 온종일 말 위에서의 대기 : 행차 날이면 한밤중부터 대궐 문 앞에 모여 말을 타고 대기해야 했으며, 행렬이 이동하는 내내 먼지와 추위·더위를 견디며 말 위에서 자세를 흐트러뜨리지 않아야 했습니다.\n\n3. 1769년 영조 서대문 행차 호종 기록 : 황윤석이 1769년 7월 영조의 서대문 밖 행차를 수행했을 때의 긴박한 이동 과정과, 행차 도중 영조가 관원들을 불러 친히 하문하던 장면이 일기와 승정원일기에 생생히 남아 있습니다.\n\n4. 화려한 반차도 뒤의 땀방울 : 그림(반차도)으로 보면 화려하기만 한 왕실 행차 뒤편에서 실무 관원들이 겪었던 체력적 고충을 실감 나게 전해줍니다.", "4-26": "1. 나라의 가장 신성한 의례인 대제(大祭) 제관 차출 : 종묘, 사직단, 문묘(성균관), 그리고 각 왕릉에서 열리는 국가 제사에는 조정의 현직 관원들이 제사를 돕는 집사(축관·찬자·알자 등)로 차출되었습니다.\n\n2. 며칠 전부터 술·고기·부정한 것을 금하는 산재와 치재(목욕재계) : 제관으로 임명된 관원은 제사 며칠 전부터 관청에서 숙식하며 술과 냄새나는 음식(파·마늘·고기)을 끊고, 상가 방문이나 음악 감상을 금하며 목욕재계로 몸과 마음을 정결히 해야 했습니다.\n\n3. 한밤중 횃불 아래서 치러지는 장엄한 제례 : 국가 제사는 주로 자정 이후 가장 어둡고 고요한 새벽 시간(축시)에 횃불을 밝혀 놓고 수백 번의 절과 음악 속에서 엄숙하게 진행되었습니다.\n\n4. 제사 후 나누어 주는 음복 고기(분육) : 무사히 제사를 마치면 제상에 올랐던 귀한 소고기와 돼지고기(복육)를 제관들에게 조금씩 나누어 주었으며, 황윤석은 이를 정성껏 싸서 숙소로 가져오곤 했습니다.", "4-27": "1. 임금과 신하의 모든 대화를 받아 적는 승정원 주서(注書) : 국왕이 신하들을 만나는 모든 자리에는 승정원의 정7품 기록관인 주서와 예문관 한림(검열)이 배석하여 현장의 모든 말을 실시간으로 받아 적었습니다.\n\n2. 붓이 날아다니는 듯한 초서 속기(초책) : 임금과 대신들이 빠르게 주고받는 긴 토론을 놓치지 않기 위해, 주서들은 바닥에 엎드려 종이 위에만 알아볼 수 있는 빠른 흘림체(초서)와 약자로 붓이 보이지 않을 만큼 빠르게 속기했습니다.\n\n3. 황윤석이 입시 현장에서 직접 본 주서의 모습 : 1778년 선정전 윤대관으로 정조 임금 앞에 입시했던 황윤석은 자신의 바로 옆에서 고개를 숙인 채 임금과 자신의 문답을 한 글자도 놓치지 않고 맹렬히 받아 적던 주서의 모습을 일기에 인상 깊게 남겼습니다.\n\n4. 세계기록유산 《승정원일기》의 탄생 현장 : 그렇게 현장에서 속기한 초고(초책)를 퇴근 후 정서하여 묶은 것이 바로 오늘날 세계 최대의 역사 기록인 《승정원일기》입니다.", "4-28": "1. 궁궐 안의 공식 카메라 《승정원일기》 vs 궁궐 밖의 개인 카메라 《이재난고》 : 승정원일기는 국왕의 눈과 귀를 중심으로 조정의 공식 결정과 대화만을 기록한 국가 문서인 반면, 이재난고는 그 자리에 참석했던 관원 개인의 속마음과 뒷이야기까지 담은 사적 기록입니다.\n\n2. 같은 날 같은 사건의 소름 돋는 일치 : 예를 들어 황윤석이 관직에 임명된 날짜, 임금 앞에 입시해 보고한 말, 지방관에서 파직된 날짜를 검색해 보면 두 기록이 날짜(간지)와 인명까지 거울처럼 정확히 일치합니다.\n\n3. 공식 기록의 행간에 숨은 진짜 이유를 밝혀줌 : 승정원일기에는 단순히 '누구를 파직하라'고 한 줄로만 적힌 사건도, 이재난고를 함께 펼쳐보면 그 이면에 어떤 세력의 청탁 거절과 모함이 있었는지 입체적인 내막이 고스란히 드러납니다.\n\n4. 한국 역사학 최고의 크로스체크(교차 검증) 모델 : 국가 사료와 개인 일기, 문집, 고문서 4종이 한 인물을 중심으로 이렇게 완벽하게 맞물리는 사례는 조선사를 통틀어 매우 희귀합니다.", "4-29": "1. 관청의 터줏대감이었던 실무 행정관 경아전(서리·書吏) : 양반 관원들은 수시로 다른 부서로 인사 이동을 했지만, 각 관청의 문서 작성과 회계 실무를 맡은 하위 아전(서리)들은 한 관청에서 수십 년간 대물림하며 법규와 관례를 독점하고 있었습니다.\n\n2. 신임 관원을 시험에 들게 하는 서리들의 꼼수 : 새로 부임한 양반 관원이 숫자 계산이나 행정 전례에 어두우면, 노련한 서리들이 복잡한 장부로 눈속임을 하여 공금을 빼돌리는 일이 비일비재했습니다.\n\n3. 서리들보다 더 법전과 수학에 밝았던 황윤석 : 그러나 황윤석은 《경국대전》과 《속대전》의 법 조항은 물론, 서리들의 전문 분야인 주판·산가지 계산(산학)과 이두 문서에 서리들보다 훨씬 정통했기 때문에 서리들이 감히 속이지 못하고 쩔쩔맸습니다.\n\n4. 실력이 만든 권위 : 권위로만 누르는 상관이 아니라 실무 지식과 계산으로 아전들을 완벽히 장악했던 프로 관료의 면모를 보여줍니다.", "4-30": "1. 지방 수령 부임 전 국왕에게 올리는 하직 인사(사조·辭朝) : 진위현령·목천현감·전의현감 같은 지방 수령으로 임명되면 임지로 떠나기 전 반드시 대궐에 들어가 임금님께 큰절을 올리고 직접 당부의 말씀을 듣는 하직 인사를 드려야 했습니다.\n\n2. 임금 앞에서 큰 소리로 외워야 하는 목민관의 7대 강령 '칠사(七事)' : 이때 수령은 국왕 앞에서 1) 농사와 누에치기 장려(농상성), 2) 호구 수 늘리기(호구증), 3) 학교 교육 진흥(학교흥), 4) 군정 정비(군정수), 5) 부역 균등 부과(부역균), 6) 소송 간소화(사송간), 7) 간사하고 교활한 아전 단속(간활식)이라는 일곱 가지 임무를 막힘없이 암송해야 했습니다.\n\n3. 국왕의 격려와 고을 현안 질문 : 칠사 암송이 끝나면 국왕은 '내 백성을 잘 부탁한다'며 고을의 가뭄이나 폐단을 묻고 격려해 떠나보냈습니다.\n\n4. 칠사를 문자 그대로 실천한 수령 : 황윤석은 임금 앞에서 외웠던 이 일곱 가지 약속(특히 학교 진흥과 아전 비리 단속)을 부임지에서 한 치의 타협 없이 그대로 실천했습니다.", "4-31": "1. 고을 아전들이 한양까지 올라와 모셔 가는 신연(新延) 행차 : 새로운 수령(현감·현령)이 임명되면 해당 고을의 아전과 관노들이 말과 가마를 끌고 한양이나 수령의 본가까지 올라와 새 사또를 맞이해 내려갔습니다.\n\n2. 고을 경계에서 벌어지는 교대식과 입성 퍼레이드 : 고을 입구에 도착하면 푸른 옷을 입은 아전과 군교, 관기들이 길 양옆에 도열해 큰절을 올리고, 나팔과 북소리를 울리며 동헌(관아)으로 들어갔습니다.\n\n3. 부임 첫날의 의례, 객사 전패(殿牌) 참배 : 관아에 들어선 수령은 가장 먼저 국왕을 상징하는 '전패(殿牌)'가 모셔진 객사(客舍)로 나아가 임금님께 부임 인사를 올린 뒤에야 비로소 집무실(동헌)에 앉아 아전들의 점고(출석)를 받았습니다.\n\n4. 검소하게 치른 황윤석의 부임길 : 황윤석은 진위·목천·전의 세 고을에 부임할 때마다 백성들에게 폐가 되는 화려한 신연 맞이와 잔치를 대폭 줄이도록 엄명을 내렸습니다.", "4-32": "1. 조선 시대 공무원 퇴직 감사 제도 해유(解由) : 수령이나 창고 관리 관원이 임기를 마치고 떠날 때는, 후임자가 관아의 곡식·세금·무기 장부와 실제 창고 재고를 일일이 대조해 '이상 없음' 확인서(해유문서)를 발급해 주어야만 다음 관직으로 갈 수 있었습니다.\n\n2. 1되 1푼의 오차도 용납하지 않는 인수인계 : 만약 전임자의 재임 기간 중 창고의 곡식이 비거나 공금이 부족한 것이 드러나면, 전임자는 해유를 받지 못해 관직 임명이 정지되고 부족분을 채워 넣어야 했습니다.\n\n3. 산학(수학)으로 완벽하게 마친 장부 인계 : 황윤석은 부임할 때나 떠날 때나 자신의 특기인 정밀 산학으로 수천 석의 환곡과 공금 장부를 한 치의 오차도 없이 검산하여 깔끔하게 인수인계를 마쳤습니다.\n\n4. 국가 재정을 지킨 안전장치 : 조선 왕조가 500년 동안 지방 재정을 통제할 수 있었던 정교한 회계 감사 시스템을 일기 속에서 확인할 수 있습니다.", "4-33": "1. 사법권까지 한 손에 쥔 지방의 판사 수령 : 조선 시대는 행정과 사법이 분리되지 않아, 지방 수령이 고을 안에서 일어나는 토지·채무·산송(묘자리 분쟁) 등 민사 소송과 도둑질·폭행 같은 형사 재판을 직접 판결했습니다.\n\n2. 법전(대명률·속대전)에 엄격히 정해진 매질(태·장) 기준 : 수령이 기분 내키는 대로 곤장을 치는 것이 아니라, 죄의 경중에 따라 작은 매인 태(笞, 10대~50대)와 큰 매인 장(杖, 60대~100대)의 횟수와 매의 크기까지 법전에 엄격히 규정되어 있었습니다.\n\n3. 억울한 백성의 말을 끝까지 들어준 황윤석의 재판 : 황윤석은 소송을 심리할 때 힘 있는 양반이나 아전의 편을 들지 않고, 양쪽의 문서 증거(명문·입안)와 증언을 꼼꼼히 대조하여 공정한 판결문(제음)을 직접 작성해 내주었습니다.\n\n4. 형벌보다 교화를 앞세운 판결 : 부득이 형벌을 집행할 때도 법정 한도를 넘겨 사람이 상하는 일이 없도록 엄격히 단속했습니다.", "4-34": "1. 타지 출신 수령을 돕는 고을 토박이 양반 대표 기구 향청(鄕廳) : 수령은 법적으로 자기 고향에 부임할 수 없었기 때문에(상피제), 고을 사정을 잘 아는 현지 양반들의 대표 기구인 향청(유향소)의 좌수(座首)와 별감(別監)으로부터 자문을 받았습니다.\n\n2. 아전 비리 견제와 향촌 풍속 교화 : 향청의 임원들은 수령을 보좌해 고을의 세금 부과를 돕고 아전들의 횡포를 감시하는 순기능이 있었으나, 때로는 토호 세력과 결탁해 가난한 백성을 괴롭히기도 했습니다.\n\n3. 예의로 대하되 부당한 청탁은 물리친 원칙 : 황윤석은 부임지 고을의 덕망 있는 원로 선비와 향청 임원들을 정중히 예우하면서도, 소송이나 세금 문제에서 사사로운 청탁을 해올 때는 단호히 선을 그었습니다.\n\n4. 수령과 향촌 사회의 역학 관계 : 일기를 통해 수령, 향청(양반), 작청(아전), 그리고 백성들 사이의 미묘한 견제와 균형을 생생히 볼 수 있습니다.", "4-35": "1. 가뭄이 들면 수령이 가장 먼저 져야 했던 책임 : 농경 사회에서 봄여름에 비가 오지 않으면 고을 전체에 굶주림이 닥쳤기 때문에, 수령은 자신의 부덕함을 자책하며 반찬 수를 줄이고(감선) 하늘에 비를 비는 기우제(祈雨祭)를 올려야 했습니다.\n\n2. 고을의 명산과 깊은 연못(용소)에서 올리는 정성 : 황윤석 역시 수령 재임 시절 가뭄이 계속되자 목욕재계하고 고을의 영험한 산봉우리와 강가 제단에 올라가 직접 지은 기우제 축문을 읽으며 간절히 비를 빌었습니다.\n\n3. 기우제 끝에 내린 단비(감우)와 기쁨의 일기 : 기우제를 지낸 뒤 마침내 하늘이 흐려지며 단비가 쏟아지면, 옷이 젖는 줄도 모르고 마당에 나와 기뻐하며 빗물이 땅에 스며든 깊이를 일기에 감격스럽게 적었습니다.\n\n4. 과학자이자 목민관의 마음 : 비가 오는 기상 원리를 과학적으로 탐구하면서도, 백성의 아픔 앞에서는 가장 낮은 자세로 하늘에 기도했던 목민관의 진심이 담겨 있습니다.", "4-36": "1. 춘궁기 백성을 살리는 구빈 금융이었던 환곡(還穀) : 환곡은 원래 봄철 먹을 것이 떨어진 가난한 농민에게 관아 창고의 곡식을 빌려주었다가, 가을 추수 후에 연 1할(10%)의 적은 이자(모곡)만 붙여 갚게 하는 훌륭한 사회보장 제도였습니다.\n\n2. 아전들의 장부 조작과 강제 대출의 폐단 : 그러나 18세기 후반에는 아전들이 곡식에 겨와 모래를 섞어 내주거나, 빈 창고를 장부상으로만 있는 것처럼 꾸며(번질·반작) 이자를 가로채는 비리가 극심했습니다.\n\n3. 직접 창고 문을 열고 되와 말을 검사한 수령 : 황윤석은 환곡을 나누어 줄 때와 거두어들일 때 아전들에게만 맡기지 않고 직접 창고에 입회하여 곡식의 품질과 되·말의 정량을 엄격히 감독했습니다.\n\n4. 아전들에게는 무서운 사또, 백성에게는 고마운 사또 : 그의 이러한 깐깐한 환곡 감사가 백성들에게는 큰 혜택이 되었으나, 부정을 못 저지르게 된 아전들이 앙심을 품고 그를 모함하는 원인이 되기도 했습니다.", "4-37": "1. 농민들을 가장 고통스럽게 한 군포(군역 세금)의 폐단 : 당시 양인 농민들은 군대에 가는 대신 베(면포)나 엽전으로 군포를 납부했는데, 도망간 이웃의 몫까지 물리거나(인징·족징), 죽은 사람(백골징포)과 어린아이(황구첨정)를 군적에 올려 세금을 뜯어내는 폐해가 심각했습니다.\n\n2. 영조 대 균역법(1년 2필 -> 1필 감면) 이후의 현장 점검 : 황윤석은 고을의 군안(군역 명부)과 호적을 일일이 대조하여 이미 사망했거나 나이가 안 된 억울한 사람들의 이름을 군적에서 삭제해 주었습니다.\n\n3. 군역 면제 특권층의 허위 등록 색출 : 반대로 돈 많은 부민들이 아전에게 뇌물을 주고 양반이나 학생(유학·교생)으로 이름을 속여 군역을 빠져나간 사례를 찾아내어 세금 부담의 형평성을 바로잡았습니다.\n\n4. 숫자로 구현한 정의 : 호적과 세금 장부의 숫자를 바로잡는 것이 곧 가난한 백성의 눈물을 닦아주는 길임을 실천으로 보여주었습니다.", "4-38": "1. 한 도의 행정·군사·사법을 총괄하는 관찰사(감사·監司) : 오늘날의 도지사에 해당하는 관찰사는 봄과 가을에 도내의 각 고을을 직접 돌며 수령의 다스림과 백성의 살림살이를 점검하는 순력(巡歷)을 실시했습니다.\n\n2. 고을 전체가 비상 걸리는 감사 행차 맞이 : 관찰사 일행 수백 명이 고을에 들이닥치면 수령은 고을 경계까지 나가 맞이해야 했고, 숙소와 음식 대접(지공), 그리고 모든 행정 장부의 결재를 준비하느라 관아 전체가 밤을 새웠습니다.\n\n3. 황윤석과 충청감사 심이지(沈頤之)의 갈등 : 1780년 목천현감 시절 황윤석은 권세가 출신인 충청감사 심이지의 부당한 요구와 아전들의 모함에 타협하지 않고 소신을 지켰다가 결국 파직되는 시련을 겪었습니다.\n\n4. 〈백교설〉에 남은 날카로운 비판 : 이 사건의 전말을 기록한 일기와 문집의 〈백교설〉은 상급 기관(감영)과 하급 고을(군현) 사이의 권력 남용 실태를 적나라하게 보여주는 명문입니다.", "4-39": "1. 국왕이 비밀리에 파견하는 특명 감찰관 암행어사 : 국왕은 지방 수령과 아전들의 비리를 몰래 조사하기 위해 젊고 강직한 당하관 관원에게 마패(馬牌)와 유척(놋쇠 자), 봉서(비밀 임명장)를 주어 암행어사로 내보냈습니다.\n\n2. 떨어진 갓과 헌 도포 차림의 잠행과 탐문 : 암행어사는 실제로 과거에 떨어진 가난한 선비나 과객 차림으로 변장하고 고을 장터와 주막, 농가를 돌며 사또가 재판을 공정하게 하는지, 환곡 비리는 없는지 민심을 채집했습니다.\n\n3. 암행어사 제도의 빛과 그림자 : 그러나 때로는 암행어사가 고을에 잠입했을 때 수령에게 불만을 품은 교활한 아전들이 의도적으로 어사 주변에 접근해 거짓 소문을 흘려 청렴한 수령을 모함하는 부작용도 발생했습니다.\n\n4. 1787년 전의현감 파직 사건의 내막 : 실제로 황윤석이 전의현감에서 물러날 때 암행어사 심풍지(沈豊之)가 아전들의 일방적인 모함만을 듣고 서계를 올린 과정이 승정원일기와 이재난고의 대조를 통해 생생히 밝혀집니다.", "4-40": "1. 파직되어 떠난 수령을 잊지 못한 목천 백성들 : 1780년 황윤석이 충청감사 심이지와의 갈등으로 목천현감에서 억울하게 파직되어 고향으로 돌아간 이듬해(1781년), 목천 고을의 유생들과 백성들이 자발적으로 성금을 모았습니다.\n\n2. 권력 눈치 안 보고 세운 진짜 선정비(거사비·去思碑) : 현직에 있을 때 아전들이 아부하려고 억지로 세우는 가짜 비석과 달리, 이미 파직되어 아무 권력도 없는 전임 현감의 어진 다스림을 그리워하며 세운 진정한 선정비였습니다.\n\n3. 일기에 적힌 목천 백성들의 편지와 감동 : 목천 백성들이 머나먼 전라도 고창 구수동까지 사람을 보내 안부를 묻고 비석을 세웠다는 소식을 전해왔을 때, 황윤석은 자신의 진심을 알아준 백성들에게 깊은 감사의 글을 남겼습니다.\n\n4. 역사가 증명한 명예 회복 : 조정의 인사 기록에는 파직으로 적혔을지언정, 백성들의 마음속에는 최고의 목민관으로 남았음을 증명하는 감동적인 실화입니다.", "4-41": "1. 유교 국가의 핵심 복지 행사 양로연(養老宴) : 조선 조정과 지방 관아에서는 매년 가을 추수가 끝난 뒤 신분의 귀천을 떠나 80세 이상의 고령 노인들을 초청해 술과 음식을 대접하고 선물을 드리는 경로 잔치(양로연)를 열었습니다.\n\n2. 수령이 직접 술잔을 올리고 지팡이 하사 : 황윤석은 지방관 재임 시절 고을의 백발 노인들을 관아 마당에 모시고 직접 큰절과 술잔을 올렸으며, 거동이 불편한 노인들에게는 고기와 쌀을 집까지 보내드렸습니다.\n\n3. 고향 구수동에서도 실천한 경로 효친 : 관직에서 물러나 고향에 있을 때도 마을과 문중의 어르신들을 모시고 계절마다 조촐한 경로 모임(기영회·양로 모임)을 열어 공경의 예를 다했습니다.\n\n4. 따뜻한 공동체 문화 : 어른을 공경하고 약자를 돌보는 것이 정치의 시작이라고 믿었던 선비의 따뜻한 행정 철학을 보여줍니다.", "4-42": "1. 칠십 넘은 노부모를 둔 서울 관원의 애타는 마음 : 당시 법전에는 부모님의 연세가 70세 이상으로 고령이거나 병환이 깊을 때, 한양에서 벼슬하는 아들이 부모님을 가까이서 봉양하기 위해 고향 근처의 지방 수령 자리로 보내달라고 청하는 '걸양(乞養)' 제도가 있었습니다.\n\n2. 효(孝)를 국정의 으뜸으로 삼은 배려 : 관원이 걸양 상소를 올리거나 이조에 신청하면, 국왕과 조정에서도 효도를 장려하는 차원에서 가능한 한 본가에서 가까운 고을의 현감·군수 자리를 배정해 주었습니다.\n\n3. 황윤석이 지방 수령을 희망했던 가장 큰 이유 : 황윤석 역시 박봉의 서울 하숙 생활보다 고향 전라도와 가까운 충청도·경기도의 지방 수령으로 나가 노모(강진김씨)를 관아에 모시고 따뜻한 밥을 대접해 드리는 것이 평생의 소원이었습니다.\n\n4. 관직보다 깊었던 효심 : 실제 그가 지방관으로 부임했을 때 고향의 어머니와 가족들에게 봉양 물자를 보내며 기뻐하던 기록이 일기에 절절히 남아 있습니다.", "4-43": "1. 몸이 아플 때 내는 병가 신청서 '정사(呈辭)' : 현직 관원이 병이 나 출근하기 어려울 때는 소속 관청이나 승정원에 병가 신청서(정사·병소)를 제출하여 며칠간 치료 휴가를 받을 수 있었습니다.\n\n2. 고향 부모님 병문안과 성묘를 위한 특별 휴가 '급유(給由)' : 한양에서 근무하는 지방 출신 관원이 고향의 부모님을 뵙거나(근친), 부모님 산소를 돌보러 갈 때(성묘), 혹은 자녀의 혼사를 치를 때는 왕명으로 왕복 이동 일수를 포함한 공식 휴가(급유·말미)를 주었습니다.\n\n3. 휴가 일수 계산과 복귀 보고 : 황윤석의 일기에는 조정으로부터 근친 휴가(유가)를 받아 고향 고창에 다녀오면서, 정해진 복귀 날짜를 어기지 않기 위해 폭우 속에서도 걸음을 재촉해 한양으로 올라온 기록이 자세히 나옵니다.\n\n4. 체계적이었던 조선의 공무원 복무 규정 : 250년 전에도 공무원의 휴가와 병가, 출장 일수가 법전에 따라 얼마나 체계적으로 관리되었는지 알 수 있습니다.", "4-44": "1. 국왕의 가문(전주이씨 왕실)을 관리하는 특별 관청 종부시(宗簿寺) : 황윤석이 정6품 주부로 오래 몸담았던 종부시는 역대 국왕의 어진(초상화)과 왕실 족보인 《선원보략》을 편찬·보관하고 왕족(종친)들의 비위를 감찰하는 핵심 관청이었습니다.\n\n2. 영의정·우의정이 도제조를 맡는 높은 위상 : 일반 실무 관청과 달리 종부시의 최고 책임자(도제조)는 영의정이나 좌·우의정이 겸임했기 때문에, 실무 주부였던 황윤석도 재상들과 직접 대면하여 국가 전례를 보고할 기회가 많았습니다.\n\n3. 문장력과 역사 고증 실력이 뛰어난 엘리트만 선발 : 왕실의 가장 중요한 기록을 다루는 곳이므로 글씨가 단정하고 역사·계보 고증에 해박한 학자형 관원들이 우선 배치되었습니다.\n\n4. 황윤석의 진가가 빛난 무대 : 실제로 그는 종부시주부 시절 왕실 족보의 오류를 정확히 고증해 내어 영의정 홍봉한과 당당히 토론하며 학자 관료로서의 명성을 떨쳤습니다.", "4-45": "1. 높은 대신들만 보던 국왕이 실무 과장·계장들을 직접 만나는 제도 : 평소 조정 회의(경연·차대)에는 정3품 이상의 고위 관리들만 참석했기 때문에, 실제 행정을 굴리는 각 관청의 4품~6품 실무 관원들의 목소리를 국왕이 직접 듣기 위해 만든 제도가 '윤대(輪對)'였습니다.\n\n2. 한 달에 세 번(매월 1일·11일·21일 등) 돌아가며 독대 : 순번이 돌아온 실무 관원(윤대관) 5명 안팎이 차례로 임금님 앞에 나아가 자신의 관직 이력(성명·이력)을 아뢰고, 현재 소속 관청의 업무 현황과 문제점을 직접 보고했습니다.\n\n3. 1778년 6월 정조와 황윤석의 선정전 윤대 : 사복시주부였던 황윤석이 창덕궁 선정전에 윤대관으로 입시했을 때, 정조 임금은 사복시의 마정(말 관리)과 재정 상태를 상세히 물었고 황윤석은 막힘없이 숫자와 대책을 보고했습니다.\n\n4. 실무 중심의 정조 대 정치 : 현장 실무자의 작은 의견까지 국정에 반영하려 했던 정조 대왕의 소통 리더십을 보여주는 장면입니다.", "4-46": "1. 1776년 음력 3월 5일, 83세 영조 대왕의 승하 : 재위 52년이라는 조선 최장수 재위 기록을 세운 영조가 경희궁에서 승하하자, 한양 도성 전체에 곡소리가 울려 퍼지며 거대한 국장(國葬·인산) 절차가 시작되었습니다.\n\n2. 온 나라가 하얗게 변한 백의(白衣)·백립(白笠)의 물결 : 국상이 선포되자 조정의 모든 관원들은 베로 만든 상복(최복)과 흰 사모를 썼고, 한양 도성과 팔도의 일반 백성들도 흰 옷과 흰 패랭이(백립)를 쓰고 가무와 혼례, 도축을 일절 멈추며 애도했습니다.\n\n3. 대궐 밖에서 곡(哭)하며 지킨 관원의 도리 : 당시 한양에 머물던 황윤석은 대궐 문밖 곡반(우는 대열)에 동참하여 선대 임금의 승하를 애도하고, 5개월간 이어진 인산(장례) 준비와 정조의 즉위 과정을 일기에 날마다 기록했습니다.\n\n4. 시대의 교체를 목격한 기록 : 영조 시대에서 정조 시대로 넘어가는 역사적 전환기의 숨 가쁜 공기가 그의 일기 속에 그대로 보존되어 있습니다.", "4-47": "1. 인사권을 쥔 핵심 요직 이조(吏曹)와 병조(兵曹) : 문관의 인사를 담당하는 이조와 무관의 인사를 담당하는 병조(양전·兩銓)는 전국의 모든 관직 희망자들이 바라보는 권력의 핵심이었습니다.\n\n2. 3명의 후보를 추천하는 삼망(三望)과 국왕의 낙점(落點) : 관직에 빈자리가 나면 정기 인사(도목정사)나 수시 인사에서 이조·병조가 적임자 3명의 이름을 나란히 적어 올리고(삼망: 수망·부망·말망), 국왕이 그중 한 명의 이름 위에 붓으로 점을 찍어(낙점) 최종 임명했습니다.\n\n3. 일기에 적힌 정사(인사 발표) 날의 풍경 : 인사 발표가 있는 날이면 조보(기별지)에 수십 명의 삼망 후보 명단과 낙점 받은 사람(점하)의 이름이 실렸고, 황윤석은 지인들과 자신의 이름이 후보(망)에 오른 내역을 일기에 꼼꼼히 채록했습니다.\n\n4. 조선 시대 인사 시스템의 투명성 : 단순히 최종 임명자만 기록한 것이 아니라 탈락한 2명의 후보자 이름까지 승정원일기와 일기에 모두 남아 있어 당시 인사 경쟁 구도를 한눈에 알 수 있습니다.", "4-48": "1. 학덕과 가문으로 천거된 음직(남행·문음) 관원 : 조선 시대에는 과거(문과)에 급제하지 못했더라도 학문과 덕행이 뛰어나거나 조상의 공훈이 있는 선비를 특별 채용(음서·학행 천거)하여 참봉부터 시작해 6품 주부와 지방 수령까지 오르게 하는 통로가 열려 있었습니다.\n\n2. 청요직(삼사·이조전랑) 진출의 보이지 않는 벽 : 그러나 음직 출신 관원은 실무 관청의 주부나 지방 현감·군수까지는 오를 수 있었어도, 홍문관·사헌부·사간원 같은 핵심 언론 기관(삼사)이나 정3품 당상관(판서·참판)으로 올라가는 데는 문과 급제자들과 차별되는 엄격한 한계가 있었습니다.\n\n3. 실력으로 문신들을 압도한 학자 관료 : 비록 제도적 한계로 고위 대신의 반열에는 오르지 못했으나, 황윤석은 문과 급제자들도 제대로 읽지 못하는 고난도 천문·산학·전례 문서를 척척 해결하며 조정 내에서 독보적인 학자 관료로 인정받았습니다.\n\n4. 직위보다 높았던 학문의 권위 : 벼슬의 높낮이가 그 사람의 진짜 실력과 역사적 가치를 결정하지 않는다는 사실을 황윤석의 삶이 증명해 줍니다.", "4-49": "1. 세 고을 수령을 지내고도 여전히 소박했던 고향 집 : 당시 일부 부패한 수령들은 한 고을만 다스리고 나와도 한양에 기와집을 사고 논밭 수백 마지기를 늘렸으나, 진위·목천·전의 세 고을 수령을 지낸 황윤석의 귀향 짐은 부임할 때와 다름없이 단출했습니다.\n\n2. 금은보화 대신 가득 실려 내려온 책과 원고 뭉치 : 그가 20여 년의 서울 생활과 관직을 마치고 고향 구수동으로 돌아올 때 조랑말 등에 실려 있던 가장 큰 재산은 녹봉을 아껴 사 모은 귀한 서적들과 빽빽하게 적어 내려간 일기장, 그리고 《이수신편》 원고 궤짝이었습니다.\n\n3. 후손들에게 부끄럼 없는 청백리의 가풍 : 관아의 공금 한 푼 사사로이 쓰지 않고 월급(녹봉)조차 고향 부모님 봉양과 가난한 친척·문인들을 돕는 데 나누어 썼기에 만년에도 늘 검소한 생활을 이어갔습니다.\n\n4. 진정한 부(富)를 남긴 선비 : 그는 눈앞의 재물 대신 230년 뒤 후손과 온 국민이 함께 읽는 무형의 지적 자산을 남겼습니다.", "4-50": "1. 《목민심서》가 이론 교과서라면, 《이재난고》는 현장 실습 일지 : 다산 정약용이 유배지에서 저술한 《목민심서》가 수령이 지켜야 할 규범을 정리한 지침서라면, 정약용보다 한 세대 앞서 실제 세 고을 수령을 지낸 황윤석의 일기는 매일 동헌에서 부딪힌 생생한 실전 행정 기록입니다.\n\n2. 18세기 지방 행정의 민낯을 그대로 보전 : 수령이 아전들의 장부 조작을 어떻게 잡아냈는지, 상급자인 관찰사와 암행어사의 정치가 현장에서 어떻게 왜곡되었는지 날짜별로 기록된 유일무이한 내부 고발장이기도 합니다.\n\n3. 중앙 관청과 지방 행정을 모두 경험한 입체적 시각 : 왕릉 참봉부터 사옹원·종부시·사복시·사헌부·의금부라는 중앙 부처와 경기·충청도 지방관을 두루 거친 덕분에 18세기 조선 관료제의 전체 톱니바퀴를 한눈에 보여줍니다.\n\n4. 공직자의 거울 : 오늘날의 공무원과 리더들이 읽어도 깊은 울림을 주는 250년 전 청렴 관료의 분투기입니다.", "5-11": "1. 1742년 성균관 입구에 세워진 탕평비 : 영조는 신하들이 사사로운 당파(붕당)를 지어 싸우지 말고 공평무사한 마음을 가지라는 공자의 말씀을 친필로 새겨 성균관 반수교 옆에 탕평비를 세웠습니다.\n\n2. 황윤석이 직접 어루만져 본 성균관 탕평비 : 한양 유학 시절 성균관을 드나들던 황윤석은 이 탕평비를 직접 보며 당쟁의 폐해를 막으려는 국왕의 고뇌를 일기에 기록했습니다.\n\n3. 이상과 현실 사이의 냉철한 관찰 : 그는 탕평책 덕분에 피비린내 나는 사화가 줄어든 점을 긍정적으로 보면서도, 한편으로는 탕평을 명분으로 왕의 외척(홍봉한·김구주 등)들이 권력을 독점하는 현실적 부작용도 날카롭게 간파했습니다.\n\n4. 균형 잡힌 정치 비평 : 특정 당파에 매몰되지 않고 영조 대 탕평 정치의 명암을 객관적으로 기록한 재야·실무 지식인의 시각이 돋보입니다.", "5-12": "1. 사도세자의 죽음을 바라보는 두 가지 시선 : 1762년 사도세자가 뒤주에 갇혀 숨진 임오화변 이후, 조선 정계는 기존 당파(노론·소론·남인)와 별개로 세자의 죽음을 어떻게 보느냐에 따라 시파와 벽파로 다시 갈라졌습니다.\n\n2. 세자를 동정하고 정조를 지지한 시파(時派) vs 영조의 처분을 정당화한 벽파(僻派) : 사도세자의 죽음을 안타까워하며 정조의 왕권 강화를 뒷받침한 세력을 '시파', 세자의 비행 때문에 영조의 결단이 불가피했다고 주장하며 신권을 강조한 원칙주의 세력을 '벽파'라 불렀습니다.\n\n3. 정조 대 정국을 흔든 시·벽 갈등의 현장 기록 : 황윤석은 정조 즉위 이후 시파(채제공 등)와 벽파(김종수·심환지 등)가 인사권과 의리를 두고 팽팽하게 맞서는 정국 흐름을 조보와 관가 전언을 통해 세밀하게 기록했습니다.\n\n4. 정치적 소용돌이 속의 신중함 : 그는 노론 낙론계 학자였으면서도 극단적인 당론에 휩쓸리지 않고 학문과 실무에 중심을 두었습니다.", "5-13": "1. 정조의 생명을 지킨 일등공신 홍국영(洪國榮) : 홍국영은 세손 시절의 정조를 벽파의 위협으로부터 온몸으로 지켜낸 공로로, 정조 즉위 직후 도승지와 금위대장을 겸하며 삼정승을 능가하는 세도(勢道)를 누렸습니다.\n\n2. 현직 관원 황윤석이 목격한 홍국영의 위세 : 마침 1776~1779년 한양에서 관직 생활을 하던 황윤석은 대궐 안팎의 모든 인사와 결정이 홍국영의 손끝에서 좌우되던 숨 막히는 분위기를 현장에서 지켜보았습니다.\n\n3. 누이동생(원빈 홍씨)의 급사와 4년 만의 몰락 : 그러나 왕의 후궁으로 들여보낸 누이동생이 일찍 죽고 홍국영의 권력 남용이 도를 넘자, 1779년 마침내 정조의 결단으로 축출·방출되는 극적인 몰락 과정이 일기에 상세히 채록되어 있습니다.\n\n4. 권력의 무상함을 일깨운 기록 : 하늘을 찌르던 권력자도 도리를 잃으면 하루아침에 무너진다는 역사적 교훈을 생생하게 전합니다.", "5-14": "1. 영조의 지극한 편애를 받은 화완옹주와 양자 정후겸 : 사도세자의 친누이였던 화완옹주와 그녀의 양자 정후겸은 영조 말년 국왕의 총애를 등에 업고 세손(정조)의 즉위를 방해하며 조정을 좌지우지했습니다.\n\n2. 1776년 정조 즉위와 동시에 시작된 단죄 : 정조가 왕위에 오르자마자 삼사와 대신들의 탄핵이 빗발쳤고, 정후겸은 경원부로 유배되었다가 사사(사약)되었으며 화완옹주 역시 작위를 박탈당하고 유배되었습니다.\n\n3. 매일의 조보를 통해 중계된 추국과 처분 : 황윤석은 영조의 국장 기간 중에 진행된 이 숨 가쁜 숙청 과정과 정조의 눈물 섞인 전교들을 날마다 일기에 베껴 적었습니다.\n\n4. 왕실 비극의 연장선 : 선대 왕의 유언(화완옹주를 살려주라는 당부)과 신하들의 법대로 처단하라는 요구 사이에서 고뇌하던 정조의 모습이 그대로 나타납니다.", "5-15": "1. 정조가 창덕궁 후원에 세운 학술·정치 연구소 규장각(奎章閣) : 1776년 즉위한 정조는 선대 왕들의 어제(글)를 보관하고 젊고 유능한 학자 관료들을 모아 개혁 정치를 뒷받침할 왕실 도서관 규장각을 설립했습니다.\n\n2. 37세 이하 젊은 문신들의 재교육 프로그램 '초계문신(抄啓文臣)' : 나아가 당하관 문신 중 37세 이하의 총명한 인재들을 선발해 관청 업무 대신 규장각에서 책을 읽고 매달 국왕이 직접 시험을 치르는 파격적인 인재 양성책을 펼쳤습니다.\n\n3. 노장파 학자 황윤석의 관심과 기록 : 당시 50대에 접어들었던 황윤석은 규장각의 설립과 검서관(서얼 출신 학자 이덕무·유득공·박제가 등) 발탁, 그리고 초계문신들에게 내려진 시험 문제들을 큰 관심을 가지고 일기에 기록했습니다.\n\n4. 문예 부흥기의 증언 : 정조 대 학술 진흥 정책이 당대 관료와 지식인 사회에 얼마나 신선한 자극을 주었는지 보여줍니다.", "5-16": "1. 길이가 수백 미터에 달한 조선판 국민청원 만인소(萬人疏) : 나라에 중대한 의리 문제나 억울한 사안이 발생했을 때, 지방의 유생 수천 명에서 만여 명이 하나의 거대한 두루마리 종이에 차례로 이름과 수결(서명)을 적어 올리는 집단 상소를 '만인소'라 불렀습니다.\n\n2. 몇 달에 걸친 전국 서명 운동과 상경 행렬 : 만인소를 올리기 위해서는 각 도의 중심 서원에 본부(소청)를 차리고 사방에 통문을 보내 유생들의 서명을 모은 뒤, 수십 명이 긴 상소문 함을 메고 한양 대궐 문 앞(금호문·돈화문)까지 행진해 복합상소(대궐 문 앞 연좌)를 벌였습니다.\n\n3. 일기에 적힌 영남·호남 유생들의 상소 소식 : 황윤석은 사도세자 문제나 서원 철폐, 선현 문묘 종사 문제를 두고 영남과 호남, 기호 유생들이 대규모 연명 상소를 준비하고 올리는 과정을 상세히 기록했습니다.\n\n4. 공론 정치의 역동성 : 왕권 시대에도 지방 지식인들이 어떻게 집단적 여론(공론)을 결집해 중앙 정치를 움직였는지 알 수 있습니다.", "5-17": "1. 조선 후기 사림 사회의 초고속 소식지 통문(通文) : '통문'은 서원이나 향교, 문중에서 중요한 안건(상소 운동, 학술 집회, 의금 모금, 비리 성토 등)이 있을 때 인근 고을의 유림들에게 돌려보내던 공식 회람 문서였습니다.\n\n2. 릴레이식으로 베껴 쓰며 퍼져나간 전파력 : 통문을 받은 향교나 서원은 내용을 즉시 필사해 기록으로 남긴 뒤 다음 고을로 파발처럼 전달했기 때문에, 인쇄기가 없던 시절에도 며칠 만에 한 도 전체에 소식이 쫙 퍼졌습니다.\n\n3. 일기와 고문서에 남은 수많은 통문들 : 황윤석의 일기에는 구수동 본가로 날아온 각지 서원의 통문 내용이 자주 초록되어 있으며, 종가고문서에도 실물 통문들이 다수 보존되어 있습니다.\n\n4. 향촌 여론의 신경망 : 중앙에 조보가 있었다면 지방에는 통문이 있어서 전국의 선비들이 하나의 여론 공동체로 묶일 수 있었습니다.", "5-18": "1. 임금님 행차 길에 징과 꽹과리를 치는 직소 제도 격쟁(擊錚) : 지방 수령과 관찰사에게도 억울함을 풀지 못한 백성이 마지막 수단으로 국왕이 거둥(행차)할 때 길가에서 징이나 꽹과리를 요란하게 쳐서 어가를 멈추게 하고 원통함을 호소하는 제도였습니다.\n\n2. 영조와 정조 대에 폭발적으로 늘어난 격쟁 : 백성의 목소리를 직접 듣길 원했던 영조와 정조는 행차 때마다 격쟁하는 백성들을 물리치지 않고, 형조와 승정원에 명해 그들의 구술 사연(원정)을 받아 조사하도록 했습니다.\n\n3. 황윤석이 수행 중 목격한 격쟁 현장 : 서울 관원으로서 국왕의 행차를 수행하거나 조보를 보던 황윤석은 산송(묘자리 분쟁), 억울한 옥살이, 세금 문제로 꽹과리를 치며 뛰어들던 백성들의 사연과 국왕의 처분을 일기에 기록했습니다.\n\n4. 조선 왕조의 민원 소통 창구 : 가장 낮은 백성이 가장 높은 군주에게 직접 호소할 수 있었던 조선 시대의 독특한 직접 민주주의적 장치입니다.", "5-19": "1. 밤사이 성문과 종루에 나붙는 익명 벽보 괘서(掛書) : 조정의 폭정이나 권력자의 비리를 규탄하거나, 민심을 선동해 역모를 꾀하는 내용을 적어 한밤중에 한양 4대문이나 종각 기둥에 몰래 붙여놓는 사건을 '괘서 사건(흉서 사건)'이라 불렀습니다.\n\n2. 도성 전체에 비상령이 걸리는 범인 색출 작전 : 괘서가 발견되면 즉시 승정원을 통해 국왕에게 보고되고, 성문을 통제한 채 포도청과 의금부가 총동원되어 종이의 산지와 붓글씨 필체를 추적하는 대대적인 수사가 벌어졌습니다.\n\n3. 나주 괘서 사건(1755년) 등 당대 대옥사의 기억 : 황윤석이 27세 때 전라도 나주 객사에 붙은 괘서로 인해 호남과 중앙의 소론 강경파들이 대거 숙청된 '나주 괘서 사건(을해옥사)'을 비롯해 당대의 흉서 소동들이 일기에 긴장감 있게 기록되어 있습니다.\n\n4. 언로가 막힐 때 터져 나온 그림자 여론 : 공식 상소가 통하지 않을 때 익명의 벽보가 어떻게 정국을 뒤흔드는 뇌관이 되었는지 보여줍니다.", "5-20": "1. 바닷가 섬과 북방 오지로 보내지는 유배(귀양) 형벌 : 당쟁에서 패하거나 왕의 노여움을 산 관료·선비들은 사형 다음으로 무거운 형벌인 유배형을 받아 전라도 제주도·흑산도·진도, 경상도 거제도, 함경도 삼수·갑산 등 험지로 쫓겨났습니다.\n\n2. 가시울타리로 집을 에워싸는 위리안치(圍籬安置) : 특히 죄질이 무거운 중죄인은 유배지 초가집 둘레에 탱자나무 가시울타리를 높이 치고 문밖출입을 일절 금하는 '위리안치'나 '절도안치' 처분을 받았습니다.\n\n3. 유배지에서도 멈추지 않은 독서와 저술 : 그러나 많은 유배객들은 절망 속에서도 고향에서 책을 보내오게 해 연구에 몰두하거나 현지 아이들을 가르치며 수많은 명저를 남겼습니다.\n\n4. 일기에 기록된 유배 인사들의 소식 : 황윤석은 삼남대로를 지나 전라도 바닷가로 유배되어 내려가는 중앙 명사들의 행렬과 유배지에서의 근황, 그리고 해배(유배 풀림) 소식을 꼼꼼히 기록했습니다.", "5-21": "1. 왕족과 사대부의 체면을 고려한 사형 방식 사사(賜死·사약) : 조선 시대에는 고위 관료나 왕족, 선비에게 사형을 내릴 때 저잣거리에서 목을 베는 대신, 집이나 유배지로 의금부 도사를 보내 국왕이 내리는 독약(사약)을 마시고 자진하게 했습니다.\n\n2. 비상(비소), 부자(초오), 천남성 등을 달인 독약 : 사약의 주재료는 맹독성 광물인 비상(砒礹)이나 독초인 생부자(附子), 천남성 등을 진하게 달인 탕약이었으며, 한 사발로 즉시 숨지지 않아 두세 사발을 연거푸 마시는 고통스러운 경우도 많았습니다.\n\n3. 북쪽(임금 계신 곳)을 향해 네 번 절하고 마시는 의례 : 죄인은 사약이 도착하면 의관을 정제하고 대궐이 있는 북쪽을 향해 사배(네 번 절함)를 올린 뒤 약사발을 받았습니다.\n\n4. 의금부 도사 경험으로 본 엄혹한 정치사 : 의금부 도사로도 재직했던 황윤석의 일기에는 당대 역모 사건과 정쟁 속에서 사약을 받고 생을 마감한 인물들의 최후가 침착한 필치로 적혀 있습니다.", "5-22": "1. 당파마다 달랐던 사대부가의 생활 문화와 복식 : 18세기 후반에는 노론, 소론, 남인, 북인 사이에 통혼(결혼)조차 잘 하지 않게 되면서, 집안에서 쓰는 도포의 깃 모양, 갓의 테두리 넓이, 상복의 세부 재단법까지 당파별로 조금씩 달라졌습니다.\n\n2. 절하는 법(배례)과 제사상 진설 방식의 차이 : 제사를 지낼 때 과일을 놓는 순서나 절을 올리는 횟수, 손의 위치 등 예법(가례)에서도 각 학파 스승(이이·송시열 계열 vs 이황·류성룡 계열 등)의 학설을 엄격히 따랐습니다.\n\n3. 말투와 어휘로 단번에 알아본 출신 배경 : 한양에서 처음 만난 선비라도 몇 마디 대화를 나누고 인사하는 법만 보면 어느 지역, 어느 학파(당색) 집안 사람인지 금방 알아차릴 수 있었습니다.\n\n4. 황윤석의 세밀한 풍속 관찰 : 예학(禮學)과 방언에 모두 정통했던 황윤석은 이러한 당파별·지역별 복식과 예절의 차이를 일기와 저술에 흥미롭게 비교해 두었습니다.", "5-23": "1. 18세기 조선 철학계를 뒤흔든 최대 논쟁 '호락논쟁(湖洛論爭)' : 숙종·영조 대 노론 학계는 한양·경기 중심의 낙론(洛論, 김창협·이재·김원행 등)과 충청도 중심의 호론(湖論, 한원진·송능상 등)으로 나뉘어 인간과 동물의 본성이 같은지 다른지를 두고 백 년 넘는 철학 논쟁을 벌였습니다.\n\n2. 인간과 동물의 본성이 같다는 낙론(인물성동론) vs 다르다는 호론(인물성이론) : 낙론은 사람이나 동물이나 하늘로부터 부여받은 근본 본성(리·理)은 모두 선하고 같다고 본 반면, 호론은 육체적 기질이 다르므로 본성도 다르다고 주장했습니다.\n\n3. 낙론의 대표 스승 김원행의 수제자 황윤석 : 황윤석은 낙론 학파의 수장이었던 미호 김원행의 문하에서 공부하며, 모든 존재의 보편적 이치를 중시하는 낙론의 철학을 바탕으로 서양 과학과 실학을 폭넓게 수용할 수 있었습니다.\n\n4. 철학이 과학과 만나는 지점 : 왜 낙론 계열에서 홍대용, 황윤석, 박지원 같은 열린 실학자들이 많이 나왔는지 이해할 수 있는 핵심 배경입니다.", "5-24": "1. 1750년(영조 26) 백성의 군포 부담을 절반(2필 -> 1필)으로 줄인 균역법 : 영조는 양인 농민들이 1년에 베 2필씩 내던 무거운 군포 세금을 1필로 대폭 깎아주는 역사적인 세제 개혁인 균역법을 단행했습니다.\n\n2. 줄어든 세수를 메우기 위한 부유층·지주 과세(결작·선무군관포) : 깎아준 세금 부족분을 채우기 위해 토지 소유자(양반 지주 포함)에게 논밭 1결당 쌀 2두씩(결작)을 더 거두고, 어장·염전·선박세(어염선세)와 부유한 평민에게 선무군관포를 부과했습니다.\n\n3. 황윤석이 현장에서 기록한 균역법의 명암 : 가난한 백성들은 당장 군포가 절반으로 줄어 환영했으나, 지방 양반 지주들은 토지세(결작) 부담이 늘어났다고 불만을 토로했으며 바닷가 어민들은 어염세 징수로 어려움을 겪는 등 현장의 생생한 반응이 일기에 적혀 있습니다.\n\n4. 정책의 현장 보고서 : 법령 한 줄로만 배우던 균역법이 실제 전라도 농촌과 어촌에서 어떻게 작동했는지 입체적으로 보여줍니다.", "5-25": "1. 1760년(영조 36) 20만 명이 동원된 청계천 대준설 공사 : 당시 한양 한가운데를 흐르는 청계천(개천)은 남산과 북악산에서 내려온 토사가 쌓여 장마 때마다 시내가 범람하자, 영조가 결단을 내려 하천 바닥을 파내고 양쪽 석축을 쌓는 대공사를 벌였습니다.\n\n2. 임금값을 주고 백성을 고용한 공공근로 사업 : 영조는 강제 부역 대신 굶주린 백성과 도시 빈민들을 유급 인부(고립꾼)로 고용해 쌀과 돈을 지급함으로써 수해 예방과 빈민 구제를 동시에 해결했습니다.\n\n3. 황윤석이 직접 거닐며 감탄한 정비된 청계천과 광통교 : 한양에 올라온 황윤석은 말끔하게 바닥을 파내고 돌다리와 버드나무를 정비한 청계천 변과 광통교를 거닐며 국가 토목 사업의 규모와 효과를 기록했습니다.\n\n4. 18세기 서울 도시계획의 현장 : 오늘날 우리가 보는 청계천 물길과 다리의 골격이 어떻게 완성되었는지 당대인의 눈으로 확인할 수 있습니다.", "5-26": "1. 승정원의 공식 발표만 싣는 관보 '조보(朝報)'의 한계 : 공식 조보에는 국왕의 전교, 인사 발령, 정식 상소 제목 등 공개가 허락된 내용만 실렸기 때문에, 물밑에서 벌어지는 치열한 권력 암투나 사건의 뒷배경은 다 알기 어려웠습니다.\n\n2. 기별 서리와 정보꾼들이 몰래 적어 돌린 비공개 소식지 : 이에 관청의 서리나 조보 필사꾼들이 조보 여백이나 별도 종이에 아직 발표되지 않은 궁중 소문, 대신들의 막후 대화, 암행어사 출두 소식 등을 몰래 적어 단골 양반들에게 비싼 값에 파는 일종의 사설 정보지(지라시)가 유행했습니다.\n\n3. 인편 편지 속에 동봉된 극비 별지(別紙) : 또한 한양의 관원들이 지방의 부모나 절친한 사우에게 편지를 보낼 때, 남이 볼까 봐 본문에는 안부만 적고 작은 쪽지(별지)에 정국의 극비 소식을 적어 보낸 뒤 읽고 즉시 불태우라고(병화·丙火) 당부하곤 했습니다.\n\n4. 일기에 살아남은 고급 정보들 : 황윤석이 한양 지인들로부터 받은 이러한 생생한 비공식 정계 소식들이 《이재난고》에 고스란히 채록되어 있습니다.", "5-27": "1. 말을 갈아타며 밤낮으로 달리는 국가 파발망(역참) : 한양에서 전국으로 뻗은 대로에는 30리(약 12km)마다 말을 갈아타는 역(驛)이 설치되어 있어서, 국가의 긴급 공문서나 왕명은 파발꾼이 말을 타고 달려 고창까지 이틀~사흘 만에 주파했습니다.\n\n2. 민간 소식과 조보가 내려오는 속도(평균 5~8일) : 일반 사대부들이 받아보는 조보 묶음이나 개인 서신은 서울을 출발한 보부상이나 관아 인편을 통해 내려왔는데, 한양에서 사건이 터지면 보통 닷새에서 이레 뒤에 고창 구수동의 황윤석 책상 위에 도착했습니다.\n\n3. 일기로 측정되는 18세기 정보 전달 속도 : 황윤석은 일기에 '지난 며칠 서울에서 일어난 사건을 오늘 도착한 조보(또는 누구의 편지)로 처음 보았다'고 기록했기 때문에, 사건 발생일(승정원일기)과 인지일(이재난고)의 시차를 정확히 계산할 수 있습니다.\n\n4. 놀랍도록 빨랐던 조선의 정보망 : 전신이나 기차가 없던 18세기에도 일주일 안팎이면 한양의 뉴스가 전라도 땅끝까지 공유되었음을 보여줍니다.", "5-28": "1. 일기나 편지가 발각되어 옥사가 일어나는 필화(筆禍) 사건 경계 : 조선 후기에는 역모 옥사나 당쟁이 벌어졌을 때 가택 수색으로 발견된 개인 일기나 편지 한 줄이 빌미가 되어 가문이 풍비박산 나는 필화 사건이 종종 일어났습니다.\n\n2. 민감한 권력자 이름을 성씨나 자(字), 별호로만 표기 : 이 때문에 황윤석은 일기에 당대의 살아있는 실세 대신이나 민감한 정치적 스캔들을 적을 때, 실명을 그대로 쓰는 대신 '홍 모(洪某)', '김 상(金相, 김 정승)'처럼 성씨와 직책만 적거나 글자 일부를 비워두는 신중함을 보였습니다.\n\n3. 승정원일기와 대조하면 100% 풀리는 암호 : 당시에는 만약을 대비해 이니셜로 숨겨 적었으나, 오늘날 우리가 그날의 《승정원일기》 기사와 나란히 대조해 보면 그 '홍 모'와 '김 상'이 누구인지 단번에 실명을 밝혀낼 수 있습니다.\n\n4. 기록자의 지혜 : 위험한 시대를 살아가면서도 후세에 진실을 남기기 위해 고안한 지식인의 지혜로운 기록 방식입니다.", "5-29": "1. 청나라의 전성기였던 강희·옹정·건륭 시대(강건성세) : 황윤석이 살았던 18세기는 이웃 청나라에서 건륭제(재위 1735~1795)가 60년간 통치하며 영토를 넓히고 《사고전서》 편찬 등 거대한 문화 사업을 벌이던 시기였습니다.\n\n2. 오랑캐(청)를 무시하던 화이론에서 현실 인식으로의 변화 : 당시 조선 지식인들은 여전히 명나라에 대한 의리(존주론)를 지키면서도, 연행사들이 전해오는 청나라의 번영과 고증학·서양 과학의 수준을 결코 얕볼 수 없다는 현실적 인식을 넓혀갔습니다.\n\n3. 건륭제의 행적과 대륙 정세 메모 : 황윤석은 연행사를 다녀온 사우들과 조보를 통해 건륭제의 남순(강남 시찰), 서역 정벌, 그리고 베이징 학계의 동향을 일기에 자세히 기록하며 국제 정세를 주시했습니다.\n\n4. 동아시아 정세 분석가 : 전라도 시골 서재에 앉아서도 베이징과 동아시아 전체의 권력 변동을 예리하게 읽고 있었습니다.", "5-30": "1. 승자의 기록이자 편집된 기록인 공식 사서 : 《조선왕조실록》이나 《승정원일기》는 세계적인 기록유산이지만, 궁궐 안에서 국왕과 고위 대신들의 시각으로 정리되었고 때로는 정권 교체 후 수정(개수)되기도 했습니다.\n\n2. 검열을 거치지 않은 100% 날것의 당대 육성 : 반면 황윤석의 《이재난고》는 누구의 눈치도 보지 않고 그날그날 보고 들은 민심과 관가의 실제 돌아가는 사정을 가감 없이 적어 내려간 무삭제 현장 기록입니다.\n\n3. 중앙과 지방을 동시에 비추는 양면 거울 : 서울 관원으로 있을 때는 대궐 안의 정치를, 지방 수령과 향촌 선비로 있을 때는 중앙의 정책이 시골 장터와 농가에 미친 파장을 동시에 기록했기 때문입니다.\n\n4. 역사의 입체 안경 : 실록이라는 한쪽 눈과 《이재난고》라는 다른 쪽 눈으로 함께 볼 때 비로소 18세기 조선의 진짜 입체 영상이 살아납니다.", "5-31": "1. 1759년(영조 35) 66세 국왕과 15세 왕비의 세기적 국혼 : 정비 정성왕후가 승하한 뒤 영조는 1759년 6월 노론 김한구의 딸인 15세 소녀(정순왕후)를 계비로 맞이하는 가례(국혼)를 올렸으며, 마침 그해 진사시 시험차 한양에 올라왔던 31세의 황윤석은 이 역사적 경사를 직접 목격했습니다.\n\n2. 국혼 경사로 열린 정시(과거)와 도성의 축제 분위기 : 왕비 책봉과 가례를 축하하기 위해 도성 곳곳에 화려한 의장 행렬이 펼쳐지고 경축 과거 시험이 열리는 등 한양 전체가 들썩였습니다.\n\n3. 새로운 외척 세력(경주김씨 김한구·김귀주)의 등장 예고 : 황윤석은 일기에 국혼의 성대한 의식 절차와 함께, 새 왕비의 친정인 김한구 일가가 정계의 새로운 핵심 세력으로 부상하는 미묘한 기류를 예리하게 포착해 적었습니다.\n\n4. 정국 변동의 분수령 : 이 1759년의 국혼은 훗날 사도세자의 비극(임오화변)과 정조 대 벽파 세력의 형성으로 이어지는 결정적 사건이 되었습니다.", "5-32": "1. 쌀 낭비를 막기 위해 영조가 내린 초강력 금주령(禁酒令) : 영조는 흉년에 백성들이 귀한 쌀로 술을 빚어 마시느라 식량이 부족해지고 풍기가 문란해진다며, 제사용 단술(예주) 외에 술을 빚거나 마시는 자를 극형에 처하는 엄격한 금주령을 단행했습니다.\n\n2. 대신의 목을 베고 대궐 문밖에서 본보기를 보인 추상같은 법 집행 : 실제로 금주령 기간에 몰래 술을 마신 관원을 유배 보내거나 사형에 처할 만큼 단속이 삼엄하여, 양반가 사랑방에서도 술잔이 자취를 감추었습니다.\n\n3. 술 대신 꿀물(밀수)·생강차·미숫가루로 손님 대접 : 황윤석의 일기를 보면 금주령 기간 동안 사우들과 모일 때 술 대신 꿀물이나 식혜, 차(茶), 국수로 정을 나누며 법을 지켰던 생생한 풍경이 나타납니다.\n\n4. 금주령 해제의 기쁨 : 이후 국왕이 고령 노인들의 기력 회복과 농민들의 노고를 위로하기 위해 금주령을 완화하거나 풀었을 때 사람들이 기뻐하던 모습도 사실적으로 적혀 있습니다.", "5-33": "1. 어머니 숙빈 최씨의 사당 육상궁(毓祥宮)에 대한 영조의 지극한 효심 : 영조는 무수리 출신이었던 생모 숙빈 최씨의 위상을 높이기 위해 사당을 '육상궁'으로 승격시키고, 재위 기간 내내 수백 차례나 직접 행차해 참배했습니다.\n\n2. 예법 원칙을 내세운 신하들과 어머니를 그리워한 국왕의 줄다리기 : 정통 성리학 예법을 중시하던 일부 신하들은 후궁 출신 사친(사사로운 어머니)의 사당을 지나치게 높이는 것에 조심스러운 입장을 보였으나, 영조는 눈물로 불효를 자책하며 자신의 뜻을 관철했습니다.\n\n3. 황윤석이 수행하고 기록한 육상궁 거둥 : 한양에서 관직 생활을 하던 황윤석은 영조가 팔순이 넘은 고령에도 비바람을 무릅쓰고 육상궁에 행차(거둥)하는 모습을 여러 차례 수행하고 일기에 기록했습니다.\n\n4. 인간 영조의 내면 : 절대 권력자이기 이전에 평생 어머니의 신분적 한을 풀어드리고 싶어 했던 인간 영조의 애틋한 내면을 엿볼 수 있습니다.", "5-34": "1. 군역 기피처와 당쟁의 본거지가 된 남설(亂設) 서원의 폐단 : 18세기 중반에는 각 지방에서 조정의 허락도 없이 사사로이 세운 서원(사우)이 수백 개에 달해, 양반들이 백성을 수탈하고 평민들이 원생으로 이름을 올려 군포 세금을 피하는 폐단이 심각했습니다.\n\n2. 1741년 영조의 갑령(금령)과 무허가 서원 수백 곳 철폐 : 이에 영조는 대원군보다 무려 120여 년이나 앞서 무단으로 세운 서원과 사우 170~300여 곳을 과감히 헐어버리는 대대적인 서원 정리책을 단행했습니다.\n\n3. 일기에 나타난 지방 사림의 당혹감과 자성 : 황윤석은 조정의 서원 단속령이 내려올 때마다 호남 지역의 서원들이 어떻게 대응했는지 기록하면서, 참된 강학(공부) 기능은 잃고 제사와 당론에만 매달리는 당시 서원 문화에 대해 차분한 성찰을 남겼습니다.\n\n4. 실록을 보완하는 향촌 현장 기록 : 중앙의 서원 철폐 명령이 실제 지방 유림 사회에 어떤 파장을 일으켰는지 보여주는 중요한 사료입니다.", "5-35": "1. 1789년(정조 13) 아버지 사도세자의 능을 수원으로 옮긴 정조의 대효(大孝) : 노년의 황윤석이 고향 구수동에 머물던 1789년 가을, 정조는 아버지 사도세자의 묘소(영우원)를 양주 배봉산에서 조선 최고의 명당으로 꼽힌 수원 화산(현륭원·융릉)으로 이장하는 국가적 대역사를 단행했습니다.\n\n2. 조보와 인편을 통해 고창까지 생중계된 천봉(遷奉) 행렬 : 비록 황윤석은 고령으로 고향에 있었으나, 수원 고을 전체를 새 도시로 옮기고 수만 명의 인부와 장엄한 발인 행렬이 한강을 건너 수원으로 향하는 전 과정을 조보와 서울 지인들의 편지를 통해 날짜별로 생생히 기록했습니다.\n\n3. 천하의 명당 수원에 쏠린 전국 유림의 관심 : 풍수학(감여학)에도 조예가 깊었던 황윤석은 새로 정해진 수원 현륭원의 산세와 좌향(방향), 그리고 정조가 직접 지은 비문과 제문 소식을 깊은 감회 속에 적어두었습니다.\n\n4. 화성 축성으로 이어지는 역사적 서막 : 정조 대 최대 프로젝트였던 수원 화성 건설이 시작되던 당시 전국 사대부들의 뜨거운 관심을 그대로 보여줍니다.", "5-36": "1. 수백 년간 능력 있는 서얼들의 발목을 잡은 서얼 금고법 : 조선 시대에는 양반의 첩에게서 태어난 서자·얼자(서얼)는 아무리 학문이 뛰어나도 문과 응시와 청요직(핵심 관직) 진출이 가로막히는 가혹한 신분 차별을 겪었습니다.\n\n2. 영·정조 대 수천 명의 서얼들이 올린 집단 상소(통청 운동) : 1770년대 들어 전국의 서얼 유생 수천 명이 한양에 모여 자신들에게도 과거와 관직의 길을 열어달라는 대규모 연명 상소를 올리며 뜨거운 사회 현안으로 떠올랐습니다.\n\n3. 1777년 정조의 서얼 허통(규장각 검서관 발탁)과 황윤석의 기록 : 황윤석은 서얼들의 집단 상소문 내용과 이에 대한 조정 대신들의 찬반 논란, 그리고 마침내 정조가 서얼들의 관직 진출 규정을 완화(정유절목)하고 규장각 검서관으로 발탁하는 과정을 일기에 상세히 기록했습니다.\n\n4. 신분제 변동기의 생생한 증언 : 재능 있는 인재라면 신분의 굴레를 넘어 쓰여야 한다는 시대적 변화의 물결을 확인할 수 있습니다.", "5-37": "1. 1763~1764년 조엄(趙曮)을 정사로 파견한 계미년 통신사 : 영조 39년(1763년) 일본 에도 막부의 새 장군 습직을 축하하기 위해 정사 조엄과 서기 남옥·성대중·원중거 등 470여 명의 대규모 조선통신사 일행이 일본을 다녀왔습니다.\n\n2. 구황작물 고구마(감저)의 전래와 일본 문물 정보 : 이 통신사 행차를 통해 대마도에서 구황작물인 고구마 종자가 처음 조선에 들어왔으며, 일본 학자들과 나눈 시문 창수(필담)와 일본의 도시·출판 문화 소식이 한양 지식인 사회에 큰 화제가 되었습니다.\n\n3. 황윤석이 모은 통신사 일행의 견문록 : 평소 외국 언어와 지리에 관심이 많았던 황윤석은 통신사에 다녀온 문사들의 기행시와 견문을 입수해 일본의 풍속, 지리, 역법 수준을 일기와 저술에 꼼꼼히 메모했습니다.\n\n4. 18세기 한일 문화 교류의 창 : 통신사가 단순한 외교 사절을 넘어 동아시아 지식인들이 서로의 학문을 확인하던 통로였음을 보여줍니다.", "5-38": "1. 서해와 남해 바닷가에 자주 밀려온 난파선(표류선) : 여름철 태풍이나 겨울철 북서풍이 불 때면 중국(청나라) 상선이나 일본 어선, 오키나와(유구국) 배, 심지어 낯선 남방·서양 선박들이 전라도 부안·흥덕·제주도 해안에 표류해 오는 일이 종종 발생했습니다.\n\n2. 지방 수령과 역관의 문정(問情, 필담 조사) 절차 : 외국 배가 표류해 오면 관아에서는 해안을 경비하는 동시에, 한자를 아는 선비나 역관을 보내 종이에 한문으로 글을 써서(필담) 어느 나라 사람이고 왜 표류했는지 조사하고 식량과 옷을 주어 돌려보냈습니다.\n\n3. 일기에 기록된 표류민들의 신기한 복장과 물건 : 서해안 고창·부안에 살았던 황윤석은 인근 바다에 표류해 온 중국 강남 상인이나 유구국 사람들의 머리 모양, 의복, 배의 구조, 그리고 그들이 가진 진귀한 물건 소식을 호기심 어린 눈으로 일기에 상세히 기록했습니다.\n\n4. 바다를 통한 세계와의 조우 : 쇄국의 시대에도 바닷가 고을에서는 표류선을 통해 바깥세상의 다채로운 문물과 마주하고 있었습니다.", "5-39": "1. 조선 후기 민심을 뒤흔든 비기(예언서) 《정감록》 : 18세기 중후반 거듭된 기근과 역모 옥사, 전염병으로 사회가 불안해지자 민간과 일부 몰락 양반들 사이에서 왕조의 운명과 전란을 예언한 《정감록》 같은 비기(秘記)와 참언이 은밀히 유행했습니다.\n\n2. 전쟁과 기근을 피할 수 있다는 열 곳의 명당 '십승지(十勝地)' 소문 : 특히 앞으로 큰 난리가 나면 풍기, 봉화, 보은, 공주 유구, 무주 무풍, 부안 변산 등 산이 깊고 기름진 십승지로 숨어야 살아남는다는 소문이 퍼져 실제로 이사하는 사람들까지 생겨났습니다.\n\n3. 유학자 황윤석의 이성적 비판과 민심 기록 : 황윤석은 인근 부안 변산 등이 피난처로 거론되는 세간의 소문을 일기에 기록하면서도, 이러한 괴이한 예언서에 현혹되어 생업을 버리는 것은 어리석은 일이라며 합리적 이성으로 경계했습니다.\n\n4. 당대 민중 심리의 온도계 : 공식 역사서에서는 반역 문서로만 취급해 지워버린 18세기 민중들의 불안과 희망을 날것 그대로 보여주는 기록입니다.", "5-40": "1. 초가집과 기와집이 다닥다닥 붙어 있던 한양 도성의 화재 취약성 : 18세기 한양은 인구가 20만 명을 넘어서며 종로와 남대문·동대문 안팎에 집들이 빽빽하게 들어서, 한 번 불이 나고 바람이 불면 수백 호에서 천여 호가 순식간에 잿더미가 되는 대화재가 자주 발생했습니다.\n\n2. 금화군(소방대) 출동과 국왕의 긴급 구휼미 방출 : 큰불이 나면 훈련도감·금위영·어영청 군사들이 달려가 주변 집의 지붕을 허물어 불길이 번지는 것을 막았고(방화선 구축), 국왕은 즉시 집 잃은 이재민들에게 쌀과 집 지을 목재·엽전을 나누어 주었습니다.\n\n3. 일기에 기록된 한양 대화재의 참상 : 황윤석은 서울 체류 중 목격했거나 조보에 실린 도성 대화재의 발화 지점, 소실된 가옥 수, 그리고 불탄 시전 상인들의 피해 규모를 상세히 기록했습니다.\n\n4. 도시 재난사의 생생한 사료 : 250년 전 수도 서울에서 대형 화재가 발생했을 때 국가의 재난 대응 시스템이 어떻게 작동했는지 보여줍니다.", "5-41": "1. 엄중한 대궐과 관청에서도 벌어진 대담한 도난 사건 : 경비가 삼엄한 궁궐 안의 전각이나 중앙 관청 창고에서도 밤사이 은그릇, 비단, 공금, 혹은 왕실의 중요 물품이 사라져 발칵 뒤집히는 사건이 간혹 일어났습니다.\n\n2. 의금부와 포도청의 합동 수사와 수문장 문책 : 이런 사건이 터지면 그날 밤 당직을 섰던 관원과 수문장들이 줄줄이 의금부에 끌려가 문책을 당했고, 포도청 포졸들이 한양의 장물아비와 전당포를 샅샅이 뒤져 범인을 잡아냈습니다.\n\n3. 일기에 적힌 관가 도난 소동과 자물쇠 단속 : 사도시·종부시·사복시 등 주요 관청에서 근무했던 황윤석은 이러한 도난 사건 소식을 타산지석으로 삼아 자신이 맡은 창고와 문서고의 자물쇠 봉인을 이중 삼중으로 점검했습니다.\n\n4. 사람 사는 세상의 리얼리티 : 근엄하기만 할 것 같은 조선 왕조의 궁궐과 관청에서도 온갖 사건·사고가 끊이지 않았음을 흥미롭게 전해줍니다.", "5-42": "1. 궁궐 문밖으로 걸어 나와 백성들을 직접 만난 영조 대왕 : 영조는 신하들의 보고서에만 의존하지 않고, 창경궁 홍화문이나 경희궁 흥화문 밖으로 직접 행차해 거리에서 한양의 시전 상인, 공인, 노인, 아낙네들을 불러 모아 애로사항을 직접 물었습니다.\n\n2. 쌀값 걱정과 세금 고통을 직접 듣고 즉석에서 해결 : 백성들 앞에서 '요즘 쌀값이 얼마냐, 관아에서 부당하게 뜯어가는 세금은 없느냐'고 자상한 할아버지처럼 묻고, 그 자리에서 호조 판서에게 명해 쌀을 풀거나 폐단을 고치게 했습니다.\n\n3. 황윤석이 현장에서 목격한 국왕과 백성의 대화 : 한양에 머물던 황윤석은 영조가 대궐 문밖에서 백성들을 모아놓고 눈물을 흘리며 위로하던 감동적인 장면을 일기에 생생하게 묘사했습니다.\n\n4. 민본 정치의 살아있는 현장 : 왕과 백성이 궁궐 문턱에서 직접 마주 앉아 대화했던 조선 후기 소통 정치의 명장면입니다.", "5-43": "1. 국가 편찬 서적의 완성 축하와 봉안(奉安) 행렬 : 《어제선원보략》이나 국왕의 문집, 《동국문헌비고》 같은 국가적 편찬 사업이 끝나면, 인쇄된 책을 화려한 가마(채여)에 싣고 악대를 앞세워 규장각과 전국 4대 사고(강화 정족산·무주 적상산·평창 오대산·봉화 태백산)에 모시는 성대한 행사가 열렸습니다.\n\n2. 편찬에 참여한 관원들에게 내리는 상급(시상)과 책 하사 : 교정과 편찬에 수고한 대제학 이하 실무 관원들에게는 품계를 올려주거나 말(숙마)·비단·사슴가죽을 상으로 내리고, 인쇄된 책을 한 질씩 가보로 하사(사건·賜件)했습니다.\n\n3. 종부시주부 황윤석의 봉안 행렬 참여 : 황윤석은 1769년 종부시주부로서 왕실 족보 《선원보략》의 교정과 봉안 업무에 직접 참여하며 그 엄숙한 의식 절차와 자부심을 일기에 남겼습니다.\n\n4. 기록 문화를 존중한 나라 : 책 한 권을 만들고 보관하는 일을 국가 최고의 의례로 여겼던 조선의 높은 문화 의식을 보여줍니다.", "5-44": "1. 사도세자의 장인 홍봉한(풍산홍씨) vs 정순왕후의 오빠 김귀주(경주김씨) : 영조 후반 조정은 세손(정조)의 외할아버지로서 오랫동안 정권을 잡았던 홍봉한 일파(북당)와, 젊은 계비 정순왕후의 친정 오빠로서 떠오른 김귀주 일파(남당) 사이의 치열한 외척 권력 투쟁에 휩싸였습니다.\n\n2. 빗발치는 상호 탄핵과 정국의 급반전 : 어제까지 영의정으로 권세를 누리던 인물이 상대파의 날카로운 상소 한 통에 하루아침에 파직되어 도성 밖으로 쫓겨나고, 며칠 뒤 다시 복귀하는 롤러코스터 같은 정국이 이어졌습니다.\n\n3. 황윤석 일기에 남은 생생한 관전평 : 마침 이 시기 한양에서 관직 생활을 하던 황윤석은 두 외척 가문이 벌이는 숨 막히는 수 싸움과 상소문 전쟁을 날마다 일기에 기록하며 외척 정치의 위험성을 경계했습니다.\n\n4. 훗날 세도정치의 예고편 : 왜 정조가 즉위한 뒤 홍봉한 가문과 김귀주 가문 양쪽 모두의 외척 권력을 철저히 배제하려 했는지 그 배경을 명쾌하게 설명해 줍니다.", "5-45": "1. 학문(서학)에서 신앙(천주교)으로 번지기 시작한 1780년대 : 처음에는 천문·역법·기하학 같은 서양 과학 지식으로만 수용되던 서학(西學)이 1784년 이승훈의 북경 세례 이후 남인 소장파와 중인을 중심으로 실제 천주교 신앙 모임으로 발전했습니다.\n\n2. 1785년 추조(형조) 적발 사건과 서학 서적 금수 조치 : 한양 명례방(명동) 김범우의 집에서 신자들이 모여 예배를 드리다 형조에 적발되면서 조정에서 큰 논란이 일었고, 정조는 북경에서 불경한 서양 서적(패관잡설·서학서)을 들여오지 못하게 금령을 내렸습니다.\n\n3. 노년의 황윤석이 기록한 서학 논쟁과 정국의 파장 : 고향 구수동에 머물던 황윤석은 조보와 서울 편지를 통해 이 천주교 적발 사건과 이가환·정약용 등 남인 학자들을 둘러싼 공방을 일기에 상세히 기록했습니다.\n\n4. 과학은 취하되 종교적 교리는 경계한 실학자의 시각 : 서양의 정밀한 수학과 과학은 적극 받아들이면서도 조상 제사를 거부하는 종교적 교리에 대해서는 정통 성리학자로서 분명한 선을 그었던 당대 지성의 태도를 보여줍니다.", "5-46": "1. 서울 벌열 가문의 관직 독점에 대한 국왕의 우려 : 영조와 정조는 이조에서 관원을 추천할 때 한양에 사는 유력 가문 자제들만 편중해서 올리고, 전라도·경상도·평안도·함경도의 실력 있는 선비들을 소외시키는 세태를 거듭 질책했습니다.\n\n2. 각 도 관찰사에게 내린 인재 천거령(향천) : 이에 국왕은 팔도 관찰사에게 명하여 도내에서 학문과 효행, 실무 능력이 뛰어난 재야 선비들을 매년 추천(천거)하게 하고 인사철마다 지방 출신을 일정 비율 이상 반드시 포함하도록 신칙했습니다.\n\n3. 천거로 발탁된 황윤석과 현실의 벽 : 황윤석 자신도 이러한 호남 인재 천거를 통해 장릉참봉으로 관직의 문을 열었으나, 막상 한양 정계에 들어가 보니 여전히 서울 인맥이 없으면 요직에 오르기 힘든 구조적 한계를 일기에 솔직히 토로했습니다.\n\n4. 오늘날의 지역 균형 인사와 닮은 고민 : 250년 전에도 수도권 집중과 지방 인재 등용 문제가 국가의 중요한 화두였음을 알 수 있습니다.", "5-47": "1. 현직·전직 정승과 판서 별세 시의 국가적 예우(졸기) : 나라를 이끌던 삼정승이나 판서, 혹은 산림의 대학자가 세상을 떠나면 승정원이 즉시 국왕에게 아뢰고, 국왕은 슬픔을 표하는 전교와 함께 며칠간 조회와 시장을 멈추는(철조·철시) 예를 갖추었습니다.\n\n2. 관짝 재료(동원비기)와 장례 물품 하사 : 조정에서는 고인의 공로를 기려 최고급 소나무 관재와 장례 비용, 제문을 내려보내고 예조 관원을 보내 국왕 대신 조문(치제)하게 했습니다.\n\n3. 일기에 적힌 당대 거물들의 부고와 인물평 : 황윤석은 조보를 통해 당대의 명재상이나 학자들의 별세 소식을 접할 때마다, 일기에 그 인물의 평생 공과(잘한 일과 못한 일)와 세간의 평가를 짤막한 열전처럼 적어 남겼습니다.\n\n4. 생생한 당대 인물 비평록 : 딱딱한 묘비명과 달리 동시대인이 바라본 솔직하고 날카로운 인물 평가가 담겨 있어 읽는 재미가 큽니다.", "5-48": "1. 과거 시험 합격자 명단을 통째로 취소하는 초유의 사태 파방(罷榜) : 과거 시험이 끝난 뒤 시험 문제가 사전에 유출되었거나, 채점관이 친인척을 부정 합격시킨 사실이 드러나면 사헌부·사간원의 탄핵과 국왕의 결단으로 그 시험의 합격자 전체를 무효 처리하는 '파방'이 선언되었습니다.\n\n2. 정당하게 합격한 수험생들의 날벼락 같은 비극 : 부정행위를 저지른 몇 사람 때문에 밤새워 정직하게 실력으로 합격했던 수십 명의 선비들까지 합격증(백패·홍패)을 빼앗기게 되어 통곡과 원성이 하늘을 찔렀습니다.\n\n3. 일기에 기록된 과거 부정 사건과 파방 논쟁 : 황윤석은 영·정조 대에 일어났던 과장 부정 사건들과 파방 여부를 둘러싼 조정의 격렬한 논쟁을 일기에 상세히 기록하며 공정한 시험 관리의 중요성을 강조했습니다.\n\n4. 공정성에 민감했던 조선 사회 : 시험의 공정성이 무너지면 국가의 기강이 흔들린다고 보았던 엄중한 역사의식을 보여줍니다.", "5-49": "1. 단순한 기사 스크랩을 넘어선 역사가의 시선 : 황윤석은 조보(기별지)를 읽고 일기장에 옮겨 적을 때 그냥 글자만 베낀 것이 아니라, 그 사건이 왜 일어났고 앞으로 어떤 파장을 불러올지 자신의 분석과 감상을 행간에 함께 적어두었습니다.\n\n2. 후대 사관(역사가)들에게 남기는 증언 : 그는 자신의 일기가 훗날 집안 후손들과 후세 학자들에게 읽힐 것임을 의식하며, 공식 기록이 권력자의 눈치를 보느라 차마 적지 못한 시대의 진실을 사초(史草)처럼 남기려 했습니다.\n\n3. 날씨·물가·정치를 하나로 연결한 통찰 : 가뭄이 심해 쌀값이 오르는 시기에 조정에서 어떤 구휼책이 나오는지, 혹은 당쟁으로 민생을 외면하는지 정치와 경제를 하나로 묶어 바라보았습니다.\n\n4. 살아있는 1인 언론사 : 매일 밤 등불 아래서 조보를 분석하고 논평을 쓰던 황윤석은 그 자체로 18세기 최고의 시사 평론가였습니다.", "5-50": "1. 한양에서 땅끝 시골까지 촘촘히 연결된 뉴스 네트워크 : 흔히 전근대 조선을 고립되고 닫힌 사회로 생각하기 쉽지만, 《이재난고》를 펼쳐보면 매일 발행되는 조보와 통문, 역참, 보부상 인편을 통해 전국이 하나의 실시간 정보망으로 움직이고 있었음을 알게 됩니다.\n\n2. 높은 문자 해독률과 기록 문화의 힘 : 서울의 대신부터 전라도 시골의 선비, 관아의 아전에 이르기까지 끊임없이 편지를 쓰고 문서를 필사하며 정보를 공유하고 검증하는 고도의 지식 사회였습니다.\n\n3. 중앙 정치에 적극 목소리를 낸 지방 공론장 : 지방 선비들은 단순히 뉴스를 받아보는 수용자에 머물지 않고, 서원 통문과 만인소를 통해 중앙 정치를 견제하고 여론을 만들어냈습니다.\n\n4. 오늘날의 인터넷·SNS 시대를 닮은 열기 : 250년 전 한지에 붓으로 쓰였을 뿐, 새로운 소식을 갈구하고 진실을 토론하던 열기만큼은 오늘날의 디지털 정보 사회 못지않게 뜨거웠습니다.", "6-11": "1. 1푼(문)이 10개면 1전(돈), 10전이면 1냥(100문) : 조선 후기 화폐 단위는 엽전 1개를 1문(푼)이라 부르고, 10문이 1전, 10전(즉 엽전 100개)을 1냥(兩)으로 계산했습니다.\n\n2. 쌀값으로 환산해 본 1냥의 체감 가치 : 풍년과 흉년에 따라 변동이 있었으나, 18세기 중후반 평년 기준으로 엽전 1냥이면 백미(흰쌀) 약 두세 말(2~3두, 약 30~40kg 내외)을 살 수 있었으므로 오늘날 체감 가치로 약 7만~10만 원 안팎에 해당했습니다.\n\n3. 주막 국밥 한 그릇에 엽전 5~10문(푼) : 따라서 엽전 한 푼(1문)은 오늘날의 약 700~1,000원 수준이어서, 주막에서 국밥 한 그릇에 막걸리 한 잔을 사 먹는 데 보통 5문~10문(약 5천~1만 원) 정도가 들었습니다.\n\n4. 일기 속 세밀한 물가 감각 : 황윤석의 일기에는 이 몇 문, 몇 전, 몇 냥의 지출이 매일 기록되어 있어 250년 전 돈의 가치를 손에 잡힐 듯 생생하게 느낄 수 있습니다.", "6-12": "1. 엽전 한 냥(100개)의 무게만 약 400g : 구리 합금으로 주조한 상평통보 당일전(1문짜리) 한 개의 무게는 약 4g(한 돈) 내외였기 때문에, 1냥(100개)이면 400g, 10냥(1관, 1,000개)이면 무려 4kg에 달했습니다.\n\n2. 100냥이면 쌀 한 가마니 무게인 40kg : 따라서 땅이나 집을 사거나 한양 장기 유학비로 50냥~100냥의 현금을 움직이려면 성인 남자가 혼자 들기도 힘든 수십 kg의 쇳덩어리를 조랑말이나 짐꾼 지게에 실어야 했습니다.\n\n3. 지푸라기 노끈으로 꿰어 다닌 '엽전 꾸러미(꾸림)' : 동전 가운데에 네모난 구멍이 뚫려 있는 이유가 바로 노끈(전민)으로 100개(1냥)나 1,000개(10냥)씩 길게 꿰어 어깨에 메거나 말 안장 양쪽에 걸쳐 운반하기 위해서였습니다.\n\n4. 어음(환표)이 발달할 수밖에 없었던 이유 : 이처럼 무겁고 도둑맞기 쉬운 엽전의 단점 때문에 황윤석을 비롯한 지방 선비들은 한양에 갈 때 종이 한 장으로 돈을 찾아 쓰는 어음(환) 거래를 적극 활용했습니다.", "6-13": "1. 천차만별이었던 한양의 집값 : 18세기 한양에서 일반 서민들이 사는 작은 초가집 한 채는 보통 10냥~30냥 수준이었고, 중인이나 사대부들이 사는 번듯한 기와집은 위치와 칸수에 따라 100냥에서 수백 냥을 호가했습니다.\n\n2. 지방 유생들의 하숙과 방 빌리기(사글세·식채) : 과거를 보러 올라온 지방 선비들은 집을 사는 대신 성균관 반촌이나 남촌의 사랑방을 빌려 지냈는데, 보통 방세는 따로 받지 않거나 소액만 받는 대신 매달 밥값(식채)과 땔감 비용으로 쌀 몇 말 또는 엽전 몇 냥을 계산했습니다.\n\n3. 한양 관원 시절의 거처 마련 : 황윤석이 중앙 관직에 나갔을 때도 박봉으로 서울에 큰 집을 사기 어려워 친지나 지인의 집 사랑채를 빌려 쓰거나 저렴한 세방(貰房)을 옮겨 다니며 검소하게 생활했습니다.\n\n4. 250년 전 서울 부동산과 주거비 기록 : 일기에 적힌 하숙비와 이사 비용은 18세기 한양의 주거 문화를 보여주는 귀중한 사료입니다.", "6-14": "1. 농가의 최고 재산이었던 큰 소 한 마리(15~30냥) : 논밭을 깊이 갈아엎는 우경(소 쟁기질)에 필수적인 건장한 황소 한 마리는 18세기 당시 엽전 15냥에서 30냥 안팎에 거래되어 작은 초가집 한 채 값이나 논 서너 마지기 값에 맞먹었습니다.\n\n2. 선비의 자가용이었던 조랑말과 준마 가격 : 지방 선비들이 타고 다니는 보통 조랑말(복마·과하마)은 상태에 따라 10냥~25냥 수준이었고, 잘 달리는 제주산 준마나 역마는 40~50냥을 넘기도 했습니다.\n\n3. 노비 몸값과의 비교 : 당시 젊은 남녀 노비 한 사람의 매매 가격 역시 보통 15냥~30냥 선에서 형성되어, 소나 말 한 마리 값과 노비 한 사람의 몸값이 비슷한 수준에서 거래되었음을 종가고문서 명문을 통해 확인할 수 있습니다.\n\n4. 소를 빌려 쓰는 품앗이와 우세(牛貰) : 소가 없는 가난한 농가에서는 소 가진 이웃에게 하루 소를 빌려 쓰고 그 대가로 일손을 갚아주거나 곡식을 내는 관행이 일기에 잘 나타나 있습니다.", "6-15": "1. 조선 후기 농업 생산력을 두 배로 늘린 모내기(이앙법) : 볍씨를 논에 바로 뿌리는 직파법 대신 모판에서 모를 길러 옮겨 심는 모내기법(이앙법)이 삼남 지방에 전면 보급되면서 김매기 노동력이 크게 줄고 수확량이 늘어났습니다.\n\n2. 제때 비가 와야만 가능한 모내기 전쟁 : 그러나 음력 4~5월 모내기 철에 단 하루라도 때맞춰 비가 오지 않으면 모가 말라 죽었기 때문에, 비가 내린 날에는 온 마을 사람들이 총동원되어 하루이틀 안에 모내기를 끝내야 했습니다.\n\n3. 일꾼(고공)의 하루 품삯과 들밥(농주) 대접 : 바쁜 모내기나 김매기 철에 날품팔이 일꾼(단기 고공)을 고용하면 아침·점심·저녁 세 끼 밥과 막걸리(농주), 담배를 푸짐하게 대접하고 하루 품삯으로 엽전 몇 푼이나 곡식을 지급했습니다.\n\n4. 일기에 적힌 구수동 농사 일지 : 황윤석은 해마다 어느 논에 언제 모내기를 했고 일꾼 몇 명에게 밥과 품삯이 얼마 들어갔는지 꼼꼼하게 농가 경영 일지를 남겼습니다.", "6-16": "1. 수확량의 절반씩 나누는 타조법(병작반수) : 지주의 땅을 빌려 농사짓는 소작농(작인)은 가을 타작마당에서 실제 수확한 벼의 절반(50%)을 지주에게 바치고 절반을 갖는 '타조법(병작반수)'이 가장 흔했습니다.\n\n2. 풍흉에 상관없이 정해진 액수를 내는 도조법(賭租法) : 반면 황윤석 가문 문서와 일기를 보면, 18세기 후반에는 매년 수확량을 일일이 재는 번거로움을 줄이기 위해 논 1마지기당 벼 몇 석씩 미리 정해진 고정 소작료만 받는 '도조법'도 널리 확산되고 있었습니다.\n\n3. 흉년에는 소작료를 깎아준 인정 : 극심한 가뭄이나 수해로 작황이 나쁜 해에는 정해진 도조 액수를 고집하지 않고 소작농들의 사정을 살펴 소작료를 대폭 감면해 주었습니다.\n\n4. 타작마당의 풍경과 추수기(秋收記) : 가을마다 들판별로 거두어들인 벼의 가마니 수를 적은 추수 기록은 18세기 호남 평야의 토지 생산성을 정확히 알려줍니다.", "6-17": "1. 닷새마다 열리는 향촌 경제의 심장 5일장(장시) : 18세기 전라도 흥덕현과 이웃 고부·정읍·부안에는 1·6일, 2·7일, 3·8일, 4·9일, 5·10일마다 돌아가며 열리는 5일장(향시)이 그물망처럼 연결되어 있었습니다.\n\n2. 서해안 물류 거점이었던 부안 줄포(茁浦) 장터 : 특히 구수동에서 가까운 바닷가 포구인 줄포장은 서해안의 어물과 소금, 내륙의 쌀과 면포, 죽세품이 대규모로 모이는 호남 서남부의 대표 상업 중심지였습니다.\n\n3. 하인을 장터에 보내 필요한 물품 조달 : 양반 사대부는 체면상 직접 장터에 나가 흥정하는 일을 삼갔기 때문에, 장날 아침이면 집안 노비에게 살 물건 목록(물목)과 엽전을 들려 보내 어물, 고기, 종이, 석유, 농기구를 사 오게 했습니다.\n\n4. 장날마다 기록된 생생한 장바구니 물가 : 장에 다녀온 하인에게 품목별 가격을 보고받아 적어둔 일기 덕분에 18세기 시골 장터의 물가 변동을 날짜별로 추적할 수 있습니다.", "6-18": "1. 바닷물을 끓여 만들던 귀한 전통 소금 자염(煮鹽) : 일제강점기 천일염이 들어오기 전까지 조선 시대의 소금은 개펄의 짠 흙을 걸러 만든 함수(간수)를 큰 가마솥에 넣고 장작불로 밤새 끓여서 만든 '자염(화염)'이었습니다.\n\n2. 고창·부안 곰소만 일대의 활발한 염전과 어살 : 황윤석의 고향인 흥덕과 부안 바닷가(현 곰소만 일대)는 조수 간만의 차가 크고 땔감 소나무가 풍부해 질 좋은 소금과 조기·새우젓, 백합조개가 대량으로 생산되었습니다.\n\n3. 봄철의 소금과 가을철의 쌀 교환 : 바닷가 염부들과 어민들은 소금과 건어물을 내륙 농촌으로 가져와 쌀이나 보리, 면포와 바꾸어 갔으며, 장마철로 불을 못 때면 소금값이 금값으로 치솟기도 했습니다.\n\n4. 해양 경제와 농촌 경제의 결합 : 내륙의 곡창지대와 서해안의 해양 자원이 어떻게 맞물려 돌아갔는지 보여주는 귀중한 지역 경제 사료입니다.", "6-19": "1. 화폐처럼 쓰이던 옷감 무명(면포)과 모시·삼베 : 조선 시대에 무명베(면포)와 삼베(마포), 모시(저포)는 단순히 옷을 해 입는 재료를 넘어 세금(군포)을 내고 물건을 사고파는 현금(실물 화폐)과 똑같은 가치를 지녔습니다.\n\n2. 밤늦도록 그치지 않던 안방의 물레와 베틀 소리 : 황윤석의 어머니 강진김씨와 아내 창원정씨를 비롯한 집안 여성들은 밭에서 거둔 목화와 삼으로 밤잠을 줄여가며 실을 잣고 베틀에 앉아 옷감을 짰습니다.\n\n3. 남편과 아들의 서울 유학비를 보탠 여성들의 노동 : 이렇게 아녀자들이 정성껏 짠 고운 무명과 모시 몇 필은 장터에 내다 팔아 황윤석의 한양 과거 여비와 책값, 그리고 집안 제수 비용을 마련하는 든든한 자금줄이 되었습니다.\n\n4. 여성 경제 활동의 재조명 : 남성 선비들의 화려한 학문과 관직 생활 뒤편에서 종가 살림을 지탱했던 조선 여성들의 피땀 어린 경제적 기여를 일기 속에서 확인할 수 있습니다.", "6-20": "1. 사실을 밝히 적어 증명한다는 뜻의 계약서 '명문(明文)' : 조선 시대에 논밭이나 집, 노비를 사고팔 때는 반드시 한지에 매매 연월일, 파는 이유, 목적물의 위치·면적(또는 노비 이름·나이), 가격을 명시한 공식 계약서인 '명문'을 작성했습니다.\n\n2. 전형적인 매매 사유 '긴히 쓸 곳이 있어(요용소치)' : 계약서 첫머리에는 흔히 '집안에 제사나 빚, 공납 등 긴급히 돈 쓸 곳이 있어 조상 대대로 내려오던 논 몇 마지기를 몇 냥에 영구히 판다(영영방매)'는 상투적 문구가 들어갔습니다.\n\n3. 주인(방매주)·증인·대필자(필집)의 3중 서명(수결) : 사기 매매를 막기 위해 파는 사람(전주·노비주) 본인뿐 아니라 거래를 지켜본 증인(증보)과 계약서를 대신 써준 필집(筆執)이 나란히 이름을 적고 자기만의 고유한 사인인 '수결(手決, 일자수결 등)'을 그었습니다.\n\n4. 장서각에 보존된 수백 점의 실물 명문 : 평해황씨 종가고문서에는 이 시기 실제로 작성된 토지·노비 명문 수백 장이 원형 그대로 남아 있어 일기 속 가계 기록과 정확히 대조됩니다.", "6-21": "1. 국가 등기소 대신 소유권을 증명하던 옛 문서 묶음 '구문기(舊文記)' : 오늘날처럼 등기부등본이 없던 시절에는 내가 이 땅의 정당한 주인임을 증명하려면, 10년·30년·50년 전 이전 주인들이 차례로 땅을 사고팔았던 옛날 계약서 원본들(구문기·본문기)을 줄줄이 가지고 있어야 했습니다.\n\n2. 새 계약서와 함께 옛날 계약서 뭉치를 통째로 인계 : 따라서 땅을 새로 팔 때는 그날 작성한 신문기(새 계약서) 한 장에다가 옛날부터 내려오던 구문기 여러 장을 풀로 길게 이어 붙여(연점) 산 사람에게 통째로 넘겨주었습니다.\n\n3. 만약 옛 계약서를 잃어버렸다면 관청 확인서(입안)로 대체 : 불이 나거나 도둑을 맞아 옛 문서를 잃어버렸을 경우, 계약서에 '구문기는 화재로 소실되어 첨부하지 못하며 차후 다른 문서를 들고 나와 딴소리하면 이 계약서로 관아에 고발해 처벌한다'는 특약 조항을 넣었습니다.\n\n4. 필지 하나의 100년 역사가 담긴 문서 : 이 관습 덕분에 땅 한 마지기 계약서를 펼치면 17세기부터 19세기까지 그 땅의 주인이 어떻게 바뀌고 땅값이 어떻게 올랐는지 한눈에 볼 수 있습니다.", "6-22": "1. 조선 후기 노비들의 신분 해방 통로 '속량(贖良)' : 18세기 후반에는 농사나 장사로 재산을 모은 노비들이 주인에게 일정한 몸값(속량가)을 지불하고 노비 문서를 불태우거나 해방 문서를 받아 양인(평민)으로 신분을 바꾸는 '속량'이 활발히 이루어졌습니다.\n\n2. 속량 가격과 자손 대대 해방 약속 : 속량 비용은 노비의 나이와 사정에 따라 보통 엽전 수십 냥에서 백여 냥 수준이었으며, 돈을 받은 주인은 '이 노비와 그 후손들을 영구히 양인으로 풀어주며 후손 누구도 다시 노비로 삼지 못한다'는 속량 명문(해방 증서)을 써주었습니다.\n\n3. 도망 노비와의 현실적 타협 수단 : 멀리 타지로 도망간 노비를 추쇄(색출)하러 갔을 때도, 억지로 끌고 와 봐야 다시 도망갈 가능성이 크므로 현지에서 속량금을 받고 풀어주는 경우가 많았습니다.\n\n4. 신분제 해체의 생생한 증거 : 황윤석의 일기와 종가고문서에 남은 노비 관련 기록들은 조선 후기 봉건 신분제가 경제적 계약 관계로 어떻게 변화해 갔는지 잘 보여줍니다.", "6-23": "1. 목돈 마련과 상호부조의 지혜 '계(契)' : 한 개인이나 한 집안의 힘만으로는 큰돈이 드는 조상 제사, 장례, 혼례, 서원 운영, 혹은 과거 시험 여비를 감당하기 어려웠기 때문에 친척이나 마을 단위로 기금을 모으는 '계'가 전국적으로 발달했습니다.\n\n2. 쌀과 돈을 불려 이자로 운영하는 식리(殖利) 방식 : 계원들이 처음에 쌀 몇 말이나 엽전 몇 냥씩 추렴해 기본 자본금(계전·계곡)을 만든 뒤, 이를 필요한 사람에게 빌려주고 매년 이자를 받아 기금을 늘려 나갔습니다.\n\n3. 문중의 종계(宗契)와 마을의 대동계, 선비들의 학계 : 황윤석 가문 역시 평해황씨 문중의 제사와 선산 관리를 위한 종계, 동네 사람들이 상사를 돕는 상포계, 친구들과의 동년계 등 여러 계에 참여하며 매년 봄가을로 회계 장부(계안)를 정리했습니다.\n\n4. 전통 협동조합 금융 : 수학과 회계에 밝았던 황윤석은 문중과 향촌 계의 원금·이자 계산과 규약(절목) 작성에서도 핵심적인 역할을 맡았습니다.", "6-24": "1. 가세가 기우는 원인이 될 만큼 컸던 양반가 장례 비용 : 유교 예법에 따라 부모상을 당하면 최고급 소나무 관(널)과 수의, 상복 마련부터 명당 묘자리 구입, 수십 명의 상두꾼과 문상객 대접, 그리고 3년 동안의 상식과 연제·대상 제사까지 막대한 비용이 들어갔습니다.\n\n2. 현금과 현물로 답지하는 조문객들의 부의금(부조·賻助) : 상을 당하면 친척과 사우, 인근 고을 유림들이 슬픔을 나누며 엽전(부금)은 물론 장례에 당장 쓸 쌀, 무명베, 종이(백지), 초(밀초), 건어물, 술을 부조로 보내주었습니다.\n\n3. 일기와 부조록(賻助錄)에 한 명도 빠짐없이 기록 : 황윤석은 1771년 부친상, 1776년 처상, 1781년 모친상을 치를 때 누가 무엇을 얼마만큼 부조했는지 일기와 별도 장부(부조기)에 꼼꼼히 적어두었다가, 훗날 그 집안에 큰일이 생겼을 때 잊지 않고 은혜를 갚았습니다.\n\n4. 상부상조의 공동체 윤리 : 슬픔과 경제적 부담을 혼자 지게 하지 않고 온 공동체가 나누어 졌던 18세기 향촌 사회의 따뜻한 연결망을 보여줍니다.", "6-25": "1. 봄철(춘궁기)에는 비싸고 가을(추수기)에는 싼 쌀값의 법칙 : 농경 사회에서 쌀값은 수확 직후인 음력 9~10월에 가장 싸졌다가, 저장된 곡식이 바닥나는 이듬해 봄 음력 3~5월(보릿고개)이 되면 가을보다 두세 배 이상 비싸지는 뚜렷한 계절 주기를 보였습니다.\n\n2. 비 한 줄기에 요동치는 장터의 곡물 시세 : 특히 음력 5월 모내기 철에 가뭄이 이틀만 더 이어져도 장터의 쌀값이 하루가 다르게 폭등했고, 반대로 단비가 내리면 사재기하던 곡식이 풀리며 값이 안정되었습니다.\n\n3. 황윤석 일기의 정밀한 시세 기록 : 황윤석은 '현재 흥덕 장터에서는 돈 1냥에 쌀이 몇 두 몇 승인데, 한양에서는 1냥에 몇 두밖에 안 한다'며 지역별·계절별 쌀값(시가)을 일기에 꾸준히 기록했습니다.\n\n4. 18세기 거시경제 지표 : 이 기록들을 그래프로 이어 보면 영·정조 대 50여 년간의 경기 변동과 물가 흐름이 현대 통계청 자료처럼 선명하게 그려집니다.", "6-26": "1. 쌀·무명베·동전 세 가지로 내던 세금과 환산 비율 '작전(作錢)' : 조선 후기에는 전세(토지세)나 대동미, 군포를 원래 규정된 쌀이나 무명베 대신 동전(상평통보)으로 환산해 내는 것(대납·작전)이 널리 허용되었습니다.\n\n2. 풍년과 흉년에 따라 달라지는 유불리 : 쌀이 흔해 값이 똥값인 풍년에는 농민들이 현물(쌀)로 세금을 내는 것이 유리한데 관아 아전들은 법정 높은 가격을 적용해 동전(돈)으로 내라고 강요했고, 반대로 쌀값이 폭등한 흉년에는 돈 대신 비싼 쌀로 내라고 요구해 차액을 챙겼습니다.\n\n3. 수령 황윤석의 공정한 세금 수취 : 이러한 아전들의 '작전 농간'을 누구보다 잘 알았던 황윤석은 수령 재임 시절 조정의 공정 고시 가격과 실제 장터 시세를 엄격히 맞춰 아전들이 환산 차액을 가로채지 못하게 막았습니다.\n\n4. 세금 행정의 디테일 : 백성들의 실질 세금 부담이 세율 자체보다도 화폐 환산 과정(작전)에서 어떻게 좌우되었는지 생생히 보여줍니다.", "6-27": "1. 종로 육의전 상인들의 막강한 독점권 '금난전권(禁亂廛權)' : 한양 종로에 자리 잡은 공인된 시전 상인들은 국가에 세금과 왕실 물품을 바치는 대가로, 허가받지 않은 영세 상인(난전·사상)들이 같은 물건을 팔면 물건을 압수하고 체포할 수 있는 특권(금난전권)을 누렸습니다.\n\n2. 물가 폭등과 서민들의 불편 초래 : 그러나 18세기 후반 한양 인구가 급증하면서 소수 시전 상인들이 생필품을 매점매석해 가격을 올리고, 시골에서 채소나 어물을 팔러 온 농민들까지 난전으로 몰아 핍박하자 도성 민심이 크게 악화되었습니다.\n\n3. 정조 대 신해통공(1791년, 자유 상업 허용)으로 이어진 흐름 : 한양 생활을 오래 한 황윤석은 시전 상인들과 도성 밖 사상(私商)들 사이의 상권 갈등과 이에 따른 한양 물가 변동을 주의 깊게 관찰해 일기에 남겼습니다.\n\n4. 상업 자본주의의 태동 : 독점 상업 체제가 무너지고 자유로운 시장 경쟁이 싹트던 18세기 후반 서울 경제의 전환기를 엿볼 수 있습니다.", "6-28": "1. 선비의 최고 애장품이었던 명품 벼루와 붓 : 학자들에게 돌이 단단하고 먹이 곱게 갈리는 충청도 보령 남포석(藍浦石) 벼루나 단양 자석 벼루, 혹은 중국산 단계연은 평생 곁에 두는 보물로, 좋은 벼루 하나에 쌀 몇 가마니 값인 수 냥을 호가했습니다.\n\n2. 사랑방을 장식한 서화 병풍과 지도, 서책 : 또한 명필의 글씨나 산수화를 배접해 만든 병풍과 족자, 세계지도나 팔도 지도, 그리고 수십 책짜리 전집류 서적은 양반 사대부들이 돈을 아끼지 않던 대표적인 문화 소비재였습니다.\n\n3. 황윤석의 알뜰한 문화 소비 기록 : 평소 옷차림과 식사에는 극도로 검소했던 황윤석도 귀한 산학서·역법서나 노안을 덜어줄 수정 안경, 좋은 벼루와 붓을 구할 때는 과감히 지갑을 열고 그 가격과 품평을 일기에 남겼습니다.\n\n4. 18세기 지식인의 소비 취향 : 선비들이 어떤 문방구와 예술품에 가치를 두고 소비했는지 보여주는 흥미로운 물질문화 기록입니다.", "6-29": "1. 조선 전기의 남녀 균분 상속에서 조선 후기 장자 우대 상속으로 : 고려 시대와 조선 초기(16세기)까지만 해도 재산을 아들과 시집간 딸에게 똑같이 나누어 주는 '남녀 균분 상속'이 일반적이었으나, 17~18세기를 거치며 조상 제사를 모시는 장남(종손)에게 재산을 집중시키는 '장자 우대 상속'으로 변해갔습니다.\n\n2. 제사를 모시는 비용 '봉사조(奉祀條)'의 확대 : 종가고문서에 남아 있는 평해황씨 가문의 분재기(재산 상속 문서)를 시대순으로 살펴보면, 18세기에 이르러 사당과 4대 제사, 손님 접대를 책임지는 종손에게 봉사조 논밭과 노비를 먼저 떼어준 뒤 나머지 형제자매에게 나누는 변화가 뚜렷이 확인됩니다.\n\n3. 차남과 출가한 딸들에게도 정성껏 배려한 우애 : 그럼에도 황윤석 가문은 장남 독식이 아니라 동생 황주석과 시집간 여동생들, 그리고 후대 자녀들에게도 생계 기반이 될 논밭과 노비를 성심껏 나누어 주어 형제간의 분쟁이 없었습니다.\n\n4. 가족 제도와 경제사의 교차점 : 한 가문의 수백 년 치 상속 문서를 통해 한국 가족 제도의 거대한 변화 과정을 실증적으로 볼 수 있습니다.", "6-30": "1. 반세기 넘게 한 사람의 손으로 기록된 연속 시계열 데이터 : 단편적인 몇 년 치 기록이 아니라, 1738년부터 1791년까지 54년이라는 긴 세월 동안 동일한 기준과 꼼꼼함으로 물가와 가계를 기록한 자료는 세계 경제사에서도 찾아보기 힘듭니다.\n\n2. 서울(중앙) 물가와 전라도(지방) 물가의 동시 비교 가능 : 황윤석이 한양 유학·관직 생활과 고향 고창 생활을 번갈아 하며 양쪽의 쌀값, 어물값, 집값, 품삯을 모두 기록했기 때문에 중앙과 지방의 물가 격차를 직접 비교할 수 있습니다.\n\n3. 일기(이재난고)와 실물 계약서(종가고문서)의 완벽한 매칭 : 일기에 '오늘 누구에게 논 몇 마지기를 몇 냥에 샀다'고 적힌 기록과 그날 실제로 작성된 실물 토지 명문이 장서각에 세트로 남아 있어 데이터의 신뢰도가 100%입니다.\n\n4. 18세기 조선 경제의 백과사전 : 화폐 유통, 금융(이자·어음), 농업 생산성, 상업 장시까지 조선 후기 실물 경제의 모든 퍼즐이 이 안에 들어 있습니다.", "6-31": "1. 씨앗 한 말을 뿌리는 넓이 '한 마지기(1두락·斗落)' : 민간에서 논밭을 사고팔 때 가장 많이 쓴 단위인 '마지기(두락)'는 볍씨나 보리씨 한 말(1두)을 뿌릴 만한 땅 넓이로, 논은 보통 150~200평 내외, 밭은 100평 안팎을 가리켰습니다.\n\n2. 땅의 비옥도에 따라 면적이 달라지는 세금 단위 '결부(結負)' : 반면 국가에서 세금을 매기는 단위인 1결(100부)은 절대 면적이 아니라 '같은 양의 곡식을 생산하는 면적'을 기준으로 삼았기 때문에, 기름진 1등 논 1결보다 척박한 6등 논 1결의 실제 땅 넓이가 네 배나 더 넓었습니다.\n\n3. 산학(수학)으로 두 단위를 자유자재로 환산한 황윤석 : 일반 백성들은 마지기와 결부 계산이 복잡해 아전들에게 속기 쉬웠으나, 황윤석은 《이수신편》과 일기에서 토지 등급별 결부와 실제 평수(보·척), 두락의 환산 공식을 정확히 정리해 두었습니다.\n\n4. 토지 문서 해독의 핵심 지식 : 종가고문서의 토지 매매 명문에는 항상 '몇 마지기(두락), 세금 장부상 몇 부 몇 속'이 나란히 적혀 있어 이 두 단위의 관계를 실물로 보여줍니다.", "6-32": "1. 벼농사의 생명줄이었던 제언(저수지)과 보(洑) : 모내기법이 전국에 보급되면서 가뭄 때도 논에 물을 댈 수 있는 저수지(제언)와 개울물을 막아 물길을 돌리는 보(洑)의 관리가 마을 전체의 사활을 좌우했습니다.\n\n2. 봄철 농사 시작 전 온 마을이 모이는 가래질과 제언 수축 : 해마다 이른 봄이면 그 저수지 물을 함께 쓰는 농민들과 지주(몽리민)들이 일제히 나와 무너진 둑을 쌓고 바닥에 쌓인 흙을 파내는 공동 부역을 실시했습니다.\n\n3. 물 싸움(수쟁) 중재와 수리 규약 : 가뭄이 심해지면 위쪽 논과 아래쪽 논 주인들 사이에 물꼬를 먼저 대려는 다툼이 벌어지기도 했는데, 이때 황윤석 같은 향촌 사족들이 나서서 순서대로 공평하게 물을 나누는 규칙을 세웠습니다.\n\n4. 일기 속 수리 시설 기록 : 구수동 앞뜰의 보(洑)가 홍수에 터져 수리한 일이나 가뭄 속 물 대기 작업이 일기에 생생히 적혀 있습니다.", "6-33": "1. 보릿고개를 넘기게 해준 구원투수 보리 농사 : 가을에 벼를 수확한 뒤 물 빠짐이 좋은 논이나 밭에 가을보리를 파종해 이듬해 음력 4~5월에 수확하는 이모작은, 쌀이 떨어진 봄철 농가의 생명을 이어주는 가장 중요한 식량이었습니다.\n\n2. 콩·팥·조·수수와 환금작물 목화 재배 : 논농사 못지않게 밭농사도 중요해서 간장·된장과 말 먹이 재료인 콩(태·대두), 떡과 밥에 넣는 팥(소두), 그리고 옷감과 현금이 되는 목화(면화)와 참깨·들깨를 알뜰하게 돌려짓기했습니다.\n\n3. 지주와 소작인의 이모작 혜택 : 보통 논에 뒷그루로 심은 보리 수확물은 지주에게 소작료를 따로 내지 않고 소작농이 전부 가져가는 경우가 많아 가난한 농민들에게 큰 도움이 되었습니다.\n\n4. 사계절 쉬지 않는 농촌의 풍경 : 일기에는 벼 타작이 끝나자마자 보리를 갈고 봄에 보리타작(맥추)을 하는 사계절 농사 주기가 빠짐없이 기록되어 있습니다.", "6-34": "1. 종부(맏며느리)의 가장 큰 임무였던 장 담그기와 술 빚기 : 1년에 십여 차례의 제사와 수백 명의 손님을 치르는 평해황씨 종가에서 간장·된장·고추장 담그기와 제사용·접대용 술(가양주) 빚기는 가계 경영의 핵심이었습니다.\n\n2. 좋은 날(손 없는 날·길일)을 택해 담근 장(醬) : 정월이나 이월에 길일을 택해 메주 수십 덩이와 서해안의 질 좋은 소금으로 큰 독 여러 개에 장을 담갔으며, 장맛이 변하면 집안에 우환이 생긴다 하여 정성을 다해 관리했습니다.\n\n3. 밀기울로 디딘 누룩과 찹쌀·맵쌀로 빚은 전통주 : 여름 밀 수확 철에 좋은 누룩을 디뎌 말려두었다가, 명절과 제사, 귀한 손님 방문에 맞춰 청주(약주)와 탁주(막걸리), 소주를 직접 빚었습니다.\n\n4. 일기에 적힌 술·장 제조 레시피 : 황윤석은 올해 장을 담그는 데 콩 몇 말과 소금 몇 두가 들어갔는지, 어떤 약재를 넣어 약술을 빚었는지까지 꼼꼼히 기록해 두었습니다.", "6-35": "1. 가을 타작 뒤 반드시 해야 하는 초가지붕 이엉 잇기 : 농가와 행랑채의 초가지붕은 1년 동안 비바람을 맞으면 볏짚이 썩기 때문에, 매년 가을 추수가 끝난 직후 새 볏짚으로 이엉과 용마루를 엮어 지붕을 새로 덮어야 했습니다.\n\n2. 몇 년에 한 번씩 하는 기와집 번와(기와 갈기) 공사 : 사랑채와 안채, 사당 같은 기와집도 세월이 흐르면 기와가 깨지고 서까래에 비가 새어, 전문 목수와 기와 기술자(와공)를 불러 깨진 기와를 갈고 회를 바르는 큰 수리를 해야 했습니다.\n\n3. 목수·미장이 품삯과 기와 구매 비용 : 황윤석의 일기에는 집수리를 할 때 기와 몇백 장을 얼마에 샀고, 목수와 일꾼들에게 며칠 동안 밥과 술, 품삯을 얼마 주었는지 건축 회계 장부처럼 자세히 적혀 있습니다.\n\n4. 한옥 유지 관리의 실상 : 전통 가옥 한 채를 온전히 보존하기 위해 해마다 얼마나 많은 손길과 비용이 들어갔는지 잘 보여줍니다.", "6-36": "1. 호텔이나 여관이 따로 없던 시절의 양반가 사랑채 : 조선 시대에는 선비들이 타지를 여행할 때 주막보다 인근 고을 양반가의 사랑채를 찾아가 하룻밤 숙식을 청하는 것이 자연스러운 관습이었습니다.\n\n2. '과객(過客) 대접에 기둥뿌리 빠진다'는 종가의 고충 : 특히 황윤석처럼 학문적 명성이 높고 교통 요지에 자리 잡은 종가에는 아는 사우는 물론 생면부지의 떠돌이 선비(과객)들까지 매일같이 찾아와 밥과 술, 심지어 노자(여비)까지 청하곤 했습니다.\n\n3. 박대하지 않고 예의로 맞이한 후덕한 가풍 : 살림이 빠듯한 날에도 찾아온 손님을 문전박대하면 가문의 수치로 여겼기에, 황윤석과 가족들은 소박한 밥상이라도 정성껏 차려 내어주고 말 먹이까지 챙겨 보냈습니다.\n\n4. 과객들이 전해준 전국의 생생한 뉴스 : 비록 쌀은 축났지만, 전국을 떠도는 이 과객들이 각 지방의 진귀한 소문과 인물 소식을 구수동 사랑방까지 전해준 인간 소식통 역할을 하기도 했습니다.", "6-37": "1. 전라도 세금 쌀을 한양으로 나르는 바다의 대동맥 조운(漕運) : 호남 곡창지대에서 거둔 막대한 양의 전세와 대동미는 함열 성당창이나 영광 법성포 등의 조창에 모였다가, 큰 조운선(세곡선)에 실려 서해 바다와 강화도를 거쳐 한양 경강(마포·서강)으로 운송되었습니다.\n\n2. 안면도와 강화도 손돌목의 험한 물살과 파선(침몰) 사고 : 그러나 봄철 짙은 안개와 거센 조류 때문에 충청도 안면도 앞바다나 강화도 해협에서 수천 석의 쌀을 실은 배가 암초에 부딪혀 침몰(취패)하는 대형 해난 사고가 해마다 끊이지 않았습니다.\n\n3. 파선 시 선원 처벌과 백성들에게 다시 물리는 재징수 논란 : 세곡선이 침몰하면 사공들이 쌀을 빼돌리고 고의로 배를 부쉈는지(고패) 엄중한 조사가 벌어졌고, 잃어버린 세금을 누구에게 변상시킬지 조정과 지방에서 큰 문제가 되었습니다.\n\n4. 서해안 선비 황윤석의 기록 : 바닷가 고창에 살며 한양을 오갔던 황윤석은 그해 조운선이 무사히 올라갔는지, 어디서 몇 척이 파선했는지 조보와 현지 소식을 통해 상세히 기록했습니다.", "6-38": "1. 온돌 난방과 건축으로 늘 부족했던 소나무 : 18세기에는 인구가 늘고 온돌 난방용 땔감(시초)과 집·배를 짓는 목재 수요가 급증하면서 마을 뒷산과 선산의 소나무 숲이 민둥산이 될 위기에 처했습니다.\n\n2. 마을과 문중이 힘을 합쳐 만든 산림 보호 조합 '송계(松契)' : 이에 사족 가문과 마을 주민들은 조상의 묘소가 있는 선산과 마을 숲의 소나무를 함부로 베지 못하도록 자치 규약인 '송계'를 조직하고 산지기(산직)를 두어 감시했습니다.\n\n3. 어긴 사람에 대한 벌금(벌전)과 땔감 채취일 지정 : 송계 규약을 어기고 몰래 생소나무를 벤 사람에게는 엄한 벌금을 물리고, 마른 솔가지나 낙엽(가랑잎)만 정해진 날에 거두어가도록 질서를 잡았습니다.\n\n4. 선조들의 지속 가능한 산림 경영 : 일기와 종가고문서의 송계 관련 기록은 250년 전 향촌 사회가 어떻게 자연환경과 산림 자원을 스스로 지켰는지 보여줍니다.", "6-39": "1. 3년마다 자·오·묘·유년에 돌아오는 식년 호적 조사 : 조선 시대의 모든 가구는 3년마다 집안 식구들의 인적 사항과 소유 노비 명단을 적은 '호구단자(戶口單子)' 2부를 작성해 관아에 제출하고, 관아의 대장(호적대장)과 대조 확인 도장을 받아 1부를 돌려받았습니다(준호구).\n\n2. 노비의 이름·나이·부모 이름까지 적는 재산 등기부 : 양반가에게 호구단자는 단순한 인구 조사를 넘어, 내가 소유한 솔거노비와 외거노비들의 법적 소유권을 국가로부터 공인받는 가장 중요한 재산 증빙 문서였습니다.\n\n3. 지난 3년간 도망간 노비(도망)와 새로 태어난 노비(가현) 기록 : 이 때문에 실제로는 몇 년 전에 도망가서 행방을 모르는 노비라도 행여 나중에 찾았을 때 소유권을 주장하기 위해 호구단자 끝에 '도망'이라고 표시해 계속 이름을 올려두기도 했습니다.\n\n4. 장서각에 전해지는 수십 건의 실물 호구단자 : 황윤석 가문이 3년마다 관아에 제출하고 돌려받은 실물 호구단자 수십 장이 장서각에 연대순으로 남아 있어 가문과 노비의 변천사를 한눈에 보여줍니다.", "6-40": "1. 조선 후기 소송의 절반 이상을 차지한 묘자리 전쟁 산송(山訟) : 좋은 명당자리에 부모와 조상을 모시면 후손이 번창한다는 풍수 신앙이 깊어지면서, 남의 선산 경계 안에 밤중에 몰래 묘를 쓰거나(투장·학장) 소나무를 베어 벌어지는 산송이 전국 관아마다 넘쳐났습니다.\n\n2. 사또가 산 현장에 나가 직접 확인하고 그리는 '산도(山圖)' : 산송이 접수되면 수령은 문서만 보고 판결할 수 없었기에, 원고와 피고를 대동하고 직접 산에 올라가 두 무덤 사이의 걸음 수(보수)와 물길, 산줄기 모양을 눈으로 확인해 그림 지도인 '산도'를 그리게 했습니다.\n\n3. 그림 위에 붉은 붓으로 내리는 판결문 : 그려진 산도 위에 원고의 조상 묘와 피고가 새로 쓴 묘의 위치를 표시하고, 법전에 정해진 금지 거리(금양 범위)를 침범했는지 따져 묘를 파내라(굴총)거나 유지하라는 판결을 내렸습니다.\n\n4. 소송의 당사자이자 판관이었던 황윤석 : 황윤석은 집안 선산을 지키기 위해 관아에 소지(탄원서)를 내기도 했고, 반대로 수령 시절에는 백성들의 산송 현장을 측량해 공정하게 판결한 양쪽 경험을 모두 일기에 남겼습니다.", "6-41": "1. 토지나 집 문서를 맡기고 돈을 빌리는 전당(典當) : 큰돈을 빌릴 때 신용만으로는 빌리기 어려우면, 자신이 가진 논밭의 매매 문서(구문기)나 기와집 문서, 혹은 값비싼 유기그릇·솥 등을 채권자에게 담보로 맡기고 돈을 빌렸습니다.\n\n2. 기한 내에 갚으면 돌려받고 못 갚으면 소유권 이전(환퇴와 영매) : 계약서에 '몇 년 몇 월까지 원금과 이자를 갚으면 문서를 돌려받고(환퇴), 만약 기한을 넘기면 이 땅을 영구히 넘긴다'는 조건을 달아 거래의 안전을 도모했습니다.\n\n3. 한양 유생들이 급할 때 이용한 전당포 : 서울에 머물던 유생들도 고향에서 여비가 오기 전 당장 밥값이 떨어지면 자신의 좋은 갓이나 도포, 서책을 전당 잡히고 급전을 빌려 쓴 뒤 송금이 오면 찾아오곤 했습니다.\n\n4. 18세기 담보 금융의 실상 : 일기와 고문서를 통해 당시 민간에서 담보 대출과 채권 회수가 어떤 법적·관습적 절차로 이루어졌는지 명확히 알 수 있습니다.", "6-42": "1. 포구와 큰 장터의 종합 상사 겸 은행이었던 객주(客主)와 여각 : 부안 줄포나 강경, 한양 마포 같은 큰 포구와 장터에는 타지에서 물건을 실어 온 상인들에게 숙식을 제공하고 창고에 물건을 보관해 주며 도매로 팔아주는 '객주'와 '여각'이 성업했습니다.\n\n2. 물건 매매를 성사시키고 받는 중개 수수료 구문(口文) : 객주 밑에서 파는 사람과 사는 사람을 연결해 흥정을 붙여주는 중개인들을 '거간꾼(집주름)'이라 불렀으며, 거래가 성사되면 정해진 비율의 중개 수수료(구문)를 받았습니다.\n\n3. 어음(환) 발행과 금융 기능까지 수행 : 신용이 탄탄한 큰 객주들은 상인이나 한양에 가는 양반들을 위해 돈을 맡아두고 다른 지역 객주에게서 현금을 찾을 수 있게 해주는 어음(환표) 거래까지 취급했습니다.\n\n4. 일기에 등장하는 장터와 포구의 상인들 : 황윤석이 쌀을 팔아 한양 여비를 마련하거나 서울에서 책을 사서 고향으로 보낼 때 이러한 포구 객주와 상인들의 유통망이 큰 역할을 했습니다.", "6-43": "1. 주인집 울타리 안에서 함께 살아가는 솔거노비(率居奴婢) : 구수동 본가의 행랑채에 거주하며 마당 쓸기, 땔감 해 오기, 농사일, 밥 짓기, 길쌈, 심부름을 직접 담당하는 노비들을 솔거노비라 불렀습니다.\n\n2. 삼시 세끼 식사와 철마다 챙겨주는 옷가지 : 주인집에서는 솔거노비들의 매일 식사를 책임졌을 뿐 아니라, 여름에는 시원한 삼베·무명옷을, 겨울에는 솜을 넣은 따뜻한 옷과 버선을 철마다 지어 입혔습니다.\n\n3. 노비 개인이 농사지어 갖게 해준 작은 땅 '사경지(私耕地)' : 또한 성실한 노비들에게는 주인집 땅 중 일부를 떼어주어(사경지) 노비 가족이 직접 농사지어 사적 재산으로 모을 수 있도록 배려하기도 했습니다.\n\n4. 정으로 얽힌 한 지붕 가족 : 일기에는 늙은 노비가 병들었을 때 황윤석이 손수 약을 지어 먹이고, 노비 자식이 태어나면 기뻐하며 미역과 쌀을 챙겨주던 따뜻한 일상이 기록되어 있습니다.", "6-44": "1. 주인집과 떨어져 독립된 살림을 사는 외거노비(外居奴婢) : 주인집 행랑채가 아니라 다른 마을이나 타 고을에 자기 집과 가족을 꾸려 살면서 소작농이나 장사를 하는 노비들을 외거노비라 불렀습니다.\n\n2. 매년 가을·겨울에 주인에게 바치는 몸값 세금 '신공(身貢)' : 외거노비는 주인집에서 매일 허드렛일을 하지 않는 대신, 1년에 한 번 정해진 액수의 몸값 세금인 '신공'을 쌀이나 무명베, 혹은 동전(엽전 1~2냥 내외)으로 주인집에 납부했습니다.\n\n3. 일기에 적힌 외거노비들의 신공 납부와 안부 : 가을 추수가 끝나고 겨울이 오면 인근 고을이나 충청도에 사는 외거노비들이 구수동 본가로 찾아와 그해의 신공을 바치고 주인집에서 따뜻한 밥과 술을 대접받고 돌아갔습니다.\n\n4. 소작농에 가까웠던 외거노비의 삶 : 조선 후기 외거노비들은 신분만 노비일 뿐 실제 경제생활은 일반 평민 소작농과 거의 다름없는 독립된 가계를 영위하고 있었습니다.", "6-45": "1. 좋은 음식은 혼자 먹지 않는 나눔의 문화 '분정(分呈)' : 황윤석의 일기에서 가장 자주 만나는 따뜻한 단어 중 하나가 바로 맛있는 음식이나 햇과일, 제사 음식을 이웃 친척·어른들에게 조금씩 나누어 보내는 '분정'과 '반사'입니다.\n\n2. 제사 뒤의 음복 떡·고기와 바닷가에서 온 첫 생선 : 종가에서 큰 제사를 지내고 나면 정성껏 만든 떡과 전, 고기를 소반이나 찬합에 담아 마을의 일가 어른들과 홀로 사는 친척 집으로 하인을 시켜 돌렸습니다.\n\n3. 가는 정이 있으면 오는 정이 있는 향촌 인심 : 반대로 이웃 사족 집에서 첫 수박이나 참외를 따거나, 귀한 꿩고기·웅어·조기를 구하면 잊지 않고 황윤석의 서재로 한 접시씩 보내와 서로의 안부를 물었습니다.\n\n4. 일기에 적힌 다정한 음식 일기 : 오늘 어느 집에서 무슨 떡을 보내왔고 우리 집에서는 무엇을 답례로 담아 보냈는지 적힌 기록을 읽으면 250년 전 시골 마을의 정겨운 풍경이 눈앞에 그려집니다.", "6-46": "1. 양반가의 필수 재산이었던 유기그릇(놋그릇)과 무쇠 솥 : 제사상에 올리는 제기와 사랑방의 반상기로 쓰이던 구리·주석 합금 유기그릇(유기)과 부엌의 큰 무쇠 가마솥은 당시 가정에서 가장 값비싼 살림살이였습니다.\n\n2. 쟁기 보습, 호미, 낫을 벼리는 장터 대장간(야장) : 봄철 농사를 시작하기 전이면 무뎌진 쟁기 날(보습)과 호미, 낫, 도끼를 들고 장터 대장간이나 마을에 찾아온 이동식 대장장이에게 맡겨 불에 달구어 새로 벼렸습니다.\n\n3. 깨진 솥이나 유기그릇을 녹여 다시 만드는 주물 비용 : 오래 써서 금이 간 가마솥이나 찌그러진 놋그릇은 그냥 버리지 않고, 쇳물 녹이는 장인(주물장·유기장)에게 옛 쇠를 넘겨주고 공임(수공비)만 조금 보태 새 그릇으로 바꾸어 썼습니다.\n\n4. 물건 하나도 대물림해 쓰던 알뜰함 : 일기 속 농기구 수리비와 그릇 구매 기록은 철과 구리가 귀했던 전근대 사회의 알뜰한 자원 순환 경제를 보여줍니다.", "6-47": "1. 밤공부의 가장 큰 비용이었던 등잔 기름(등유) : 전기가 없던 18세기에 해가 진 뒤 밤늦도록 책을 읽고 일기를 쓰려면 종지에 기름을 붓고 심지에 불을 붙이는 등잔(호롱불)을 켜야 했는데, 이 기름값이 가난한 선비에게는 만만치 않은 지출이었습니다.\n\n2. 비싼 참기름·들기름 대신 아주까리기름(피마자유)과 생선기름 활용 : 먹는 참기름이나 들기름은 너무 비싸 등잔불로 쓰기 아까웠기에, 주로 밭둑에 심은 아주까리(피마자) 열매 기름이나 산초기름, 바닷가에서 구한 생선기름(어유)을 사서 불을 밝혔습니다.\n\n3. 제사와 귀한 손님 맞이에만 아껴 쓴 밀초(벌집 밀랍 초) : 꿀벌의 집에서 얻은 밀랍으로 만든 양초(밀초·황촉)는 연기나 냄새가 적고 밝았으나 가격이 매우 비싸서 조상 제사나 관청 숙직 등 특별한 날에만 아껴 썼습니다.\n\n4. 불빛 한 방울의 소중함 : 황윤석이 '기름이 다 떨어져 달빛에 비추어 글을 읽었다'거나 장터에서 등잔 기름 몇 홉을 사 온 기록을 보면 옛 선비들의 고학(苦學)이 얼마나 치열했는지 느껴집니다.", "6-48": "1. 대나무의 고장 호남의 명품 죽세공품 : 따뜻한 남쪽 지방인 전라도 흥덕·고창·담양·태인 일대는 집집마다 뒤란에 대나무 숲(죽림)이 울창하여 전국 최고의 대나무 수공예품 산지였
