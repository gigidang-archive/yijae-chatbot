습니다.\n\n2. 여름 필수품 죽부인·대자리부터 합죽선 부채, 채반까지 : 대나무를 가늘게 쪼개 엮은 시원한 대자리(죽석), 단오 선물로 최고 인기를 끈 전주·남원 합죽선 부채, 곡식을 까부르는 키와 채반, 붓대, 담뱃대(연죽)가 장터마다 활발히 거래되었습니다.\n\n3. 선비의 상징인 말총 갓(흑립)과 망건 가격 : 또한 제주도와 남해안에서 올라온 말총과 대나무 실(죽사)로 정교하게 엮어 만든 선비들의 갓(흑립)은 품질에 따라 엽전 한두 냥에서 수 냥을 호가하는 고급 패션 아이템이었습니다.\n\n4. 구수동 대밭 가꾸기와 죽제품 구매 기록 : 황윤석 역시 집안의 대나무 숲을 아껴 가꾸고 장날마다 집안에 필요한 소쿠리, 삿갓, 부채를 몇 푼에 샀는지 일기에 정겹게 기록해 두었습니다.", "6-49": "1. 들어오는 것을 헤아려 나가는 것을 조절한다(양입위출·量入出) : 황윤석이 가계 경영에서 평생 지킨 제1원칙은 1년 동안 논밭에서 거두어들일 추수량을 먼저 정확히 계산한 뒤, 그 범위 안에서 제사비와 생활비를 계획해 절대로 분수에 넘치는 빚을 지지 않는 것이었습니다.\n\n2. 선비라도 살림(치산)과 셈에 어두워서는 안 된다 : 돈을 입에 올리는 것조차 천하게 여겨 살림을 하인에게만 맡겼다가 패가망신하는 허세 양반들을 경계하며, 가장(家長)이 직접 주판을 잡고 가계부를 써야 가문의 도덕과 학문도 지킬 수 있다고 가르쳤습니다.\n\n3. 나에게는 엄격하고 남에게는 베푸는 검약 정신 : 자신의 옷 한 벌, 종이 한 장을 쓰는 데는 구두쇠 소리 들을 만큼 아꼈지만, 가난한 친척의 관혼상제나 굶주린 이웃을 돕는 데는 아낌없이 곳간을 열었습니다.\n\n4. 실학자의 반듯한 경제관 : 정당한 노동과 치밀한 회계, 그리고 공동체적 나눔이 조화를 이룬 참된 선비의 경제 철학입니다.", "6-50": "1. 학문적 권위(문화 자본)와 토지 경영(경제 자본)의 조화 : 평해황씨 구수동 종가가 조선 후기 신분제 변동기에도 흔들리지 않고 명문가의 위상을 지킨 비결은, 철저한 독서 교육으로 학문적 존경을 얻는 동시에 부지런한 영농과 문서 관리로 경제적 자립을 이루었기 때문입니다.\n\n2. 계약서 한 장, 영수증 한 장도 버리지 않은 철저한 아카이빙 : 땅 한 마지기를 사고팔거나 세금을 낼 때마다 모든 문서를 궤짝에 분류해 보관하고 일기에 이중으로 기록해 두었기에, 어떤 소송이나 위기에서도 가문의 재산권을 완벽히 방어할 수 있었습니다.\n\n3. 문중의 화합과 향촌 공동체와의 상생 : 장남과 차남, 친척들이 재산으로 다투지 않고 종계를 중심으로 뭉쳤으며, 소작농과 노비들에게도 가혹하지 않게 대하며 향촌의 신망을 얻었습니다.\n\n4. 300년을 이어온 명문가의 비결 : 황윤석의 일기와 고문서는 한 가문이 어떻게 수백 년간 품격과 실속을 함께 지켜낼 수 있는지 보여주는 최고의 가문 경영 교과서입니다.", "7-11": "1. 18세기는 소금 절임 백김치에서 고추 김치로 바뀌던 혁명기 : 임진왜란 전후로 전래된 고추(번초·남만초)가 18세기 들어 본격적으로 김치 양념으로 쓰이기 시작하면서, 젓갈과 고추를 넣은 오늘날 형태의 김치가 탄생했습니다.\n\n2. 황윤석의 어학·생활 기록에 등장하는 김치(침채·딤채)와 번초 : 황윤석은 《이수신편》과 일기에서 우리말 '딤채(김치)'의 어원을 설명하고, 텃밭에서 기른 고추(번초)와 마늘, 생강, 서해안의 조기젓·새우젓으로 김장을 담그는 풍경을 기록했습니다.\n\n3. 겨울철 반찬의 제왕 김장 김치와 동치미 : 가을 무와 배추를 수확해 큰 독에 김장 김치와 톡 쏘는 동치미를 담가 땅에 묻어두는 것은 구수동 종가의 가장 중요한 겨울 준비였습니다.\n\n4. 타향살이 유학생의 소울푸드 : 한양 하숙방에 머물 때도 고향에서 인편으로 보내온 어머니의 김치와 젓갈 항아리가 도착하면 밥맛이 살아났다며 기뻐했습니다.", "7-12": "1. 겨울철 최고의 별미였던 살얼음 동치미 메밀 냉면 : 냉면은 오늘날 여름 음식으로 여겨지지만, 냉장고가 없던 18세기에는 땅속 독에서 살얼음이 낀 동치미 국물을 퍼 올릴 수 있는 늦가을부터 한겨울철 최고의 밤참이자 별미였습니다.\n\n2. 한양 관청 숙직 날과 모임의 단골 배달·초대 메뉴 : 황윤석의 서울 생활 일기를 보면 추운 겨울밤 동료 관원들과 숙직을 서거나 사우들과 모일 때, 메밀국수를 차가운 동치미·육수에 말아 편육과 배를 얹은 냉면이나 따뜻한 장국면, 만두를 시켜 먹은 기록이 자주 등장합니다.\n\n3. 메밀과 녹두로 만든 면 요리 문화 : 고향 전라도에서도 메밀이나 밀가루로 칼국수(절면)를 밀어 장국에 끓여 먹거나 콩국수에 말아 먹는 면 요리를 무척 즐겼습니다.\n\n4. 250년 전의 생생한 야식 기록 : 등불 아래서 동료들과 후루룩 냉면을 나누어 먹던 풍경이 오늘날의 야식 문화와 놀라울 정도로 닮아 있습니다.", "7-13": "1. 삼복더위를 이기는 이열치열 보양식 : 초복·중복·말복이 돌아오면 황윤석을 비롯한 당대 사람들은 더위로 지친 기력을 보충하기 위해 인삼과 대추를 넣은 영계백숙(연계백숙), 개장국(구장), 혹은 쇠고기 육개장을 끓여 먹었습니다.\n\n2. 서해안의 여름 별미 민어와 장어, 조기탕 : 특히 바닷가와 가까운 고창 본가에서는 여름철 제철 생선인 민어와 장어, 병어, 웅어, 죽합(조개)으로 맑은 탕을 끓이거나 회를 쳐서 입맛을 돋우었습니다.\n\n3. 시원한 미숫가루(미수)와 꿀물, 수박·참외 : 한낮의 갈증을 식히기 위해 보리나 찹쌀을 볶아 가루 낸 미숫가루를 찬 우물물에 타서 꿀을 섞어 마셨으며, 텃밭에서 딴 시원한 수박과 참외를 우물물에 띄워 두고 나누어 먹었습니다.\n\n4. 대궐에서 받은 귀한 얼음 조각 : 서울 관원 시절에는 삼복에 국왕이 내리는 빙표(얼음 교환권)로 서빙고의 천연 얼음을 받아와 더위를 식히는 호사를 누리기도 했습니다.", "7-14": "1. 임금부터 서민까지 공포에 떨게 한 피부 염증 '종기(창종)' : 항생제가 없던 조선 시대에 피부에 난 작은 부스럼이나 종기가 등에 크게 번지는 '등창(배종)'이나 '발제창'은 패혈증으로 이어져 정조 임금을 비롯한 수많은 사람의 목숨을 앗아간 치명적인 질환이었습니다.\n\n2. 고름을 빨아내는 고약과 침으로 째는 파종(破腫) 치료 : 황윤석은 자신이나 가족에게 종기가 나면 초기에 열독을 내리는 탕약을 쓰고, 고름이 차오르면 느릅나무 껍질이나 송진 등으로 만든 고약을 붙여 고름을 모은 뒤 침으로 째서 빼내는 외과적 처치를 상세히 기록했습니다.\n\n3. 어의 피부의(종기 전문의)들의 치료법 채록 : 한양에서 종기를 가장 잘 고치기로 소문난 전문 의원들의 처방과 뜸법을 일기와 의학 노트에 꼼꼼히 적어두어 고향 사람들을 치료할 때 활용했습니다.\n\n4. 식이요법과 위생 관리의 중요성 : 종기가 났을 때는 술과 기름진 고기, 비린 생선을 철저히 금하며 몸을 정결히 다스렸습니다.", "7-15": "1. 여름과 가을 농촌을 괴롭힌 단골 풍토병 학질(말라리아) : 모기가 많던 전통 사회에서는 하루걸러 또는 이틀걸러 정해진 시각만 되면 이가 딱딱 부딪칠 정도로 오한이 났다가 불덩이 같은 고열이 나는 학질(학병·자라배) 환자가 매년 속출했습니다.\n\n2. 황윤석의 합리적 약물 치료(절학 탕제) : 민간에서는 학질을 귀신이 붙은 병으로 여겨 부적을 붙이거나 주술적인 방법을 쓰기도 했으나, 황윤석은 《동의보감》의 처방에 따라 시호, 상산, 초과, 패모 등 열을 내리고 기력을 돕는 약재를 정확히 배합해 치료했습니다.\n\n3. 본인과 가족의 학질 투병 일지 : 실제로 황윤석 자신과 아들이 학질에 걸려 며칠 동안 정해진 시간에 열이 오르내릴 때, 맥박의 변화와 복용한 약의 효과를 시간대별로 관찰해 일기에 기록했습니다.\n\n4. 원기를 보하는 근본 치료 : 무리하게 독한 약으로 병만 쫓으려 하면 몸이 상한다 하여, 인삼과 흰죽으로 환자의 체력을 먼저 북돋우는 정통 의학 원칙을 지켰습니다.", "7-16": "1. 통과해야만 비로소 내 자식이 된다던 공포의 두창(천연두·마마) : 18세기 당시 천연두(두창)와 홍역(마진)은 몇 년 주기로 전국을 휩쓸며 수많은 어린아이들의 목숨을 앗아갔기에, 아이가 마마를 무사히 앓고 넘겨야 비로소 호적에 올리고 안심할 수 있었습니다.\n\n2. 마마 기간 중 집안 전체의 금기와 정성(배송) : 집안의 아이나 손자가 두창이나 홍역을 앓기 시작하면 외부인의 출입을 엄격히 막고, 부정한 일이나 비린 음식 냄새를 피하며 밤낮으로 열꽃(발진)이 잘 돋아나기를 기도했습니다.\n\n3. 당대 최신 소아과 의서들의 처방 연구 : 황윤석은 18세기 중후반 유행한 홍역과 천연두 전문 의서들의 치료법을 연구하여, 열독이 안으로 뭉치지 않고 피부 밖으로 순조롭게 빠져나오게 돕는 약재를 신중하게 썼습니다.\n\n4. 손자들의 완쾌와 안도의 기록 : 아들과 손자들이 마침내 딱지가 떨어지며 천연두를 무사히 이겨냈을 때 온 가족이 기뻐하며 떡을 해 나누어 먹은 기록이 애틋하게 남아 있습니다.", "7-17": "1. 노년의 선비들을 가장 괴롭힌 고통 치통(풍치와 충치) : 평균 수명이 늘어나며 40~50대 이후 잇몸이 붓고 이가 흔들리는 풍치(풍열통)와 충치 통증은 황윤석을 비롯한 당대 중년 선비들의 가장 흔한 고통이었습니다.\n\n2. 아침저녁 소금 양치질(염수 양치)과 치아 두드리기(고치법) : 평소 치아 건강을 위해 아침에 일어나면 구운 소금(청염)이나 약재 달인 물로 입안을 헹구고, 윗니와 아랫니를 서른여섯 번씩 가볍게 부딪쳐 잇몸을 단단하게 하는 양생법(고치법)을 실천했습니다.\n\n3. 극심한 치통 때의 약재 머금기와 진통 처방 : 밤에 갑자기 치통이 심해져 볼이 부어오르면 세신(족두리풀), 초피(산초), 백지 등을 달인 물을 입에 머금어 통증을 가라앉히고 위장의 열을 내리는 탕약을 복용했습니다.\n\n4. 일기에 적힌 인간적인 치통 고백 : '어젯밤 오른쪽 어금니가 쑤셔 한숨도 자지 못했다'거나 '흔들리던 이가 마침내 빠져 시원하면서도 서글프다'는 솔직한 노년의 기록이 미소를 짓게 합니다.", "7-18": "1. 조선 시대의 우황청심원(청심환)과 소합원(소합향원) : 갑자기 정신을 잃고 쓰러지는 중풍·기절이나 극심한 가슴 답답증에는 '우황청심환'을, 여행길의 급체·배탈·더위 먹음·찬 기운 감기에는 방향성 약재로 만든 '소합원'을 최고의 명약으로 쳤습니다.\n\n2. 궁중 내의원에서 만들어 국왕이 하사한 최고급 약 : 특히 대궐 내의원에서 정선된 약재와 금박으로 빚어 단오나 연말에 국왕이 관원들에게 내려주는 내하(內下) 청심환과 소합원, 기응환은 돈 주고도 구하기 힘든 귀한 구급약이었습니다.\n\n3. 과거 길과 고향 어른들을 위한 상비약 : 황윤석은 한양을 오가는 험한 여행길에 언제나 이 환약들을 주머니(약낭)에 휴대했으며, 고향에 내려갈 때면 아껴둔 내의원 환약을 어르신들과 위급한 마을 환자들에게 나누어 주어 생명을 구했습니다.\n\n4. 일기 속 응급 처치 기록 : 실제로 길 위에서 급체한 하인이나 갑자기 쓰러진 이웃에게 소합원·청심환을 따뜻한 물에 개어 먹여 소생시킨 사례가 여러 번 등장합니다.", "7-19": "1. 유학자의 기본 소양이었던 의학(유의·儒醫)과 침구술 : '부모님이 병들었을 때 의理를 모르면 효도를 다할 수 없다'는 유교적 신념에 따라, 황윤석은 약물 처방뿐 아니라 경혈(혈자리)에 침을 놓고 뜸을 뜨는 침구학에도 깊은 조예를 갖추었습니다.\n\n2. 기력을 끌어올리는 단전·족삼리 쑥뜸(구법) : 몸이 허약해지거나 만성 위장병, 신경통이 있을 때는 약쑥을 비벼 무릎 아래 족삼리(足三里) 혈이나 배꼽 아래 기해·관원 혈에 뜸을 떠서 면역력과 양기를 북돋우었습니다.\n\n3. 급체와 종기에 활용된 침술 : 갑작스러운 급체로 사지가 싸늘해질 때는 손끝·발끝(십선혈)이나 합곡 혈을 침으로 따서 막힌 기혈을 뚫어주었습니다.\n\n4. 천문 역법과 결합된 자오유주(子午流注) 침법 이해 : 시간에 따라 인체 경락의 기혈이 흐르는 위치가 달라진다는 수리 의학 이론까지 꿰뚫고 있어 침구 치료의 정확도를 높였습니다.", "7-20": "1. 달력의 절기를 따라 흐르는 풍요로운 세시풍속 : 황윤석의 54년 일기는 해마다 정월 설날부터 섣달그믐까지 조선 후기 양반가와 농촌 마을에서 펼쳐진 사계절 세시풍속의 생생한 파노라마입니다.\n\n2. 정월 대보름의 부럼·귀밝이술과 달집태우기 : 음력 1월 15일 대보름 아침에는 한 해 동안 부스럼이 나지 말라고 밤과 호두(부럼)를 깨물고 귀가 밝아지라는 귀밝이술(이명주)을 마셨으며, 저녁에는 마을 뒷산에 올라 보름달을 보며 한 해 농사의 풍흉을 점쳤습니다.\n\n3. 삼짇날 화전, 단오 창포물과 부채, 유두 밀전병 : 봄철 삼짇날(3월 3일)에는 진달래 화전을 부쳐 먹고, 5월 단오에는 창포 삶은 물에 머리를 감고 단오 부채를 선물했으며, 6월 유두에는 햇밀로 수제비와 전병을 해 먹었습니다.\n\n4. 동지 팥죽과 섣달그믐 수세(守歲) : 밤이 가장 긴 동지에는 붉은 팥죽에 새알심을 넣어 사당에 올리고 이웃과 나누었으며, 1년의 마지막 날 밤에는 온 집안에 불을 밝히고 밤을 새우는 '수세'를 하며 새해를 맞이했습니다.", "7-21": "1. 주사위 두 개로 말을 움직이는 인기 보드게임 '쌍륙(雙六)' : 오늘날의 백개먼(Backgammon)과 비슷한 쌍륙은 나무판 위에 양쪽 각 15개의 말을 놓고 주사위 두 개를 던져 나온 숫자대로 말을 옮겨 먼저 다 빼내는 고도의 확률·전략 게임이었습니다.\n\n2. 벼슬길 승진과 파직을 체험하는 조선판 부루마블 '승경도(陞卿圖)' : 커다란 종이에 종9품 참봉부터 영의정까지 수백 개의 관직 칸을 그려놓고, 나무 주사위(윤목)를 굴려 승진하거나 유배·파직당하며 누가 먼저 정승에 오르고 퇴직(봉조하)하는지 겨루는 승경도 놀이는 명절날 선비와 아이들 모두에게 큰 인기였습니다.\n\n3. 선비의 품격 있는 두뇌 대결 바둑(기·碁)과 투호 : 사랑방에서는 조용히 바둑을 두며 수 읽기를 겨루거나, 마당에 항아리를 놓고 화살을 던져 넣는 투호(投壺) 놀이로 집중력을 길렀습니다.\n\n4. 놀이를 수학으로 분석한 실학자 : 황윤석은 쌍륙 주사위의 확률과 바둑판의 수리적 원리까지 학문적으로 탐구하며 건전한 여가 문화를 즐겼습니다.", "7-22": "1. 18세기 한양과 지방을 휩쓴 소설(패관소설·언문소설) 열풍 : 영·정조 대에는 《삼국지연의》, 《수호전》, 《서유기》 같은 중국 소설은 물론 《구운몽》, 《사씨남정기》, 《춘향전》 같은 국문·한문 소설이 필사본과 방각본(상업 출판본)으로 폭발적인 인기를 끌었습니다.\n\n2. 안방 아녀자들의 한글 소설 낭독 문화 : 특히 글(한글)을 깨친 양반가 여성들과 시집간 딸들은 겨울밤 안방에 모여 소설책을 빌려다 한 사람이 구성지게 소리 내어 읽으면 둘러앉아 눈물을 흘리거나 웃으며 듣는 문화가 널리 퍼졌습니다.\n\n3. 성리학자의 절제와 문학적 호기심의 공존 : 정통 유학자들은 지나치게 자극적인 연애·허구 소설(패설)에 빠지는 것을 경계했으나, 박학다식한 황윤석은 시중에 어떤 이야기책들이 유행하는지 그 제목과 줄거리, 세태를 일기와 만필에 흥미롭게 기록해 두었습니다.\n\n4. 고전 소설사의 소중한 연대기 사료 : 그의 일기에 언급된 소설 제목들은 해당 고전 소설이 18세기 어느 시점에 실제로 유통되었는지 증명해 주는 결정적 근거가 됩니다.", "7-23": "1. 선비들의 최고의 힐링 여행이었던 산수 유람(유산·遊山) : 답답한 서재 공부와 과거 준비에 지칠 때면, 황윤석은 마음이 맞는 고향 사우들과 함께 도시락과 시권(종이·붓)을 챙겨 인근의 명산과 계곡, 바닷가로 며칠간의 유람을 떠났습니다.\n\n2. 천하절경 부안 변산반도(내소사·직소폭포·채석강)와 고창 선운산 : 그의 고향 구수동에서 가까운 부안 변산반도와 고창 선운산(도솔산)은 기암괴석과 폭포, 천년 고찰, 서해 바다가 어우러진 최고의 유람지였습니다.\n\n3. 자연 속에서 시를 짓고 역사 유적을 답사 : 폭포 아래 바위에 앉아 발을 담그고 친구들과 즉석에서 운자를 맞춰 시를 지었으며(차운), 옛 성터나 고려 시대 유적의 유래를 고증하며 인문 기행을 즐겼습니다.\n\n4. 일기에 남은 18세기 호남 여행 가이드북 : 어디서 출발해 어느 고개를 넘고 어느 절에서 묵었는지 적힌 그의 유람 기록은 오늘날 그대로 따라가도 좋을 만큼 생생한 명소 안내서입니다.", "7-24": "1. 억불숭유 시대에도 이어진 선비와 승려의 교유 : 국가 이념은 성리학이었으나, 실제 지방 사족들과 명산 대찰의 학식 있는 스님(승려)들은 산수 유람과 독서, 시문을 매개로 꽤 친밀하게 교류했습니다.\n\n2. 조용한 산사(절)에서의 독서 합숙과 종이·미투리 구입 : 과거 시험을 앞둔 선비들이 조용한 산속 암자에 머물며 공부하기도 했고, 당시 사찰은 최고 품질의 한지(승지·장지)와 튼튼한 미투리(삼신), 부채를 만드는 수공업 중심지여서 물품 거래도 활발했습니다.\n\n3. 유학자 황윤석과 승려들의 품격 있는 필담과 시문 교환 : 황윤석이 변산이나 선운산, 혹은 충청·경기 사찰을 찾았을 때 글씨와 한시에 능한 스님들이 찾아와 시를 청하면, 기꺼이 격려하는 시를 지어주고 사찰의 역사(사적기)를 고증해 주었습니다.\n\n4. 불교 범자(산스크리트어)와 사찰 고문서까지 연구 : 특히 그는 절에 보관된 옛 비문과 고문서, 그리고 불경 속의 고대 인도 문자(범자)의 음운 체계까지 학문적 연구 대상으로 삼아 스님들과 깊이 대화를 나누었습니다.", "7-25": "1. 매일 아침 세수와 양치, 정기적인 목욕재계 : 조선 선비들은 매일 새벽 일어나자마자 대야에 물을 떠서 세수를 하고 소금물로 양치질을 하며 수염과 머리를 단정히 빗어 상투를 다시 매만지는 것으로 하루를 시작했습니다.\n\n2. 비누와 샴푸 대신 쓴 녹두가루(조두)와 창포물, 쌀뜨물 : 서양식 화학 비누가 없던 시절에는 피부의 기름때를 잘 빼주고 피부를 고와지게 하는 '녹두가루(조두)'나 팥가루, 쌀뜨물을 비누 대신 썼고, 머리는 창포 삶은 물로 감은 뒤 동백기름이나 아주까리기름을 발라 윤기 있게 정돈했습니다.\n\n3. 여름철 개울가 탁족(발 씻기)과 제사 전 목욕 : 더운 여름에는 시냇가에서 땀을 씻는 목욕과 탁족을 자주 했으며, 특히 조상 제사나 국가 제향, 임금 알현을 앞두었을 때는 한겨울이라도 따뜻한 물을 데워 온몸을 깨끗이 씻는 목욕재계를 철저히 지켰습니다.\n\n4. 깔끔하고 단정했던 선비의 위생 : 일기 곳곳에 적힌 목욕과 이발(수염·손발톱 정리) 기록은 몸가짐의 청결을 수양의 일부로 여겼던 선비의 생활 습관을 보여줍니다.", "7-26": "1. 18세기 소빙하기의 매서운 겨울 한파 : 황윤석이 살았던 18세기는 지구 전체가 지금보다 기온이 낮았던 소빙하기로, 한강이 두껍게 얼어붙고 남쪽 전라도에도 폭설과 강추위가 몰아치는 날이 많았습니다.\n\n2. 과학적인 난방 시스템 온돌(구들)과 솜이불 : 아궁이에 장작과 솔가지를 때어 방바닥 전체를 데우는 온돌과 두툼한 목화솜 이불·요는 겨울을 나는 가장 든든한 무기였습니다.\n\n3. 외풍을 막아주는 방장(휘장)과 병풍, 화로 : 한옥 창호지 문틈으로 스며드는 찬 바람(외풍)을 막기 위해 방 안 사방에 두꺼운 천으로 된 커튼(방장·장막)과 병풍을 둘러치고, 방 한가운데에는 따뜻한 숯불 화로를 놓아 손을 녹이며 책을 읽었습니다.\n\n4. 외출 시의 방한 패션 남바위·풍차·토시·솜버선 : 추운 날 밖으로 나설 때는 귀와 볼을 덮는 털모자(남바위·풍차·휘항)를 쓰고 팔에는 토시, 발에는 두꺼운 솜버선을 신어 체온을 지켰습니다.", "7-27": "1. 60갑자를 다 채우고 다시 태어난 경사 '환갑(회갑·수연)' : 평균 수명이 짧았던 시대에 큰 병 없이 61세(만 60세) 환갑을 맞이하는 것은 하늘이 내린 큰 복으로 여겨져 온 문중과 고을이 함께 축하하는 성대한 수연(壽宴, 장수 잔치)을 열었습니다.\n\n2. 색동옷을 입고 어버이를 기쁘게 해드리는 노래자(老萊子)의 효도 : 부모님의 환갑날이면 머리가 희끗희끗한 마흔·쉰 살의 아들딸들도 어린아이처럼 화려한 옷을 입고 춤을 추거나 큰절과 헌수(장수 기원 술잔)를 올리며 어버이를 기쁘게 해드렸습니다.\n\n3. 부부가 해로하여 혼인 60주년을 맞는 기적 '회혼례(回禮)' : 특히 부부가 모두 장수하여 결혼 60주년을 맞이하면, 신랑·신부 시절처럼 다시 사모관대와 족두리·원삼을 입고 자손들의 축하 속에 두 번째 혼례(회혼례)를 올렸는데 이는 당대 최고의 경사로 조보와 문집에까지 실렸습니다.\n\n4. 일기에 담긴 수연 시와 축하의 정 : 황윤석은 집안 어른들과 스승, 사우 부모님의 환갑·칠순·회혼 잔치 때마다 진심 어린 축하시(수시·헌수시)를 지어 올리며 장수를 축원했습니다.", "7-28": "1. 일기장에 생생히 기록된 수백 편의 꿈 이야기(기몽·記夢) : 《이재난고》를 읽다 보면 '어젯밤 꿈에 돌아가신 아버지를 뵈었다', '꿈에 스승님과 경서를 토론했다', '꿈에 낯선 산천을 날아다녔다'는 흥미로운 꿈 기록이 자주 등장합니다.\n\n2. 세상을 떠난 가족에 대한 사무치는 그리움의 투영 : 부모님과 아내 창원정씨가 세상을 떠난 뒤에는 꿈속에서라도 생전처럼 마주 앉아 밥을 먹고 대화를 나누었다가, 새벽에 잠에서 깨어 빈방에서 홀로 눈물을 훔치며 그 장면을 일기에 적어 내려갔습니다.\n\n3. 학문적 몰두가 만든 영감의 꿈 : 낮에 풀리지 않던 어려운 수학 문제나 역법, 주역의 이치를 고민하다 잠이 들면 꿈속에서 옛 성현이나 친구가 나타나 힌트를 주는 이른바 '학문적 자각몽'도 경험하곤 했습니다.\n\n4. 18세기 인간의 무의식과 심리 기록 : 겉으로는 근엄한 유학자였지만 꿈 기록을 통해 그의 가장 깊은 내면의 불안, 소망, 그리움을 생생하게 들여다볼 수 있습니다.", "7-29": "1. 옛날이야기가 아닌 실제 재난이었던 호환(虎患, 호랑이 피해) : 18세기 조선에서는 소나무 숲이 우거진 산골 마을은 물론, 고창·부안 변산반도와 심지어 한양 성곽 및 북악산·인왕산 근처에까지 실제 호랑이(대충·범)와 표범이 출몰해 가축과 사람을 물어가는 사고가 빈번했습니다.\n\n2. 일기에 기록된 구수동 인근의 호랑이 출몰 소동 : 황윤석의 일기에는 밤사이 이웃 마을 외양간에 호랑이가 들어와 소나 돼지, 개를 물어갔다거나, 산길에서 나무하던 백성이 호랑이에게 해를 입었다는 긴박한 소식이 사실적으로 기록되어 있습니다.\n\n3. 관아의 착호갑사(포수) 출동과 호랑이 사냥 : 고을에 호랑이가 나타나 인명 피해가 발생하면 수령과 병영에서 화승총으로 무장한 전문 포수들을 동원해 대대적인 호랑이 사냥(착호)을 벌였습니다.\n\n4. 생태 환경사의 흥미로운 사료 : 왜 옛날에 '호랑이보다 더 무서운 것'이라는 속담이 생겨났는지 18세기 한반도의 야생 생태 환경을 실감 나게 보여줍니다.", "7-30": "1. 거창한 권력보다 일상의 작은 평온에서 찾은 행복 : 황윤석의 54년 일기를 관통하는 가장 큰 매력은 높은 벼슬이나 일확천금이 아니라, 가족이 건강하고 제때 비가 내려 풍년이 들며 좋은 책을 한 권 새로 읽었을 때 느끼는 소박하고 단단한 행복감입니다.\n\n2. 사계절 자연의 변화를 오감으로 누리는 삶 : 봄이면 마당에 매화와 살구꽃이 피는 것을 반기고, 여름이면 댓잎 스치는 바람 소리를 들으며 낮잠을 자고, 가을이면 햅쌀밥에 국화주를 마시며, 겨울이면 따뜻한 아랫목에서 손자들과 책을 읽는 기쁨이 곳곳에 배어 있습니다.\n\n3. 좋은 벗과 나누는 대화와 편지 한 통의 설렘 : 먼 곳의 친구에게서 안부 편지가 도착하거나 뜻이 통하는 벗이 찾아와 밤새워 학문과 세상 이야기를 나눌 때를 인생 최고의 즐거움으로 여겼습니다.\n\n4. 250년 시간을 건너 전해지는 위로 : 바쁘고 치열한 21세기를 살아가는 우리에게 '하루를 성실히 살고 기록하는 것만으로도 충분히 빛나는 인생'이라는 따뜻한 위로를 건네줍니다.", "7-31": "1. 새 생명의 탄생과 부정을 막는 금줄(인줄) : 집안에서 아기가 태어나면 아들과 딸을 구분해 대문에 고추나 숯, 솔가지를 꽂은 금줄을 쳐서 세 이레(삼칠일, 21일) 동안 외부인의 출입을 막고 산모와 아기를 감염으로부터 보호했습니다.\n\n2. 산모를 위한 미역국과 삼신상 정성 : 출산 직후 산모에게는 서해안에서 구한 질 좋은 미역으로 끓인 미역국과 흰쌀밥을 먹여 기력을 회복시켰고, 집안 어른들은 아기가 건강하게 자라기를 빌었습니다.\n\n3. 백일 떡 나눔과 첫돌 돌잡이 : 아기가 무사히 100일을 넘기면 백설기와 수수팥떡을 해 이웃과 나누어 먹었고, 첫돌(돌잔치)에는 상 위에 책, 붓, 먹, 실타래, 돈, 활 등을 올려놓고 아기가 무엇을 잡는지 보며 장래를 축복했습니다.\n\n4. 손자 돌잡이를 흐뭇하게 기록한 할아버지 : 황윤석은 아들과 손자들이 태어날 때마다 출생 시각(사주)과 태어난 날의 날씨, 그리고 돌잡이에서 손자가 붓과 책을 잡았다며 기뻐하는 할아버지의 미소를 일기에 남겼습니다.", "7-32": "1. 몸가짐과 마음가짐을 바르게 하는 전통 태교(胎敎) : 사대부가에서는 아기를 가지면 산모가 나쁜 말을 듣거나 험한 것을 보지 않고, 반듯한 자리에 앉아 좋은 글과 옛 성현의 이야기를 들으며 태아의 성품을 기르는 태교를 매우 중시했습니다.\n\n2. 어머니와 유모의 모유 수유 및 이유식(미음·암죽) : 아기에게는 어머니가 직접 모유를 먹이거나 건강한 유모를 두었으며, 이가 나기 시작하면 쌀을 곱게 갈아 쑨 미음과 암죽, 무른 밥으로 소화를 도왔습니다.\n\n3. 할아버지 무릎에서 시작되는 밥상머리 교육 : 말을 배우기 시작하면 할아버지 황윤석이 손자를 무릎에 앉혀놓고 숫자와 천자문, 어른께 인사하는 법을 놀이처럼 다정하게 가르쳤습니다.\n\n4. 자애롭고 세심한 육아 기록 : 아이가 밤에 열이 나거나 보채면 할아버지가 직접 맥을 짚고 배를 쓸어주며 밤을 새운 기록에서 조선 시대 가장의 깊은 가족애를 볼 수 있습니다.", "7-33": "1. 사주단자(납채)와 연길(날짜 잡기), 혼서지 발송 : 혼담이 성사되면 신랑 집에서 신랑의 생년월일시를 적은 사주단자(예장)를 보내고, 신부 집에서 좋은 날을 택해(연길) 알려오면 혼례 직전 비단과 혼서지를 함에 담아 보냈습니다.\n\n2. 신랑이 나무 기러기를 안고 신부 집으로 가는 초행과 전안례 : 혼례 당일 신랑은 사모관대를 입고 말을 타거나 가마를 타고 신부 집으로 가서(초행), 백년해로의 상징인 나무 기러기(목안)를 상 위에 놓고 절하는 전안례와 신부와 마주 절하는 교배례·합근례를 올렸습니다.\n\n3. 신부가 시댁으로 들어오는 신행(新行)과 폐백(현구고례) : 혼례 후 며칠 뒤 또는 해를 넘겨 신부가 가마를 타고 시댁(구수동 본가)으로 들어오면, 시부모님과 사당에 대추·밤·육포를 올리고 큰절을 하는 현구고례를 치러 비로소 한 가족이 되었습니다.\n\n4. 종가고문서에 남은 실물 혼서지와 예장지 : 황윤석 가문이 자녀와 손자들의 혼사 때 주고받은 실물 혼서지와 예장 단자들이 장서각에 그대로 보존되어 있습니다.", "7-34": "1. 양반가 제사와 손님상의 일등 단백질 식품 두부(포·泡) : 조선 시대 문헌과 일기에서 '포(泡)'라는 한자로 자주 기록된 두부는 고기가 귀하던 시절 제사상과 선비들의 술안주, 반찬으로 가장 사랑받던 고단백 영양식이었습니다.\n\n2. 서해안 바닷물 간수(고염수)로 엉기게 한 고창 손두부 : 가을에 수확한 햇콩을 물에 불려 맷돌에 곱게 간 뒤, 가마솥에 끓여 콩물을 짜내고 인근 고창·부안 염전에서 가져온 천연 간수를 부어 몽글몽글한 순두부와 단단한 모두부를 만들었습니다.\n\n3. 조상 제사 전날과 겨울철 별미로 쑤던 두부 : 큰 제사를 앞두거나 귀한 손님이 오실 때, 혹은 눈 내리는 추운 겨울날 집안에서 직접 두부를 쑤어 김이 모락모락 나는 따끈한 두부를 양념간장에 찍어 나누어 먹었습니다.\n\n4. 서원 유생들의 단체 모임 '연포회(軟泡會)' : 선비들이 서원이나 정자에 모여 두부를 만들어 먹으며 시를 짓고 우정을 나누는 모임을 '연포회(부드러운 두부 모임)'라 불렀을 만큼 두부는 선비 문화와 떼려야 뗄 수 없는 음식이었습니다.", "7-35": "1. 껍질을 깎아 가을바람에 말린 곶감(건시) : 고창·정읍 일대에 흔한 감은 가을에 따서 짚에 넣어 달콤한 홍시(연시)로 먹거나, 껍질을 깎아 처마 밑에 주렁주렁 매달아 말려 쫀득한 곶감으로 만들어 이듬해 봄·여름 제사상과 간식으로 썼습니다.\n\n2. 땅속 구덩이와 모래·왕겨 속에 묻어둔 밤과 배 : 밤(생율)과 배, 무는 얼지 않도록 마당 한구석에 깊은 땅속 구덩이(움)를 파고 축축한 모래나 왕겨, 솔잎을 켜켜이 덮어 묻어두면 한겨울과 봄까지도 아삭한 수분과 단맛이 그대로 유지되었습니다.\n\n3. 꿀이나 소금물에 재워 보관한 과일(밀침) : 쉽게 상하는 과일이나 생강, 연근, 매실은 진한 꿀이나 조청에 재워(정과) 일 년 내내 귀한 다과로 내놓았습니다.\n\n4. 조상들의 지혜로운 자연 냉장고 : 일기에는 늦봄에 땅속 움에서 꺼낸 배와 밤을 손님에게 대접했다는 기록이 나와 당시 저장 기술의 우수함을 보여줍니다.", "7-36": "1. 참기름과 꿀, 밀가루로 정성껏 빚은 약과(藥果)와 유과 : 약과는 귀한 밀가루에 꿀(청밀)과 참기름, 술, 생강즙을 넣어 반죽해 기름에 튀겨낸 뒤 다시 조청에 담근 과자로, '약이 되는 과자'라 불릴 만큼 제사상과 잔칫상의 최고급 음식이었습니다.\n\n2. 집안 뒤란이나 산속 벌통에서 채취한 토종꿀(청밀) : 설탕이 중국에서 수입되는 고가의 약재였던 시절, 단맛을 내는 최고 재료는 토종벌에서 얻은 꿀(석청·목청)과 엿기름으로 고아 만든 조청(물엿)이었습니다.\n\n3. 명절과 손님 접대용 음료 식혜와 수정과 : 설날이나 추석, 혹은 기름진 음식을 먹은 뒤에는 엿기름으로 삭힌 시원한 식혜와 곶감·생강·계피를 넣은 수정과를 내어 소화를 돕고 입가심을 했습니다.\n\n4. 일기에 적힌 꿀 구입과 약과 만들기 : 황윤석은 집안 제사와 어른들 생신을 앞두고 꿀 몇 되와 참기름을 얼마에 사서 약과와 다식을 만들었는지 알뜰하게 기록했습니다.", "7-37": "1. 장마철 습기와 책벌레(좀벌레)로부터 책을 지키는 포서(曝書) : 음력 6월 긴 장마가 끝나고 7월 초가을의 맑고 건조한 햇볕이 나면, 책이 많은 양반가와 관청에서는 서재의 모든 책을 마당의 멍석과 평상 위에 펼쳐 통풍시키고 말리는 '포서(책 말리기)' 행사를 열었습니다.\n\n2. 54년 일기책과 수천 권 장서를 한 권씩 털고 점검 : 황윤석 역시 해마다 여름 끝자락 날씨가 쾌청한 날을 택해 자신이 쓴 일기책들과 《이수신편》 초고, 조상 대대로 물려받은 고서와 고문서 궤짝을 모두 열어 바람을 쐬어주었습니다.\n\n3. 책 사이에 좀벌레 쫓는 향초(배초향·은행잎) 끼워 넣기 : 책을 말리면서 찢어진 표지를 풀로 보수하고, 책장 사이에 벌레가 싫어하는 향기 나는 풀이나 은행잎을 끼워 넣어 1년 내내 종이가 상하지 않게 관리했습니다.\n\n4. 250년 문헌 보존의 일등 공신 : 매년 거르지 않은 이 정성스러운 포서(거풍) 덕분에 수백 년 전 한지 책들이 오늘날까지 곰팡이나 벌레 피해 없이 깨끗하게 전해질 수 있었습니다.", "7-38": "1. 유학자의 몸가짐이 곧 마음가짐이라는 의관정제(衣冠整齊) : 성리학에서는 아무리 날씨가 덥고 혼자 방 안에 있더라도 머리카락이 흩어지지 않게 망건을 두르고 버선을 신으며 바른 자세로 앉는 것을 선비 수양의 기본으로 여겼습니다.\n\n2. 손님이 오면 한여름에도 반드시 챙겨 입은 도포와 갓 : 평소 집 안에서는 시원한 모시 적삼이나 심의를 입더라도, 외부 손님이 찾아오거나 어른을 뵐 때는 삼복더위에도 반드시 의관을 갖추고 도포를 입어 상대방에 대한 예를 표했습니다.\n\n3. 바람이 잘 통하는 등거리(등토시)와 등메의 지혜 : 대신 겉옷 안에 땀이 차지 않도록 대나무나 등나무 줄기로 성기게 엮은 조끼 모양의 '등거리'와 '토시'를 받쳐 입어 옷과 피부 사이에 시원한 바람길을 만들었습니다.\n\n4. 일기 속 솔직한 더위 호소 : 그러면서도 가족들만 있는 한낮에는 너무 더워 웃옷을 느슨하게 풀고 대나무 자리에 누워 부채질을 했다는 인간적인 모습도 일기에 정겹게 나타납니다.", "7-39": "1. 의서를 제대로 읽지 않고 독한 약을 함부로 쓰는 용의(庸醫) 비판 : 황윤석은 환자의 체질과 병의 원인을 깊이 살피지 않고, 남들이 좋다는 처방이나 인삼·부자 같은 독하고 비싼 약재를 무턱대고 써서 오히려 병을 악화시키는 돌팔이 의원(용의)들을 강하게 비판했습니다.\n\n2. 시골 장터 약장수들의 가짜 약재 구별법 : 또한 장터에서 중국산 진품 약재라고 속여 파는 가짜 약재나 상한 약재를 색깔, 냄새, 맛으로 정확히 구별하는 본초학적 감별법을 익혀 속지 않도록 주의를 당부했습니다.\n\n3. 어설픈 의원에게 맡기느니 약을 안 먹는 것이 낫다(불복약위중의) : 병세를 정확히 모를 때는 섣불리 강한 약을 쓰기보다 미음과 휴식으로 몸의 자연 치유력을 돕는 것이 중간 가는 의원과 같다는 옛 의학 격언을 중시했습니다.\n\n4. 가족 주치의가 된 학자 : 이러한 불신 때문에 그는 자신이 직접 《동의보감》과 역대 의서를 통달하여 가족과 고향 이웃들의 가장 믿음직한 주치의 역할을 해냈습니다.", "7-40": "1. 등잔불 독서와 황사·피로로 흔했던 눈병(안질) : 어두운 호롱불 아래서 밤늦도록 작은 글씨를 읽고 쓰던 선비들에게 눈이 붉게 충혈되고 눈곱이 끼며 시야가 흐려지는 안질(결막염·안통)은 평생 따라다니는 직업병이었습니다.\n\n2. 황련·소금물·찻물로 눈을 씻는 세안법(점안법) : 눈병이 나면 열을 내리는 약재인 황련(黃連)을 달인 물이나 깨끗한 소금물, 혹은 맑게 우린 찻물과 국화 달인 물로 눈을 부드럽게 씻어내어 염증을 가라앉혔습니다.\n\n3. 간(肝)과 신장의 열을 내리는 내복약 병행 : 한의학에서 눈은 간(肝)의 기운이 통하는 창문으로 보았기에, 결명자, 구기자, 국화 등을 달여 마시며 며칠간 독서를 멈추고 푸른 먼 산을 바라보며 눈을 쉬게 했습니다.\n\n4. 눈이 침침해질수록 더 빛난 기록 열정 : 50대 이후 노안과 안질로 눈물이 나는 고통을 겪으면서도 수정 안경(애체)을 쓰고 마지막까지 붓을 놓지 않은 집념이 일기에 고스란히 배어 있습니다.", "7-41": "1. 선비의 절개를 상징하는 사군자(매화·난초·국화·대나무) : 황윤석이 머물던 구수동 사랑채 마당과 뒤란에는 이른 봄 가장 먼저 꽃을 피우는 매화(梅), 가을 서리를 이기는 국화(菊), 그리고 사계절 푸른 대나무(竹)가 정성껏 가꾸어져 있었습니다.\n\n2. 열매와 꽃을 함께 즐기는 석류나무, 살구나무, 연꽃 : 마당 한구석에는 붉은 꽃과 탐스러운 열매가 열리는 석류나무와 살구나무, 파초, 그리고 작은 연못의 연꽃을 심어 계절이 바뀔 때마다 변화하는 자연의 빛깔을 감상했습니다.\n\n3. 꽃이 피고 지는 날짜를 기록한 식물 계절 일지 : 그는 매년 봄 매화와 복숭아꽃, 살구꽃이 몇 월 며칠에 처음 꽃망울을 터뜨렸는지 일기에 기록하여 작년보다 봄이 일찍 왔는지 늦게 왔는지 비교하곤 했습니다.\n\n4. 자연과 하나 된 선비의 정원(원림) : 화려한 인공 정원이 아니라 소박한 꽃나무 몇 그루에서 우주의 사계절 순환을 읽었던 선비의 서정성이 돋보입니다.", "7-42": "1. 사랑방의 화롯불 이야기꽃과 고전 강독 : 눈보라가 치는 긴 겨울밤이나 장대비가 쏟아져 들일을 못 나가는 날이면, 사랑방 화로에 밤과 고구마·감자를 구우며 할아버지와 아버지가 아이들에게 역사 이야기와 집안 조상들의 일화를 들려주었습니다.\n\n2. 남성들의 짚신 삼기·멍석 짜기와 여성들의 바느질 : 행랑채와 마당에서는 남자들이 볏짚으로 1년 동안 신을 짚신과 가마니, 멍석, 새끼줄을 꼬았고, 안방에서는 여성들이 등불 아래 모여 앉아 도란도란 이야기를 나누며 바느질과 길쌈을 했습니다.\n\n3. 황윤석의 원고 정리와 책 제본 작업 : 황윤석에게 비 오는 날과 겨울 농한기는 흩어진 메모들을 모아 《이수신편》과 시문집 초고를 깔끔하게 정서하고, 낱장으로 쌓인 일기들을 노끈으로 묶어 책으로 제본하는 가장 바쁘고 행복한 시간이었습니다.\n\n4. 고요하고 충만했던 겨울밤 : 텔레비전이나 스마트폰이 없던 시절에도 가족들이 한방에 모여 손을 움직이고 이야기를 나누던 따뜻한 정경이 그려집니다.", "7-43": "1. 유학자의 원칙론적 입장과 현실적 관찰 : 성리학자로서 황윤석은 병이 났을 때 의약을 쓰지 않고 무당을 불러 굿(무격)을 하거나 재물을 낭비하는 미신적 행위에 대해서는 비판적인 태도를 견지했습니다.\n\n2. 마을 공동체의 대동 놀이와 풍물(농악)에 대한 포용 : 그러나 정월 대보름이나 모내기·추수 때 마을 농민들이 풍물을 울리며 고단함을 잊고 하나로 뭉치는 민속놀이나, 과거 합격 잔치에서 재주를 부리는 광대(창우)들의 연희는 향촌의 자연스러운 활력으로 너그럽게 바라보았습니다.\n\n3. 민속 어휘와 놀이의 기원에 대한 학문적 탐구 : 나아가 줄다리기, 윷놀이(척사), 연날리기, 씨름(각희) 같은 민간 놀이들이 고대 어느 시대부터 시작되었고 왜 그런 우리말 이름이 붙었는지 학자적 호기심으로 고증해 남겼습니다.\n\n4. 생생한 18세기 민속학 기록 : 그의 이러한 기록 덕분에 조선 후기 전라도 농촌의 세시 놀이와 민간 신앙의 실제 모습이 문헌으로 전해질 수 있었습니다.", "7-44": "1. 마을 입구 정자나 십리 밖 주막까지 따라나가는 전별(餞別) : 교통과 통신이 불편해 한 번 헤어지면 언제 다시 만날지 기약하기 어려웠던 시절에는, 한양으로 떠나는 가족이나 임지로 떠나는 벗을 위해 마을 밖 정자나 첫 번째 나루터·주막까지 함께 걸어가며 배웅했습니다.\n\n2. 이별주 한 잔과 즉석에서 지어 건네는 전별시(증별시) : 주막에 마주 앉아 작별의 술잔(이별주)을 나누고, 소매에서 종이와 붓을 꺼내 먼 길 무사히 다녀오라는 마음을 담은 전별시(餞別詩)를 지어 선물했습니다.\n\n3. 말안장 옆에 묶어주는 노자(여비)와 비상약 : 떠나는 사람의 행장에 마른안주나 짚신, 비상약(청심환·소합원), 혹은 적은 돈이라도 노자로 보태주며 말에서 내려 손을 잡고 눈시울을 붉혔습니다.\n\n4. 만남과 이별의 가치를 알았던 시대 : 일기에 수없이 등장하는 배웅과 마중의 기록을 읽으면 사람과 사람의 인연을 얼마나 귀하게 여겼는지 가슴이 뭉클해집니다.", "7-45": "1. 터럭 한 올까지 똑같이 그리는 전신사조(傳神寫照)의 초상화 : 18세기 조선 화단에서는 얼굴의 주름과 검버섯, 수염 한 올까지 있는 그대로 그려내어 그 사람의 내면 정신까지 담아내는 극사실주의 초상화 문화가 크게 유행했습니다.\n\n2. 스승과 명사들의 초상화(영정) 배관 기록 : 황윤석은 스승 미호 김원행이나 당대 명현들의 초상화(화상)를 뵐 때마다 그 닮은 정도와 화가의 붓솜씨, 그리고 그림을 마주했을 때 느끼는 경외감을 일기와 찬문(화상찬)으로 남겼습니다.\n\n3. 거울 속 백발이 된 자신을 바라보며 지은 자탄시 : 또한 세월이 흘러 거울(석경·유리경) 속에 비친 자신의 희끗희끗한 수염과 주름진 얼굴을 바라보며, 십 대 소년이 어느덧 육십 노인이 되었음을 돌아보는 성찰의 시를 지었습니다.\n\n4. 글로 그린 자화상 《이재난고》 : 비록 물감으로 그린 황윤석의 초상화는 없더라도, 54년간 매일 자신의 행동과 마음을 그려낸 《이재난고》야말로 세상에서 가장 정밀한 자화상입니다.", "7-46": "1. 가뭄과 홍수, 메뚜기 떼(황충)·서리 피해의 삼중고 : 화학 비료와 농약이 없던 18세기 농촌에서 가뭄(한재), 장마 홍수(수재), 가을 일찍 내리는 서리(조상), 그리고 들판을 까맣게 덮치는 메뚜기·멸구 떼(충재)는 한 해 농사를 망치는 무서운 자연재해였습니다.\n\n2. 온 마을이 횃불을 들고나서는 해충 잡기(포황) : 들판에 해충이 번지면 수령과 농민들이 밤에 논두렁에 불을 피우거나 도랑을 파서 벌레를 몰아 묻는 공동 방제 작업을 벌였습니다.\n\n3. 수해·한해 시 늦게 심어도 자라는 구황작물(대파 작물) 파종 : 모내기 시기를 놓쳐 벼농사가 불가능해지면, 농민들은 논을 갈아엎고 자라는 기간이 짧은 메밀이나 조, 기장, 콩을 대신 심어(대파) 겨울 식량을 확보했습니다.\n\n4. 자연의 시련을 이겨낸 농민들의 생명력 : 황윤석의 일기는 기후 위기 속에서도 좌절하지 않고 지혜롭게 땅을 일구어낸 조선 농민들의 강인한 생명력을 증언합니다.", "7-47": "1. 평생 모은 수천 권의 애장서와 장서인(藏書印) : 책 읽기를 생명처럼 여겼던 황윤석은 구수동 본가 서재에 경서, 사서, 문집, 천문·산학서, 의서, 지리서 등 지방 사족으로서는 보기 드문 방대한 개인 도서관을 구축하고 자신의 호가 새겨진 인장을 찍어 소중히 보관했습니다.\n\n2. 책을 빌려줄 때의 기록(차서록)과 반납 독촉 : 인근 고을의 선비나 제자들이 책을 빌려달라고 찾아오면 학문을 나누는 마음으로 기꺼이 빌려주되, 일기장에 '오늘 누구에게 무슨 책 몇 권을 빌려주었다'고 반드시 적어두었다가 잊지 않고 돌려받았습니다.\n\n3. 빌려온 책은 약속 날짜 안에 깨끗이 읽고 돌려주기 : 반대로 자신이 남의 귀한 책을 빌려 왔을 때는 책장이 구겨지거나 손때가 묻지 않게 정성껏 다루고, 밤을 새워 필사한 뒤 약속한 기한 안에 감사 편지와 함께 정확히 반납했습니다.\n\n4. 책으로 맺어진 신뢰 네트워크 : 책을 아끼고 대여 약속을 철저히 지켰던 그의 습관 덕분에 전국의 장서가들이 황윤석에게는 비장의 희귀본도 믿고 빌려주었습니다.", "7-48": "1. 노년의 서재에서 다시 펼쳐 본 10세 소년 시절의 일기장 : 50대 후반과 60대에 접어든 황윤석은 고향 구수동 서재에서 사십여 년 전 열 살, 스무 살 시절 자신이 고사리손으로 적어두었던 옛 일기책들을 다시 꺼내 읽으며 깊은 감회에 젖었습니다.\n\n2. 이미 세상을 떠난 그리운 이름들과의 재회 : 옛 일기장 속에 살아 숨 쉬는 할아버지, 아버지, 어머니, 젊은 날의 아내, 그리고 먼저 떠난 옛 친구들의 이름을 어루만지며 마치 어제 일처럼 생생한 기억에 눈시울을 붉혔습니다.\n\n3. 옛 일기 여백에 덧붙인 노년의 주석(추기) : 젊은 날 잘 모르고 적었던 내용이나 세월이 흐른 뒤 알게 된 사실을 옛 일기 여백에 작은 글씨로 보충해 적어 넣으며 평생의 기록을 스스로 완성해 나갔습니다.\n\n4. 기록하는 자만이 누릴 수 있는 축복 : 자신의 삶 전체를 한 권의 역사책처럼 다시 읽으며 인생을 정리할 수 있었던 것은 54년 일기 쓰기가 그에게 준 가장 큰 선물이었습니다.", "7-49": "1. 세계 기록사에서도 유례를 찾기 힘든 54년 연속 친필 일기 : 서양의 유명한 새뮤얼 피프스 일기(약 10년 기록)나 동양의 다른 개인 일기들과 비교해도, 한 인간이 10세부터 63세 임종 직전까지 반세기 넘는 세월을 하루도 빠짐없이 기록해 원본 57책이 완질로 남은 사례는 세계적으로 독보적입니다.\n\n2. 인문학과 자연과학, 경제와 일상을 망라한 백과사전적 밀도 : 단순한 신변잡기가 아니라 18세기 동아시아의 천문·수학·어학·기후·물가·의학·정치·민속이 한 치의 오차도 없는 날짜(간지)와 수치로 기록되어 있어 인류 공동의 지적 유산으로서 가치가 높습니다.\n\n3. 국가 기록(승정원일기) 및 고문서와의 완벽한 입체 교차 검증 : 이미 세계기록유산으로 등재된 《승정원일기》와 평해황씨 종가고문서, 목판 문집 《이재유고》와 한 세트로 맞물려 당대 사회를 3차원 입체로 복원해 줍니다.\n\n4. 대한민국과 호남이 세계에 자랑할 기록 보물 : 한국학중앙연구원 장서각과 학계, 지자체가 힘을 모아 이 위대한 기록 유산의 가치를 세계에 알리고 있습니다.", "7-50": "1. 250년 전 종이 위의 먹 글씨가 디지털 AI와 만나다 : 한문 흘림체(초서·행서)와 어려운 전문 용어로 적혀 있어 그동안 소수의 고문헌 전문가들만 읽을 수 있었던 57책의 방대한 일기가, 오늘날 누구나 클릭 한 번으로 재미있게 읽는 350가지 이야기로 활짝 열렸습니다.\n\n2. 평생 지식을 나누고 싶어 했던 황윤석의 꿈 실현 : 생전에 세상의 모든 지식을 모아 백과사전(이수신편)을 만들고 후학들에게 쉽게 알려주려 했던 실학자 황윤석이 오늘날 이 AI 문답 상자를 본다면 누구보다 기뻐하며 무릎을 쳤을 것입니다.\n\n3. 과거와 현재가 실시간으로 대화하는 역사 교육의 장 : 박물관 유리창 너머에 멈춰 있는 박제된 고문서가 아니라, 오늘을 살아가는 학생과 시민들의 호기심에 다정하게 답해주는 살아있는 친구가 되었습니다.\n\n4. 기록은 시간을 이긴다 : 1738년 열 살 소년 황윤석이 촛불 아래서 첫 줄을 적었던 그 성실한 기록의 힘이 250년의 세월을 뛰어넘어 오늘 우리 마음속에 생생하게 살아 숨 쉬고 있습니다.", "이현직과의 대화": "1. 현재 제시된 검색 사료 근거에는 황윤석이 이현직과 만나 직접 대화를 나누거나 교유한 구체적인 사실이 수록되어 있지 않습니다.\n2. 본 사료군에 나타난 주요 인물 대화는 석실서원에서 김원행과 나눈 호락논쟁 및 과거 폐해 논의, 태인 관아에서 김시간 부자와 나눈 정축년 은전 소식 등이 주를 이룹니다.\n3. 아울러 1757년 한양 체류 중 이복원을 찾아가 나눈 담소나 김진탁, 김재옥, 송일림 등 다양한 문인 관료들과 만나 시문을 짓고 정세를 살핀 사실이 집중적으로 확인됩니다.\n4. 그러므로 질의하신 이현직과의 구체적인 대화 내용을 고증하기 위해서는 제시된 사료 외에 이현직이 직접 등장하는 해당 시점의 일자별 사료를 추가로 추적·검토해야 합니다.", "1-1": "1. 인물 개요 : 이재 황윤석(頤齋 黃胤錫, 1729~1791, 본관 평해)은 전라도 흥덕현 구수동(현 전북 고창) 출신으로 신경준·위백규와 함께 호남 실학의 3대 거두로 꼽히는 대학자입니다.\n\n2. 학문과 관력 : 미호 김원행(金元行)의 문하에서 수학하며 성리학(낙론)은 물론 천문·역법·산학·음운학·도량형을 총망라한 백과전서 《이수신편》과 문집 《이재유고》를 남겼고, 장릉참봉·종부시주부·목천현감·전의현감 등을 역임했습니다.\n\n3. 54년 일기 집필 이유 : 10세(1738년)부터 임종 사흘 전인 63세(1791년 4월)까지 매일의 독서·기후·교유·정국 동향·물가를 기록한 57책의 《이재난고》는 유학자로서의 자기 성찰과 격물치지의 실증적 기록 정신을 실천한 결과물입니다.\n\n4. 사료적 가치 : 개인 일기(이재난고)와 문집(이재유고), 종가고문서(1,164건), 그리고 국가 공식 기록인 《승정원일기》가 1대1로 교차 검증되는 조선 후기 독보적인 기록유산입니다.", "1-2": "1. 평해황씨 구수동 입향 : 황윤석 가문은 병자호란(1636) 무렵 5대조 황응규(黃應奎) 대에 흥덕현 구수동에 정착하여 호남의 대표적 재지사족으로 성장했습니다.\n\n2. 조부모와 부모 : 조부는 황재만(黃載萬)이며, 부친 통덕랑 황전(黃琠, 1704~1771)과 모친 강진김씨(김백형의 딸, ~1781) 사이에서 장남으로 태어났습니다. 부친 황전은 평생 아들의 학문과 과거·관직 생활을 뒷바라지하며 수많은 왕복 서신(가서)을 남겼습니다.\n\n3. 동생과 매부 : 아우 황주석(黃冑錫, 자 온수 溫叟)은 형과 함께 김원행의 문인이 되어 평생 학문적 동반자로 지냈으며, 매부로는 노위(盧煒)와 수루 김익휴(金益休)가 있습니다.\n\n4. 부인과 자녀들 : 20세(1748년)에 창원정씨(정남채의 딸, ~1776)와 혼인하여 정실 소생으로 장남 황수룡(초명 일한), 차남 황수표(조졸), 삼남 황두룡(초명 칠한)과 사위 유원빈·홍재룡을 두었고, 측실 소생으로 아들 황보룡·황필룡과 사위 이언성을 두었습니다.", "1-3": "1. 4대 대표 저술 : 평생의 일기인 《이재난고》(57책), 조선 후기 대표 백과전서인 《이수신편》(23권), 시문과 학술 논설을 모은 《이재유고》(원집 26권·속집 14권), 그리고 독서·견문 수록인 《자지기》와 운서 《성씨운휘》 등을 저술했습니다.\n\n2. 1909년 구수동 종가 화재 : 1909년(순종 3) 봄 종가에 큰 화재가 발생하여 수십 종의 미간행 유고와 수천 권의 고서적이 소실되는 안타까운 화를 입었습니다.\n\n3. 핵심 유산의 보존 경위 : 다행히 별도의 문서함과 사랑채에 분리 보관되어 있던 《이재난고》 57책 원본과 《이수신편》, 그리고 교지·분재기·간찰 등 종가고문서 1,164점은 불길을 피해 온전히 보존되었습니다.\n\n4. 현전 아카이브 구축 : 살아남은 일기와 문집, 고문서는 현재 한국학중앙연구원 장서각(고문서집성 101·102책)과 한국고전번역원 DB로 정리되어 전해지고 있습니다.", "1-4": "1. 첫 예방과 입문 : 황윤석은 28세 때인 1756년(영조 32) 8월 전주 감시(생원·진사 초시)에 장원한 직후, 그해 9월 양주 석실서원으로 당대 낙론(洛論)의 종장인 미호 김원행(渼湖 金元行)을 처음 찾아뵙고 가르침을 청했습니다.\n\n2. 사제의 예 확립 : 이어 31세 때인 1759년(영조 35) 2월 진사시 복시에 합격한 뒤, 아우 황주석과 함께 정식으로 납폐(納幣)를 올리고 제자의 예를 행하며 《대학》과 심성론을 깊이 수학했습니다.\n\n3. 학문적 영향 : 김원행과의 문답을 통해 이이(율곡)와 권상하·김창협으로 이어지는 정통 성리학의 호락논쟁(인물성동이론)을 절충·심화하였고, 김원행 문하의 경화사족(김용겸·김종후·이지항 등)과 폭넓은 학술 네트워크를 형성했습니다.\n\n4. 스승에 대한 추모 : 1772년(44세) 7월 김원행이 별세하자 부음을 듣고 즉시 소복(素服)을 입으며 스승을 애도하는 제문과 기록을 일기와 문집(권14)에 상세히 남겼습니다.", "1-5": "1. 부친상(1771년) : 43세 때인 1771년(영조 47) 12월 부친 황전(黃琠)의 상을 당하자 시묘살이와 장례 절차를 철저히 예법에 따라 치렀고, 이듬해 조부와 부친의 유고를 정성껏 편찬하고 부친의 행장·유사(이재유고 권18·22)를 직접 지었습니다.\n\n2. 부인 창원정씨 상(1776년) : 48세 때인 1776년(영조 52) 9월 28년간 고락을 함께한 정실부인 창원정씨가 별세하자, 극심한 슬픔 속에서도 망실(亡室)의 생졸기와 제문(문집 권14·22)을 지어 가난한 살림을 꾸려온 아내의 노고를 애통해했습니다.\n\n3. 모친상(1781년) : 53세 때인 1781년(정조 5) 12월 모친 강진김씨의 상을 당했을 때는 노년의 몸으로 다시 상복을 입고 곡읍하며 효성을 다했습니다.\n\n4. 문집과 고문서의 교차 기록 : 당시 장례 과정에서 들어온 조문객 명단과 부의금 내역(부의록), 제수 물목은 《이재난고》 일기뿐만 아니라 장서각 종가고문서 실물로도 생생하게 남아 있습니다.", "2-1": "1. 자명종 실물 관찰(1746년) : 황윤석은 18세 때인 1746년(영조 22) 8월 서양식 태엽 기계시계인 자명종(自鳴鐘)을 구해 내부의 톱니바퀴와 추, 타종 장치의 작동 원리를 직접 분해·관찰했습니다.\n\n2. 기문과 시문 저술 : 관찰 직후 그 정교한 기계적 구조와 시간 측정 원리를 기록한 기문(記文)과 〈자명종시(自鳴鐘詩)〉(이재유고 권1 수록)를 남겨 호남 실학자의 남다른 과학적 탐구심을 보여주었습니다.\n\n3. 수리학으로의 확장 : 같은 해 신경준(申景濬)을 찾아가 소강절(邵康節)의 수리학(數理學)을 배우면서 서양 기하학·기계 원리와 동양 역학의 수리 체계를 융합해 이해하기 시작했습니다.\n\n4. 학술적 의의 : 18세기 중반 서울이 아닌 호남 지방의 젊은 사족이 서양 과학 기물을 직접 접하고 실증적으로 분석한 대표적인 과학사 사료입니다.", "2-2": "1. 1774년 담헌 홍대용과의 회동 : 46세 때인 1774년(영조 50) 8월 서울에 올라온 황윤석은 북학파의 선구자 담헌 홍대용(湛軒 洪大容)의 예방을 받고 여러 날에 걸쳐 깊이 있는 학술 토론을 벌였습니다.\n\n2. 서양 천문·역법 논의 : 두 학자는 중국 역법(수시력·선명력)과 서양의 시헌력(時憲曆), 지전설(지구의 자전)과 우주의 무한성, 혼천의 등 서양 천문 기구의 원리에 대해 구체적인 수치를 들어가며 토론했습니다.\n\n3. 산학(수학)과 율려(음악) 교류 : 홍대용의 저술인 《주해수용》과 황윤석의 《이수신편》에 담긴 구장산술·삼각법·율려 도량형 계산법을 서로 비교하며 당대 최고 수준의 자연과학 지식을 교환했습니다.\n\n4. 사료 출전 : 이 만남의 상세한 대화록은 《이재난고》 1774년 8월 일기와 《이재유고》 연보 및 서간문에 생생하게 기록되어 있습니다.", "2-3": "1. 신경준과의 교유 : 젊은 시절인 1746년(18세)과 1762년(34세) 고향 인근의 선배 실학자 여암 신경준(申景濬)을 만나 소강절의 수리학과 율려(음악 이론), 천문·지리학을 깊이 있게 토론했습니다.\n\n2. 서명응과의 학술 문답 : 1766년(38세)과 1767년에는 당대 규장각·문헌비고 편찬을 주도한 보만재 서명응(徐命膺)과 편지(이재유고 권7) 및 대면을 통해 악학(樂學)·역학(曆學)·산학(算學)·팔진도를 논했습니다.\n\n3. 이가환과의 교류 : 1778년(50세) 8월에는 정조 대 남인 실학의 거두 금대 이가환(李家煥)과 만나 서양 천문·역법의 정밀한 계산법과 성리학을 아울러 토론했습니다(문집 권8 답서 수록).\n\n4. 《이수신편》으로 집대성 : 이러한 당대 최고 실학자들과의 교류 성과는 황윤석이 1770년대에 완성한 백과전서 《이수신편》과 《산학계몽》·《수학계몽》 제발(문집 권12)로 집대성되었습니다.", "2-4": "1. 서양 과학기술과 천주교의 분리 인식 : 황윤석은 1769년(41세) 11월 순암 안정복(安鼎福) 등과 서학(西學)·천학(天學)에 관해 깊이 논의하며 서양의 정밀한 과학기술(역법·산학·기하학)과 종교로서의 천주교 교리를 엄격히 구분하는 입장을 취했습니다.\n\n2. 서양 역법·산학의 적극 수용 : 《신법보인》, 《의상고성》, 《만년력》 등 한역 서양 과학서는 일식·월식 예측과 역법 계산에 매우 정밀하므로 실용적으로 적극 수용해야 한다고 평가했습니다(이재유고 권7·12).\n\n3. 천주교 교리에 대한 비판 : 반면 영혼불멸설이나 천당·지옥설 등 서학의 종교적 교리는 유교의 인륜과 제사 제도를 해치는 이단(異端)으로 보아 안정복과 함께 경계하는 성리학자의 정체성을 지켰습니다.\n\n4. 사료적 특징 : 18세기 후반 조선 지식인들이 서학 서적을 어떻게 입수해 읽고 사상적으로 대응했는지 보여주는 핵심 사료입니다.", "2-5": "1. 대표 어학 저술 : 황윤석은 백과전서 《이수신편》과 문집 《이재유고》 권25·26에 〈화음방언자의해(華音方言字義解)〉, 〈자모변(字母辨)〉, 〈오음정치변(五音正齒辨)〉 등 독보적인 음운학 논설을 남겼습니다.\n\n2. 훈민정음 창제 원리 탐구 : 〈자모변〉 등에서는 훈민정음의 초성·중성·종성 제자 원리를 성리학적 역리(易理)와 발음기관의 조음 위치(아·설·순·치·후 오음)로 정밀하게 분석했습니다.\n\n3. 우리말 어원과 방언 비교 : 〈화음방언자의해〉에서는 중국 한자음(화음)과 18세기 조선의 현실 한자음, 그리고 고유어 방언(전라도·서울 어휘)의 어원과 음운 변화를 실증적으로 비교·고증했습니다.\n\n4. 국어사적 가치 : 스승의 외조부인 최석정과 선배 신경준(훈민정음운해)의 학통을 이어받아 18세기 국어 음운사를 밝히는 가장 귀중한 언어학 사료로 평가받습니다.", "3-1": "1. 이동 소요 기간 : 전라도 흥덕 구수동에서 한양까지는 편도 약 600여 리 길로, 도보와 조랑말(쇄마)을 이용해 보통 7일에서 10일가량이 소요되었습니다.\n\n2. 주요 상경 경로(서행일력) : 흥덕을 출발해 정읍·태인·전주·여산·논산(은진)·공주(금강 도강)·천안·직산·진위·수원·과천을 거쳐 동작진(한강)을 건너 남대문으로 입성하는 삼남대로 경로를 이용했습니다.\n\n3. 숙박과 여정 기록 : 이동 중에는 주로 역원(驛院) 주변의 주막(점막)이나 연고 있는 지방 사족·친척의 집, 사찰에서 유숙했으며, 1770년 《서행일력》 등에 매일의 이동 거리와 날씨가 상세히 적혀 있습니다.\n\n4. 동행과 짐 운반 : 아우 황주석이나 고향 유생들과 동행하며 노비에게 과거용 서적과 필묵, 건량(식량), 노자(엽전)를 지워 이동했습니다.", "3-2": "1. 향시와 도회 연승 : 황윤석은 25세 때인 1753년 8월 고부 향시(鄕試)에 책문으로 합격하고, 1754년(26세) 8월 남원 도회(都會) 장원, 1756년(28세) 8월 전주 감시(監試)에서 연이어 장원을 차지하며 호남의 문명을 떨쳤습니다.\n\n2. 1759년 진사시 최종 입격 : 1756년 겨울 한양 회시에서는 한 차례 낙방했으나, 31세 때인 1759년(영조 35) 기묘 식년 진사시 복시(覆試)에 최종 입격하여 성균관 진사가 되었습니다.\n\n3. 치열했던 과거장 풍경 : 일기에는 수만 명의 유생이 몰려든 한양 과장(성균관·춘당대)에서 좋은 자리를 잡기 위한 자리다툼(선접), 추위와 우천 속의 답안 작성, 합격자 발표(방방) 날의 긴장감이 생생히 묘사되어 있습니다.\n\n4. 교차 사료 확인 : 1759년 진사 합격 사실은 《이재난고》 일기뿐만 아니라 장서각 종가고문서에 실물로 보존된 백패(합격 교지)를 통해서도 확인됩니다.", "3-3": "1. 노자(여비·체류비) 조달 : 고향의 부친 황전(黃琠)이 논밭 추수곡이나 면포·담배 등을 처분해 마련한 엽전(전폐)을 인편이나 환(換·어음)으로 올려 보내주었으며, 지인들에게 일시 차용하기도 했습니다.\n\n2. 한양 하숙과 숙식 : 주로 성균관(반촌) 주변이나 남산(남촌)·수표교 일대의 사족 사랑채 또는 유생 하숙집에 머물며 다달이 밥값(식채)과 방세, 말 먹이 비용(마초값)을 정산했습니다.\n\n3. 서적과 문방구 지출 : 서울 체류 중 여윳돈이 생길 때마다 광통교·종로 서쾌(책장수)에게서 한역 서양 과학서와 경서, 문집, 안경, 필묵 등을 구입하고 그 가격을 일기(경제물가)에 꼼꼼히 기록했습니다.\n\n4. 가계 경제의 압박 : 장기 체류로 여비가 떨어지면 동생 황주석이나 고향 본가에 편지를 보내 송금을 요청하는 지방 유생의 현실적인 고충이 일기 곳곳에 나타납니다.", "3-4": "1. 종가고문서 속 실물 시권 : 한국학중앙연구원 장서각 《고문서집성 101책》에는 황윤석과 부친 황전, 아우 황주석 및 후손들이 실제 과거 시험장에서 작성해 제출했던 수십 점의 대형 친필 시권(試券)이 보존되어 있습니다.\n\n2. 시권의 형태와 채점 흔적 : 시권에는 응시자의 사조(四祖·증조까지 4대 조상) 인적사항을 적은 봉미(封彌)와 시관(채점관)이 매긴 성적 등급(차상·차중 등), 붉은 비점(批點)과 합격 도장(과차 인장)이 그대로 찍혀 있습니다.\n\n3. 1759년 진사 백패(白牌) : 황윤석이 1759년(영조 35) 기묘 식년 진사시 3등 제42인으로 합격했을 때 국왕(영조)으로부터 발급받은 흰 종이의 합격 교지(백패) 실물도 온전히 전해집니다.\n\n4. 일기와의 교차 가치 : 일기 속 시제(시험 문제)와 답안 구상 기록을 실물 답안지(시권)와 1대1로 대조할 수 있는 귀중한 과거제도사 자료입니다.", "3-5": "1. 장릉참봉 제수(1766년) : 진사 합격 후 여러 차례 대과(문과 정시·식년시)에 응시했으나 급제하지 못하던 중, 학식과 문명을 인정받아 38세 때인 1766년(영조 42) 6월 음직(문음)인 강원도 영월 장릉참봉(종9품)에 첫 제수되었습니다.\n\n2. 출사를 결심한 배경 : 성리학자로서 과거를 통한 문과 급제를 이상으로 여겼으나, 연로하신 부모님(부친 황전·모친 강진김씨)을 봉양하고 가문을 일으켜야 한다는 현실적 효도와 책임감 때문에 음직 출사를 택했습니다.\n\n3. 관직 중의 과거 응시 : 참봉과 직장·주부 등 관직에 재임하면서도 1767년 정시와 1770년 식년시 등 문과 시험에 계속 도전했으나 끝내 대과와는 인연을 맺지 못했습니다.\n\n4. 학문으로의 승화 : 비록 화려한 청요직에는 오르지 못했으나, 종부시·사복시 등 서울 관직 생활을 통해 왕실 문헌과 경화사족의 장서를 폭넓게 접하며 《이수신편》 등 불후의 저술을 남기는 계기가 되었습니다.", "4-1": "1. 중앙 관직 이력 : 1766년 장릉참봉(38세)을 시작으로 1768년 사옹원봉사·사직서직장·종부시직장(40세), 1769년 사헌부감찰·종부시주부(41세), 1776년 사도시주부(48세), 1778년 사복시주부·동궁집사(50세), 1784년 장악원주부·익위사익찬(56세), 1786년 내섬시주부(58세)를 역임했습니다.\n\n2. 외직(지방관) 이력 : 1778년 12월 경기도 진위현령(50세), 1779년 8월 충청도 목천현감(51세), 1786년 6월 충청도 전의현감(58세)으로 부임해 목민관으로 활동했으며, 1788년 고산현감(60세)에는 부임하지 않았습니다.\n\n3. 3중 교차 검증 : 이 모든 관직 임명 사실은 1) 《이재난고》 일기의 당일 기록, 2) 장서각 종가고문서에 남아 있는 실물 사령 교지(敎旨), 3) 《승정원일기》 이비(吏批) 정사(인사 발령) 기사를 통해 날짜와 품계까지 완벽히 일치함이 확인됩니다.", "4-2": "1. 사건의 발단(1769년) : 41세 때인 1769년(영조 45) 황윤석이 왕실 족보를 관장하는 종부시주부(宗簿寺主簿)로 재임하던 중, 《어제선원보략(御製璿源譜略)》의 간행·교정 과정에서 오탈자 및 체제 문제가 불거져 실무 관원들이 문책을 당할 위기에 처했습니다.\n\n2. 영의정 홍봉한 예방과 담판 : 황윤석은 종부시 제조이자 당시 영의정이던 홍봉한(洪鳳漢)의 사저를 직접 찾아가 선원보략 교정의 고충과 전례의 법도를 조리 있게 설명하며 사태를 수습했습니다.\n\n3. 사건의 무마 : 홍봉한이 황윤석의 해박한 전례 지식과 논리를 인정하여 국왕(영조)께 잘 아뢰면서 종부시 관원들에 대한 처벌 없이 일이 원만하게 무마되었습니다.\n\n4. 사료 출전 : 이 사건은 한국고전종합DB 《이재유고》 연보 1769년 조와 문집 권7 〈상홍영의정봉한서(上洪領議政鳳漢書)〉 및 당해 일기에 상세히 기록되어 있습니다.", "4-3": "1. 1769년 영조 호종 입시 : 1769년(영조 45) 7월 종부시주부로서 영조의 서대문 밖 전렵(군사 사열·행차)을 호종하여 입시했으며, 노년의 영조가 친히 군무를 챙기는 엄숙한 현장 분위기를 일기에 기록했습니다.\n\n2. 1778년 정조 선정전 윤대관 입시 : 50세 때인 1778년(정조 2) 6월 사복시주부 재임 중 각 관청 실무 관원이 국왕에게 직무를 보고하는 윤대관(輪對官)으로 선정전(宣政殿)에 입시하여 정조와 직접 문답했습니다.\n\n3. 일기와 승정원일기의 교차 : 《승정원일기》에는 윤대관 황윤석이 사복시의 마정(馬政)과 직제 현황을 아뢰었다는 공식 문답이 간략히 적혀 있는 반면, 《이재난고》에는 입시 전날부터 예상 질문을 암기하며 긴장하던 모습과 정조의 총명한 질문 태도까지 세밀하게 묘사되어 있습니다.\n\n4. 역사적 의미 : 국가 공식 사초(승정원일기)의 행간을 개인의 미시적 체험(이재난고)으로 완벽히 메워주는 대표적 사례입니다.", "4-4": "1. 1780년 목천현감 파직 : 52세 때인 1780년(정조 4) 6월 충청도 관찰사 심이지(沈頤之)가 도내 수령 근무 성적(포폄·장계)을 올리면서 목천현감 황윤석을 파직시켰으며, 《승정원일기》에는 감사 장계에 따른 공식 파직 처분만 기록되어 있습니다.\n\n2. 1787년 전의현감 파직 : 59세 때인 1787년(정조 11) 1월에는 호서 암행어사 심풍지(沈豊之)의 서계(탄핵 보고)로 인해 전의현감에서 다시 파직되었습니다.\n\n3. 황윤석의 억울함과 〈백교설〉 저술 : 반면 황윤석은 일기와 문집 권23 〈백교설(白敎說)〉에서 자신이 아전들의 부정을 엄단하고 권세가들의 청탁을 거절하자 토호·아전들이 무고(誣告)를 꾸며 감사와 어사의 귀를 가렸다고 구체적인 내막을 폭로했습니다.\n\n4. 목천 읍민들의 선정비 건립 : 실제로 파직 이듬해인 1781년 목천 백성들이 황윤석의 선정을 기려 자발적으로 선정비를 세운 사실이 연보와 일기에 기록되어 있어 그의 결백을 뒷받침합니다.", "4-5": "1. 1776년 영조 승하와 인산(국장) : 48세 때인 1776년(영조 52) 1월 사도시주부로 서울에 있던 황윤석은 그해 3월 영조가 승하하자 궐문 밖에서 백관과 함께 곡(哭)하며 52년 재위 국왕의 국장(인산) 전 과정을 일기에 상세히 남겼습니다.\n\n2. 정조 즉위와 정국 격변 목격 : 정조가 즉위한 직후 홍인한(洪麟漢)·정후겸(鄭厚謙) 등 세손의 대리청정을 반대했던 척신 세력이 숙청·유배되고 사도세자 추숭 관련 상소가 잇따르는 숨 가쁜 정국 변동을 실시간으로 기록했습니다.\n\n3. 복제(服制) 논의 참여 : 국장 기간 중 왕실과 백관의 상복 입는 법도(복제)를 둘러싼 예학 논란에 대해 자신의 학술적 견해를 정리한 〈영릉국장시복제사의〉(이재유고 권24)를 저술했습니다.\n\n4. 사료적 특징 : 《승정원일기》의 건조한 정변 기록과 달리 당시 서울 도성 관료 사회에 돌던 긴박한 여론과 민심을 생생하게 전해줍니다.", "5-1": "1. 조보(朝報)를 통한 정보 입수 : 황윤석은 승정원에서 매일 발행하는 조정 소식지인 조보(기별지)를 서울 체류 시에는 당일~이틀 내에 직접 구독했고, 고향(전라도 흥덕)에 있을 때는 전주 감영이나 현아, 또는 서울 지인이 인편에 보내준 조보 초록을 통해 접했습니다.\n\n2. 승정원일기와의 시차(Time-lag) : 본 통합 DB에서 일기 기사와 《승정원일기》를 교차 대조한 결과, 서울 체류 시에는 1~3일, 고향(호남) 거주 시에는 보통 7일에서 15일가량의 시차를 두고 중앙의 인사 발령(정사)과 상소·옥사 소식이 일기에 기록됨이 확인됩니다.\n\n3. 서신과 방문객을 통한 비화 수집 : 공식 조보에 실리지 않는 당쟁의 이면이나 국왕의 격노 같은 비화는 서울 관료들과 주고받은 간찰이나 과거 길에 들른 사족들과의 대화를 통해 보완했습니다.\n\n4. 정보사적 의의 : 18세기 한양의 정치 정보가 삼남 지방 사족 사회로 어떻게 확산·소비되었는지 날짜 단위로 추적할 수 있는 핵심 사료입니다.", "5-2": "1. 채제공(蔡濟恭) 관련 기록 : 남인의 영수 채제공이 영·정조의 신임을 받아 호조판서·내국제조·대제학·우의정 등으로 발탁될 때마다 노론 강경파(김종수·유언호 등)와 벌인 치열한 갈등과 상소 파동을 일기에 비중 있게 기록했습니다.\n\n2. 홍봉한(洪鳳漢)과 김상철(金尙喆) : 영조 대 탕평 정국을 주도한 영의정 홍봉한에게는 1769년 종부시 선원보략 문제로 직접 찾아가 도움을 받은 인연이 있으며, 김상철의 박학함과 문헌비고 편찬 주도에 대해서도 우호적인 관심을 보였습니다.\n\n3. 김종수(金鍾秀)·유언호(兪彦鎬) : 같은 노론 계열이면서도 정조 초년 권력을 둘러싼 김종수·유언호 등의 강경한 언론 활동과 인사 갈등을 객관적인 관찰자 시선으로 서술했습니다.\n\n4. 당파를 넘어선 인물평 : 황윤석은 학문적으로 노론 낙론계(김원행 문인)에 속하면서도, 극단적 당론보다는 인물의 실무 능력과 학식을 중시하는 온건하고 실증적인 시각을 유지했습니다.", "5-3": "1. 호락논쟁(湖洛論爭)의 학술적 절충 : 황윤석은 21세(1749년) 때부터 인간의 본성과 사물의 본성이 같은지 다른지를 다투는 노론 내부의 호론(한원진)과 낙론(이간·김원행) 논쟁을 깊이 연구하여, 1778년 〈호락이론절충기〉를 저술하는 등 독자적인 절충론을 펼쳤습니다.\n\n2. 안처인·송명흠 등과의 서신 토론 : 1765년 안처인(安處仁), 1767년·1779년 호론계 학자 송명흠(宋明欽) 등과 만나거나 편지를 주고받으며 율곡 이이의 심성론과 주자·육구연의 학술적 차이를 치열하게 변증했습니다.\n\n3. 지방 서원 강회와 통문 : 구암서원·석실서원·화양서원 등의 원임 선임이나 배향 문제를 둘러싸고 노론·소론 유림 사이에 오간 통문(通文)과 향촌 여론이 일기와 종가고문서에 상세히 남아 있습니다.\n\n4. 사상사적 가치 : 중앙의 당쟁과 성리학 논쟁이 18세기 호남 사족들의 일상 학문 담론에서 어떻게 수용·재해석되었는지 보여줍니다.", "5-4": "1. 천문 이변의 정밀 관측 : 황윤석은 천문학에 조예가 깊어 1764년·1770년 등에 혜성(객성)이나 큰 유성(별똥별), 일식·월식이 나타나면 그 방위와 크기, 이동 경로를 관상감 관원 못지않게 정밀하게 관측해 일기에 그렸습니다.\n\n2. 승정원일기 측후 기록과의 일치 : 일기에 기록된 유성·객성 출현 날짜를 《승정원일기》 관상감 계본(보고서)과 대조하면 발생 시각과 별자리 위치가 정확히 일치합니다.\n\n3. 기근·전염병과 조정의 구휼 : 가뭄과 홍수로 삼남 지방에 대기근이나 여역(전염병)이 돌 때 조정에서 내린 여제(癘祭) 하교 및 진휼 정책과, 실제 향촌에서 굶주리는 백성들의 참상을 나란히 기록했습니다.\n\n4. 천인감응론과 민심 : 당대 지식인들이 자연재해와 천문 이변을 국왕의 정치적 성찰을 촉구하는 하늘의 경고(재이론)로 해석하던 시대상을 잘 보여줍니다.", "5-5": "1. 1770년·1779년 《주자대전》 교정 참여 : 황윤석은 42세(1770년 2월)와 51세(1779년)에 당대 대표 학자인 김용겸(金用謙)·홍계희(洪啓禧) 등과 함께《주자대전(朱子大全)》과 《대학혹문》·《중용혹문》의 오탈자와 구절을 정밀 교정하는 작업에 참여했습니다.\n\n2. 《동국문헌비고》 편찬 동향 기록 : 1770년 영조의 명으로 서명응·홍봉한·김상철 등이 조선의 문물제도를 집대성한 《동국문헌비고(東國文獻備考)》를 편찬할 때, 편찬 관원들과 교류하며 진행 과정과 포상 소식을 일기에 상세히 남겼습니다.\n\n3. 《어제선원보략》 교정 : 1769년 종부시주부로서 왕실 족보인 《어제선원보략》 교정 실무를 직접 담당하기도 했습니다.\n\n4. 문헌학적 안목 : 이러한 국가 편찬물 교정 경험은 황윤석이 자신의 백과전서 《이수신편》과 고문헌 제발 48편(이재유고 권12~13)을 집필하는 데 탄탄한 문헌고증학적 밑거름이 되었습니다.", "6-1": "1. 미곡(쌀) 및 식량 가격 : 《이재난고》 경제물가 기록에 따르면 18세기 중후반 쌀 1섬(석) 가격은 풍흉과 계절에 따라 보통 엽전 3냥~5냥 내외로 변동했으며, 과거 길 주막의 한 끼 식사(국밥·말 먹이 포함)는 수십 문(전) 수준이었습니다.\n\n2. 전답(논밭) 매매가 : 장서각 종가고문서의 토지 명문(계약서)과 일기를 대조하면, 흥덕·고부 일대 논(답) 1두락(마지기) 가격은 토질에 따라 약 3냥~8냥 선에서 거래되었습니다.\n\n3. 노비 몸값 : 18세기 노비 매매 명문에는 장정 노비나 여종의 몸값이 1구당 15냥~30냥 내외로 기록되어 있으며, 도망 노비를 추쇄하거나 속량(신분 해방)할 때의 대가도 상세히 적혀 있습니다.\n\n4. 서적과 기물 가격 : 한양에서 구입한 서적 한 질은 수 냥에서 10여 냥에 달해 논 몇 마지기 값과 맞먹었으며, 종이(백당지)·붓·신발·약재 등의 미시적 시장 물가가 날짜별로 기록되어 있습니다.", "6-2": "1. 연간 농사와 추수기 : 평해황씨 종가는 구수동 본가 주변의 직영지와 고부·부안 등지의 소작지에서 매년 가을 타작(추수)을 거두어 일수(日收)·추수기에 작황과 소작료를 꼼꼼히 기록했습니다.\n\n2. 삼정(전세·군포·환곡) 납부 : 관아에 납부하는 전세(토지세)와 대동미, 환곡(춘대추납 곡식), 그리고 묘직 노비들의 군역·호역 문제를 해결하기 위해 관아와 교섭하던 과정이 일기와 고문서(소지)에 그대로 남아 있습니다.\n\n3. 분재기(재산 상속 문서) : 종가고문서에는 1680년(숙종 6) 선대 화회분재기부터 18세기 형제 분재기가 전해지며, 제사를 모시는 장남(봉사조)에게 전답과 노비를 우대 상속하던 조선 후기 종법적 상속 관행을 보여줍니다.\n\n4. 실증 경제사 사료 : 일기 속의 장부 기록과 종가고문서의 실물 계약서(명문·수표)가 완벽하게 맞물리는 18세기 농업경제사 핵심 자료입니다.", "6-3": "1. 중앙 관원 시절의 녹봉 : 황윤석이 종부시주부·사복시주부(종6품) 등 경관직에 있을 때 광흥창·군자감에서 매달 지급받은 녹봉(쌀·콩·명주·엽전) 내역이 일기 경제물가 편에 구체적인 말(두)·필 단위로 기록되어 있습니다.\n\n2. 박봉과 서울 생활의 적자 : 하위 경관직의 녹봉만으로는 본인을 포함한 하인·말 유지비와 한양 하숙비를 감당하기 빠듯하여 고향 본가에서 보내오는 추수 자금으로 적자를 메워야 했습니다.\n\n3. 지방관(현령·현감) 운영비 : 반면 진위현령·목천현감·전의현감 재임 시에는 관아의 공식 아록(수령 급여)이 넉넉하여 노모 봉양과 친족 부조, 서적 구입에 숨통이 트였습니다.\n\n4. 부의금과 세찬(선물) 네트워크 : 명절(설·추석)이나 상장례 때 경향의 사우·관료들과 주고받은 세찬(생선·건어물·종이·부채·약재)과 부의금 물목이 일기와 고문서에 상세히 남아 있습니다.", "6-4": "1. 선산 투장과 산송(山訟) 발생 : 조선 후기 족보와 선산 의식이 강화되면서 황윤석 가문 역시 조상의 묘역(고부 마항 등) 인근에 타인이 몰래 묘를 쓰는 투장(偸葬)이나 산림 경계 침범 문제로 여러 차례 산송을 겪었습니다.\n\n2. 소지(所志)·백활(白活) 제출 : 분쟁이 발생하면 황윤석과 문중에서는 침범의 부당함과 선대 문권을 근거로 적은 탄원서(소지·원정)를 흥덕현감이나 전라감사에게 제출했습니다.\n\n3. 관아의 제음(판결)과 입안 : 장서각 종가고문서에는 수령이 소지 하단에 붓으로 직접 판결 내용(굴이 파낼 것, 현장 적간할 것 등)을 적어 돌려준 제음(題音)과 소유권 확인서인 입안(立案) 실물이 다수 보존되어 있습니다.\n\n4. 법제사적 의의 : 소장을 초안하고 관아에 제출해 판결을 받기까지의 막후 교섭 과정은 《이재난고》 일기에서, 실제 법적 효력을 지닌 판결문은 《종가고문서》에서 함께 확인할 수 있습니다.", "6-5": "1. 3년 식년마다 작성된 호구 문서 : 장서각 《고문서집성 101책》에는 조부 황재만 대부터 부친 황전, 황윤석 당대 및 아들 황수룡 대까지 3년마다(식년) 흥덕현에 제출한 호구단자와 관아에서 발급한 준호구 수십 건이 연대순으로 남아 있습니다.\n\n2. 가구원 및 사조(四祖) 기록 : 문서에는 호주 황윤석의 직역(유학·진사·주부·현감 등) 변화와 본관, 부·조·증조·외조의 사조, 그리고 부인 창원정씨와 자녀들의 연령이 정확히 기재되어 있습니다.\n\n3. 솔거·외거 노비의 변동 추적 : 함께 등재된 수십 명의 솔거노비(집안 거주)와 외거노비(타지 거주)의 이름, 나이, 부모 계보, 도망(도망노비) 및 출생 내역을 시계열로 추적할 수 있습니다.\n\n4. 가족사·신분사 연구 가치 : 18세기 한 사족 가문의 직역 상승 과정과 노비 노동력의 세대별 증감을 실증적으로 보여주는 귀중한 통계 사료입니다.", "7-1": "1. 빈발했던 18세기 질병들 : 《이재난고》에는 황윤석 본인과 부모·아내·자녀들이 겪은 학질(말라리아), 마마(천연두·두역), 홍역, 감기(외감), 복통·설사, 안질(눈병), 종기(창종) 등 다양한 투병 기록이 매일의 증세와 함께 적혀 있습니다.\n\n2. 한약재와 처방 기록 : 질병이 발생하면 유의(유학자 의원)나 태의(내의원 의원)에게 진맥을 받고 인삼, 패독산, 육미지황환, 불환금정기산, 우황청심원 등 구체적인 탕약과 환약을 조제해 복용했습니다.\n\n3. 천연두(마마)와 전염병의 공포 : 당시 어린 자녀와 손자들이 천연두나 홍역을 앓을 때 온 집안이 금기(부정 가리기)를 지키며 노심초사하던 모습과 약방문(처방전)이 일기와 고문서에 생생히 남아 있습니다.\n\n4. 한의학사적 가치 : 황윤석 스스로도 의약 서적을 깊이 연구하여 약재의 효능과 가격, 실제 임상 효과를 일기에 꼼꼼히 남겼습니다.", "7-2": "1. 서해안과 호남의 풍부한 해산물·육류 : 고향인 흥덕·고부·부안 일대에서는 칠산바다에서 나는 조기(석수어), 전어, 숭어, 게(해), 백하젓, 굴, 김 등 해산물과 꿩고기, 소고기, 돼지고기, 닭고기를 즐겨 먹었습니다.\n\n2. 한양 유학 시절의 식문화 : 서울에 머물 때는 냉면, 만두, 떡, 설렁탕류, 그리고 각지에서 올라온 과일(감, 배, 귤, 석류)과 약주·소주·이강고 등 다양한 주류와 차(茶)를 접하고 기록했습니다.\n\n3. 절기 음식과 제사·잔치 상차림 : 설날의 떡국과 세주, 단오와 추석의 절기 음식, 그리고 부모님 수연(환갑·진갑 잔치)이나 기제사·차례 때 준비한 제수 물목이 일기와 고문서에 상세히 적혀 있습니다.\n\n4. 음식문화사 사료 : 18세기 양반 사족의 일상 식단부터 궁중·경화사족의 별미까지 당대 식생활을 복원할 수 있는 미시사 자료입니다.", "7-3": "1. 부안 변산(邊山)과 백양산 유람 : 황윤석은 1751년(23세)과 1758년(30세, 부친 황전 동행) 부안 변산의 내소사·월명암·직소폭포 등을 유람했고, 1760년(32세)에는 백양산 백학봉에 머물며 《주역》을 읽고 유람시(이재유고 권2)를 남겼습니다.\n\n2. 영월·단양 및 경기 명승 기행 : 1766년 영월 장릉참봉 재임 시에는 단종 능역과 영월·단양의 절경을 둘러보았고, 1757년에는 양주 석실서원과 죽림서원 등 경기·충청권의 명승과 서원을 답사했습니다.\n\n3. 선비들의 여행 준비물과 풍류 : 유람 길에는 승혜(짚신·나막신), 죽장(지팡이), 필묵과 시축(시 두루마리), 술과 건량을 챙겼으며, 사찰의 승려들이 가마(남여)를 메어주거나 길 안내를 맡았습니다.\n\n4. 시문으로의 기록 : 명승지마다 함께 간 사우들과 운자를 맞추어 차운시(次韻詩)를 짓고 일기와 문집에 기행록으로 남겼습니다.", "7-4": "1. 수천 권의 장서 수집과 목록 : 황윤석은 평생 경서·사서·성리서뿐만 아니라 천문·역법·산학·음운·지리·군사 서적까지 수천 권의 장서를 수집하여 구수동 종가에 보관했습니다.\n\n2. 서적 입수 경로 : 과거와 관직 생활로 한양에 올라갈 때마다 광통교 서쾌(책 중개인)를 통해 중국(연경)에서 수입된 서적과 희귀본을 구입하거나, 경화사족(서명응·김용겸·홍대용 등)의 가전 비장본을 빌려 보았습니다.\n\n3. 치열한 필사(베껴 쓰기)와 교감 : 구입하기 어려운 희귀 서적(고려 선명력, 수시력, 산학계몽 등)은 밤을 새워 직접 손으로 베껴 쓰고(필사) 오탈자를 교정한 뒤 그 끝에 48편의 제발(題跋, 이재유고 권12~13)을 남겼습니다.\n\n4. 서지학적 가치 : 18세기 조선에서 어떤 중국 서적과 고문헌이 유통·독서되었는지 보여주는 살아 있는 서지학 보고입니다.", "7-5": "1. 행장과 묘갈명 찬술(1821~1824년) : 1791년 황윤석이 별세한 뒤 아들 황수룡·황두룡이 가장(家狀)을 정리했고, 1821년 문인 송치규(宋穉圭)가 행장을, 1824년 이서구(李書九)가 묘갈명을, 1843년 홍직필(洪直弼)이 묘지명을 지었습니다.\n\n2. 1829년 목판 초간본 간행(원집 26권 13책) : 사후 38년 만인 1829년(순조 29) 후손 황수경(黃秀瓊)이 유고를 정리하고, 당시 전라도 관찰사 조인영(趙寅永)이 학술적 가치를 높이 평가해 서문을 쓰고 재정·인력을 지원하여 목판 초간본을 간행했습니다.\n\n3. 1942년 석인본 간행(속집 14권 7책 추가) : 1909년 종가 화재 이후인 1942년 봄, 후손 황병두(黃炳斗)가 다행히 화를 면한 《이재난고》 일기 속에서 초간본에 빠졌던 시문을 뽑아 속집을 편차하고 원집과 합쳐 석인본(20책)으로 간행했습니다.\n\n4. 문헌 전승의 모범 : 후손들의 지극한 문헌 수호 노력과 호남 유림·관찰사의 협력이 어우러져 오늘날까지 전해지게 되었습니다."};

vOh8TM/dRYvUU40h7pZzab/rxhRoOi4/ZPZIW5oR/hx7/BFzvURAHnJwXAAAAAElFTkSuQmCC";

const allQuestionsFlat = [];
for (const [cat, qList] of Object.entries(CATEGORY_QUESTIONS)) {
  for (const q of qList) {
    allQuestionsFlat.push([cat, q]);
  }
}

const cmbCategory = document.getElementById("cmbCategory");
const cmbQuestion = document.getElementById("cmbQuestion");
const entFilter = document.getElementById("entFilter");
const qTitle = document.getElementById("qTitle");
const qBody = document.getElementById("qBody");
const aTitle = document.getElementById("aTitle");
const aBody = document.getElementById("aBody");
const puppyImg = document.getElementById("puppyImg");

if (PUPPY_B64) {
  puppyImg.src = PUPPY_B64;
  puppyImg.style.display = "block";
}

function formatNumberedSpacing(text) {
  if (!text) return "";
  return String(text).trim().replace(/\n+(?=\d+\.\s)/g, "\n\n");
}

function initApp() {
  cmbCategory.innerHTML = "";
  for (const cat of Object.keys(CATEGORY_QUESTIONS)) {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    cmbCategory.appendChild(opt);
  }
  populateQuestions(CATEGORY_QUESTIONS[cmbCategory.value] || []);
  showWelcomeGuide();
}

function populateQuestions(qList) {
  cmbQuestion.innerHTML = "";
  for (const q of qList) {
    const opt = document.createElement("option");
    opt.value = q;
    opt.textContent = q;
    cmbQuestion.appendChild(opt);
  }
}

function showWelcomeGuide() {
  qTitle.textContent = "■ 질문 [추천 질문]";
  qBody.textContent = "위에서 궁금한 [1단계 주제 분야]와 [2단계 질문 선택]을 고르시거나, 우측 상단의 [🎲 랜덤 호기심 질문 뽑기] 버튼을 눌러보세요!";
  aTitle.textContent = "■ 황윤석의 《이재난고》 이야기 답변";
  aBody.textContent = formatNumberedSpacing(
    "1. 《이재난고(頤齋亂藁)》는 조선 후기 호남의 실학자 이재 황윤석(1729~1791)이 10세 소년 시절부터 63세 별세 직전까지 54년 동안 하루도 빠짐없이 기록한 57책 분량의 대일기입니다.\n\n" +
    "2. 서양 자명종 시계와 안경 이야기부터 과거 시험장 풍경, 한양 자취방 생활비, 임금님 독대 비화, 18세기 음식과 질병 치료법까지 조선 시대 사람들의 생생한 삶이 담겨 있습니다.\n\n" +
    "3. 위 목록에서 흥미로운 질문을 클릭하시면 기다림 없이 즉시 재미있고 정확한 4줄 핵심 이야기를 들려드립니다."
  );
}

function onCategoryChange() {
  entFilter.value = "";
  const qList = CATEGORY_QUESTIONS[cmbCategory.value] || [];
  populateQuestions(qList);
  if (qList.length > 0) {
    cmbQuestion.selectedIndex = 0;
    runSelectedQuestion();
  }
}

function onFilterSearch() {
  const kw = entFilter.value.trim();
  if (!kw) {
    populateQuestions(CATEGORY_QUESTIONS[cmbCategory.value] || []);
    return;
  }
  const matched = allQuestionsFlat.filter(item => item[1].includes(kw)).map(item => item[1]);
  if (matched.length > 0) {
    populateQuestions(matched);
    cmbQuestion.selectedIndex = 0;
    runSelectedQuestion();
  }
}

function resetFilter() {
  entFilter.value = "";
  const qList = CATEGORY_QUESTIONS[cmbCategory.value] || [];
  populateQuestions(qList);
  if (qList.length > 0) {
    cmbQuestion.selectedIndex = 0;
    runSelectedQuestion();
  }
}

function prevQuestion() {
  const len = cmbQuestion.options.length;
  if (len === 0) return;
  cmbQuestion.selectedIndex = (cmbQuestion.selectedIndex - 1 + len) % len;
  runSelectedQuestion();
}

function nextQuestion() {
  const len = cmbQuestion.options.length;
  if (len === 0) return;
  cmbQuestion.selectedIndex = (cmbQuestion.selectedIndex + 1) % len;
  runSelectedQuestion();
}

function pickRandomQuestion() {
  if (allQuestionsFlat.length === 0) return;
  const [cat, q] = allQuestionsFlat[Math.floor(Math.random() * allQuestionsFlat.length)];
  entFilter.value = "";
  cmbCategory.value = cat;
  populateQuestions(CATEGORY_QUESTIONS[cat] || []);
  cmbQuestion.value = q;
  runSelectedQuestion();
}

function runSelectedQuestion() {
  const rawQ = (cmbQuestion.value || "").trim();
  if (!rawQ) return;
  const m = rawQ.match(/^(\d+\-\d+)/);
  const qCode = m ? m[1] : "";
  const cleanQ = rawQ.replace(/^\d+\-\d+\.\s*/, "").trim();
  const ansText = CURATED_ANSWERS_BANK[qCode] || "해당 질문의 요약 답변 데이터를 준비 중입니다.";

  qTitle.textContent = `■ 질문 [${qCode}]`;
  qBody.textContent = cleanQ;
  aTitle.textContent = `■ 황윤석의 《이재난고》 이야기 답변 (문항 ${qCode})`;
  aBody.textContent = formatNumberedSpacing(ansText);
}

window.addEventListener("DOMContentLoaded", initApp);
</script>
</body>
</html>
