<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18세기 조선 선비 황윤석의 《이재난고》 이야기 챗봇 (일반 대중용)</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 0;
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    background-color: #ECEFF1;
    color: #111111;
  }
  .app-container {
    max-width: 1520px;
    margin: 0 auto;
    padding: 18px 22px 28px 22px;
  }
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 8px 4px 16px 4px;
  }
  .main-title {
    font-size: 30pt;
    font-weight: 800;
    color: #1B4F72;
    margin: 0;
    letter-spacing: -0.5px;
    line-height: 1.25;
  }
  .top-btn-group {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .btn {
    font-family: inherit;
    font-size: 12pt;
    font-weight: bold;
    padding: 9px 16px;
    border: 1px solid #B0BEC5;
    border-radius: 6px;
    background: #FFFFFF;
    color: #1B4F72;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    transition: background 0.15s, transform 0.08s;
  }
  .btn:hover {
    background: #EBF5FB;
    border-color: #1F618D;
  }
  .btn:active {
    transform: translateY(1px);
  }
  .btn-primary {
    background: #1F618D;
    color: #FFFFFF;
    border-color: #154360;
  }
  .btn-primary:hover {
    background: #154360;
    color: #FFFFFF;
  }
  .section-box {
    background: #F8F9F9;
    border: 1.5px solid #BDC3C7;
    border-radius: 8px;
    padding: 18px 20px 18px 20px;
    margin-bottom: 18px;
    position: relative;
  }
  .section-legend {
    font-size: 13pt;
    font-weight: bold;
    color: #1B4F72;
    margin-bottom: 14px;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }
  .section-subnote {
    font-size: 10.5pt;
    font-weight: normal;
    color: #566573;
  }
  .form-row {
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    gap: 10px;
    margin-bottom: 10px;
    width: 100%;
  }
  .step-label {
    width: 165px;
    font-size: 13pt;
    font-weight: bold;
    flex-shrink: 0;
  }
  .label-step1 {
    color: #1F618D;
  }
  .label-step2 {
    color: #0B5345;
  }
  .select-cat {
    font-family: inherit;
    font-size: 12.5pt;
    font-weight: bold;
    padding: 6px 10px;
    width: 410px;
    border: 1.5px solid #90A4AE;
    border-radius: 5px;
    background: #FFFFFF;
    color: #111111;
  }
  .search-right-box {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .search-label {
    font-size: 12.5pt;
    font-weight: bold;
    color: #7D3C98;
  }
  .search-input {
    font-family: inherit;
    font-size: 12.5pt;
    padding: 6px 10px;
    width: 210px;
    border: 1.5px solid #90A4AE;
    border-radius: 5px;
  }
  .select-question {
    font-family: inherit;
    font-size: 12.5pt;
    font-weight: bold;
    padding: 7px 10px;
    flex: 1;
    min-width: 0;
    border: 1.5px solid #1E8449;
    border-radius: 5px;
    background: #FFFFFF;
    color: #111111;
  }
  .btn-right-end {
    width: 122px;
    text-align: center;
    flex-shrink: 0;
  }
  .vertical-nav-row {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: 10px;
  }
  .nav-spacer {
    width: 165px;
    margin-right: -8px;
    flex-shrink: 0;
  }
  .nav-btn-vertical {
    width: 175px;
    text-align: center;
    font-size: 11pt;
    padding: 6px 12px;
  }
  .chat-area {
    background: #F4F6F7;
    border: 1.5px solid #BDC3C7;
    border-radius: 8px;
    padding: 18px 20px 24px 20px;
    min-height: 540px;
  }
  .card-question {
    background: #D4EFDF;
    border: 2px solid #1E8449;
    border-radius: 18px;
    padding: 22px 28px;
    margin-bottom: 18px;
    color: #0B5345;
  }
  .card-title-q {
    font-size: 21pt;
    font-weight: bold;
    color: #0B5345;
    margin: 0 0 14px 0;
  }
  .card-body-q {
    font-size: 20pt;
    font-weight: 500;
    color: #0B5345;
    line-height: 1.55;
    margin: 0;
    white-space: pre-wrap;
    word-break: keep-all;
  }
  .card-answer {
    background: #FFFFFF;
    border: 2px solid #1F618D;
    border-radius: 18px;
    padding: 22px 28px 26px 28px;
    color: #111111;
  }
  .answer-header-row {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
  }
  .puppy-avatar {
    width: 78px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin-right: 64px;
    margin-bottom: 0;
    flex-shrink: 0;
  }
  .card-title-a {
    font-size: 21pt;
    font-weight: bold;
    color: #1F618D;
    margin: 0;
  }
  .card-body-a {
    font-size: 20pt;
    color: #111111;
    line-height: 1.52;
    margin: 0;
    white-space: pre-wrap;
    word-break: keep-all;
  }
  @media (max-width: 900px) {
    .app-container {
      padding: 10px 10px 20px 10px;
    }
    .header-bar {
      flex-wrap: wrap;
    }
    .main-title {
      font-size: 18pt;
      line-height: 1.3;
    }
    .section-box {
      padding: 12px;
      overflow: hidden;
    }
    .form-row {
      flex-wrap: wrap !important;
      gap: 8px;
    }
    .step-label {
      width: 100%;
      font-size: 12pt;
    }
    .select-cat,
    .select-question {
      width: 100% !important;
      max-width: 100% !important;
      flex: none !important;
      font-size: 11.5pt;
      box-sizing: border-box;
    }
    .search-right-box {
      width: 100%;
      margin-left: 0;
      flex-wrap: wrap;
      gap: 6px;
    }
    .search-label {
      width: 100%;
      margin-left: 0;
      font-size: 11.5pt;
    }
    .search-input {
      flex: 1;
      min-width: 0;
      width: auto;
      font-size: 11.5pt;
    }
    .btn-right-end {
      width: 100%;
      box-sizing: border-box;
    }
    .vertical-nav-row {
      flex-wrap: wrap;
      gap: 8px;
    }
    .nav-spacer {
      display: none;
    }
    .nav-btn-vertical {
      flex: 1 1 46%;
      width: auto;
      font-size: 10.5pt;
      padding: 8px 6px;
    }
    .vertical-nav-row .btn-primary {
      width: 100%;
      text-align: center;
    }
    .card-question,
    .card-answer {
      padding: 14px 16px;
    }
    .card-title-q,
    .card-title-a {
      font-size: 14pt;
    }
    .card-body-q,
    .card-body-a {
      font-size: 13pt;
      line-height: 1.55;
    }
    .puppy-avatar {
      width: 52px;
      height: 48px;
      margin-right: 12px;
    }
  }
</style>
</head>
<body>
<div class="app-container">
  <div class="header-bar">
    <h1 class="main-title">📖 18세기 조선 지성인 황윤석의 54년 일기 《이재난고》 문답 상자</h1>
  </div>

  <div class="section-box">
    <div class="section-legend">
      <span>■ 궁금한 분야와 질문을 골라보세요 (질문을 선택하면 즉시 아래에 답변이 나타납니다)</span>
    </div>

    <div class="form-row">
      <div class="step-label label-step1">1단계 [주제 분야] :</div>
      <select id="cmbCategory" class="select-cat" onchange="onCategoryChange()"></select>
      <div class="search-right-box">
        <span class="search-label">🔍 질문 단어 찾기 :</span>
        <input type="text" id="entFilter" class="search-input" placeholder="예: 안경, 과거, 냉면..." oninput="onFilterSearch()">
        <button class="btn btn-right-end" onclick="resetFilter()">전체 보기</button>
      </div>
    </div>

    <div class="form-row" style="margin-bottom: 8px;">
      <div class="step-label label-step2">2단계 [질문 선택] :</div>
      <select id="cmbQuestion" class="select-question" onchange="runSelectedQuestion()"></select>
      <button class="btn btn-primary btn-right-end" onclick="runSelectedQuestion()">답변 보기 ▶</button>
    </div>

    <div class="vertical-nav-row">
      <div class="nav-spacer"></div>
      <button class="btn nav-btn-vertical" onclick="showWelcomeGuide()">🏠 처음 안내로</button>
      <button class="btn nav-btn-vertical" onclick="prevQuestion()">◀ 이전 질문</button>
      <button class="btn nav-btn-vertical" onclick="nextQuestion()">다음 질문 ▶</button>
      <button class="btn btn-primary" style="padding: 6px 20px; font-size: 11pt;" onclick="pickRandomQuestion()">🎲 랜덤 호기심 질문 뽑기</button>
    </div>
  </div>

  <div class="chat-area">
    <div class="section-legend" style="margin-bottom: 16px;">
      <span>■ 이재난고 스토리텔링 문답창</span>
      <span class="section-subnote">(본 자료는 이재난고, 이재유고, 종가고문서, 승정원일기를 바탕으로 만들어졌습니다.)</span>
    </div>

    <div class="card-question">
      <div id="qTitle" class="card-title-q"></div>
      <div id="qBody" class="card-body-q"></div>
    </div>

    <div class="card-answer">
      <div class="answer-header-row">
        <img id="puppyImg" class="puppy-avatar" alt="강아지 아이콘" style="display:none;">
        <div id="aTitle" class="card-title-a"></div>
      </div>
      <div id="aBody" class="card-body-a"></div>
    </div>
  </div>
</div>

<script>
const CATEGORY_QUESTIONS = {"1. 인물과 생애 (황윤석과 평해황씨 가문)": ["1-1. 황윤석은 어떤 인물이며, 왜 10세(1738년)부터 63세(1791년)까지 54년 동안 매일 일기(이재난고)를 썼나요?", "1-2. 황윤석의 가문(평해황씨 구수동 종가)과 가족 관계(부친 황전, 모친 강진김씨, 동생 황주석, 부인 창원정씨, 자녀들)는 어떠했나요?", "1-3. 황윤석이 평생 남긴 대표 저술(이재난고, 이수신편, 이재유고, 자지기 등)에는 어떤 내용들이 담겨 있고 1909년 종가 화재 때 어떻게 살아남았나요?", "1-4. 황윤석이 스승인 미호 김원행(金元行)을 처음 찾아가 제자가 된 과정과 스승으로부터 받은 학문적 영향은 무엇인가요?", "1-5. 1776년 부인 창원정씨와 1771년 부친(황전), 1781년 모친이 세상을 떠났을 때 황윤석이 겪은 슬픔과 장례 과정은 일기와 문집에 어떻게 기록되어 있나요?", "1-6. 황윤석은 병중이거나 여행 중일 때도 어떻게 하루도 빠짐없이 54년 동안 일기를 쓸 수 있었나요?", "1-7. 평생 가장 가까운 학문적 벗이었던 동생 황주석(黃冑錫)과는 일상에서 어떤 우애와 대화를 나누었나요?", "1-8. 서울에 간 아들을 걱정하며 아버지 황전(黃琠)이 보낸 편지에는 어떤 당부와 부자지간의 정이 담겨 있나요?", "1-9. 황윤석은 아들(황수룡·황두룡)과 손자들의 독서와 버릇을 어떻게 가르치며 자녀 교육을 했나요?", "1-10. 환갑(61세)을 맞이한 황윤석이 자신의 파란만장한 삶을 돌아보며 남긴 회고와 자부심은 무엇이었나요?", "1-11. 황윤석의 호인 '이재(頤齋)'와 자인 '영수(永叟)'에는 어떤 특별한 뜻이 담겨 있나요?", "1-12. 황윤석이 태어나던 날(1729년), 부모님이 꾸었다는 태몽이나 출생 당시의 신기한 일화가 있나요?", "1-13. 황윤석은 몇 살 때 처음 천자문을 뗐으며, 어린 시절 동네에서 어떤 신동(神童)으로 불렸나요?", "1-14. 10살 소년 황윤석이 1738년 태어나서 처음으로 일기장을 펼쳤을 때 첫 페이지에 무엇을 적었나요?", "1-15. 황윤석이 평생 살았던 고향 '전라도 흥덕현 구수동(지금의 고창군 성내면)'은 어떤 마을이었나요?", "1-16. 황윤석의 집안인 평해황씨(平海黃氏)는 언제부터 전라도 흥덕 구수동에 터를 잡고 살게 되었나요?", "1-17. 황윤석의 할아버지 황응규(黃應奎)는 어린 손자 황윤석을 어떻게 총애하고 가르쳤나요?", "1-18. 황윤석은 몇 살에 결혼했으며, 부인 창원정씨(昌原丁氏)와의 첫 만남과 신혼 생활은 어떠했나요?", "1-19. 조선 시대 남편이었던 황윤석이 부인 창원정씨를 대하는 태도와 부부 금슬은 일기에 어떻게 나타나나요?", "1-20. 황윤석에게도 질풍노도의 사춘기나 학업 슬럼프, 혹은 젊은 날의 방황이 있었나요?", "1-21. 황윤석의 실제 성격은 깐깐한 완벽주의자였나요, 아니면 유머와 정이 많은 스타일이었나요?", "1-22. 황윤석은 평생 하루 몇 시간씩 잤으며, 아침에 일어나서 밤에 잠들 때까지의 루틴은 어떠했나요?", "1-23. 황윤석의 글씨체(필체)는 어떤 특징이 있었고, 왜 일기장에는 흘려 쓴 초서와 반듯한 해서가 섞여 있나요?", "1-24. 황윤석은 평생 술과 담배(남초)를 즐겼나요? 그의 기호식품과 건강 관리 비결은 무엇이었나요?", "1-25. 황윤석의 어머니 강진김씨(康津金氏)는 어떤 성품의 여성이었으며 아들에게 어떤 영향을 주었나요?", "1-26. 황윤석에게는 여동생(누이)들도 있었나요? 조선 시대 오빠 황윤석이 여동생들을 챙기는 모습은 어떠했나요?", "1-27. 황윤석의 두 아들(황수룡·황두룡)과 딸들은 아버지를 어떻게 기억했고 어떤 삶을 살았나요?", "1-28. 황윤석이 가장 기뻐했던 인생 최고의 순간(하이라이트)은 일기에서 언제였나요?", "1-29. 반대로 황윤석이 평생 가장 후회하거나 가슴 아파했던 일은 무엇이었나요?", "1-30. 1791년 63세로 세상을 떠나기 직전, 황윤석이 마지막으로 일기장에 남긴 기록과 유언은 무엇인가요?", "1-31. 조선 시대 남자가 어른이 되는 성년식(관례)을 황윤석은 몇 살에 치렀고 상투를 틀던 날 기분은 어떠했나요?", "1-32. 황윤석의 장인어른(창원정씨)과 처가 식구들은 사위 황윤석을 어떻게 대했나요?", "1-33. 황윤석의 외가(강진김씨 가문)는 어떤 집안이었으며 외삼촌들과는 어떤 교류를 나누었나요?", "1-34. 황윤석이 평생 책상머리에 붙여두고 마음속에 새겼던 인생의 좌우명(자경문)은 무엇이었나요?", "1-35. 황윤석이 가장 존경하고 닮고 싶어 했던 역사 속 롤모델(우상)은 누구였나요?", "1-36. 고향 구수동 본가에서 황윤석이 매일 책을 읽고 일기를 쓰던 서재(사랑채) 풍경은 어떠했나요?", "1-37. 황윤석은 집에서 기르던 개나 닭, 혹은 먼 길을 함께 다닌 조랑말을 일기에 어떻게 기록했나요?", "1-38. 명절(설날·추석)이나 조상님 제사 때 평해황씨 종가에는 친척들이 몇 명이나 모였나요?", "1-39. 황윤석은 자신의 사주팔자나 관상, 운명에 대해 어떻게 생각했나요?", "1-40. 황윤석이 평생 사귄 가장 절친한 고향 단짝 친구(죽마고우)는 누구였나요?", "1-41. 스승 김원행의 문하(석실서원)에서 함께 공부한 동문 선후배들과는 어떤 우정을 나누었나요?", "1-42. 황윤석은 낯선 사람을 처음 만났을 때 상대방의 어떤 점을 가장 눈여겨보았나요?", "1-43. 황윤석이 화가 크게 났을 때나 억울한 일을 당했을 때 마음을 다스리던 방법은 무엇이었나요?", "1-44. 황윤석이 평생 지은 한시(漢詩)가 수천 수에 달한다는데, 주로 어떤 순간에 시를 지었나요?", "1-45. 황윤석은 음악(거문고)이나 그림, 서예 같은 예술 활동도 직접 즐겼나요?", "1-46. 50대 이후 고향에 은거하던 만년에 황윤석을 찾아온 제자들은 어떤 사람들이었나요?", "1-47. 황윤석이 세상을 떠난 뒤 무덤(묘소)은 어디에 마련되었고 묘비(묘갈명)는 누가 썼나요?", "1-48. 황윤석의 후손들은 일제강점기와 6·25 전쟁의 혼란 속에서 어떻게 57책의 일기를 지켜냈나요?", "1-49. 만약 황윤석이 21세기 오늘날 태어났다면 어떤 직업을 가졌을까요?", "1-50. 오늘날 우리가 250년 전 황윤석의 《이재난고》를 읽어야 하는 가장 큰 매력과 가치는 무엇인가요?"], "2. 과학·실학·어학 (18세기 지성인의 백과사전)": ["2-1. 황윤석이 18세(1746년) 때 서양식 기계시계인 자명종(自鳴鐘)을 구해 원리를 관찰하고 남긴 기록은 어떤 내용인가요?", "2-2. 1774년 서울에서 담헌 홍대용(洪大容)을 만나 서양 과학, 천문, 역법(曆法), 산학에 대해 어떤 대화를 나누었나요?", "2-3. 신경준(申景濬), 서명응(徐命膺), 이가환(李家煥) 등 당대 실학자·학자들과 교유하며 수학(산학)과 음악(율려)을 어떻게 연구했나요?", "2-4. 서양 학문인 서학(西學·천학)과 중국을 통해 들어온 새로운 서적들에 대해 황윤석과 안정복 등은 어떤 입장과 평가를 내렸나요?", "2-5. 황윤석이 우리말 방언과 한자 발음, 훈민정음 음운학을 연구하여 남긴 화음방언자의해와 자모변은 어떤 학술적 가치가 있나요?", "2-6. 18세기에도 노안(老眼)을 교정하는 안경(애체·안경)이 있었나요? 황윤석이 안경을 구해 쓴 기록은 어떠한가요?", "2-7. 일식(日蝕)이나 월식(月蝕)이 일어나는 날, 황윤석은 하늘을 어떻게 관측하고 시간 오차를 계산했나요?", "2-8. 전라도 고창 출신인 황윤석이 기록한 18세기 호남 방언(사투리)과 한양 말씨의 재미있는 차이는 무엇인가요?", "2-9. 조선 시대 선비들은 구구단이나 복잡한 토지 면적·세금 계산(산학)을 어떤 도구와 공식으로 풀었나요?", "2-10. 피리나 거문고 같은 악기의 음높이(율려)를 수학 공식과 기장 알갱이 크기로 정밀하게 계산한 이유는 무엇인가요?", "2-11. 황윤석이 평생 집필한 백과사전 《이수신편(理藪新編)》은 어떤 책이며 왜 제목이 '이수'인가요?", "2-12. 18세기 조선 선비였던 황윤석도 지구가 둥글다는 사실(지구설)과 지구가 돈다는 지전설을 알고 있었나요?", "2-13. 서양에서 들어온 망원경(천리경)이나 세계지도(곤여만국전도)에 대해 황윤석은 어떤 호기심을 보였나요?", "2-14. 황윤석은 매년 새해 달력(책력)이 나오면 왜 날짜와 절기 시간을 직접 다시 계산해 보았나요?", "2-15. 음력에서 몇 년에 한 번씩 돌아오는 윤달(閏月)은 어떤 수학 원리로 정해지는지 황윤석은 어떻게 설명했나요?", "2-16. 원의 둘레와 넓이를 구하는 원주율(파이·3.14)을 18세기 조선 학자들은 소수점 몇 자리까지 알고 있었나요?", "2-17. 가로·세로·대각선의 합이 모두 같아지는 마방진(魔方陣)과 주역 수학을 황윤석은 어떻게 연구했나요?", "2-18. 서양의 '파스칼의 삼각형'이나 피타고라스 정리(구고현의 정리) 같은 고급 수학이 황윤석의 책에도 나오나요?", "2-19. 물시계(자격루)나 해시계(앙부일구), 별자리 관측 기구(혼천의)의 제작 원리를 황윤석은 어떻게 정리했나요?", "2-20. 황윤석이 매일 일기에 기록한 날씨와 비 온 양(강우량) 기록은 오늘날 기후 연구에 어떤 도움이 되나요?", "2-21. 자(尺)나 되·말 같은 도량형이 시대와 지역마다 달라서 생기는 혼란을 황윤석은 어떻게 바로잡으려 했나요?", "2-22. 세종대왕이 만든 훈민정음 글자 중 오늘날 사라진 옛 글자(ㆍ, ㅿ, ㆁ, ㆆ)의 발음을 황윤석은 어떻게 분석했나요?", "2-23. 우리나라 한자 발음(동음)과 중국 본토 발음(화음)이 서로 다른 이유를 황윤석은 어떻게 밝혔나요?", "2-24. 일본어(왜어)나 만주어(여진어), 몽골어 같은 외국어 단어들도 황윤석의 연구 노트에 등장하나요?", "2-25. 일상에서 흔히 쓰지만 한자로 쓰기 애매한 순우리말(이두·방언) 어휘들을 황윤석은 어떻게 채록했나요?", "2-26. 중국 사신 행차(연행)를 다녀온 지인들로부터 황윤석이 가장 듣고 싶어 했던 베이징(연경)의 최신 정보는 무엇이었나요?", "2-27. 무지개나 번개, 우박, 지진 같은 자연현상이 일어나는 이유를 18세기 실학자 황윤석은 어떻게 설명했나요?", "2-28. 밀물과 썰물(조수 간만)이 달의 움직임에 따라 매일 시간이 바뀌는 원리를 황윤석은 어떻게 계산했나요?", "2-29. 사람의 몸속 오장육부와 맥박이 뛰는 횟수, 호흡의 원리를 수학과 역법으로 연결한 연구는 어떤 내용인가요?", "2-30. 인문학자(성리학자)였던 황윤석이 왜 기술자(중인)들의 분야로 여겨지던 수학과 과학에 그토록 몰두했나요?", "2-31. 가뭄 때 강물을 논으로 끌어올리는 양수기(수차·용미차) 기술에 대해 황윤석은 어떤 관심을 보였나요?", "2-32. 무거운 돌을 적은 힘으로 들어 올리는 도르래와 지렛대(기중기)의 역학 원리도 연구했나요?", "2-33. 18세기에도 기온을 재는 온도계(한열계)나 습도를 재는 습도계(조습계)에 관한 지식이 있었나요?", "2-34. 바둑판(361칸) 위에 놓을 수 있는 바둑돌의 경우의 수나 엄청나게 큰 숫자의 단위를 어떻게 계산했나요?", "2-35. 우리나라 팔도의 산맥(산경표)과 강줄기, 그리고 고을 간의 정확한 거리(리수)는 어떻게 파악했나요?", "2-36. 총포와 화약, 병거(전투 수레)나 성곽 축조 같은 군사 과학 기술도 《이수신편》에 다루어져 있나요?", "2-37. 오래된 옛 비석(금석문)의 마모된 글자를 판독하고 역사적 연대를 고증할 때 어떤 과학적 방법을 썼나요?", "2-38. 낯선 동식물이나 희귀한 광물·약재의 이름과 생태를 비교 연구한 박물학(본초학) 기록은 어떠한가요?", "2-39. 훈민정음의 모음(ㆍ, ㅡ, ㅣ)이 하늘(천)·땅(지)·사람(인)을 본떴다는 창제 철학을 어떻게 수학적으로 해석했나요?", "2-40. 전라도·경상도·충청도·평안도 등 조선 팔도 사람들의 말투와 억양 특징을 황윤석은 어떻게 품평했나요?", "2-41. 18세기 당시 한양의 역관(통역관)들이 중국어나 일본어를 공부하던 외국어 학습법은 어떠했나요?", "2-42. 복잡한 친척 관계(촌수·복제)와 상복 입는 기간을 수학 공식과 도표로 일목요연하게 정리한 이유는 무엇인가요?", "2-43. 곡식을 쌓아둔 창고의 부피만 재고도 그 안에 쌀이 몇 가마니(석) 들어 있는지 단번에 계산하는 공식이 있었나요?", "2-44. 북극성의 고도와 해 그림자 길이를 재어 내가 서 있는 지역의 위도(북극고도)를 알아내는 방법은 무엇인가요?", "2-45. 서양의 기하학 책인 《기하원본(유클리드 기하학)》을 읽고 황윤석이 감탄한 대목은 무엇이었나요?", "2-46. 거문고나 가야금, 편경 같은 국악기를 만들 때 나무의 재질과 경석(돌)의 두께는 어떻게 계산했나요?", "2-47. 한약 처방전에서 가장 중요한 약재의 무게(1돈, 1냥)가 시대에 따라 달라진 문제를 어떻게 고증했나요?", "2-48. 별똥별(유성)이나 혜성이 나타나는 주기와 궤도에 대해 당대 천문학자들은 어떤 계산을 시도했나요?", "2-49. 황윤석이 평생 작성한 수많은 수표(수학 표)와 천문 도표에서 계산 실수(오자)를 막기 위해 쓴 비결은 무엇인가요?", "2-50. 황윤석의 과학과 어학 연구가 후대 실학자들(정약용, 서유구 등)과 근대 학문에 남긴 유산은 무엇인가요?"], "3. 과거 시험과 서울 유학 생활 (지방 선비의 상경)": ["3-1. 전라도 흥덕(고창)에 살던 황윤석이 과거 시험을 보러 한양까지 올라갈 때 며칠이 걸렸고, 어떤 경로로 이동하며 어디서 숙박했나요?", "3-2. 황윤석이 고부 향시(1753), 남원 도회(1754), 전주 감시(1756)를 거쳐 1759년 진사시(사마시)에 최종 합격하기까지의 과정과 시험장 풍경은 어떠했나요?", "3-3. 한양에 머물며 과거와 학문을 준비하던 시절, 하숙집 생활비와 식비, 책값 등 서울 체류 비용(노자)은 어떻게 조달하고 지출했나요?", "3-4. 과거 시험장에서 실제로 작성해 제출했던 황윤석 가문의 실물 답안지(시권)와 합격증(백패)은 종가고문서에 어떻게 남아 있나요?", "3-5. 대과(문과) 급제에는 이르지 못하고 음직(문음)인 장릉참봉으로 관직 생활을 시작하게 된 배경과 본인의 속마음은 어떠했나요?", "3-6. 조선 후기 과거 시험장에서도 남의 글을 베끼거나 대리 시험(차작)을 치르는 부정행위가 실제로 있었나요?", "3-7. 지방 선비가 한양에서 방을 구할 때 집주인 인심은 어떠했고, 어떤 동네에서 주로 하숙(기숙)했나요?", "3-8. 고창에서 한양까지 걸어 올라가는 길에 주막에서 사 먹은 음식과 길 위에서 겪은 도둑·악천후 에피소드는 무엇인가요?", "3-9. 과거 공부에 지친 한양 유생들은 휴일에 어디로 소풍을 가고 어떻게 스트레스를 풀었나요?", "3-10. 과거 시험에 낙방한 뒤 짐을 싸서 고향 전라도로 내려올 때의 솔직한 심경과 가족들의 반응은 어떠했나요?", "3-11. 고창에서 한양까지 600리 과거 길을 떠날 때 황윤석의 여행 가방(행장) 속에는 어떤 필수품들이 들어 있었나요?", "3-12. 한양으로 올라가는 길에 동행한 하인(노비)은 무슨 일을 했고, 타고 간 조랑말은 어떻게 관리했나요?", "3-13. 전라도에서 충청도·경기도를 거쳐 한강(노량진·동작진) 나루터를 배로 건너 한양 성문으로 들어갈 때의 풍경은 어떠했나요?", "3-14. 황윤석이 1759년에 합격한 사마시에서 '생원시'와 '진사시'는 시험 과목과 인기가 어떻게 달랐나요?", "3-15. 수만 명이 몰리는 과거 시험장에서 좋은 자리(명당)를 차지하기 위해 전날 밤부터 어떤 자리싸움이 벌어졌나요?", "3-16. 과거 시험 당일, 시험장 안에서 비나 햇볕을 가리는 커다란 우산(설우산)을 펴고 하루 종일 어떻게 버텼나요?", "3-17. 과거 시험장 안에서 수험생들은 점심 도시락으로 무엇을 먹었고 화장실 문제는 어떻게 해결했나요?", "3-18. 18세기 과거 시험용 답안지(시권)는 크기가 얼마나 컸으며, 어디서 그 비싼 종이를 사서 준비했나요?", "3-19. 채점관들이 응시자의 이름을 보고 편파 판정을 하지 못하도록 답안지를 어떻게 밀봉(봉미·역서)했나요?", "3-20. 과거 답안지 중 가장 먼저 제출하는 '일필(一筆)'과 마감 시간까지 뜸을 들이는 답안지는 채점에서 어떤 차이가 있었나요?", "3-21. 채점관(시관)들이 과거 답안지에 매기던 성적 등급(상상·상중·차상 등)과 비점(동그라미 표시)은 어떤 의미였나요?", "3-22. 진사시 합격 발표가 나던 날, 합격자 집 앞에 몰려와 재주를 넘고 축하 돈을 받아 가던 광대(창우)들의 풍습은 무엇인가요?", "3-23. 진사시에 합격한 뒤 머리에 어사화(종이꽃)를 꽂고 거리를 행진하던 유가(遊街) 행렬과 연회 비용은 얼마나 들었나요?", "3-24. 진사시 합격자 100명 동기생들이 평생 우정을 다지기 위해 만든 동년계(同年契)와 합격자 명부(사마방목)는 무엇인가요?", "3-25. 진사가 된 황윤석이 성균관(태학)에 입학해 기숙사(재)에 머물 때 지켜야 했던 엄격한 규칙은 무엇이었나요?", "3-26. 성균관 유생들이 대과 응시 자격을 얻기 위해 매일 아침저녁 식당에서 밥을 먹고 찍던 출석 점수(원점·圓點) 제도는 무엇인가요?", "3-27. 한양 유학 시절, 고향에서 보낸 생활비(노자)가 떨어졌을 때 황윤석은 누구에게 돈을 빌려 위기를 넘겼나요?", "3-28. 황윤석은 한양의 서적 중개상(서쾌)이나 세책가(책 대여점)를 통해 어떻게 귀한 책들을 구해 읽었나요?", "3-29. 한양 도성에서 밤 10시(이경)에 인정(종)이 울리고 통행금지(야금)가 시작되면 유생들은 어떻게 지냈나요?", "3-30. 지방 출신 선비(향곡 유생)들이 한양의 쟁쟁한 벌열 가문 자제들(경화사족)과 경쟁하며 느낀 설움과 자존심은 어떠했나요?", "3-31. 임금님이 성균관에 직접 행차해 그 자리에서 문제를 내고 당일에 합격자를 뽑던 '알성시(謁聖試)'는 어떤 시험이었나요?", "3-32. 성균관 유생들이 조정의 잘못에 항의하며 밥을 굶고 기숙사를 비우던 단체 행동(권당·공관)은 어떻게 이루어졌나요?", "3-33. 성균관 주변 마을인 반촌(泮村)에 유생들이 즐겨 찾던 소고기 식당(현방)이 유독 발달했던 이유는 무엇인가요?", "3-34. 3년마다 열리는 정규 과거(식년시) 외에 나라에 경사가 있을 때 수시로 열리던 특별 시험(증광시·별시·정시)은 무엇인가요?", "3-35. 시험관 앞에서 책을 덮어놓고 사서삼경을 통째로 외워야 했던 구술 면접시험 '배강(背講)'은 얼마나 떨렸나요?", "3-36. 과거 답안지를 쓸 때 임금님의 이름(어휘)이나 선대 왕의 글자를 실수로 쓰면 그 자리에서 탈락하는 '피휘(避諱)' 규칙은 무엇인가요?", "3-37. 답안지에 글자를 잘못 썼을 때 지우개나 수정액이 없던 시절에는 어떻게 고쳐 쓰는 것이 허용되었나요?", "3-38. 수만 명이 모이는 과거 시험장(과장) 문밖에는 어떤 장사꾼들과 먹거리 노점상들이 몰려들었나요?", "3-39. 한양에 머물던 황윤석은 고창 본가의 부모님·아내와 어떻게 편지를 주고받았으며 편지가 가는 데 며칠이 걸렸나요?", "3-40. 한양 유학을 마치고 고향으로 내려갈 때 황윤석이 부모님과 아내, 아이들을 위해 사 간 '서울 선물(경물)'은 무엇이었나요?", "3-41. 경기도 양주 한강 변의 석실서원(스승 김원행의 서원)으로 공부하러 갈 때는 어떤 교통수단을 이용하고 어디서 묵었나요?", "3-42. 한양 하숙방에서 벼룩·빈대·모기나 쥐 때문에 잠을 설치며 겪었던 자취생 황윤석의 고충은 어떠했나요?", "3-43. 서울 유학 중 갑자기 몸이 아파 드러누웠을 때 타향에서 누가 간호해 주었고 약은 어디서 구했나요?", "3-44. 과거 시험 문제(시제)에 당대의 민감한 정치 현안이나 역사 문제가 나왔을 때 수험생들은 어떻게 답안을 작성했나요?", "3-45. 한양에서 처음 맛본 서울 음식과 고향 전라도 음식의 맛 차이에 대해 황윤석은 어떤 기록을 남겼나요?", "3-46. 한겨울 눈보라 치는 날이나 한여름 폭우가 쏟아지는 날에 야외 과거 시험이 열리면 어떻게 시험을 치렀나요?", "3-47. 한양 유학 시절 황윤석이 서울의 명문가 자제들이나 중인 학자들과 필담·토론을 나누며 놀란 점은 무엇인가요?", "3-48. 과거 시험을 보러 한양에 올라왔다가 여비가 다 떨어져 고향에 못 돌아가는 유생들은 어떻게 돈을 마련했나요?", "3-49. 20대 첫 상경 때의 패기 넘치던 일기와 30대 후반 관직에 나간 뒤의 서울 일기는 분위기가 어떻게 다른가요?", "3-50. 황윤석이 남긴 한양 유학 일기(서행일력 등)가 오늘날 18세기 서울 도시사 연구에 왜 그토록 중요한가요?"], "4. 관직 생활과 승정원일기 교차 검증 (영·정조 대 조정)": ["4-1. 황윤석이 역임한 중앙 관직(장릉참봉, 사옹원봉사, 종부시주부, 사도시주부, 사복시주부 등)과 지방관(진위현령, 목천현감, 전의현감) 기록은 일기·교지·승정원일기에 어떻게 나타나나요?", "4-2. 1769년 종부시주부 시절 왕실 족보인 어제선원보략(御製璿源譜略) 교정 문제로 영의정 홍봉한(洪鳳漢)을 찾아가 담판 지은 사건의 전말은 무엇인가요?", "4-3. 1769년 7월 영조의 서대문 행차 호종 입시와 1778년 6월 정조 앞 선정전 윤대관(輪對官) 입시 때, 일기에 적힌 황윤석의 기록과 승정원일기의 공식 기록은 어떻게 교차 검증되나요?", "4-4. 1780년 충청감사 심이지(沈頤之)와 1787년 암행어사 심풍지(沈豊之)의 탄핵으로 목천현감과 전의현감에서 파직될 때, 승정원일기와 일기·문집(백교설)의 기록은 어떤 차이가 있나요?", "4-5. 1776년 영조의 승하와 국장(인산), 그리고 정조 즉위 초반의 급박한 정국 변동을 서울에서 직접 목격한 황윤석은 일기에 무엇이라 기록했나요?", "4-6. 38세에 처음 말단 관직(종9품 참봉)에 나갔을 때 선배 관원들의 텃세나 관청의 신참 신고식(면신례)은 어떠했나요?", "4-7. 황윤석이 가까이서 직접 뵌 영조(英祖)와 정조(正祖) 임금님의 실제 외모, 목소리, 성격은 일기에 어떻게 묘사되어 있나요?", "4-8. 임금님의 가마와 말을 관리하는 사복시(司僕寺) 주부 시절, 궁중의 말(어승마) 관리와 관련해 어떤 뒷이야기가 있나요?", "4-9. 목천현감·전의현감 같은 지방 수령(사또)으로 부임했을 때, 하루 일과는 어떠했고 아전들의 비리를 어떻게 단속했나요?", "4-10. 권세가와 아전들의 모함으로 파직 통보를 받던 날, 관아를 떠나며 남긴 기록과 백성들의 전송 모습은 어떠했나요?", "4-11. 황윤석의 첫 직장인 파주 장릉(長陵) 참봉은 어떤 왕의 무덤을 지키는 자리였고 하루 일과는 어떠했나요?", "4-12. 왕릉 참봉 시절, 능 주변의 소나무 숲을 몰래 베어 가는 도벌꾼이나 산불을 어떻게 막았나요?", "4-13. 임금님의 식사(수라)와 궁중 도자기를 담당하는 사옹원(司饔院) 봉사 시절에는 어떤 특별한 업무를 보았나요?", "4-14. 궁궐과 관청에 쓸 쌀·간장·된장을 관리하던 사도시(司導寺) 주부 시절, 창고 회계를 어떻게 점검했나요?", "4-15. 오늘날의 감사원·검찰 격인 사헌부 감찰(監察)로 일할 때 관리들의 비리를 어떻게 감시했나요?", "4-16. 중죄인을 다루는 왕명 재판소 의금부(義禁府) 도사로 근무할 때 죄인 압송과 국문 현장은 어떠했나요?", "4-17. 세손(훗날의 정조)을 호위하는 익위사(翊衛司) 관원으로 근무하며 가까이서 지켜본 청년 정조의 모습은 어떠했나요?", "4-18. 조선 시대 공무원(관원)들의 출근 시간(묘시)과 퇴근 시간(유시)은 몇 시였고 지각하면 어떤 벌을 받았나요?", "4-19. 관청에서 밤새워 건물을 지키는 당직 근무(숙직·번)를 설 때 밤에는 무엇을 먹으며 시간을 보냈나요?", "4-20. 말단 종9품 참봉에서 정6품 주부(참상관)로 승진하기 위해 하루하루 채워야 했던 근무 일수(사일·仕日)란 무엇인가요?", "4-21. 일 년에 두 번(6월·12월) 매기는 조선 시대 공무원 인사 고과 성적표 '포폄(褒貶)'에서 황윤석은 어떤 평가를 받았나요?", "4-22. 관직에 임명될 때 임금님이 내려주시는 임명장(교지·고신)은 어떤 종이에 어떻게 적혀 있었나요?", "4-23. 관원들이 입는 관복(단령)의 색깔과 가슴에 달린 흉배(학·호랑이), 허리띠는 품계에 따라 어떻게 달랐나요?", "4-24. 단오에는 부채, 동지에는 달력, 여름에는 얼음 등 임금님이 관원들에게 내려주신 특별 보너스(하사품)는 무엇이었나요?", "4-25. 국왕이 궁궐 밖으로 행차(거둥·능행)할 때 뒤를 따르는 수가(隨駕) 관원들은 말 위에서 어떻게 고생했나요?", "4-26. 종묘나 사직단, 왕릉에서 국가 제사(대제)가 열릴 때 제관(헌관·집사)으로 차출되면 며칠 전부터 어떻게 목욕재계했나요?", "4-27. 승정원일기(承政院日記)를 실시간으로 기록하던 주서(注書)들의 엄청난 속기 실력을 황윤석은 어떻게 묘사했나요?", "4-28. 황윤석의 일기 《이재난고》와 국가 공식 기록 《승정원일기》를 나란히 비교해 보면 왜 두 기록이 완벽한 짝을 이루나요?", "4-29. 서울 관청에서 일하는 실무 행정관인 서리(경아전)들과 양반 관원들은 일상 업무에서 어떤 미묘한 신경전을 벌였나요?", "4-30. 지방 수령(진위·목천·전의현감)으로 나갈 때 임금님 앞에서 직접 올리던 부임 인사(하직 숙배)와 칠사(七事) 암송은 무엇인가요?", "4-31. 새로 임명된 사또(지방 수령)가 고을에 처음 도착하는 날 벌어진 환영 행렬(신연 맞이)과 부임식은 어떠했나요?", "4-32. 전임 사또에게 관아의 열쇠와 창고 장부를 넘겨받을 때 한 푼이라도 부족하면 책임을 묻던 '해유(解由)' 제도는 무엇인가요?", "4-33. 드라마에서처럼 사또가 동헌 마루에 앉아 '네 죄를 네가 알렷다!' 하며 재판하고 곤장을 치는 모습은 실제로 어떠했나요?", "4-34. 고을의 유력 양반들이 모인 자치 기구 '향청(유향소)'의 좌수·별감들과 수령 황윤석은 어떻게 관계를 맺었나요?", "4-35. 가뭄이 들었을 때 지방 수령이 백성들을 대표해 산꼭대기나 용소에 올라가 올리던 기우제(祈雨祭)는 어떻게 치러졌나요?", "4-36. 봄에 곡식을 빌려주고 가을에 이자(모곡)를 붙여 갚게 하던 환곡(還穀) 제도를 황윤석은 어떻게 공정하게 운영했나요?", "4-37. 죽은 사람이나 갓난아기에게도 군대 세금(군포)을 물리는 폐단(백골징포·황구첨정)을 막기 위해 수령으로서 어떤 노력을 했나요?", "4-38. 도지사 격인 관찰사(감사)가 고을을 순시(순력)하러 오면 수령과 관아 아전들은 어떻게 맞이했나요?", "4-39. 마패를 든 암행어사(暗行御史)는 실제로 어떻게 변장을 하고 고을에 잠입해 수령과 아전의 비리를 조사했나요?", "4-40. 황윤석이 충청도 목천현감 시절 백성들의 칭송을 받아 살아생전 세워졌다는 선정비(거사비)에는 어떤 사연이 담겨 있나요?", "4-41. 가을 추수가 끝난 뒤 수령이 고을의 80세 이상 노인들을 관아로 초청해 잔치를 베풀던 '양로연(養老宴)'은 어떤 행사였나요?", "4-42. 연로하신 부모님을 가까이서 모시기 위해 서울 관원이 임금님께 지방 수령 자리를 청하던 '걸양(乞養)' 풍습은 무엇인가요?", "4-43. 조선 시대 공무원들도 몸이 아프거나 고향 부모님을 뵈러 갈 때 내는 병가(정사)와 특별 휴가(급유) 제도가 있었나요?", "4-44. 왕실의 족보를 관리하는 종부시(宗簿寺)에 근무할 때 일반 관청과 달랐던 특별한 위상과 혜택은 무엇이었나요?", "4-45. 정조 임금이 매달 실무 관원들을 차례로 불러 마주 앉아 업무 보고를 받던 '윤대(輪對)' 제도는 왜 만들어졌나요?", "4-46. 1776년 영조 임금이 승하했을 때 현직 관원들과 백성들은 며칠 동안 흰 옷(백의·백립)을 입고 상을 치렀나요?", "4-47. 조정의 인사를 담당하는 이조·병조 판서들이 세 마리의 말을 타고 출근한다 하여 붙은 별명 '삼마태수'와 인사청 풍경은 어떠했나요?", "4-48. 음직(문음, 과거 없이 학덕으로 천거된 관직) 출신 관원들이 문과 급제자들 사이에서 겪은 보이지 않는 유리천장은 무엇이었나요?", "4-49. 황윤석이 20여 년의 중앙·지방 관직 생활을 마치고 고향으로 완전히 돌아올 때 남긴 재산은 얼마나 되었나요?", "4-50. 황윤석의 관직 일기가 다산 정약용의 《목민심서》와 함께 읽힐 때 어떤 특별한 역사적 가치를 지니나요?"], "5. 18세기 중앙 정국과 정보 유통 (조보와 당쟁)": ["5-1. 황윤석은 중앙 정계의 인사 발령, 상소 파동, 역모 옥사 소식을 조보(朝報)나 편지를 통해 어떻게 접했으며, 승정원일기의 실제 사건 발생일과 며칠의 시차가 나나요?", "5-2. 영·정조 대의 핵심 정치가인 채제공(蔡濟恭), 홍봉한(洪鳳漢), 김상철(金尙喆), 김종수(金鍾秀), 유언호 등에 대해 황윤석은 일기에 어떤 기록과 평가를 남겼나요?", "5-3. 당대 노론(낙론·호론)과 소론, 남인 사이의 학문적·정치적 갈등(호락논쟁, 탕평책 등)이 지방 사족들의 일상 대화와 서신에서는 어떻게 논의되었나요?", "5-4. 관상감의 천문 관측(유성, 객성, 혜성 출현)이나 가뭄·홍수 같은 자연재해가 발생했을 때 조정(승정원일기)의 대응과 일기에 적힌 민심의 반응은 어떠했나요?", "5-5. 김용겸, 홍계희 등과 함께 국가적 편찬 사업인 주자대전(朱子大全) 교정이나 동국문헌비고 편찬 관련 소식을 나눈 기록은 어떻게 남아 있나요?", "5-6. 조선의 일간신문 격인 조보(朝報·기별지)를 매달 받아보는 구독료는 얼마였고, 누가 집까지 배달해 주었나요?", "5-7. 정조 즉위 초 자객 침입 사건이나 역모 옥사 같은 충격적인 궁중 뉴스가 퍼질 때 도성 사람들의 반응은 어떠했나요?", "5-8. 정치적으로는 노론과 남인·소론으로 갈려 싸우면서도, 사적인 모임이나 술자리에서는 서로 어떻게 어울렸나요?", "5-9. 영조가 사도세자를 뒤주에 가둔 임오화변(1762년) 당시, 지방 선비였던 황윤석은 이 비극을 어떻게 전해 듣고 기록했나요?", "5-10. 한양 도성이나 시골 장터에 떠도는 가짜 뉴스(와언·유언비어)를 접했을 때 황윤석은 사실 여부를 어떻게 검증했나요?", "5-11. 영조 임금이 당파 싸움을 막기 위해 성균관 입구에 세운 '탕평비(蕩平碑)'와 탕평책에 대해 황윤석은 어떻게 평가했나요?", "5-12. 정조 시대에 조정을 두 갈래로 갈라놓았던 '시파(時派)'와 '벽파(僻派)'는 무엇 때문에 그토록 대립했나요?", "5-13. 정조 즉위 직후 막강한 권력을 휘두르다 몰락한 세도가 홍국영(洪國榮)에 대해 황윤석은 일기에 무엇이라 적었나요?", "5-14. 영조의 총애를 받던 화완옹주와 양자 정후겸이 정조 즉위 후 처벌받는 과정을 황윤석은 어떻게 지켜보았나요?", "5-15. 정조가 젊은 인재들을 키우기 위해 만든 왕실 도서관 '규장각(奎章閣)'과 '초계문신' 제도는 당대에 어떤 화제를 모았나요?", "5-16. 전국의 선비 수천 명이 연명으로 서명해 임금님께 올리던 거대한 상소문 '만인소(萬人疏)'는 어떻게 만들어졌나요?", "5-17. 지방 서원과 향교 선비들이 여론을 모을 때 전국으로 돌려보내던 회람 편지 '통문(通文)'은 어떤 위력이 있었나요?", "5-18. 억울한 백성이 임금님 행차 길에 뛰어들어 꽹과리나 징을 치며 직접 호소하던 '격쟁(擊錚)'을 황윤석도 목격했나요?", "5-19. 밤사이 한양 성문이나 대궐 담장에 조정을 비판하는 익명의 대자보(괘서·흉서)가 붙으면 어떤 소동이 벌어졌나요?", "5-20. 정치적 패배로 제주도나 흑산도, 함경도 삼수갑산으로 귀양(유배)을 간 선비들은 유배지에서 어떻게 살았나요?", "5-21. 드라마에서처럼 죄인에게 내려지는 '사약(賜藥)'에는 실제로 어떤 독약 성분이 들어갔고 어떻게 집행되었나요?", "5-22. 노론·소론·남인·북인 사대부들은 쓰는 갓의 모양이나 도포 끈, 심지어 절하는 법과 말투까지 서로 달랐나요?", "5-23. 황윤석의 학문적 뿌리인 노론 '낙론(洛論, 서울·경기 학파)'과 충청도 중심의 '호론(湖論)'은 왜 논쟁을 벌였나요?", "5-24. 영조가 군포 세금을 절반으로 줄여준 '균역법(均役法)'이 시행될 때 양반들과 백성들의 실제 반응은 어떠했나요?", "5-25. 영조가 한양 청계천 바닥을 파내는 대규모 토목공사(준천 사업)를 벌였을 때 도성 풍경은 어떠했나요?", "5-26. 조정에서 공식 발행한 조보 외에, 민감한 궁중 비화나 미확인 소문을 몰래 적어 팔던 '사초(私草)·지라시'도 있었나요?", "5-27. 한양에서 일어난 대사건 소식이 삼남대로의 역참(파발)과 보부상을 타고 전라도 고창까지 내려오는 데 며칠이 걸렸나요?", "5-28. 황윤석은 왜 일기장에 당대의 민감한 정치 사건을 적을 때 특정 인물의 이름을 이니셜(성씨나 자)로만 적기도 했나요?", "5-29. 영·정조 대에 청나라 건륭제(乾隆帝)의 통치와 중국 대륙의 정세 변화를 조선 지식인들은 어떻게 분석했나요?", "5-30. 황윤석의 《이재난고》가 국가 공식 기록인 《조선왕조실록》이나 《승정원일기》의 빈틈을 메워주는 이유는 무엇인가요?", "5-31. 1759년 66세의 영조 임금이 15세 소녀 정순왕후를 새 왕비로 맞이한 국혼(가례) 당시 도성 분위기는 어떠했나요?", "5-32. 영조가 술을 빚거나 마시면 사형에 처한다는 초강력 '금주령(禁酒令)'을 내렸을 때 선비들과 백성들은 어떻게 대처했나요?", "5-33. 영조가 돌아가신 어머니 숙빈 최씨의 사당(육상궁)에 수시로 행차하며 보인 지극한 효심을 신하들은 어떻게 바라보았나요?", "5-34. 전국에 우후죽순 생겨난 서원(書院)들을 영조가 과감히 정리·철폐했을 때 지방 사족들의 반응은 어떠했나요?", "5-35. 1789년 정조가 아버지 사도세자의 무덤을 양주 배봉산에서 수원 화산(현륭원)으로 옮기던 천봉 대역사는 어떻게 기록되었나요?", "5-36. 양반의 첩에게서 태어난 서얼(庶孽)들이 차별을 풀어달라며 수천 명씩 모여 올린 '서얼 허통 상소'를 황윤석은 어떻게 보았나요?", "5-37. 1763년 일본으로 떠난 조선통신사(조엄 일행) 소식과 일본에 대한 18세기 조선 지식인들의 시선은 어떠했나요?", "5-38. 태풍을 만나 전라도나 제주도 바닷가에 표류해 온 외국 배(청나라·일본·유구국·서양 배) 소식은 어떻게 전해졌나요?", "5-39. 18세기 후반 민간에 몰래 퍼지던 예언서 《정감록(鄭鑑錄)》과 십승지(전쟁 피난처) 소문에 대해 황윤석은 어떤 기록을 남겼나요?", "5-40. 한양 종로나 남대문 밖 시전 거리에 큰불(대화재)이 나 수백 채의 집이 타버렸을 때 조정은 어떻게 구호했나요?", "5-41. 대궐 안이나 관청에 도둑이 들거나 국가의 귀중한 문서·어보가 도난당하는 사건이 일기에도 나오나요?", "5-42. 임금님이 백성들의 억울함을 풀어주기 위해 대궐 문밖에 직접 나와 시민들을 만나던 '여민동락' 현장은 어떠했나요?", "5-43. 왕실의 족보나 국왕의 문집(어제)을 인쇄해 전국 명산의 사고(史庫)와 신하들에게 나누어 주던 행사는 어떻게 진행되었나요?", "5-44. 홍봉한(정조의 외할아버지)과 김귀주(정순왕후의 오빠) 두 외척 가문이 벌인 치열한 권력 다툼은 어떻게 기록되어 있나요?", "5-45. 정조 시대에 천주교(서학) 신자들이 적발되어 처벌받기 시작한 초기 사건(추조 적발 사건 등)을 황윤석은 어떻게 기록했나요?", "5-46. 호남이나 영남의 인재들이 인사에서 소외되지 않도록 국왕이 특별히 내린 지방 인재 등용 명령은 현장에서 잘 지켜졌나요?", "5-47. 조정의 고위 대신(정승·판서)이 세상을 떠났을 때 나라에서 치러주던 예우(예장·시호 하사)와 조보 기사는 어떠했나요?", "5-48. 과거 시험 문제 유출이나 채점 비리로 인해 합격자 전체를 무효로 만들던 '파방(罷榜)' 사태가 터지면 어떤 일이 벌어졌나요?", "5-49. 황윤석은 매일 밤 조보(신문)의 주요 기사를 일기장에 베껴 적으면서 왜 자기 나름의 촌평을 함께 남겼나요?", "5-50. 18세기 조보와 서신 유통망을 통해 본 조선 후기 사회는 우리가 생각하던 것보다 얼마나 역동적인 정보 사회였나요?"], "6. 사회경제·물가·가계 경영 (18세기 실물 경제)": ["6-1. 이재난고(경제물가)와 종가고문서(토지·노비 명문)에 나타난 18세기 당시 쌀 가격, 논밭 매매가, 노비 몸값, 서적 구입 가격은 실제로 얼마였나요?", "6-2. 지방 사족 가문이 1년 동안 농사(추수)를 짓고 노비를 관리하며 세금(환곡, 전세, 군포)을 납부하던 실제 가계부와 재산 상속(분재기) 모습은 어떠했나요?", "6-3. 관직에 있을 때 받은 녹봉(월급)이나 지방관 시절의 관아 운영비, 그리고 지인들과 주고받은 부의금·선물(세찬, 물목)의 규모는 어느 정도였나요?", "6-4. 조상의 묘자리 경계를 둘러싼 산송(山訟)이나 토지·노비 분쟁이 벌어졌을 때, 사족들은 관아에 어떤 탄원서(소지·백활)를 내고 어떻게 판결(제음)을 받았나요?", "6-5. 3년마다 관아에 제출한 호구단자와 준호구(종가고문서)를 통해 볼 때, 황윤석 집안의 가족 구성과 소유 노비 수는 시대에 따라 어떻게 변했나요?", "6-6. 18세기 양반 사족들도 급전이 필요할 때 누구에게 돈을 빌렸으며, 당시 사채 이자율(식리)은 몇 할이나 되었나요?", "6-7. 집안의 노비가 도망갔을 때 다시 찾아오는 추쇄(推刷) 과정은 어떠했고, 주인과 노비의 실제 일상 관계는 어떠했나요?", "6-8. 글을 엄청나게 많이 쓴 황윤석은 값비싼 종이(한지)와 붓·먹을 어떻게 아껴 쓰고 이면지를 재활용했나요?", "6-9. 극심한 가뭄으로 흉년과 보릿고개가 닥쳤을 때, 황윤석 가문은 굶주린 이웃과 소작농들을 어떻게 도왔나요?", "6-10. 딸이나 누이를 시집보낼 때(혼례) 양반가에서 준비한 혼수품과 잔치 비용은 가계에 얼마나 큰 부담이었나요?", "6-11. 조선 후기 대표 화폐인 '상평통보(常平通寶)' 한 냥(100문)은 오늘날 돈으로 치면 체감 가치가 얼마쯤 되었나요?", "6-12. 구리 동전인 상평통보 100냥을 들고 가려면 무게가 얼마나 나갔고, 먼 길을 갈 때 돈을 어떻게 운반했나요?", "6-13. 18세기 한양의 기와집·초가집 집값과 지방 선비가 서울에서 방을 빌릴 때 내던 방세는 얼마였나요?", "6-14. 농사의 일등 공신인 소(우마) 한 마리와 타고 다니는 말 한 필의 가격은 쌀값이나 노비 몸값과 비교해 어떠했나요?", "6-15. 모내기(이앙법)와 논매기를 할 때 동네 사람들이 품앗이(두레)를 하거나 일꾼(고공)에게 주던 하루 품삯은 얼마였나요?", "6-16. 가을 추수 때 땅 주인(지주)과 소작농(작인)은 수확한 벼를 어떤 비율(병작반수·도조법)로 나누어 가졌나요?", "6-17. 전라도 흥덕·고부·부안 줄포의 5일장(장시)에는 어떤 물건들이 나왔고 황윤석 집안은 장터를 어떻게 이용했나요?", "6-18. 서해 바닷가 고창·부안 지역의 특산물인 소금(자염)과 젓갈, 건어물은 내륙의 쌀과 어떻게 교환되었나요?", "6-19. 겨울 옷감인 목화(면화)와 여름 옷감인 삼베·모시를 집안 아녀자들이 밤새워 짜던 길쌈 경제는 가계에 얼마나 보탬이 되었나요?", "6-20. 논밭이나 노비를 사고팔 때 작성하던 조선 시대 계약서 '명문(明文)'에는 어떤 문구와 서명(수결)이 들어갔나요?", "6-21. 땅을 팔 때 왜 계약서(명문) 한 장만 넘기지 않고 수십 년 전 옛날 주인들의 구문기(옛 계약서 묶음)까지 통째로 넘겨주었나요?", "6-22. 노비가 주인에게 몸값을 내고 평민(양인) 신분으로 해방되던 '속량(贖良)' 비용은 얼마였고 어떤 문서를 써주었나요?", "6-23. 양반 가문에서 조상 제사 비용이나 관혼상제 목돈을 마련하기 위해 운영하던 '계(契: 종계·대동계·혼상계)'는 어떻게 굴러갔나요?", "6-24. 집안의 큰어른이 돌아가셨을 때 장례 비용(상장비)은 얼마나 들었고, 조문객들이 내는 부의금(부조)은 무엇으로 들어왔나요?", "6-25. 해마다 봄이면 쌀값이 치솟고 가을 추수 직후에는 쌀값이 폭락하던 계절별 물가 변동을 황윤석은 어떻게 기록했나요?", "6-26. 국가에 세금을 쌀 대신 무명베(면포)나 동전(엽전)으로 낼 때 환산 비율(작전)을 두고 왜 관아와 백성 사이에 실랑이가 벌어졌나요?", "6-27. 한양 종로의 독점 상인(시전 상인)들과 골목길 난전 상인들이 벌이던 상권 다툼(금난전권)을 황윤석은 어떻게 보았나요?", "6-28. 지방 선비들이 좋은 벼루(남포석·단양석)나 족자, 병풍, 안경 같은 기호품을 살 때는 얼마를 지출했나요?", "6-29. 황윤석 집안의 재산 상속 문서(분재기)를 보면 장남(종손)과 차남, 그리고 시집간 딸들의 상속 몫이 어떻게 변화했나요?", "6-30. 54년 동안 매일의 지출 내역을 1푼 단위까지 기록한 《이재난고》가 한국 경제사 연구에서 왜 '살아있는 물가 보물창고'로 불리나요?", "6-31. 옛날 땅 문서에 나오는 '한 마지기(1두락)'와 세금을 매기는 단위인 '1결(結)·1부(負)'는 넓이가 어떻게 달랐나요?", "6-32. 가뭄에 대비해 마을 논에 물을 대던 저수지(제언)나 보(洑)는 누가 어떻게 관리하고 수리했나요?", "6-33. 논에 벼를 베고 난 뒤 겨울에 보리를 심는 이모작(답리작)과 콩·팥·목화 등 밭농사 수익은 어떠했나요?", "6-34. 종가에서 1년 내내 손님과 제사에 쓸 술(가양주)과 간장·된장을 담그는 데 쌀과 콩이 얼마나 들어갔나요?", "6-35. 해마다 가을이면 초가지붕(이엉)을 새로 얹거나 오래된 기와집을 수리할 때 목수와 와공(기와장수) 품삯은 얼마였나요?", "6-36. 양반 집 사랑채에 하루가 멀다 하고 찾아와 밥과 잠자리를 청하던 나그네(과객·過客) 접대비는 얼마나 큰 부담이었나요?", "6-37. 전라도에서 거둔 세금 쌀을 배에 실어 서해 바다를 거쳐 한양으로 운반하던 조운선(세곡선) 이야기와 침몰 사고는 어떠했나요?", "6-38. 땔감과 집 지을 나무를 얻기 위해 문중이나 마을 사람들이 함께 소나무 숲을 지키던 '송계(松契)'는 어떻게 운영되었나요?", "6-39. 3년마다 호구단자(호적)를 써낼 때 도망간 노비나 새로 태어난 노비 자식은 호적에 어떻게 올렸나요?", "6-40. 조상 산소 자리를 두고 싸우는 산송(山訟)이 벌어지면 사또가 현장에 나가 직접 그리던 지도 '산도(山圖)'는 무엇인가요?", "6-41. 빚을 진 사람이 제때 돈을 못 갚을 때 논밭이나 집 문서를 담보로 잡히던 전당(典當) 거래는 어떻게 이루어졌나요?", "6-42. 장터에서 쌀이나 소금을 사고팔 때 중개 수수료(구문)를 챙기던 객주(客主)·여각과 거간꾼들의 역할은 무엇이었나요?", "6-43. 종가에서 부리는 솔거노비(집안 노비)들에게는 1년 동안 옷과 밥, 혹은 개인 농사 땅(사경지)을 어떻게 챙겨주었나요?", "6-44. 외지에 나가 사는 외거노비(바깥 노비)들이 매년 주인집에 바치던 몸값 세금인 '신공(身貢)'은 얼마였나요?", "6-45. 집안 제사를 지낸 뒤 남은 제수 음식이나 추수한 햇곡식을 이웃 친척들과 나누어 먹던 풍습(분정)은 어떠했나요?", "6-46. 유기그릇(놋그릇)이나 가마솥, 호미·낫 같은 철제 농기구는 어디서 샀으며 대장간 수리 비용은 얼마였나요?", "6-47. 밤에 글을 읽을 때 꼭 필요했던 등잔 기름(들기름·아주까리기름·생선기름)과 밀초 가격은 가계에 얼마나 부담이었나요?", "6-48. 전라도 고창·부안에서 나는 대나무로 만든 돗자리, 소쿠리, 부채, 갓 같은 수공예품 가격은 얼마였나요?", "6-49. 황윤석이 아들들과 손자들에게 집안 살림(치산·治産)을 가르치며 강조했던 경제 철학은 무엇이었나요?", "6-50. 250년 전 황윤석 가문의 고문서와 일기를 통해 본 18세기 조선 사족 가문의 생존 전략은 무엇이었나요?"], "7. 일상생활·의약·문화·음식 (미시사로 본 선비의 하루)": ["7-1. 황윤석을 비롯한 18세기 가족들이 천연두(마마), 학질, 감기, 안질, 종기 등 질병에 걸렸을 때 어떤 한약재와 처방으로 치료했나요?", "7-2. 일기에 기록된 18세기 호남과 한양의 계절별 음식, 술, 차, 과일, 그리고 잔치나 제사상에 올린 특별한 식문화는 어떠했나요?", "7-3. 부안 변산(邊山)이나 백양산, 단양·영월 등을 유람하며 남긴 기행 기록과 당시 선비들의 여행 준비물 및 풍류 생활은 어떠했나요?", "7-4. 황윤석이 평생 수집하거나 빌려 읽고 베껴 쓴(필사) 책들은 어떤 것들이며, 책을 구하기 위해 어떤 노력을 기울였나요?", "7-5. 정조 대 이후 황윤석의 사후에 문집(이재유고)이 1829년 목판본과 1942년 석인본으로 간행되기까지 후손들과 관찰사 조인영 등은 어떤 노력을 기울였나요?", "7-6. 치통(이앓이)이나 눈병, 혹은 과음 후 숙취로 고생할 때 황윤석이 실제로 써본 민간요법과 한방 처방은 무엇인가요?", "7-7. 근엄해 보이는 조선 선비들도 친구들과 모이면 바둑(기), 장기, 투호, 시 짓기 내기를 하며 어떻게 놀았나요?", "7-8. 에어컨도 없던 18세기 한여름 삼복더위와 매서운 한겨울 추위를 황윤석은 어떤 피서법과 난방(온돌 땔감)으로 견뎠나요?", "7-9. 합리적인 실학자였던 황윤석의 일기에도 귀신, 도깨비, 명당 풍수, 혹은 신기한 태몽·예지몽 이야기가 나오나요?", "7-10. 카메라가 없던 시절, 황윤석은 자신의 얼굴(초상화)이나 외모 특징, 혹은 평생의 자취를 어떻게 묘사해 남겼나요?"]};
const CURATED_ANSWERS_BANK = {"1-6": "1. 메모 습관(장중록) : 황윤석은 외출하거나 여행할 때도 소매 속에 작은 수첩(장중록·일력)과 휴대용 붓(묵통)을 지니고 다니며 보고 들은 것을 즉시 메모했습니다.\n\n2. 병중의 구술과 보완 : 몸이 심하게 아파 붓을 들기 힘든 날에는 간략히 날씨와 증세만 적거나, 병이 조금 나은 뒤 며칠 치의 기억과 편지·조보를 대조해 빈틈없이 채워 넣었습니다.\n\n3. 임종 사흘 전까지의 집념 : 10세(1738년) 소년기부터 별세 사흘 전인 63세(1791년 4월)까지 단 한 해의 공백도 없이 57책을 채운 것은 기록을 수양의 일부로 여긴 경이로운 정신력 덕분이었습니다.\n\n4. 사실주의적 기록 원칙 : 자신의 실수나 가난, 낙방의 아픔까지도 미화하지 않고 있는 그대로 적어 사료적 신뢰도를 극대화했습니다.", "1-7": "1. 평생의 학문적 동지 : 아우 황주석(黃冑錫, 자 온수 溫叟)은 형 황윤석과 함께 석실서원 김원행의 문하에 나란히 입문하여 성리학과 경학을 함께 토론한 가장 든든한 학문적 동반자였습니다.\n\n2. 서울 유학길 동행과 뒷바라지 : 젊은 시절 과거 시험을 보러 한양에 오르내릴 때 형제가 함께 여정을 견뎠고, 형이 서울에서 관직 생활을 할 때는 고향 살림과 부모님 봉양을 분담했습니다.\n\n3. 일기 속 형제의 일상 : 일기에는 형제가 밤늦도록 등불 아래서 시를 주고받거나(차운시), 집안 대소사와 시국 현안을 상의하며 서로의 건강을 챙기는 다정한 모습이 자주 등장합니다.\n\n4. 문집과 고문서의 기록 : 형제가 주고받은 편지(가서)와 시문은 《이재유고》와 장서각 종가고문서에 다수 전해져 조선 후기 우애 깊은 사족 형제의 전형을 보여줍니다.", "1-8": "1. 부친 황전(黃琠)의 세심한 사랑 : 부친 황전은 한양에 머무는 장남 황윤석에게 인편이 있을 때마다 편지(가서)와 함께 쌀, 밑반찬, 여비(엽전), 여름·겨울 옷가지를 챙겨 보냈습니다.\n\n2. 건강과 몸가짐 당부 : 편지에는 객지 하숙집에서 찬 음식을 조심하고 과로하지 말라는 아버지의 애틋한 걱정과 함께, 말과 행동을 삼가 당쟁에 휩쓸리지 말라는 어른스러운 훈계가 담겨 있습니다.\n\n3. 고향 농사와 살림 소식 : 또한 고향 구수동의 가뭄과 추수 작황, 어머니의 안부, 어린 손자들의 성장 소식을 세세히 적어 보내 타향살이하는 아들의 외로움을 달래주었습니다.\n\n4. 실물 간찰 보존 : 부친과 주고받은 이 친필 편지들은 일기에 날짜별로 초록되어 있을 뿐 아니라 장서각 종가고문서에도 실물로 남아 있습니다.", "1-9": "1. 엄격하고도 자상한 독서 지도 : 황윤석은 장남 황수룡과 삼남 황두룡, 그리고 손자들에게 매일 읽을 경서(천자문·소학·사서)의 분량을 정해주고 직접 강독(배강)을 받으며 기초 학문을 다지게 했습니다.\n\n2. 생활 예절과 근검절약 교육 : 사족의 자제로서 교만하지 않고 어른을 공경하며, 종이 한 장과 곡식 한 톨도 아끼는 근검한 생활 습관을 몸소 실천해 보였습니다.\n\n3. 서울 관직 중의 편지 교육 : 자신이 한양이나 지방 임지에 나가 있을 때도 아들들에게 편지를 보내 그날그날 공부한 내용과 글씨 연습 결과를 보고하도록 독려했습니다.\n\n4. 가학(家學)의 전승 : 이러한 가정 교육을 통해 아들 황수룡·황두룡과 후손들은 선대의 방대한 일기와 저술을 흩트리지 않고 끝까지 지켜낼 수 있었습니다.", "1-10": "1. 환갑(1789년, 61세)의 감회 : 황윤석은 1789년(정조 13) 회갑을 맞아 고향 구수동에서 가족·문인들과 조촐히 자리를 함께하며 지난 60년의 학문과 관직 생활을 차분히 돌아보았습니다.\n\n2. 벼슬보다 빛난 저술의 자부심 : 비록 대과 급제나 고위 대신에는 이르지 못했으나, 50년 넘게 이어온 일기 《이재난고》와 평생의 심혈을 기울인 백과전서 《이수신편》을 완성했다는 학자적 자긍심이 뚜렷했습니다.\n\n3. 자지기(自知記)와 시문 정리 : 노년에도 붓을 놓지 않고 자신의 독서와 사상을 갈무리한 《자지기》와 시문을 손수 정리하며 후대에 남길 학문적 유산을 갈고닦았습니다.\n\n4. 호남 유림의 존경 : 만년에는 호남 일대의 수많은 후학들이 구수동으로 찾아와 가르침을 청하는 향촌 사림의 정신적 스승으로 존경받았습니다.", "2-6": "1. 40대 이후 찾아온 노안과 안질 : 평생 밤낮으로 잔글씨를 읽고 필사하던 황윤석은 40대 중반 이후 시력이 약해지고 눈병(안질)이 잦아지자 독서와 교정에 큰 불편을 겪었습니다.\n\n2. 안경(애체·叆叇)의 구입과 착용 : 이에 한양 광통교와 지인들을 통해 중국(연경)에서 수입된 수정 돋보기안경(노안경)을 구해 착용했으며, 그 가격과 도수(밝기)를 일기에 상세히 기록했습니다.\n\n3. 안경 덕분에 이어간 노년 저술 : 안경을 쓴 뒤 작은 한자 획이 다시 또렷이 보인다며 기뻐했고, 덕분에 50~60대 노년기에도 세밀한 수표 계산과 일기 집필을 멈추지 않을 수 있었습니다.\n\n4. 생활사적 흥미 : 18세기 조선 학자들에게 안경이 어떻게 보급되어 학문 수명을 연장해 주었는지 보여주는 생생한 기록입니다.", "2-7": "1. 관상감 예고와 실제 관측 비교 : 일식이나 월식이 예고된 날이면 황윤석은 마당에 나가 해와 달이 가려지기 시작하는 시각(초휴), 가장 많이 가려진 시각(식심), 다시 복원되는 시각(복원)을 분 단위로 직접 관측했습니다.\n\n2. 서양 시헌력의 정밀성 검증 : 자신이 직접 관측한 시간·방위를 조정 관상감의 공식 예측표 및 서양 역법서(시헌력)의 계산 공식과 대조하며 몇 분의 오차가 나는지 꼼꼼히 계산했습니다.\n\n3. 일기 속 천문 스케치 : 날씨가 맑아 관측이 잘된 날에는 해와 달이 어느 방향부터 몇 분의 몇이나 가려졌는지 일기장 여백에 그림과 수치로 상세히 남겨두었습니다.\n\n4. 실증적 과학 정신 : 일식을 단순한 하늘의 재앙으로만 두려워하지 않고 수학적·천문학적 법칙으로 검증해 낸 실학자의 면모를 보여줍니다.", "2-8": "1. 전라도 방언과 서울말의 실증 비교 : 황윤석은 고향인 전라도 흥덕·고부 지역의 고유 사투리와 한양 도성 사람들이 쓰는 서울말의 어휘·억양 차이를 예리하게 포착해 일기와 〈화음방언자의해〉에 남겼습니다.\n\n2. 옛 고어(古語)가 남은 호남 방언 : 흔히 시골 사투리를 변방의 틀린 말로 여겼던 당대 통념을 깨고, 오히려 전라도와 남도 방언 속에 신라·고려 이래의 순수한 옛 우리말(고어)과 정확한 훈민정음 음가가 원형대로 보존되어 있음을 밝혀냈습니다.\n\n3. 일상 사물 명칭의 어원 추적 : 김치(침채), 가위, 부추, 새우젓 등 일상 음식과 농기구, 동식물의 지방별 명칭이 한자음 및 고유어와 어떻게 연결되는지 어원을 추적했습니다.\n\n4. 방언학의 선구자 : 오늘날 국어학자들이 18세기 전라도 방언과 중앙어를 복원할 때 가장 먼저 인용하는 보물 같은 자료입니다.", "2-9": "1. 산가지(산목)와 주판의 활용 : 18세기 학자들은 대나무로 만든 산가지(算木)를 바닥에 놓거나 주판을 활용해 사칙연산은 물론 제곱근(개방), 연립방정식(방정), 삼각법(구고술)까지 풀어냈습니다.\n\n2. 복잡한 토지 모양 면적 계산 : 실제 농촌에서는 논밭의 모양이 반듯한 사각형이 아니라 삼각형, 사다리꼴, 둥근 활 모양 등 제각각이었기에, 《구장산술》과 《산학계몽》의 기하학 공식을 써서 정확한 평수와 세금(결부)을 계산했습니다.\n\n3. 《이수신편》 산학 편의 집대성 : 황윤석은 당대 유통되던 동서양 수학서의 계산법과 구구단 응용 공식을 《이수신편》에 체계적으로 정리하여 실생활의 측량과 회계에 쓸 수 있게 했습니다.\n\n4. 인문학자의 수학 사랑 : 성리학자이면서도 수학을 우주의 질서(이수)이자 실용 학문으로 여겨 평생 계산 연습을 즐겼습니다.", "2-10": "1. 도량형과 음악의 기준인 황종관(黃鐘管) : 동양 전통 과학에서는 음악의 기본음인 황종(黃鐘) 피리의 길이와 둘레가 곧 길이(척), 부피(되·말), 무게(냥·근)를 재는 모든 국가 도량형의 출발점이었습니다.\n\n2. 검은 기장 알갱이(거서) 실험 : 황윤석은 고대 문헌대로 중간 크기의 검은 기장 알갱이 90알을 나란히 줄 세워 표준 길이를 재고, 피리 대롱 안에 1,200알이 들어가는 부피를 직접 실험하며 오차를 검증했습니다.\n\n3. 삼분손익법과 12율 수학 계산 : 피리 길이를 3분의 1씩 줄이고 늘리는 수학 공식(삼분손익법)을 정밀한 소수점까지 계산하여 12음계(12율려)의 정확한 음높이를 산출했습니다.\n\n4. 과학과 예술의 융합 : 음악을 단순한 감상이 아니라 정밀 수학과 물리학(음향학)으로 규명하려 한 18세기 지성사의 결정판입니다.", "3-6": "1. 만연했던 과장(시험장)의 폐단 : 18세기 후반 과거 시험장에는 수만 명이 몰리면서 남이 지어준 글을 사서 내는 차작(借作), 시험장에 책을 몰래 숨겨 들어가는 협책(挾冊), 하인을 시켜 좋은 자리를 맡는 선접 등 부정행위가 심각한 사회 문제였습니다.\n\n2. 황윤석이 목격한 과장 풍경 : 일기에는 시험장 문이 열릴 때 유생들과 하인들이 뒤엉켜 짓밟히는 소동과, 권세가 자제들이 거느린 수행원들의 소란스러운 모습이 생생히 기록되어 있습니다.\n\n3. 정정당당한 실력 승부 : 이러한 혼탁한 분위기 속에서도 황윤석은 남의 힘을 빌리지 않고 오직 자신이 갈고닦은 경학 실력과 문장력으로만 향시·도회·감시 장원과 진사시 합격을 일구어냈습니다.\n\n4. 과거제 개혁론에 대한 공감 : 과거장의 타락을 직접 겪으며 실력 있는 지방 인재들이 소외되는 현실을 안타까워하는 기록을 여러 차례 남겼습니다.", "3-7": "1. 주요 하숙 동네(반촌과 남촌) : 한양에 올라온 황윤석은 주로 성균관 주변의 반촌(泮村)이나 남산 아래 남촌, 또는 광통교·수표교 근처의 중인·서민 집 사랑채 및 친척·지인의 집에 방을 얻어 머물렀습니다.\n\n2. 하숙비(식채) 정산 방식 : 하숙집 주인에게 매달 쌀이나 엽전으로 밥값(식채)과 방세, 땔감 비용, 그리고 타고 온 조랑말의 마초(먹이) 값을 꼼꼼히 계산해 치렀습니다.\n\n3. 잦은 이사와 집주인 인심 : 방이 좁고 시끄러워 공부에 방해가 되거나 하숙비가 오르면 더 조용하고 저렴한 집으로 거처를 옮기기도 했으며, 인정 많은 집주인이 명절 음식을 챙겨주던 따뜻한 일화도 적혀 있습니다.\n\n4. 지방 유생의 서울살이 애환 : 고향에서 송금이 늦어지면 하숙집 주인에게 미안해하며 외상으로 버티던 인간적인 고충이 그대로 전해집니다.", "3-8": "1. 주막(점막)의 점심과 숙박 : 삼남대로를 따라 올라가는 동안 점심(중화)과 저녁에는 길가 주막에 들러 국밥과 탁주, 말 먹이(죽)를 사 먹었으며, 한 끼 비용으로 보통 엽전 몇 푼(문)에서 수십 문을 지출했습니다.\n\n2. 빈대와 추위, 열악한 잠자리 : 주막 방에 손님이 가득 차면 모르는 나그네들과 끼어 자야 했고, 여름철 모기·빈대와 겨울철 외풍 때문에 잠을 설친 고생담이 《서행일력》 등에 적혀 있습니다.\n\n3. 폭우로 불어난 강물과 도둑 경계 : 장마철이나 해빙기에는 금강(공주)이나 한강(동작진) 나루터의 배가 끊겨 며칠씩 발이 묶이기도 했고, 고갯길에서는 행색이 수상한 무리를 만나 일행과 바짝 긴장하며 이동했습니다.\n\n4. 로드무비 같은 생생함 : 18세기 조선의 도로망과 주막 경제, 여행자들의 실제 모습을 날짜와 시간 단위로 복원할 수 있습니다.", "3-9": "1. 한양 명승지 소풍(유상) : 봄가을 날씨가 좋은 날이면 함께 공부하는 유생들과 어울려 성균관 뒤편 삼청동 계곡, 북한산(삼각산), 세검정, 한강 정자 등으로 산책을 나가 시를 읊고 탁족(발 씻기)을 즐겼습니다.\n\n2. 광통교·종로 책방 거리 구경 : 황윤석이 가장 좋아한 휴식은 청계천 광통교와 종로 일대의 서쾌(책장수)와 필방, 골동품 가게를 둘러보며 새로 들어온 중국 서적과 진귀한 물건을 구경하는 일이었습니다.\n\n3. 고향 벗들과의 번개 모임 : 한양에 올라와 있는 호남 출신 선비들이나 김원행 문하의 벗들 거처를 찾아가 차와 술을 나누며 고향 소식과 시국 이야기를 나누는 것이 큰 위안이었습니다.\n\n4. 청춘의 낭만 : 팍팍한 수험 생활 속에서도 학문적 호기심과 우정으로 활력을 되찾던 18세기 한양 유학생들의 일상이 담겨 있습니다.", "3-10": "1. 방방(합격 발표) 날의 허탈함 : 과거 합격자 명단(방목)에 자신의 이름이 없는 것을 확인한 날에는 며칠간 밤잠을 이루지 못하며, 고향에서 학수고대하고 계실 노부모님께 죄송한 마음을 일기에 솔직히 토로했습니다.\n\n2. 무거운 귀향길 발걸음 : 남은 하숙비를 정산하고 지친 몸으로 다시 600리 길을 걸어 내려오면서, 길가의 산천을 보며 자신의 불우한 운명을 달래는 기행시를 남기기도 했습니다.\n\n3. 가족들의 따뜻한 위로 : 그러나 고향 구수동에 도착하면 부친 황전과 모친, 아내 창원정씨는 낙방한 아들을 조금도 책망하지 않고 따뜻한 밥상을 차려주며 다음 기회를 격려했습니다.\n\n4. 전화위복의 공부 : 낙방의 아픔을 오히려 경학과 자연과학(이수신편) 연구에 더욱 매진하는 계기로 삼아 당대 최고의 실학자로 거듭났습니다.", "4-6": "1. 신참 관원의 신고식(면신례·허참례) : 조선 시대 관청에서는 새로 임명된 관원이 선배 관원들에게 술과 음식을 대접하고 짓궂은 통과의례를 치르는 면신례(免新禮) 관행이 있었습니다.\n\n2. 황윤석의 첫 출근 풍경 : 1766년 장릉참봉과 이후 사옹원·종부시·사헌부감찰 등 중앙 관청에 처음 출근(숙배)할 때, 고참 관원들과 서리(아전)들에게 관례에 따라 예물을 건네고 직무 인수인계를 받았습니다.\n\n3. 학식으로 얻은 존중 : 비록 늦은 나이에 음직으로 출발한 하위 관원이었으나, 황윤석의 뛰어난 문장력과 전례·산학 지식이 소문나면서 선배 관원들도 함부로 대하지 못하고 어려운 문서 작성을 자문하곤 했습니다.\n\n4. 관료 사회의 미시사 : 공식 법전에는 나오지 않는 18세기 관청 내부의 직장 문화와 인간관계를 엿볼 수 있습니다.", "4-7": "1. 노년의 영조(英祖) 임금 목격담 : 1769년 서대문 행차 호종과 입시 때 가까이서 뵌 70대 중반의 영조는 고령에도 불구하고 카랑카랑한 음성과 매서운 눈빛으로 신하들을 호령하며 군무를 직접 챙기는 정력적인 군주였습니다.\n\n2. 젊은 정조(正祖) 임금과의 대면 : 1778년 선정전 윤대관으로 입시하여 독대한 27세의 젊은 국왕 정조는 실무 관원의 작은 보고까지 꼼꼼히 경청하고 핵심을 찌르는 질문을 던지는 총명하고 학자적인 군주로 묘사되어 있습니다.\n\n3. 성은에 대한 감격 : 미관말직인 자신의 대답을 정조 임금이 온화한 안색으로 들어주자, 퇴궐 후 일기에 국왕의 질문 한마디 한마디를 토씨까지 기억해 감격스럽게 적어두었습니다.\n\n4. 두 성군의 생생한 초상 : 영조와 정조 두 시대를 모두 관원으로 섬기며 근거리에서 관찰한 귀중한 인물 기록입니다.", "4-8": "1. 사복시(司僕寺) 주부의 핵심 업무 : 사복시는 국왕이 타는 어승마(御乘馬)와 궁중의 가마, 그리고 전국 목장의 말과 사료를 총괄하는 핵심 관청으로, 황윤석은 1778년 사복시주부로 재임했습니다.\n\n2. 말 사료(마초)와 회계 점검 : 수학(산학)에 밝았던 황윤석은 수백 필에 달하는 궁중 마필의 사료(콩·여물) 배급량과 지방 목장에서 올라오는 세금 장부를 정밀하게 검산하여 아전들이 중간에서 가로채는 폐단을 막았습니다.\n\n3. 거둥(왕의 행차) 준비의 긴장감 : 정조가 능행차나 거둥을 나설 때면 새벽부터 궁궐 마구간에서 어승마의 건강 상태와 마구(안장)를 점검하며 혹시라도 말이 놀라 실수가 생길까 노심초사하던 현장이 일기에 적혀 있습니다.\n\n4. 승정원일기와의 일치 : 정조 앞 윤대관 입시에서 사복시의 마정(馬政) 현황을 막힘없이 보고한 기록이 승정원일기에도 그대로 남아 있습니다.", "4-9": "1. 새벽부터 밤까지의 수령 일과 : 진위현령·목천현감·전의현감 재임 시절, 황윤석은 새벽에 일어나 관아 아전들의 점고(출석 확인)를 받고, 낮에는 백성들의 소송(산송·채무) 판결과 세금·환곡 장부 결재를 직접 챙겼습니다.\n\n2. 아전(향리)들의 장부 조작 적발 : 산학(수학)의 대가였던 황윤석이 환곡과 전세 장부의 숫자를 직접 주판과 산가지로 검산하자, 평소 수령이 셈에 어두운 틈을 타 부정을 저지르던 아전들이 혀를 내두르며 꼼짝 못 했습니다.\n\n3. 향교 진흥과 백성 구휼 : 틈날 때마다 고을 향교의 유생들을 모아 강학을 열고, 가난한 백성들에게 부당한 잡세를 거두지 못하게 엄단하여 목천 고을 백성들로부터 살아생전 선정비가 세워지는 칭송을 받았습니다.\n\n4. 목민관의 모범 : 다산 정약용의 《목민심서》보다 앞서 실학자 수령이 어떻게 고을을 다스렸는지 보여주는 실전 행정 일기입니다.", "4-10": "1. 아전과 토호들의 보복성 무고 : 황윤석이 원칙대로 행정을 펼치며 아전들의 횡령을 막고 서울 권세가들의 부당한 청탁을 거절하자, 이에 앙심을 품은 세력이 관찰사(심이지)와 암행어사(심풍지)에게 거짓 모함을 꾸며 파직에 이르게 했습니다.\n\n2. 떳떳했던 귀향 행장 : 파직 통보를 받은 날 황윤석은 조금도 비굴해하지 않고 관아의 공금을 한 푼의 오차도 없이 인계한 뒤, 부임할 때 가져왔던 단출한 책짐만 꾸려 당당히 관아 문을 나섰습니다.\n\n3. 길을 막고 눈물 흘린 고을 백성들 : 특히 목천현감에서 물러날 때는 고을 노인과 백성들이 길가에 나와 청렴한 수령이 억울하게 떠나는 것을 안타까워하며 전송했고, 이듬해 스스로 돈을 모아 선정비를 세웠습니다.\n\n4. 〈백교설〉로 남긴 진실 : 공식 사초(승정원일기)에는 한 줄의 파직 기사로만 남았으나, 일기와 문집 〈백교설〉을 통해 지방 행정의 구조적 모순을 생생히 고발했습니다.", "5-6": "1. 조보(기별지) 배달원 기별군사 : 한양에서는 각 관청과 사대부가에 매일 아침 승정원의 공식 발표를 베껴 쓴 조보(朝報)를 배달해 주는 전문 배달원(기별군사·조보꾼)이 활동했습니다.\n\n2. 한 달 구독료(조보채) : 황윤석이 한양에 머물며 기록한 물가 장부에 따르면, 조보를 한 달 동안 구독하는 비용(조보채)은 엽전 수십 문(전) 수준으로, 지방 선비들도 식비를 아껴가며 반드시 구독할 만큼 필수 정보원이었습니다.\n\n3. 고향으로의 재발송(전람) : 자신이 다 읽은 조보는 버리지 않고 날짜순으로 묶어 고향 구수동의 아버지(황전)나 호남의 사우들에게 인편으로 내려보내 함께 돌려 보도록 했습니다.\n\n4. 조선의 뉴스 네트워크 : 18세기 지식인들이 어떻게 유료 뉴스를 구독하고 스크랩하여 아카이빙했는지 알 수 있습니다.", "5-7": "1. 1777년 정조 침전 자객 침입 사건 : 정조 즉위 초인 1777년 7월 홍상범 일당이 국왕의 침전(존현각) 지붕까지 자객(전흥문)을 침투시킨 초유의 암살 미수 사건이 발생하자 한양 도성 전체가 큰 충격과 공포에 휩싸였습니다.\n\n2. 금부 추국과 도성 검문 : 황윤석은 조보와 도성 관원들의 전언을 통해 의금부의 삼엄한 국문(추국) 과정, 성문 통제, 그리고 역모 가담자들의 처형 소식을 실시간에 가깝게 일기에 상세히 기록했습니다.\n\n3. 정국의 긴장과 언로 위축 : 잇따른 역모 옥사로 인해 관료들이 말 한마디를 조심하고 밤거리 통행이 얼어붙은 당시 서울의 삼엄한 분위기를 생생하게 전합니다.\n\n4. 역사의 현장 중계 : 영화나 드라마로만 보던 정조 대 초기의 암살 위협을 당대인의 눈으로 생생히 목격한 사료입니다.", "5-8": "1. 당색을 넘어선 학술·시문 교류 : 조정의 상소문에서는 노론과 남인·소론이 사생결단하며 맞섰으나, 학문과 기예를 사랑하는 실학자·문인들의 사적인 사랑방에서는 당파를 초월한 만남이 활발히 이루어졌습니다.\n\n2. 남인 실학자 이가환 등과의 우정 : 노론 낙론계였던 황윤석이 남인의 핵심 인물인 이가환(李家煥)이나 소론·북학파 학자들과 스스럼없이 만나 밤새 천문·역법·시문을 토론하고 술잔을 나눈 것이 대표적인 예입니다.\n\n3. 과거 시험장과 관청의 동료애 : 같은 해 진사시에 합격한 동기(동년)나 종부시·사복시 같은 실무 관청에서 함께 일하는 동료 관원들과는 당색에 상관없이 경조사를 챙기고 부조를 주고받았습니다.\n\n4. 입체적인 정치사회사 : 붕당 정치를 흑백논리로만 보던 시각에서 벗어나 18세기 지식인 사회의 유연하고 인간적인 교유망을 보여줍니다.", "5-9": "1. 1762년(임오년) 5월의 충격적 비보 : 황윤석이 34세로 고향에 머물던 1762년(영조 38) 5월 윤달, 한양에서 사도세자가 폐서인되어 뒤주에 갇혀 숨졌다는 전대미문의 비보가 삼남 지방까지 전해졌습니다.\n\n2. 극도로 조심스러웠던 기록 태도 : 국왕(영조)과 왕실의 가장 민감한 금기 사안이었기에 일기에서도 직접적인 비판이나 자세한 언급은 극도로 삼가면서도, 당시 조보에 실린 영조의 전교와 신하들의 처분 소식을 침통한 필치로 채록했습니다.\n\n3. 정조 즉위 후의 변화 : 14년 뒤 사도세자의 아들 정조가 즉위(1776년)하며 세자를 장헌세자로 추숭하고 관련자들을 숙청할 때는 서울 관원으로서 그 역전의 과정을 현장에서 지켜보며 기록했습니다.\n\n4. 시대의 아픔을 담은 사초 : 당대 재야 지식인들이 임오화변이라는 거대한 정치적 트라우마를 어떻게 받아들였는지 엿볼 수 있습니다.", "5-10": "1. 전쟁설·민란설 등 당대의 유언비어 : 18세기에도 가뭄이 들거나 큰 옥사가 터지면 청나라에 변란이 났다거나 어느 도에서 반란이 일어났다는 식의 흉흉한 소문(와언·유언비어)이 장터와 주막을 통해 빠르게 퍼졌습니다.\n\n2. 황윤석의 교차 검증(팩트 체크) : 황윤석은 떠도는 소문을 들으면 일단 일기에 '전하는 말에 의하면(전언)'이라고 단서를 달아 기록한 뒤, 반드시 며칠 뒤 도착하는 공식 조보(朝報)나 해당 지역 지인의 편지를 통해 진위를 재확인했습니다.\n\n3. 거짓 소문의 정정 기록 : 확인 결과 헛소문으로 밝혀지면 일기 뒷부분에 '앞서 들은 소문은 와전된 것이었다'라고 명확히 정정하여 기록의 정확성을 지켰습니다.\n\n4. 투철한 실증 정신 : 가짜 뉴스에 쉽게 흔들리지 않고 복수의 정보원을 대조해 사실을 가려낸 근대적 저널리즘에 가까운 태도를 보여줍니다.", "6-6": "1. 양반가의 일시 차용과 환(어음) 거래 : 추수 전 보릿고개나 한양 과거 여비가 급할 때 황윤석 가문 역시 이웃 사족이나 장터 상인, 혹은 관아의 공금·사창에서 엽전이나 곡식을 일시 차용(변통)하곤 했습니다.\n\n2. 18세기 당시의 이자율(식리) : 일기와 고문서 기록을 보면 당시 민간 대차의 이자율은 보통 연 2할~5할(월 2~4푼) 수준이었으며, 가을 타작(추수) 직후에 원금과 이자를 쌀이나 엽전으로 갚았습니다.\n\n3. 한양에서의 환전(환표) 활용 : 고향에서 무거운 구리 엽전을 직접 지고 올라오기 힘들 때는 전주나 한양 상인의 어음(환표)을 끊어 서울에서 현금으로 찾는 발달된 금융 방식을 이용했습니다.\n\n4. 생생한 금융 생활사 : 양반 사대부도 체면만 차릴 수 없었던 현실적인 자금 융통과 18세기 화폐 경제의 실상을 잘 보여줍니다.", "6-7": "1. 노비 도망과 추쇄(推刷)의 어려움 : 18세기 후반에는 신분제가 흔들리며 노비들이 타지로 도망치는 일이 잦았고, 황윤석 가문에서도 도망간 외거노비를 찾기 위해 충청도·전라도 일대로 사람을 보내 추쇄하곤 했습니다.\n\n2. 추쇄 과정의 갈등과 타협 : 도망 노비를 찾아내더라도 노비가 이미 현지에서 가정을 꾸렸거나 완강히 버티면, 무작정 끌고 오기보다 일정액의 몸값(속량가)이나 신공(세금)만 받고 타협하는 경우가 많았습니다.\n\n3. 집안 솔거노비와의 인간적 유대 : 반면 구수동 본가에서 대대로 함께 살며 한양 심부름을 다니던 충직한 노비들이 병들거나 죽었을 때는 약을 지어주고 장례비를 보태주며 안타까워하는 기록도 일기에 자주 나옵니다.\n\n4. 신분제 변동기 사료 : 일기 속 노비 관리 기록과 종가고문서의 노비 명문·호구단자를 함께 보면 조선 후기 노비제의 변화를 입체적으로 알 수 있습니다.", "6-8": "1. 귀하고 비쌌던 한지(종이) 가격 : 18세기 당시 질 좋은 종이(백지·장지) 한 권(20장)은 쌀 여러 되 값에 달할 만큼 비싼 귀중품이었기에, 평생 57책의 일기와 수십 권의 저술을 쓴 황윤석에게 종이값은 큰 부담이었습니다.\n\n2. 관청 폐지와 편지 뒷면(이면지) 재활용 : 이에 황윤석은 고향에서 온 편지봉투나 다 읽은 조보, 관아의 파지(버리는 문서) 뒷면을 뒤집어 묶은 뒤 깨알 같은 글씨로 초고를 잡고 계산 연습을 했습니다.\n\n3. 몽당붓과 먹 조각 아껴 쓰기 : 붓끝이 다 닳아 몽당붓이 될 때까지 글씨를 썼고, 지방에 가는 지인들에게는 다른 선물 대신 종이와 붓·먹을 구해달라고 부탁하곤 했습니다.\n\n4. 실물 유물의 증거 : 실제로 현재 전해지는 《이재난고》 원본을 보면 종이 여백 한 치도 남기지 않고 빽빽하게 적어 내려간 검소함과 집념을 눈으로 확인할 수 있습니다.", "6-9": "1. 대기근과 참혹한 보릿고개 : 18세기 중후반 삼남 지방에 큰 가뭄이나 홍수가 들면 봄철 보릿고개에 풀뿌리와 소나무 껍질(송피)로 연명하다 굶어 죽는 유민(流民)들이 길가에 속출했습니다.\n\n2. 종가 차원의 구휼과 소작료 감면 : 흉년이 들면 황윤석과 부친 황전은 집안 곳간을 풀어 굶주린 일가친척과 마을 이웃들에게 죽과 곡식을 나누어 주었고, 소작농들의 가을 소작료(도조)를 깎아주었습니다.\n\n3. 향촌 사족의 사회적 책임(노블레스 오블리주) : 비록 본가 살림도 넉넉지 않았으나 향촌의 지도층(사족)으로서 마을 공동체가 무너지지 않도록 돕는 것을 당연한 도리로 여겼습니다.\n\n4. 기후와 경제의 연결 : 일기에 매일 기록된 강우량·날씨와 그해 가을의 추수량, 이듬해 봄의 쌀값 폭등이 정확히 맞물려 나타납니다.", "6-10": "1. 양반가 혼례 절차와 준비 : 사족 가문에서 자녀의 혼사가 정해지면 사주단자와 납채(혼서지·예단)를 주고받고, 신랑이 신부 집으로 찾아가 예를 올리는 친영·반친영 풍습에 따라 큰 잔치를 열었습니다.\n\n2. 만만치 않았던 혼수 비용 : 딸이나 누이를 시집보낼 때는 비단 옷감, 이불, 유기그릇, 장신구와 잔치 음식, 하인들의 노자까지 마련해야 해서 수십 냥의 큰돈이 들어가 가계가 휘청거리기도 했습니다.\n\n3. 문중과 사우들의 부조(품앗이) : 이럴 때면 친척들과 인근 사족들이 쌀, 국수, 생선, 엽전 등을 부조(부물)로 보내주어 상부상조로 큰일을 치렀고, 황윤석은 그 명단과 물목을 꼼꼼히 적어두었다가 훗날 똑같이 갚았습니다.\n\n4. 사위들과의 각별한 정 : 사위인 유원빈·홍재룡·이언성 등을 친아들처럼 아끼며 학문을 가르치고 편지를 주고받은 기록이 일기에 가득합니다.", "7-6": "1. 평생 괴롭힌 치통(치통·풍치)과 눈병 : 황윤석은 중년 이후 잇몸이 붓고 이가 흔들리는 치통과 눈이 충혈되는 안질로 자주 고생했으며, 소금물 양치나 초피(산초)·마늘 찜질, 청열 탕약 등으로 통증을 다스렸습니다.\n\n2. 여름철 배탈·학질과 겨울 감기 : 여름철 상한 음식으로 인한 설사·복통에는 불환금정기산과 쑥뜸을 썼고, 사흘걸이 열병인 학질(말라리아)과 독감에는 인삼패독산과 생강·파뿌리 달인 물을 복용했습니다.\n\n3. 숙취와 피로 회복법 : 사우들과 약주를 마신 다음 날에는 꿀물이나 차(茶), 맑은 장국으로 속을 풀고 조용히 정좌(명상)하며 기력을 회복했습니다.\n\n4. 살아있는 한방 임상기 : 어떤 약재를 몇 돈 넣고 달여 먹었더니 몇 시간 뒤에 땀이 나며 열이 내렸는지 현대 의학 차트처럼 자세히 적혀 있습니다.", "7-7": "1. 선비들의 최고 인기 오락 바둑(위기) : 황윤석과 당대 선비들은 공부나 공무가 끝난 여가 시간에 사랑방에 모여 바둑(圍碁)과 장기를 두며 수 싸움을 즐겼고, 때로는 작은 술내기나 음식 내기를 곁들였습니다.\n\n2. 시회(詩會)와 운자 맞추기 게임 : 명절이나 계절 모임 때는 제비뽑기로 어려운 한자 운자(韻字)를 뽑은 뒤 정해진 시간 안에 시를 지어 품평하는 즉석 백일장 놀이를 가장 고상한 풍류로 여겼습니다.\n\n3. 투호와 활쏘기(향사례) : 몸이 찌뿌둥할 때는 마당에 항아리를 놓고 화살을 던져 넣는 투호(投壺)를 하거나, 인근 활터(사정)에 나가 활쏘기를 하며 심신을 단련했습니다.\n\n4. 인간미 넘치는 일상 : 하루 종일 경서만 읽었을 것 같은 도학자들의 유쾌하고 인간적인 여가 생활을 엿볼 수 있습니다.", "7-8": "1. 삼복더위 피서법(죽부인과 탁족) : 음력 6~7월 숨 막히는 폭염이 찾아오면 대청마루에 대나무 자리(죽부인·죽침)를 깔고 지냈으며, 인근 계곡이나 정자 그늘로 나가 찬물에 발을 담그는 탁족(濯足)과 미숫가루·수박·참외로 더위를 식혔습니다.\n\n2. 한겨울 온돌 난방과 땔감(시초) 걱정 : 반대로 겨울철에는 온돌방을 데울 장작과 솔가지(시초)를 확보하는 것이 가장 큰일이었으며, 특히 한양 하숙 시절에는 비싼 땔감 값을 아끼려 이불을 뒤집어쓰고 언 손에 입김을 불며 글을 썼습니다.\n\n3. 얼어붙은 벼루와 화로(화로불) : 한겨울 아침 책상 위 벼루의 먹물이 꽁꽁 얼어붙으면 조그만 화로(화독)의 숯불에 벼루를 녹여가며 그날의 일기를 적어 내려갔습니다.\n\n4. 미시 기후사의 보고 : 18세기 소빙하기의 매서운 추위와 폭염 속에서 선조들이 어떻게 사계절을 나았는지 생생히 전해줍니다.", "7-9": "1. 밤마다 꾼 꿈(몽기)의 솔직한 기록 : 황윤석은 돌아가신 부모님이나 아내, 스승 김원행을 꿈에서 뵙고 눈물 흘리며 깬 이야기, 혹은 과거 시험을 앞두고 꾼 길몽·흉몽을 일기에 꾸밈없이 자세히 적어두었습니다.\n\n2. 도깨비불과 기이한 소문에 대한 탐구 : 시골 밤길에 나타난 도깨비불(인화·귀화)이나 흉가에 귀신이 나온다는 마을 소문을 들으면, 무작정 믿기보다 음양오행의 기(氣)가 뭉쳐서 생기는 자연 현상(인 성분 발화 등)으로 합리적 설명을 시도했습니다.\n\n3. 조상 묘자리 풍수(감여학) 연구 : 당시 사족들에게 부모의 묏자리를 잡는 풍수지리(청오경 등)는 효도의 핵심이었기에, 황윤석 역시 지관(풍수가)들에게 휘둘리지 않기 위해 직접 풍수 서적을 깊이 연구했습니다.\n\n4. 전통과 이성의 교차점 : 18세기 실학자의 내면에 공존하던 합리적 과학 정신과 당대의 전통적 세계관을 동시에 볼 수 있는 흥미로운 대목입니다.", "7-10": "1. 글로 남긴 자화상(자찬·자명) : 황윤석은 자신의 생김새와 성품, 평생의 학문적 지향을 스스로 돌아보며 지은 글(자명·자지기 등)을 통해 겉모습보다 내면의 정신을 후대에 전하고자 했습니다.\n\n2. 당대 초상화(어진·사대부 초상)에 대한 관심 : 한양 체류 중 당대 명화가들이 그린 국왕의 어진(御眞) 모사 소식이나 스승·명사들의 초상화(진영)에 붙여진 찬문(화찬)을 일기와 문집에 상세히 기록했습니다.\n\n3. 57책 일기 자체가 가장 완벽한 자화상 : 비록 비단 위에 그린 채색 초상화보다도, 10세 소년 시절부터 63세 노년까지 매일의 생각과 희로애락, 심지어 작은 습관까지 적어 남긴 《이재난고》 57책 자체가 조선 역사상 가장 정밀한 정신적 자화상으로 꼽힙니다.\n\n4. 후손들의 추모 : 사후 문인들과 후손들이 작성한 가장·행장·묘갈명에도 그의 단정하고 학구적인 풍모가 생생히 묘사되어 있습니다.", "1-11": "1. 주역(周易)에서 따온 호 이재(頤齋) : '이재(頤齋)'는 《주역》의 '산뢰이(山雷頤)' 괘에서 따온 이름으로, 올바른 말과 음식으로 몸과 마음의 도덕성을 기른다(양정·養正)는 선비의 수양 철학이 담겨 있습니다.\n\n2. 장수를 기원한 자 영수(永叟) : 성인이 되는 관례 때 받은 자(字)인 '영수(永叟)'는 학문과 덕을 오래도록 길이 보전하는 어른이 되라는 뜻으로 집안 어른들과 스승이 축원해 준 이름입니다.\n\n3. 다양한 별호의 활용 : 이 밖에도 그는 고향 마을 이름을 딴 구수산인(龜壽山人), 서재 이름을 딴 녹차정(綠此亭) 등 상황에 따라 풍류 넘치는 여러 호를 함께 사용했습니다.\n\n4. 이름대로 살아낸 일생 : '올바름을 기른다'는 호의 뜻처럼 54년 동안 하루도 거르지 않고 자신을 성찰하는 일기를 쓰며 이름값을 온전히 증명했습니다.", "1-12": "1. 1729년(영조 5) 음력 4월의 탄생 : 황윤석은 1729년 음력 4월 20일 전라도 흥덕현 구수동 본가에서 아버지 황전과 어머니 강진김씨 사이의 2남 3녀 중 장남으로 태어났습니다.\n\n2. 집안의 기대를 한 몸에 받은 종손 : 평해황씨 구수동 종가의 대를 이을 귀한 맏손자가 태어나자 조부 황응규를 비롯한 온 문중이 크게 기뻐하며 각별한 정성으로 길렀습니다.\n\n3. 남달랐던 영특함 : 갓난아기 때부터 눈빛이 맑고 울음소리가 우렁찼으며, 돌이 지나 말을 배우기 시작할 무렵부터 한 번 들은 글귀와 사물 이름을 잊지 않아 집안 어른들을 놀라게 했습니다.\n\n4. 《자지기》와 연보의 기록 : 이러한 출생 당시의 정황과 어린 시절의 기억은 그가 직접 정리한 연보와 문집 기록을 통해 생생히 전해집니다.", "1-13": "1. 네다섯 살에 시작된 한글과 한자 깨치기 : 황윤석은 4~5세 무렵 할아버지와 아버지 무릎에서 글자를 배우기 시작해 또래보다 훨씬 빠른 속도로 《천자문》과 《동몽선습》을 통달했습니다.\n\n2. 일곱여덟 살에 시를 지은 소년 : 7~8세가 되었을 때는 이미 사서삼경의 기본 구절을 외우고 운자에 맞춰 한시를 지어내어 흥덕과 고부 일대에서 신동이 났다는 소문이 퍼졌습니다.\n\n3. 숫자 계산과 달력에 보인 천재성 : 특히 글공부뿐만 아니라 복잡한 날짜 계산(역법)이나 숫자를 다루는 산학(수학) 원리를 스스로 깨우쳐 어른들이 계산하지 못하는 문제를 척척 풀어냈습니다.\n\n4. 평생 독서광의 출발 : 어린 시절 서당에서 밤늦도록 책을 읽느라 부모님이 건강을 걱정해 등불을 감추어야 했을 만큼 학구열이 남달랐습니다.", "1-14": "1. 1738년(무오년) 10세 소년의 첫 기록 : 《이재난고》 제1책은 그가 열 살이 되던 1738년 정월 초하루부터 시작되며, 당시 배웠던 글공부 내용과 집안의 설날 차례 풍경, 날씨를 또박또박 적었습니다.\n\n2. 아버지의 권유와 스스로의 다짐 : 처음에는 아버지 황전이 그날 배운 글과 일과를 적어보라고 권유해 시작했으나, 곧 소년 황윤석 스스로 기록의 재미에 빠져 매일의 습관으로 자리 잡았습니다.\n\n3. 어린아이답지 않은 관찰력 : 10대 초반의 일기임에도 마을에 찾아온 손님의 이름, 그날 읽은 책의 쪽수, 계절에 따라 피는 꽃과 날씨가 어른의 글 못지않게 꼼꼼히 기록되어 있습니다.\n\n4. 세계적 기록 유산의 첫걸음 : 열 살 소년이 공책에 꾹꾹 눌러쓴 이 첫 줄이 훗날 54년간 단 하루도 끊기지 않는 인류사적 대기록의 출발점이 되었습니다.", "1-15": "1. 산과 들, 바다가 어우러진 풍요로운 고을 : 구수동(龜壽洞, 현 전북 고창군 성내면 조동리)은 거북이가 장수한다는 지명처럼 완만한 구릉과 기름진 논밭이 펼쳐진 평화로운 반촌(양반 마을)이었습니다.\n\n2. 변산반도와 정읍·고부를 잇는 교통 요지 : 북쪽으로는 부안 변산반도와 서해 바다가 가깝고 동쪽으로는 정읍·태인·전주로 통하는 길목이어서, 쌀과 해산물이 풍부하고 선비들의 왕래가 잦았습니다.\n\n3. 학문과 풍류가 살아있는 향촌 : 마을 안에는 평해황씨 문중의 서재와 정자가 자리 잡고 있었으며, 인근 고창·부안·정읍의 사족들과 시회(詩會)를 열고 책을 빌려 보기에 좋은 문화적 환경을 갖추고 있었습니다.\n\n4. 평생의 안식처 : 황윤석이 한양 유학과 관직 생활로 지칠 때마다 언제나 돌아와 재충전하고 저술에 몰두했던 정신적 고향이었습니다.", "1-16": "1. 시조와 고려 말·조선 초의 명문가 : 평해황씨는 고려 후기 시조 황온인 이래 조선 초기에 명재상과 학자들을 배출한 명문 사족이었습니다.\n\n2. 호남 흥덕으로의 입향(入鄕) : 조선 중기 전란과 정치적 변동을 거치면서 황윤석의 선대 조상들이 처가와 외가의 연고를 따라 전라도 흥덕현 구수동에 처음 자리를 잡고 세거(대대로 거주)하기 시작했습니다.\n\n3. 학문과 효행으로 다진 사족의 위상 : 구수동에 정착한 이후 조부 황응규와 부친 황전에 이르기까지 대대로 효행과 학문으로 향촌 사회의 신망을 얻으며 흥덕을 대표하는 유력 가문으로 성장했습니다.\n\n4. 300년 고문서의 보고 : 한 마을에서 수백 년간 터전을 지키며 문서를 보관해 온 덕분에 오늘날 한국학중앙연구원 장서각에 수천 점의 종가고문서가 고스란히 전해질 수 있었습니다.", "1-17": "1. 맏손자를 끔찍이 아낀 할아버지 : 조부 황응규(黃應奎)는 총명한 맏손자 황윤석을 어디를 가든 데리고 다니며 자랑했고, 맛있는 음식이 생기면 손자 입에 먼저 넣어줄 만큼 지극히 사랑했습니다.\n\n2. 첫 학문의 스승 : 어린 황윤석에게 처음 한자와 경서를 가르쳐 준 것도 할아버지였으며, 손자가 질문이 많아 밤늦게까지 귀찮게 물어도 늘 웃으며 이치를 설명해 주었습니다.\n\n3. 가문의 역사와 선비 정신 전수 : 할아버지는 옛 성현들의 이야기와 평해황씨 집안 조상들의 충절·효행담을 옛날이야기처럼 들려주며 어린 손자의 가슴에 사대부로서의 자긍심을 심어주었습니다.\n\n4. 평생 잊지 못한 조부의 은혜 : 황윤석은 노년이 되어서도 할아버지의 기일이나 생신이 되면 어린 시절 할아버지 품에서 공부하던 추억을 일기에 적으며 그리워했습니다.", "1-18": "1. 10대 후반에 맞이한 배필 창원정씨 : 황윤석은 당대 사족가의 관습에 따라 10대 후반의 나이에 인근 명문가인 창원정씨(昌原丁氏) 가문의 규수와 혼례를 올렸습니다.\n\n2. 설렘과 쑥스러움이 교차한 초행길 : 신랑이 말을 타고 신부 집으로 찾아가 예를 올리는 첫 행차(초행) 당시의 날씨, 혼례식 풍경, 처가 어른들과의 첫인사가 청년 시절 일기에 풋풋하게 적혀 있습니다.\n\n3. 어질고 부지런했던 종부(宗婦) : 부인 창원정씨는 시조부모와 시부모를 지성으로 모시고 넉넉지 않은 종가 살림과 수많은 손님 접대를 불평 한마디 없이 해낸 현숙한 내조자였습니다.\n\n4. 학문에만 전념할 수 있었던 버팀목 : 아내가 고향 구수동 살림을 든든하게 책임져 준 덕분에 황윤석은 마음 놓고 한양으로 올라가 과거 공부와 학문 연구에 매진할 수 있었습니다.", "1-19": "1. 무뚝뚝한 듯하면서도 깊었던 남편의 정 : 조선 시대 유학자답게 겉으로는 감정을 절제했으나, 한양에 올라가 있을 때면 고향에서 고생하는 아내의 건강을 걱정하며 안부를 챙기는 자상한 남편이었습니다.\n\n2. 아내가 병들었을 때의 간호 : 부인 창원정씨가 몸져누우면 황윤석은 직접 의서를 뒤져 증세를 살피고 약재를 구해다 달여 먹이며 밤잠을 설치고 간호했습니다.\n\n3. 1776년 아내의 별세와 통곡 : 1776년(48세) 아내가 먼저 세상을 떠나자 황윤석은 하늘이 무너지는 듯한 슬픔에 빠져 일기와 제문(제망실문)에 평생 고생만 시키고 호강 한 번 못 해준 미안함을 피눈물로 적었습니다.\n\n4. 매년 아내 무덤을 찾은 순애보 : 아내가 떠난 뒤에도 기일과 명절마다 아내의 묘소를 찾아가 생전의 추억을 되새기며 애틋한 추모시를 남겼습니다.", "1-20": "1. 과거 낙방이 가져온 20대의 고뇌 : 어릴 때 신동 소리를 들었던 황윤석이었기에, 20대 시절 과거 시험에서 몇 차례 고배를 마셨을 때는 자존심에 큰 상처를 입고 깊은 슬럼프를 겪었습니다.\n\n2. 과거 공부(거업)와 진짜 학문(위기지학) 사이의 갈등 : 시험 합격을 위해 정해진 모범답안 형식만 외워야 하는 과거 공부에 회의를 느끼고, 내가 진정으로 원하는 폭넓은 학문(성리학·과학·역사)을 하고 싶다는 청년기의 내적 방황이 일기에 생생히 나타납니다.\n\n3. 스승 김원행과의 만남으로 극복 : 이러한 방황은 31세 되던 1759년 진사시에 합격하고 당대의 대석학 미호 김원행을 스승으로 만나 학문의 큰길을 찾으면서 완전히 해소되었습니다.\n\n4. 공감 가는 청춘의 기록 : 250년 전 청년 선비도 오늘날의 취업 준비생처럼 미래에 대한 불안과 진로 고민으로 밤잠을 설쳤다는 사실이 큰 공감을 줍니다.", "1-21": "1. 기록과 계산에서는 초정밀 완벽주의자 : 54년간 하루도 빠짐없이 일기를 쓰고 쌀 한 되, 엽전 한 푼의 지출까지 기록하며 소수점 아래 수십 자리 수학 계산을 해낸 면모만 보면 엄청나게 꼼깐한 완벽주의자였습니다.\n\n2. 인간관계에서는 따뜻하고 호기심 많은 이야기꾼 : 그러나 실제 지인들과 어울릴 때는 세상만사에 호기심이 넘치고 재미있는 일화나 새로운 지식을 나누기 좋아하는 다정하고 유머러스한 성품이었습니다.\n\n3. 불의에는 타협하지 않는 강직함 : 평소에는 온화하다가도 관직에서 아전들의 부정부패를 보거나 학문적 원칙이 훼손될 때는 영의정 앞에서도 할 말을 다 하는 대쪽 같은 기개를 보였습니다.\n\n4. 입체적인 인간 황윤석 : 차가운 이성(과학·수학)과 따뜻한 감성(시문·가족애)을 함께 지녔던 매력적인 지식인이었습니다.", "1-22": "1. 새벽 닭이 울면 일어나는 아침형 인간 : 황윤석은 보통 새벽 4~5시경(인시·묘시)에 일어나 세수를 하고 의관을 정제한 뒤, 가장 먼저 조용히 앉아 마음을 가다듬고 경서를 읽으며 하루를 시작했습니다.\n\n2. 낮 시간의 독서·집필·손님 맞이 : 오전에는 책을 읽거나 《이수신편》 원고를 집필했고, 오후에는 찾아온 사우들과 학문을 토론하거나 편지를 쓰고 집안 살림을 돌보았습니다.\n\n3. 잠들기 전 등불 아래서 쓰는 일기 : 밤이 되면 호롱불(등잔불)을 켜고 그날 하루 동안 있었던 일, 만난 사람, 날씨, 읽은 책, 지출 내역을 《이재난고》에 꼼꼼히 기록한 뒤 자정 무렵에야 잠자리에 들었습니다.\n\n4. 하루 5~6시간 수면의 강철 체력 : 평생 하루 5~6시간만 자면서 깨어 있는 대부분의 시간을 독서와 기록에 바친 경이로운 자기관리의 달인이었습니다.", "1-23": "1. 단정하고 힘 있는 선비의 서체 : 황윤석은 평소 편지나 공식 문서, 시권을 쓸 때는 획이 반듯하고 기품 있는 해서(楷書)와 유려한 행서(行書)를 구사하여 당대에도 글씨를 잘 쓴다는 평을 들었습니다.\n\n2. 일기장에 가득한 빠른 흘림체(초서·행초) : 반면 매일 밤 방대한 분량을 빠르게 적어야 했던 일기 《이재난고》에는 속도를 높이기 위해 글자를 흘려 쓴 행초서(行草書)가 많이 사용되었습니다.\n\n3. 종이를 아끼기 위한 깨알 글씨(세자) : 특히 비싼 종이를 아끼려고 손톱보다 작은 깨알 같은 글씨로 여백 없이 빽빽하게 적어 넣었기 때문에, 오늘날 전문가들도 판독하는 데 상당한 공력이 들어갑니다.\n\n4. 감정에 따라 달라지는 필적 : 기쁜 날의 경쾌한 붓놀림과 부모상을 당했거나 파직당했을 때의 거칠고 떨리는 붓자국이 그대로 남아 있어 당시의 심리 상태까지 느껴집니다.", "1-24": "1. 풍류를 아는 적당한 음주(약주) : 황윤석은 폭음을 경계했으나, 반가운 벗이 찾아오거나 산천을 유람할 때면 막걸리(탁주)나 맑은 약주를 서너 잔 기울이며 시를 읊는 풍류를 무척 즐겼습니다.\n\n2. 조선 후기 대유행 기호품 담배(남초)와 차(茶) : 18세기 당시 전국적으로 유행하던 담배(남초·연초)에 관한 기록은 물론, 정신을 맑게 해주는 전통 차(茶)와 생강차·꿀물을 즐겨 마신 기록이 자주 등장합니다.\n\n3. 소식(小食)과 산책을 통한 건강 관리 : 평소 과식을 피하고 소박한 제철 나물과 생선을 즐겼으며, 눈과 허리가 피로할 때면 마을 뒷산이나 개울가를 거닐며 건강을 챙겼습니다.\n\n4. 의학 지식을 활용한 자가 건강법 : 자신이 직접 공부한 동의보감 등 의학 지식을 바탕으로 계절마다 기력을 보하는 탕약과 뜸으로 63세까지 왕성한 집필력을 유지했습니다.", "1-25": "1. 어질고 강단 있었던 어머니 강진김씨 : 어머니 강진김씨는 넉넉지 않은 살림 속에서도 자식들의 기를 살려주고 시부모 봉양과 집안 제사를 빈틈없이 챙긴 현모양처였습니다.\n\n2. 아들의 한양 유학을 뒷바라지한 정성 : 아들이 서울로 과거를 보러 갈 때면 밤새워 물레를 돌리고 바느질을 해 새 옷과 버선을 지어주었으며, 마른반찬과 비상금을 괴나리봇짐 깊숙이 넣어주었습니다.\n\n3. 효자 황윤석의 지극한 어버이 봉양 : 황윤석은 관직에 나가 받은 녹봉과 진귀한 음식(귤, 건어물, 비단 등)이 생기면 자신이 먼저 먹지 않고 반드시 인편을 통해 고향의 어머니께 올려보냈습니다.\n\n4. 1781년 모친상과 시묘살이의 효심 : 53세 때인 1781년 어머니가 별세하자 노년의 나이에도 불구하고 상례를 엄격히 지키며 어머니에 대한 절절한 그리움을 일기에 남겼습니다.", "1-26": "1. 2남 3녀의 든든한 큰오빠 : 황윤석은 남동생 황주석 외에도 세 명의 여동생(누이)을 둔 5남매의 맏오빠로서 동생들을 부모님 못지않게 살뜰히 챙겼습니다.\n\n2. 시집간 여동생들과의 왕래 : 여동생들이 인근 고을 사족 가문으로 시집간 뒤에도 명절이나 집안 행사가 있을 때마다 소식을 주고받았으며, 누이들이 아프다는 소식이 들리면 직접 약 처방을 적어 보냈습니다.\n\n3. 매제(매부)들과의 학문 교유 : 여동생들의 남편인 매제들과도 단순한 인척을 넘어 함께 시를 짓고 과거 시험 정보를 나누는 가까운 벗으로 지냈습니다.\n\n4. 재산 상속(분재)에 나타난 우애 : 종가고문서에 남아 있는 집안 문서들을 보면 출가한 딸과 누이들에게도 정성껏 몫을 챙겨주던 평해황씨 가문의 화목한 가풍을 확인할 수 있습니다.", "1-27": "1. 가학을 이어받은 아들 황수룡과 황두룡 : 장남 황수룡(黃秀龍)과 삼남 황두룡(黃斗龍)은 아버지의 엄격하고도 자상한 가르침 아래 성장하여 평해황씨 가문의 학통과 예법을 훌륭히 계승했습니다.\n\n2. 요절한 둘째 아들에 대한 아픔 : 황윤석에게도 젊어서 먼저 세상을 떠난 자식이 있었으며, 자식을 앞세운 아버지의 찢어지는 가슴과 눈물이 일기와 제문에 고스란히 기록되어 있습니다.\n\n3. 아버지의 유고(유품)를 목숨처럼 지킨 후손들 : 아들들과 손자 황재만 등은 아버지가 평생 쓴 일기 57책과 《이수신편》, 《이재유고》 초고를 한 장도 잃어버리지 않고 정성껏 정서(깨끗이 베껴 씀)하여 보관했습니다.\n\n4. 대를 이은 효심의 결실 : 자녀들의 이러한 헌신 덕분에 사후 38년 만인 1829년에 문집 《이재유고》 목판본이 세상에 빛을 볼 수 있었습니다.", "1-28": "1. 1759년(31세) 진사시 합격의 감격 : 수차례의 도전 끝에 마침내 1759년 사마시(진사시)에 합격하여 백패(합격증)를 받고 고향 구수동에 금의환향해 부모님께 절을 올리던 날이 청년기 최고의 기쁨이었습니다.\n\n2. 1778년(50세) 정조 임금 앞 선정전 독대 : 중앙 관원으로서 창덕궁 선정전에 입시하여 학자 군주 정조와 직접 마주 앉아 학문과 직무를 문답하고 임금의 칭찬을 들었던 날을 관직 생활 최고의 영광으로 꼽았습니다.\n\n3. 평생 대작 《이수신편》의 탈고 : 수십 년간 자료를 모으고 계산하여 23권에 달하는 자연과학·인문학 백과사전 《이수신편》의 마지막 권을 완성했을 때 학자로서 더할 나위 없는 보람을 느꼈습니다.\n\n4. 손자 탄생과 가문의 번영 : 노년에 똑똑한 손자들이 태어나 재롱을 부리고 글 읽는 소리가 사랑채에 울려 퍼질 때 가장 평온한 행복을 기록했습니다.", "1-29": "1. 대과(문과) 급제를 이루지 못한 아쉬움 : 뛰어난 학식에도 불구하고 끝내 문과(대과)에 급제하지 못해 부모님 생전에 더 높은 관직으로 호강시켜 드리지 못한 것을 늘 마음의 빚으로 여겼습니다.\n\n2. 가족들의 병구완과 이별의 아픔 : 1771년 부친 황전, 1776년 아내 창원정씨, 1781년 모친 강진김씨가 차례로 세상을 떠났을 때, 자신이 의학을 공부했음에도 사랑하는 가족의 수명을 더 늘리지 못했다고 자책하며 슬퍼했습니다.\n\n3. 목천·전의현감 파직 사건의 울분 : 백성을 위해 청렴하게 일했음에도 아전들의 무고와 권세가들의 횡포로 두 번이나 지방관에서 파직당했을 때는 부패한 정치 현실에 깊은 환멸과 통한을 느꼈습니다.\n\n4. 아픔을 승화시킨 기록 문학 : 그러나 이러한 좌절과 슬픔조차 포기하지 않고 일기와 〈백교설〉 같은 명문장으로 남김으로써 시대를 넘어선 불멸의 이름을 얻었습니다.", "1-30": "1. 1791년(정조 15) 4월, 별세 사흘 전까지의 일기 : 황윤석은 63세로 세상을 떠나기 불과 사흘 전인 1791년 음력 4월 말까지도 병석에서 떨리는 손으로 붓을 들어 그날의 날씨와 문병 온 사람들의 이름을 기록했습니다.\n\n2. 후손들에게 남긴 당부 : 임종을 앞두고 아들들과 문인들에게 화려한 장례를 치르지 말고 검소하게 할 것과, 평생 모아둔 서적과 집필 원고(이재난고·이수신편)를 잘 보전하여 학문을 이어갈 것을 유언으로 남겼습니다.\n\n3. 호남 유림의 애도와 제문 : 그가 타계하자 호남과 충청, 한양의 수많은 학자들과 제자들이 구수동으로 몰려와 큰 학자의 별세를 애통해하며 수십 편의 제문과 만사를 바쳤습니다.\n\n4. 끝이 아닌 새로운 시작 : 붓을 놓는 마지막 순간까지 기록을 멈추지 않았던 그의 삶은 230년이 지난 오늘날 디지털 AI 챗봇으로 다시 살아나 우리에게 말을 건네고 있습니다.", "1-31": "1. 15세 전후에 치른 어른의 통과의례 관례(冠禮) : 황윤석은 10대 중반에 집안 어른들과 학덕 높은 빈객(손님)을 모시고 땋았던 머리를 올려 상투를 틀고 갓을 쓰는 성년식(관례)을 올렸습니다.\n\n2. 새 이름 '영수(永叟)'를 받은 날 : 관례 자리에서 어른들로부터 아명(어릴 때 이름) 대신 평생 사용할 자(字)인 '영수(永叟)'를 부여받고, 어른으로서의 책임감을 가슴에 새겼습니다.\n\n3. 일기에 적힌 설렘과 다짐 : 비로소 어른의 의관을 갖추고 사당과 부모님께 큰절을 올리며, 이제부터는 어린아이의 장난기를 버리고 성현의 학문에 매진하겠다고 다짐했습니다.\n\n4. 전통 예법의 모범 : 훗날 그는 자신의 아들과 손자들의 관례를 치를 때도 고례(주자가례)의 절차를 꼼꼼히 고증하여 기록으로 남겼습니다.", "1-32": "1. 인근 명문 사족이었던 처가 창원정씨 : 부인 창원정씨의 친정은 고창·흥덕 일대에서 학문과 가풍으로 이름난 사족 가문으로, 어린 사위 황윤석의 비범한 학문적 재능을 일찌감치 알아보았습니다.\n\n2. 사위를 아낀 장인어른과 처남들 : 황윤석이 처가에 들를 때마다 장인과 처남들은 귀한 손님처럼 극진히 대접했으며, 조용히 공부할 수 있도록 서재와 서적을 아낌없이 내어주었습니다.\n\n3. 부인 사후에도 이어진 처가와의 인연 : 1776년 아내가 먼저 세상을 떠난 뒤에도 황윤석은 처가 어른들의 안부를 꾸준히 챙기고 처남들과 서신을 주고받으며 변함없는의리를 지켰습니다.\n\n4. 호남 사족의 혼맥 네트워크 : 종가고문서와 일기를 통해 18세기 호남 양반 가문들이 혼인을 통해 어떻게 학문적·경제적 유대를 맺었는지 잘 드러납니다.", "1-33": "1. 학문적 전통이 깊었던 외가 강진김씨 : 어머니 강진김씨의 친정 역시 호남의 유서 깊은 선비 가문으로, 황윤석은 어린 시절 외가에 머물며 외할아버지와 외삼촌들로부터 많은 책과 이야기를 접했습니다.\n\n2. 외삼촌들과의 따뜻한 교유 : 외삼촌들은 조카 황윤석이 과거 시험을 준비하거나 한양에 올라갈 때 노자(여비)와 격려 편지를 보내주며 물심양면으로 응원했습니다.\n\n3. 외가 친척들의 대소사 기록 : 일기에는 외가 어른들의 생신, 과거 합격, 혼사와 상사 소식이 친가 못지않게 자세하게 기록되어 있어 외가와의 끈끈한 정을 보여줍니다.\n\n4. 양측 친족 중심의 가족 문화 : 부계 친족뿐 아니라 모계(외가)와 처가까지 두루 아우르며 살아갔던 18세기 사족의 실제 가족 관계를 확인할 수 있습니다.", "1-34": "1. 성실과 무실(務實)의 철학 : 황윤석이 평생 가장 중시한 좌우명은 헛된 명예를 쫓지 않고 실질적인 이치와 실천에 힘쓴다는 '무실(務實)'과 하루도 게으르지 않는 '자강불식(自彊不息)'이었습니다.\n\n2. 말과 행동을 삼가는 신독(愼獨) : 남이 보지 않는 혼자만의 공간에서도 몸가짐을 바르게 하고, 특히 당쟁이 치열한 시대에 말을 아끼고 기록으로만 진실을 남긴다는 원칙을 지켰습니다.\n\n3. 오늘 할 공부를 내일로 미루지 않기 : 아무리 피곤하고 바쁜 날이라도 그날 정한 독서 분량과 일기 쓰기만큼은 반드시 마치고 잠자리에 드는 철저한 자기 규율을 실천했습니다.\n\n4. 57책 대일기를 만든 원동력 : 이러한 좌우명이 있었기에 반세기 넘는 세월 동안 단 하루의 빈틈도 없는 대기록을 완성할 수 있었습니다.", "1-35": "1. 학문의 최고 사표 주자(朱子)와 율곡 이이 : 성리학자로서 그는 송나라의 주희(주자)와 조선의 율곡 이이(李珥)를 학문과 수양의 가장 큰 스승으로 삼아 그들의 저술을 글자 하나까지 깊이 연구했습니다.\n\n2. 박학다식한 백과전서파 학자들에 대한 동경 : 동시에 천문·수학·음운·지리 등 세상의 모든 이치를 탐구했던 소강절(소옹), 서경덕, 김석문 같은 박학한 학자들의 탐구 정신을 깊이 흠모했습니다.\n\n3. 현실의 스승 미호 김원행 : 당대 인물 중에서는 자신의 스승인 석실서원의 미호 김원행을 학덕과 인품을 겸비한 참된 스승으로 평생 우러러보았습니다.\n\n4. 도학과 실학의 조화 : 정통 성리학자의 도덕성과 과학자의 실증적 탐구열을 하나로 합치려 했던 그의 이상이 롤모델에서도 그대로 드러납니다.", "1-36": "1. 책으로 가득 찬 구수동 사랑채 : 황윤석의 서재에는 사서삼경과 역사서는 물론, 천문도, 산학서(수학책), 운서(발음 사전), 의서, 그리고 매년 묶어둔 일기책들이 천장까지 빼곡히 쌓여 있었습니다.\n\n2. 책상 위의 필수품들 : 문갑 위에는 벼루와 붓, 먹, 메모용 파지 묶음, 계산용 대나무 산가지(산목), 그리고 노년에 애용하던 수정 돋보기안경(애체)이 늘 정돈되어 있었습니다.\n\n3. 창밖의 자연과 어우러진 공간 : 마당에는 매화와 국화, 대나무가 심어져 있어 독서에 지칠 때면 창문을 열어 계절의 변화를 감상하고 시를 읊었습니다.\n\n4. 호남 지식인들의 사랑방 : 이곳은 혼자 공부하는 방을 넘어 호남 각지의 선비들과 제자들이 찾아와 밤새 학문을 토론하던 지역 문화의 중심지였습니다.", "1-37": "1. 600리 한양 길을 함께한 조랑말 : 고창에서 한양까지 험한 길을 오르내릴 때 황윤석을 태우고 다닌 말(마필)은 단순한 이동 수단이 아니라 생사고락을 함께한 동반자였습니다.\n\n2. 말의 건강과 먹이(마초)까지 챙긴 일기 : 일기에는 주막에 도착할 때마다 말이 다리를 절지는 않는지, 말 편자(징)가 닳지 않았는지 살피고 따뜻한 콩죽(마죽)을 먹인 기록이 세세히 나옵니다.\n\n3. 집안의 가축과 자연 생물 관찰 : 본가에서 기르던 개가 새끼를 낳은 일, 닭이 우는 시각, 봄마다 처마 밑에 찾아오는 제비와 두견새 소리까지 따뜻한 시선으로 기록했습니다.\n\n4. 생명을 아끼는 마음 : 작은 동물과 식물의 변화까지 놓치지 않고 적어둔 대목에서 자연과 더불어 살았던 선비의 온기가 느껴집니다.", "1-38": "1. 문중 전체가 모이는 종가의 큰 행사 : 평해황씨 구수동 종손이었던 황윤석의 집에는 설날·추석 차례와 4대 조상님의 기제사 때마다 인근 마을의 일가친척 수십 명이 한자리에 모였습니다.\n\n2. 며칠 전부터 시작되는 제수 준비 : 제사를 앞두고 장터에서 어물(생선)과 고기, 과일을 사 오고 술을 빚으며 집안을 청소하는 과정과 비용이 일기에 자세히 적혀 있습니다.\n\n3. 제사 후의 음복과 문중 회의 : 제사가 끝난 뒤에는 친척들이 사랑채에 둘러앉아 제사 음식을 나누어 먹으며(음복), 집안의 족보 수단, 선산 관리, 자녀 교육 문제를 상의했습니다.\n\n4. 종손의 무거운 책임감 : 넉넉지 않은 살림에도 1년에十여 차례 돌아오는 제사와 손님 접대를 정성껏 치러낸 종손과 종부의 노고를 엿볼 수 있습니다.", "1-39": "1. 명리학(사주)과 주역의 원리 탐구 : 황윤석은 당대 지식인들처럼 《주역》의 점법과 사주명리(성명학)의 수학적·음양오행적 원리에 대해서도 해박한 지식을 가지고 있었습니다.\n\n2. 자신의 사주에 대한 성찰 : 과거 시험에 거듭 낙방하거나 관직에서 파직당했을 때 자신의 사주 운세를 돌아보며 '벼슬운은 박하나 학문과 저술로 이름을 남길 팔자'라고 스스로를 다독이기도 했습니다.\n\n3. 맹신보다 수양을 앞세운 태도 : 그러나 점술가나 관상가의 말에 휘둘리지 않고, 운명이란 결국 자신이 얼마나 바르게 수양하고 노력하느냐에 달렸다는 유학자의 주체적 태도를 견지했습니다.\n\n4. 솔직한 인간적 고백 : 때로는 길흉화복 앞에서 흔들리면서도 이성으로 중심을 잡으려 했던 인간적인 모습이 일기 속에 솔직히 담겨 있습니다.", "1-40": "1. 어릴 적부터 함께 자란 고향 사우들 : 구수동과 흥덕·고부·부안 일대에서 어린 시절부터 함께 서당에 다니며 시를 짓고 과거 공부를 했던 고향 벗들은 평생의 든든한 버팀목이었습니다.\n\n2. 한양 하숙방의 동고동락 : 젊은 시절 한양에 올라가 비좁은 하숙방에서 함께 밥을 해 먹고 시험 정보를 나누며 타향살이의 외로움을 달랬던 벗들과의 일화가 일기에 가득합니다.\n\n3. 노년까지 이어진 시회(詩會)와 문안 : 늙어서 고향에 돌아온 뒤에도 걸어서 오갈 수 있는 이웃 고을의 옛 친구들과 계절마다 모임을 갖고, 서로 아플 때면 약을 보내주며 우정을 지켰습니다.\n\n4. 먼저 떠난 벗들을 위한 눈물의 만사(輓詞) : 평생 함께한 벗들이 하나둘 세상을 떠날 때마다 황윤석은 지난 추억을 되새기며 애절한 만사와 제문을 지어 마지막 길을 배웅했습니다.", "1-41": "1. 당대 지성들의 산실 석실서원(石室書院) : 경기도 양주 석실서원의 미호 김원행 문하에는 서울과 지방의 가장 뛰어난 영재들이 모여들어 학문적 자극을 주고받았습니다.\n\n2. 경향 각지 동문들과의 평생 교류 : 황윤석은 이곳에서 만난 동문들과 성리학의 심성론(호락논쟁)부터 경세학까지 깊이 있는 토론을 나누며 전국적인 학술 인맥을 형성했습니다.\n\n3. 고향으로 돌아간 뒤의 서신 토론(문목) : 전라도로 내려온 뒤에도 한양과 충청도의 동문들과 끊임없이 편지(서간)를 주고받으며 학문적 의문점을 묻고 답했습니다.\n\n4. 스승 사후 문집 간행과 추모 사업 동참 : 스승 김원행이 별세하자 동문들과 힘을 합쳐 스승의 유고를 정리하고 행장을 다듬는 일에 적극 참여했습니다.", "1-42": "1. 첫인상과 말씨, 학식의 깊이를 관찰 : 황윤석은 낯선 선비나 관원을 처음 만나면 그 사람의 용모와 몸가짐, 사용하는 어휘와 억양(방언), 그리고 독서의 깊이를 예리하게 살폈습니다.\n\n2. 가문 배경과 인맥의 꼼꼼한 기록 : 일기에는 오늘 처음 만난 누구는 어느 고을 출신이고 본관은 어디며 누구의 후손·제자인지 인물 정보가 사전처럼 정확하게 기록되어 있습니다.\n\n3. 신분을 가리지 않은 열린 태도 : 상대가 비록 지위가 낮은 중인(역관·산원)이나 시골의 무명 선비라 할지라도, 수학이나 천문·의학 등 한 분야에 뛰어난 식견이 있으면 겸손하게 배우고 기록했습니다.\n\n4. 18세기 인물 백과사전 : 그의 이러한 기록 습관 덕분에 《이재난고》에는 무려 수천 명에 달하는 조선 후기 인물들의 생생한 프로필이 살아 숨 쉬고 있습니다.", "1-43": "1. 일기장에 솔직하게 털어놓는 글쓰기 치유 : 억울한 모함을 받거나 무례한 사람을 만나 속이 상한 날이면, 밤에 일기장을 펼쳐 그 사건의 전말과 자신의 분노·답답함을 숨김없이 적어 내려가며 감정을 정리했습니다.\n\n2. 산책과 시 짓기로 승화 : 마음이 어지러울 때는 고요히 눈을 감고 앉아 호흡을 가다듬는 정좌(靜坐)를 하거나, 자연 속을 거닐며 울분을 시(詩)로 읊어내어 평정심을 되찾았습니다.\n\n3. 고전 속 성현들의 고난 되새기기 : 옛 성현이나 충신들이 겪었던 더 큰 시련에 관한 책을 읽으며 자신의 어려움을 객관적으로 바라보려 노력했습니다.\n\n4. 기록이 가진 치유의 힘 : 화를 남에게 함부로 쏟아붓는 대신 기록과 학문으로 승화시켰던 성숙한 감정 관리법을 보여줍니다.", "1-44": "1. 일상이 곧 시(詩)였던 선비의 삶 : 황윤석은 아름다운 산천을 유람할 때나 계절의 첫꽃이 피었을 때는 물론, 한양 길 주막에서 밤비를 들을 때, 친구와 이별할 때, 심지어 치통으로 잠 못 이룰 때도 시를 지었습니다.\n\n2. 친구들과 주고받은 차운시(次韻詩) : 사우들과 모이면 같은 운자(끝 글자 발음)를 써서 즉석에서 시를 주고받는 차운시를 즐겼으며, 편지 말미에도 늘 안부 시를 덧붙였습니다.\n\n3. 역사와 과학까지 담아낸 영사시(詠史詩) : 단순한 서정시뿐만 아니라 우리나라와 중국의 역사적 사건, 천문 현상, 지방의 풍속을 읊은 학술적인 장편 시도 다수 남겼습니다.\n\n4. 《이재유고》와 《이재난고》의 문학 세계 : 이렇게 평생 지은 수천 수의 시는 그의 문집과 일기 곳곳에 보석처럼 수록되어 18세기 한문학의 풍성한 결실을 보여줍니다.", "1-45": "1. 거문고(금·琴)와 율려에 대한 깊은 조예 : 황윤석은 음악 이론(율려학)의 대가였을 뿐 아니라, 실제로 거문고의 줄과 괘의 위치를 수학적으로 조율하고 옛 악보를 연구하며 선비의 풍류를 즐겼습니다.\n\n2. 서예와 비석 글씨(금석학) 감상 : 옛 명필들의 서첩(법첩)과 전국의 오래된 비석 탁본을 수집·감상하기를 좋아했으며, 글씨의 필획과 서체 변천사에 대해서도 수준 높은 비평을 남겼습니다.\n\n3. 지도와 천문도 직접 그리기 : 회화(산수화) 자체보다도 정밀한 천문 성좌도, 지리 지도, 기하학 도형, 고대 복식과 기물 그림을 직접 자와 붓으로 세밀하게 작도하는 데 탁월한 솜씨를 보였습니다.\n\n4. 지성과 감성의 조화 : 예(禮)와 악(樂), 서(書)와 수(數)라는 선비의 육예(六藝)를 두루 체득한 전인적 교양인이었습니다.", "1-46": "1. 구수동으로 모여든 호남의 청년 학도들 : 황윤석이 관직을 내려놓고 고향 구수동에 완전히 자리 잡은 50대 후반 이후, 그의 높은 학식을 배우려는 흥덕·고창·부안·정읍·전주 일대의 젊은 유생들이 줄지어 찾아왔습니다.\n\n2. 문하생 개개인의 눈높이에 맞춘 교육 : 그는 기초 경학을 배우려는 소년에게는 사서삼경을, 수학과 역법에 관심 있는 제자에게는 산학과 천문을 맞춤형으로 가르치며 후학을 양성했습니다.\n\n3. 스승의 저술 정리를 도운 문인들 : 제자들은 노년의 스승을 도와 방대한 《이수신편》과 시문 원고를 정서하고 교정하는 작업에 기꺼이 힘을 보탰습니다.\n\n4. 호남 실학과 도학의 전수 : 그가 길러낸 제자들과 후손들은 19세기 호남 유림 사회에서 이재 학풍을 이어가는 든든한 뿌리가 되었습니다.", "1-47": "1. 1791년 고향 인근 선산에 안장 : 황윤석이 1791년 63세로 별세하자 가족과 문인들은 예법에 따라 장례를 치르고 고향 흥덕의 선영 인근에 묘소를 마련했습니다.\n\n2. 제자와 후손들이 작성한 가장과 행장 : 그의 평생 행적과 학문적 업적을 정리한 가장(家狀)과 행장, 묘갈명에는 54년 일기와 《이수신편》을 남긴 당대 최고의 박학군자라는 찬사가 담겼습니다.\n\n3. 유림들의 끊이지 않는 참배 : 사후에도 호남 유림들은 그의 묘소와 구수동 종가를 찾아 참배하며 향촌의 큰 스승으로 기렸습니다.\n\n4. 고창 지역의 대표 역사 문화 유적 : 오늘날에도 고창군 성내면 조동리(구수동) 일대에는 평해황씨 종택과 그의 자취가 소중한 지역 문화유산으로 보존되어 있습니다.", "1-48": "1. 1909년 종가 화재 속의 필사적 구출 : 구한말인 1909년 의병 전쟁의 와중에 일본군에 의해 구수동 종택이 불타는 절체절명의 위기가 닥쳤으나, 후손들이 불길 속에서 《이재난고》 57책과 고문서 궤짝을 먼저 안고 뛰어나와 기적적으로 구해냈습니다.\n\n2. 일제강점기 1942년 석인본 문집 간행 : 일제 말기의 어려운 여건 속에서도 후손 황병두 등은 선조의 학문이 인멸될까 염려하여 1942년 원집과 속집을 합친 《이재유고》 석인본을 간행해 전국에 배포했습니다.\n\n3. 6·25 전쟁과 현대의 영구 보존 결단 : 한국전쟁 때도 땅속과 깊숙한 곳에 숨겨 지켜낸 유물들을, 현대에 이르러 학계의 연구와 안전한 영구 보존을 위해 한국학중앙연구원 장서각 등에 기탁·제공했습니다.\n\n4. 후손들의 위대한 문화유산 수호 정신 : 230년 동안 화재와 전쟁을 뚫고 문서를 지켜낸 평해황씨 후손들의 정성이 없었다면 우리는 이 보물 같은 일기를 만날 수 없었을 것입니다.", "1-49": "1. 최고의 데이터 사이언티스트이자 백과사전 편집장 : 54년간 매일의 날씨·물가·사건을 정량화해 기록하고 수학과 천문을 통합한 그는 오늘날 태어났다면 빅데이터 분석가나 위키백과 총괄 편집장이 되었을 것입니다.\n\n2. 100만 구독자를 거느린 지식 유튜버·파워 블로거 : 세상의 모든 신기한 사물(자명종, 안경, 방언)을 직접 체험하고 맛깔나는 글로 매일 업로드하는 성실함은 현대의 일류 크리에이터 그 자체입니다.\n\n3. 융합 과학기술원(KAIST) 석좌교수 : 인문학(언어학·역사학)과 자연과학(수학·천문학·음향학)의 경계를 자유자재로 넘나든 통섭형 천재로서 융합 학계를 이끌었을 것입니다.\n\n4. 시대를 앞서간 근대적 지식인 : 18세기 조선이라는 시공간 속에서 이미 현대 정보화 사회의 아카이빙 정신을 완벽히 구현한 인물입니다.", "1-50": "1. 왕조실록에는 없는 진짜 사람들의 숨결 : 국왕과 대신들 중심의 딱딱한 공식 역사가 아니라, 밥을 먹고 병을 앓고 시험에 떨어져 울고 웃던 18세기 보통 사람들과 선비의 생생한 일상이 살아 있기 때문입니다.\n\n2. 세계적으로 유례가 드문 54년 연속 개인 일기 : 한 인간이 10살 어린아이부터 63세 노인이 될 때까지 반세기 넘는 세월을 단 하루도 빠뜨리지 않고 기록한 것은 세계 기록사에서도 기적에 가까운 유산입니다.\n\n3. 조선 후기 모든 분야를 망라한 타임캡슐 : 물가, 기후, 의약, 음식, 방언, 과학, 정치가 한 권의 거대한 타임캡슐처럼 들어 있어 어떤 분야의 독자가 읽어도 흥미진진한 이야기를 만날 수 있습니다.\n\n4. 오늘의 나를 돌아보게 하는 거울 : 250년 전 치열하게 공부하고 성실하게 하루를 기록했던 황윤석의 삶을 통해 오늘을 살아가는 우리의 하루를 따뜻하게 돌아보게 해줍니다.", "2-11": "1. 23권 20책의 거대한 개인 백과사전 : 《이수신편(理藪新編)》은 황윤석이 젊은 시절부터 노년까지 평생에 걸쳐 천문, 역법, 산학(수학), 율려(음악), 도량형, 지리, 역사, 음운학을 집대성한 18세기 최고의 백과전서입니다.\n\n2. 우주의 원리 '이(理)'와 수학적 법칙 '수(藪·數)' : 제목의 '이수'는 눈에 보이지 않는 성리학적 도덕 원리(理)와 눈에 보이는 자연과학·수학적 수치(數)가 결코 둘이 아니라 하나라는 융합 철학을 담고 있습니다.\n\n3. 혼자 힘으로 일구어낸 지식의 탑 : 국가 기관이 여러 학자를 동원해 만든 책이 아니라, 지방의 한 선비가 수백 권의 동서양 서적을 직접 읽고 계산하며 홀로 완성했다는 점에서 학술사적 가치가 놀랍습니다.\n\n4. 조선 후기 실학의 정수 : 인문학과 자연과학을 한 권의 체계 안에 완벽히 녹여낸 조선 후기 지식 문화의 기념비적 저작입니다.", "2-12": "1. 서양 과학서를 통한 지구설(地球說) 수용 : 황윤석은 마테오 리치 등 서양 선교사들이 한문으로 번역한 천문·지리서를 깊이 연구하여 땅이 네모난 것이 아니라 둥근 구체(지구)라는 사실을 명확히 이해하고 있었습니다.\n\n2. 홍대용·김석문의 지전설(地轉說) 탐구 : 나아가 조선의 학자 김석문의 《역학도해》와 벗 홍대용과의 대화를 통해 지구가 하루에 한 바퀴씩 자전한다는 파격적인 지전설(지구 자전설)을 진지하게 검토하고 기록했습니다.\n\n3. 위도와 경도에 따른 시간차 계산 : 땅이 둥글기 때문에 베이징(연경)과 한양, 그리고 전라도 고창의 해 뜨는 시각과 북극성 고도가 조금씩 달라진다는 사실을 수학적으로 계산해 냈습니다.\n\n4. 열린 우주관 : 성리학적 세계관에 머물지 않고 우주의 실제 구조를 과학적으로 파악하려 한 선구적 지성이었습니다.", "2-13": "1. 천리 밖을 보는 안경 천리경(망원경) : 황윤석은 서양에서 청나라를 거쳐 조선에 들어온 망원경(천리경·원경)의 렌즈 굴절 원리와 이를 통해 관측한 달 표면·목성 위성 이야기에 깊은 학문적 호기심을 보였습니다.\n\n2. 세계지도(곤여만국전도)와 5대양 6대주 : 중국 중심의 좁은 지도에서 벗어나 아시아, 유럽, 아프리카, 아메리카 대륙이 그려진 서양식 세계지도를 접하며 세계의 광활함을 일기와 저술에 상세히 메모했습니다.\n\n3. 자명종·안경·화기 등 서양 기물에 대한 기록 : 기회가 닿을 때마다 한양의 명사들이 소장한 서양 시계, 유리그릇, 정밀 관측 기구들을 직접 눈으로 확인하고 그 작동 원리를 분석했습니다.\n\n4. 호기심이 만든 과학 기록 : 새로운 문물을 오랑캐의 요술로 치부하지 않고 정밀한 물리 법칙의 산물로 바라본 태도가 돋보입니다.", "2-14": "1. 조선 시대 최고 베스트셀러였던 책력(달력) : 매년 동지 무렵 관상감에서 만들어 배포하는 새해 달력(시헌력)은 농사철과 절기, 길흉일을 알려주는 필수품이었습니다.\n\n2. 큰달(30일)과 작은달(29일), 절기 시각의 검산 : 황윤석은 새 달력을 받아 들면 그냥 보는 데 그치지 않고, 자신의 수학·역법 공식으로 그해의 24절기 입기 시각과 매달의 대소(30일·29일)를 직접 계산해 달력과 맞는지 검증했습니다.\n\n3. 중국 역법과 조선 역법의 시차 분석 : 베이징 기준 시간과 한양 기준 시간의 경도 차이로 인해 절기 시각이 몇 분 달라지는지까지 꼼꼼하게 따져 일기에 적어두었습니다.\n\n4. 달력 하나도 그냥 넘기지 않은 학구열 : 일상 속 달력 한 장에서도 천체 운동의 수학적 정밀성을 확인하며 즐거워했던 과학자의 모습입니다.", "2-15": "1. 19년에 7번 윤달을 넣는 장법(章法) : 달이 차고 기우는 음력 한 달(약 29.53일)을 12번 합치면 약 354일이 되어, 지구가 태양을 도는 1년(약 365.24일)보다 매년 약 11일이 모자라게 됩니다.\n\n2. 계절과 달력을 맞추는 수학 공식 : 이 오차를 방치하면 한여름에 설날이 오는 혼란이 생기므로, 19년 동안 정확히 7번의 윤달(더해 주는 달)을 넣으면 태양력과 태음력이 거의 일치한다는 고대 역법 수식을《이수신편》에 명쾌하게 풀이했습니다.\n\n3. 중기(中氣)가 없는 달을 윤달로 지정 : 나아가 서양 시헌력 도입 이후 태양이 움직이는 속도에 따라 24절기 중 짝수 절기(중기)가 들지 않는 달을 윤달로 정하는 정밀 계산법을 상세히 예시했습니다.\n\n4. 생활 속의 천문 수학 : 조상들의 지혜가 담긴 음력과 윤달이 얼마나 치밀한 수학 계산의 산물인지 잘 보여줍니다.", "2-16": "1. 고대의 원주율 '지름 1에 둘레 3(경일위삼)' 비판 : 옛 산학서에서는 계산을 쉽게 하려고 원주율($\\pi$)을 단순히 3으로 잡았으나, 황윤석은 이 방식이 큰 오차를 낸다는 점을 정확히 지적했습니다.\n\n2. 조충지의 밀률(355/113)과 서양 원주율 비교 : 그는 남북조 시대 수학자 조충지가 구한 3.1415926...의 정밀한 수치와 서양 기하학서(기하원본 등)를 통해 전해진 소수점 수십 자리의 원주율을 《이수신편》에 나란히 수록하고 비교했습니다.\n\n3. 원 안에 정다각형을 쪼개 넣는 할원술(割圓術) : 원 안에 정육각형, 정십이각형 등 다각형을 끝없이 잘게 쪼개어 원의 실제 둘레에 가까워지는 극한의 원리를 그림과 숫자로 설명했습니다.\n\n4. 정밀 과학의 토대 : 이렇게 구한 정확한 원주율은 천문 관측 기구의 둥근 고리 제작과 곡식 되·말(원통형 그릇)의 부피 계산에 그대로 활용되었습니다.", "2-17": "1. 가로·세로·대각선 합이 모두 15가 되는 구궁수(마방진) : 1부터 9까지의 숫자를 3x3 칸에 배열해 어느 방향으로 더해도 합이 15가 되는 기본 마방진(낙서 구궁)부터 시작해, 4x4, 5x5, 최대 10x10에 이르는 고차원 마방진을 직접 연구했습니다.\n\n2. 원형 마방진과 입체 배열 : 사각형 배열뿐 아니라 동심원과 방사형 직선 위에 숫자들을 배치해 합이 같아지게 만드는 복잡한 도형 수열까지 막힘없이 풀어냈습니다.\n\n3. 수학 퍼즐과 역학(易學)의 결합 : 이를 단순한 숫자 놀이로 보지 않고 우주 만물의 균형과 조화를 보여주는 수리 철학의 모델로 해석하여 《이수신편》에 도표로 남겼습니다.\n\n4. 최석정의 《구수략》을 잇는 업적 : 조선 숙종 대 영의정 최석정의 마방진 연구와 함께 18세기 조선 조합 수학의 높은 수준을 증명하는 자료입니다.", "2-18": "1. 파스칼보다 앞선 동양의 이항계수 삼각형(개방작법본원도) : 서양에서 파스칼의 삼각형으로 불리는 거듭제곱 계수 배열표가 동양 산학서(산학계몽 등)에서는 이미 13세기부터 사용되었으며, 황윤석은 이를 완벽히 분석해 제곱근·세제곱근 풀이에 적용했습니다.\n\n2. 직각삼각형의 구고현(勾股弦) 정리 : 서양의 피타고라스 정리($a^2 + b^2 = c^2$)에 해당하는 동양의 구고술(밑변 구, 높이 고, 빗변 현)을 활용해 산의 높이나 강 건너편까지의 거리를 측량하는 다양한 응용 문제를 수록했습니다.\n\n3. 연립방정식과 급수 계산 : 여러 개의 미지수가 섞인 방정식(천원술·방정술)과 등차·등비수열의 합을 구하는 공식까지 체계적으로 정리했습니다.\n\n4. 동서양 수학의 만남 : 전통 동양 산학의 강점과 서양에서 새로 들어온 비례·기하학을 한자리에 회통시킨 수학 교과서와 같습니다.", "2-19": "1. 세종 대 과학 기구들의 제도와 치수 복원 : 황윤석은 세종대왕 시절 장영실과 이천 등이 제작했던 자격루(자동 물시계), 앙부일구(오목 해시계), 간이의, 혼천의의 구조와 설계 치수를 문헌을 통해 정밀하게 고증했습니다.\n\n2. 톱니바퀴와 부력(살수·수차)의 물리학 : 물이 일정하게 흘러내려 살대(잣대)를 띄우고 구슬을 굴려 종과 북을 치게 만드는 자동 시보 장치의 기계적 메커니즘을 단계별로 설명했습니다.\n\n3. 서양 태엽 시계(자명종)와의 비교 : 물의 힘으로 움직이는 전통 수격식 시계와 철제 태엽·톱니바퀴로 움직이는 서양식 자명종의 장단점을 비교하며 시계 기술의 발전을 통찰했습니다.\n\n4. 과학사 아카이브 : 조선 전기의 찬란했던 과학 기구 제작 기술이 18세기 실학자들에게 어떻게 계승·연구되었는지 보여줍니다.", "2-20": "1. 54년 동안 하루도 빠짐없는 기상 관측 일지 : 황윤석은 《이재난고》에서 매일 날짜 옆에 맑음(晴), 흐림(陰), 비(雨), 눈(雪), 바람(風), 안개(霧), 서리(霜)를 기상청 일지처럼 정확히 기록했습니다.\n\n2. 호미와 쟁기 날이 젖은 깊이로 잰 강우량 : 비가 온 날에는 당시 조선의 전통 방식에 따라 빗물이 땅속으로 스며든 깊이를 '호미 한 치(일서)', '쟁기 한 보습(일려)' 등으로 표현하여 실질적인 강수량을 가늠하게 했습니다.\n\n3. 한양의 측우기 수위 기록 채록 : 서울에 머물거나 조보를 볼 때는 관상감과 팔도 감영에서 측우기(測雨器)로 측정한 몇 척 몇 촌 몇 분의 공식 강우량 수치를 일기에 그대로 옮겨 적었습니다.\n\n4. 18세기 소빙하기 기후 복원의 열쇠 : 오늘날 기상학자들이 18세기 한반도의 가뭄 주기, 장마 기간, 겨울철 이상 한파를 연구할 때 가장 신뢰하는 1차 기후 사료입니다.", "2-21": "1. 지역과 관청마다 달랐던 자(尺)와 되(升) : 18세기 당시에는 옷감을 재는 포백척, 건물을 짓는 영조척, 음악 피리를 재는 황종척, 토지를 재는 양전척의 길이가 서로 달랐고, 장터마다 되와 말의 크기가 달라 백성들이 세금을 낼 때 손해를 보곤 했습니다.\n\n2.《경국대전》과 고대 표준 도량형의 실측 비교 : 황윤석은 국가 법전인 《경국대전》에 규정된 표준 치수와 당시 한양·전라도에서 실제 쓰이는 자와 그릇의 크기를 직접 자로 재고 물을 부어 비교했습니다.\n\n3. 종이에 실제 길이 눈금을 그려 남긴 실증성 : 후대 사람들이 책을 베껴 쓰는 과정에서 비율이 틀어질까 봐, 표준 황종척의 실제 치수와 비율을 숫자로 거듭 명시하여 기준이 흔들리지 않게 했습니다.\n\n4. 백성을 위한 바른 눈금 : 도량형 통일이 곧 공정한 세금 수취와 상업 거래의 기본이라는 실학자의 경세 의식이 담겨 있습니다.", "2-22": "1. 사라져 가던 훈민정음 창제 당시의 28자 복원 : 18세기에는 이미 한글 창제 초기의 옛이응(ㆁ), 여린히읗(ㆆ), 반치음(ㅿ), 아래아(ㆍ) 발음이 일상에서 흔들리거나 사라져 가고 있었습니다.\n\n2. 목구멍·혀·이·입술의 발음 기관(오음) 정밀 분석 : 황윤석은 《이수신편》과 〈자모변〉에서 이 글자들이 입안의 어느 위치에서 어떻게 공기가 마찰하며 나는 소리인지 성대·구강 구조의 원리로 명쾌하게 설명했습니다.\n\n3. 훈민정음의 과학적 우수성 극찬 : 세계 여러 나라의 문자와 음운 체계를 비교하면서, 세상의 모든 소리를 다 적을 수 있는 훈민정음이야말로 천지자연의 이치에 부합하는 가장 완벽한 문자라고 높이 평가했습니다.\n\n4. 조선 후기 국어학의 최고봉 : 신경준의 《훈민정음운해》와 함께 18세기 한글 음운학 연구를 대표하는 쌍벽으로 꼽힙니다.", "2-23": "1. 중국 한자음(화음)과 한국 한자음(동음)의 대조 : 예를 들어 '하늘 천(天)'이나 '땅 지(地)'를 읽을 때 조선 선비들의 발음과 당대 청나라 베이징 사람들의 실제 발음이 왜 다른지 역사적 변천 과정을 추적했습니다.\n\n2. 조선 한자음에 살아남은 고대음(입성 받침 ㄱ·ㄹ·ㅂ) : 중국 본토(북방음)에서는 시대가 흐르며 받침 소리(입성: ㄱ, ㄹ, ㅂ)가 사라졌지만, 오히려 우리나라 한자음에는 옛 수·당·송나라 시절의 정통 고대 발음이 화석처럼 잘 보존되어 있음을 증명했습니다.\n\n3. 역관(통역관)들의 실용 발음서까지 섭렵 : 이를 규명하기 위해 사대부들이 잘 보지 않던 사역원 역관들의 중국어 발음 교재(노걸대·박통사·사성통해)까지 샅샅이 구해 읽고 대조했습니다.\n\n4. 현대 한중 비교언어학의 선구 : 오늘날 언어학자들이 고대 동아시아 한자음을 재구할 때 사용하는 연구 방법론과 놀라울 정도로 일치합니다.", "2-24": "1. 만주어(청어)·몽골어·일본어·산스크리트어(범어)까지 탐구 : 황윤석의 언어적 호기심은 한국어와 중국어에 그치지 않고, 청나라의 공용어였던 만주어(여진 문자), 몽골어, 일본어(왜어), 심지어 불경의 고대 인도 문자(범자)에까지 뻗어 있었습니다.\n\n2. 우리말과 북방 언어의 어원적 유사성 포착 : 우리말의 고유 어휘들과 만주어·몽골어의 단어를 나란히 놓고 발음과 뜻이 서로 통하는 단어들을 찾아내어 언어의 뿌리를 비교했습니다.\n\n3. 표음 문자(알파벳식 문자)의 결합 원리 비교 : 한글 자모가 자음과 모음으로 합쳐지는 방식과 만주 문자·인도 범자·일본 가나 문자의 표기 방식을 객관적으로 대조했습니다.\n\n4. 18세기 비교언어학의 탄생 : 서양에서 인도유럽어족 비교언어학이 싹트던 바로 그 시기에 조선의 시골 서재에서도 동북아 언어 비교 연구가 이루어지고 있었습니다.", "2-25": "1. 〈화음방언자의해〉에 담긴 살아있는 우리말 사전 : 황윤석은 사람들이 매일 입으로 쓰면서도 정확한 유래를 모르던 순우리말 단어 수백 개를 모아 그 뜻과 어원을 풀이했습니다.\n\n2. 음식·신체·친족 호칭의 생생한 기록 : 아버지·어머니, 아재(아저씨), 시누이 같은 가족 호칭부터 무지개, 노을, 가위, 인두, 김치, 누룩 같은 생활 단어들이 18세기에 실제로 어떻게 발음되었는지 한글과 한자로 꼼꼼히 적어두었습니다.\n\n3. 관청 문서에 쓰이던 이두(吏讀) 용어 정리 : 고문서나 소송 문서에 자주 나오는 '하올사(白活)', '분재(分財)', '다짐(侤音)' 같은 한국식 한자 숙어(이두)의 유래도 명쾌하게 정리했습니다.\n\n4. 고문서 해독의 일등 공신 : 오늘날 연구자들이 18세기 간찰이나 고문서에 나오는 난해한 생활 용어를 해석할 때 결정적인 열쇠가 되어 줍니다.", "2-26": "1. 청나라 수도 베이징(연경)을 다녀온 사신단 소식 수집 : 황윤석은 비록 직접 중국에 가지는 못했으나, 연행사로 다녀온 홍대용 등 지인들을 만날 때마다 베이징 유리창(책방 거리)과 서양 천주당의 풍경을 꼬치꼬치 물었습니다.\n\n2. 서양 선교사들과 나눈 필담(筆談) 기록 입수 : 조선 학자들이 베이징의 서양인 천문학자(할러슈타인 등)들을 찾아가 천문과 역법, 시계, 악기에 대해 한문으로 주고받은 대화록(연행록)을 빌려 밤새 베껴 읽었습니다.\n\n3. 새로 간행된 청나라의 학술 서적 목록 파악 : 현재 베이징에서 어떤 새로운 수학책과 고증학 서적이 출판되어 유통되고 있는지 서목(책 목록)을 입수해 일기에 기록했습니다.\n\n4. 앉아서 세계를 내다본 안목 : 고창과 한양에 머물면서도 동아시아의 최신 지식 트렌드를 실시간으로 흡수한 정보력을 보여줍니다.", "2-27": "1. 햇빛과 물방울이 만드는 무지개의 광학 원리 : 황윤석은 무지개를 용이 승천하는 신비 현상으로 보지 않고, 비가 갠 뒤 공기 중의 수많은 물방울에 태양 빛이 비치고 굴절되어 나타나는 자연적인 빛의 현상으로 설명했습니다.\n\n2. 음양의 기운 충돌로 설명한 천둥·번개와 우박 : 따뜻한 기운(양기)과 차가운 기운(음기)이 대기 중에서 급격히 부딪히고 억눌릴 때 천둥·번개가 치고, 여름철 높은 하늘의 찬 기운에 빗방울이 얼어 우박이 떨어진다고 분석했습니다.\n\n3. 지진과 해일에 대한 냉정한 기록 : 땅이 흔들리는 지진이 발생했을 때도 어느 방향에서 소리가 나며 기와가 얼마나 흔들렸는지 진도와 지속 시간을 과학자의 눈으로 침착하게 기록했습니다.\n\n4. 미신을 넘어선 자연학 : 자연현상에서 공포와 미신을 걷어내고 인과관계와 물리적 원리를 찾으려 한 합리주의 정신이 빛납니다.", "2-28": "1. 달의 위치에 따라 움직이는 바닷물의 호흡 : 서해 바다가 가까운 고창·부안에서 자란 황윤석은 밀물(조·潮)과 썰물(석·汐)이 태양보다 달의 차고 기욺(삭망)에 정확히 연동되어 움직인다는 사실을 깊이 연구했습니다.\n\n2. 음력 날짜별 물때(조석 시각) 계산 공식 : 보름(15일)과 그믐·초하루(1일)에는 바닷물이 가장 높이 차오르는 사리(대조)가 되고, 반달이 뜨는 7~8일과 22~23일에는 물이 가장 적게 빠지는 조금(소조)이 되는 주기를 수식으로 정리했습니다.\n\n3. 서해안 포구마다 달라지는 시간차 고려 : 같은 서해 바다라도 강화도와 충청도, 전라도 부안 줄포의 밀물 들어오는 시각이 지형에 따라 몇 시간씩 차이 나는 점을 실증적으로 기록했습니다.\n\n4. 해양 실학의 귀중한 자료 : 세곡을 나르는 조운선과 어부들의 항해에 꼭 필요한 조석 계산법을 학문적으로 체계화한 업적입니다.", "2-29": "1. 인체를 작은 우주(소우주)로 본 수리 의학 : 동양 의학과 자연학에서는 사람의 몸이 하늘과 땅의 주기(1년 365일, 12달, 24절기)와 똑같은 수학적 비율로 움직인다고 보았습니다.\n\n2. 하루 호흡 횟수(1만 3,500회)와 맥박의 계산 : 황윤석은 사람이 한 번 숨을 내쉬고 들이마시는 동안 맥박이 평균 4~5번 뛰며, 하루 온종일 약 1만 3,500번 호흡하면서 혈기가 몸속 경락을 50바퀴 순환한다는《황제내경》의 수치를 역법 계산과 대조해 검증했습니다.\n\n3. 계절과 시간에 따른 맥상의 변화 : 봄·여름·가을·겨울 사계절의 기운에 따라 정상적인 맥박의 빠르기와 깊이가 어떻게 달라지는지 정량적으로 정리했습니다.\n\n4. 생명 현상의 수학적 모델링 : 인체의 생리 현상까지 숫자와 주기로 파악하려 했던 18세기 통합 과학의 독특한 매력을 보여줍니다.", "2-30": "1. 진짜 성리학(격물치지)은 사물의 이치를 끝까지 파헤치는 것 : 당시 많은 양반 선비들이 마음 수양(심성론)에만 치우쳐 수학과 기술을 아전이나 중인들의 잡학으로 무시했으나, 황윤석은 세상의 물리적 법칙을 모르고서는 우주의 참된 도리(理)를 알 수 없다고 보았습니다.\n\n2. 주자(朱子)와 세종대왕의 전통 계승 : 원래 주자 역시 천문과 역법에 정통했고 세종대왕 대의 유학자들도 칠정산(역법)과 산학을 직접 연구했음을 들어, 과학 연구야말로 선비의 본분이라고 당당히 주장했습니다.\n\n3. 수령과 관원에게 꼭 필요한 실무 능력 : 수학과 측량을 알아야만 토지 세금을 공정하게 매기고 아전들의 장부 조작을 막아 백성을 구제할 수 있다는 철저한 실용 정신이 바탕에 있었습니다.\n\n4. 문과와 이과의 벽을 허문 융합 지성 : 인문학적 도덕성과 자연과학적 정밀성을 하나로 융합한 황윤석의 학문관은 오늘날 우리에게도 큰 울림을 줍니다.", "2-31": "1. 가뭄 극복의 핵심 기계 수차(水車) : 해마다 반복되는 삼남 지방의 가뭄을 목격한 황윤석은 낮은 개울물을 높은 논으로 끌어올리는 전통 수차(무자위)와 중국·서양식 양수 기계에 깊은 관심을 가졌습니다.\n\n2. 아르키메데스 나선식 양수기(용미차)의 원리 : 특히 서양 수리학서(태서수법 등)에 소개된 나선형 물 올리기 기계인 용미차(龍尾車)와 피스톤 원리를 이용한 옥형차의 구조를 분석하고 기록했습니다.\n\n3. 조선 지형에 맞는 실용성 검토 : 왜 중국 강남이나 서양에서는 수차가 널리 쓰이는데 조선 농촌에서는 보급이 더딘지 토질과 하천 낙차, 제작 비용 측면에서 원인을 냉정하게 짚어냈습니다.\n\n4. 농민의 땀을 덜어주려는 과학 : 과학 기술을 단순한 호기심거리가 아니라 농민의 고된 노동을 덜어줄 민생 도구로 바라본 실학적 시선입니다.", "2-32": "1. 도르래(활차)와 지렛대(권형)의 물리학 : 황윤석은 작은 힘으로 수천 근의 무거운 돌이나 목재를 들어 올리는 지렛대와 복합 도르래의 무게 분산 원리를 수학과 역학의 관점에서 탐구했습니다.\n\n2. 《기기도설》 등 서양 기계학 서적 탐독 : 서양의 각종 기계 설계도를 담은 《기기도설(奇器圖說)》의 내용을 파악하여 톱니바퀴와 물레를 결합할 때 힘이 몇 배로 증폭되는지 비례식으로 계산했습니다.\n\n3. 성곽 축조와 교량 공사에의 응용 : 이러한 역학 지식은 훗날 정조 대 수원 화성을 쌓을 때 정약용이 고안한 거중기(擧重機)가 탄생할 수 있었던 18세기 조선 지식계의 탄탄한 학문적 토양을 보여줍니다.\n\n4. 수학과 공학의 결합 : 비례 수학이 실제 건축과 토목 현장에서 어떻게 물리적 힘으로 전환되는지 잘 설명해 줍니다.", "2-33": "1. 서양에서 전해진 온도계(한열계)와 습도계(조습계) : 17~18세기 청나라를 통해 서양 선교사 페르비스트(남회인) 등이 제작한 공기와 액체의 팽창 원리를 이용한 온도계(한열계)와 습도계(조습계) 정보가 조선 실학자들에게도 전해졌습니다.\n\n2. 홍대용 등 북학파 학자들과의 기구 정보 교류 : 황윤석은 베이징을 다녀온 홍대용을 비롯한 서울 학자들과 교류하며 서양의 정밀 관측 기구들이 날씨와 공기의 건조·습윤 상태를 숫자로 눈금화한다는 사실에 주목했습니다.\n\n3. 전통 절기 관측과의 결합 : 땅속의 기운과 바람의 습도를 살피던 동양 전통의 후기법(候氣法)을 서양의 실측 기구 원리와 비교하며 기상 관측의 객관성을 높이려 했습니다.\n\n4. 정량적 기상학에 대한 열망 : 덥고 추운 정도를 단순한 느낌이 아니라 객관적 수치로 기록하려 한 근대 과학 정신의 맹아입니다.", "2-34": "1. 억·조·경·해를 넘어 무량대수까지의 큰 수 체계 : 황윤석은 《이수신편》에서 만(萬), 억(億), 조(兆), 경(京), 해(垓)부터 시작해 자, 양, 구, 간, 정, 재, 극, 항하사, 아승기, 나유타, 불가사의, 무량대수에 이르는 동양 수학의 거대 수 단위를 자릿수별로 명확히 정리했습니다.\n\n2. 바둑판 361칸과 거듭제곱의 기하급수적 증가 : 첫째 칸에 쌀 1톨, 둘째 칸에 2톨, 셋째 칸에 4톨씩 두 배로 늘려갈 때($2^n$) 바둑판이나 체스판 전체에 쌓이는 천문학적인 숫자를 거듭제곱 공식으로 정확히 산출했습니다.\n\n3. 순열과 조합의 경우의 수 계산 : 주역의 64괘가 조합되는 원리와 사물을 나열하는 경우의 수를 수학적 거듭제곱으로 명쾌하게 풀이했습니다.\n\n4. 무한대의 세계를 다룬 수학자 : 아주 작은 소수점(미·섬·사·진·애)부터 우주 크기의 거대 수까지 자유자재로 다룬 수리적 스케일을 보여줍니다.", "2-35": "1. 백두산에서 지리산까지 이어지는 산줄기와 물줄기 : 황윤석은 당대 지리학의 대가이자 절친한 학문적 동지였던 여암 신경준(《산경표》·《도로고》의 저자)과 깊이 교유하며 조선 팔도의 산맥과 수계를 정밀하게 연구했습니다.\n\n2. 한양에서 전국 각 고을까지의 도로 리수(里數) 정리 : 자신이 직접 걸어서 다닌 삼남대로의 주막 간 거리는 물론, 한양에서 전국 300여 군현까지의 이정표와 소요 일수를 꼼꼼하게 대조해 기록했습니다.\n\n3. 고지도와 역사 지리 고증 : 단군·삼국 시대부터 고려·조선에 이르기까지 각 고을의 옛 지명이 어떻게 바뀌었는지 역사 지리를 실증적으로 추적했습니다.\n\n4. 발로 뛰고 자로 잰 실학 지리 : 책상머리의 관념적 지리가 아니라 실제 여행자의 걸음 수와 천문 위도를 결합한 실용 지리학입니다.", "2-36": "1. 선비도 반드시 알아야 할 병학(군사학) : 황윤석은 문신과 학자라도 나라가 위급할 때 군사를 지휘하고 성을 지키려면 군사 과학(병학)과 무기 체계를 정확히 알아야 한다고 보았습니다.\n\n2. 화약 배합 비율과 총포의 사거리 계산 : 염초(질산칼륨), 유황, 숯을 섞어 화약을 만드는 정확한 무게 비율과 조총·화포의 탄도 및 사거리를 숫자로 정리했습니다.\n\n3. 진법(陣法)의 기하학적 배치와 병거(전차) 연구 : 수천 명의 군사가 대형을 바꾸며 이동하는 팔진도(八陣圖) 등 진법의 원리를 수학적 도형과 방위로 분석하고, 방어용 수레인 전차(병거)의 구조를 고증했습니다.\n\n4. 유비무환의 실학 정신 : 병자호란과 임진왜란의 아픈 역사를 되풀이하지 않으려 했던 18세기 지식인의 국방 의식이 담겨 있습니다.", "2-37": "1. 금석학(金石學)을 통한 역사 실증 : 종이에 적힌 책은 후대에 베껴 쓰면서 글자가 틀릴 수 있지만, 당대에 돌과 쇠에 새긴 비석(금석문)과 종(鐘)의 명문은 당시의 진실을 그대로 간직한 1차 사료라는 점에 주목했습니다.\n\n2. 간지(60갑자)와 일식 기록을 이용한 연대 역산 : 비석의 연호 글자가 닳아 없어졌을 때, 비문 속에 적힌 '무슨 달 무슨 간지 초하루'라는 달력 정보만 가지고 자신의 역법 공식으로 역산하여 그 비석이 몇 년도에 세워졌는지 정확히 찾아냈습니다.\n\n3. 전국의 옛 비석 탁본 수집과 분석 : 신라·고려 시대의 고비(古碑) 탁본을 구해 글자체와 관직명을 비교하며 역사서의 누락된 기록을 보완했습니다.\n\n4. 과학으로 역사를 풀다 : 천문 역법(과학)을 역사 고증(금석학)의 도구로 활용한 탁월한 융합 연구 사례입니다.", "2-38": "1. 이름 모를 풀과 물고기 하나도 그냥 지나치지 않는 관찰력 : 황윤석은 여행길이나 바닷가, 산속에서 특이한 식물이나 물고기, 조개, 새를 보면 그 생김새와 크기, 지방 사람들이 부르는 이름을 일기에 세밀히 적었습니다.\n\n2. 중국 문헌의 명칭과 조선 토종 생물의 비교(물명고) : 중국 본초학 책에 나오는 한자 이름의 동식물이 우리나라의 실제 어떤 풀과 나무, 물고기에 해당하는지(향약명·물명) 실물 특징을 대조해 규명했습니다.\n\n3. 서해안 해산물과 호남 특산물의 생태 기록 : 고향 고창과 부안 바닷가에서 나는 백합, 죽합, 전어, 숭어, 김, 미역 등의 채취 시기와 맛, 약효를 생생하게 남겼습니다.\n\n4. 조선 후기 박물학의 보고 : 훗날 정약전의 《자산어보》나 유희의 《물명고》로 이어지는 조선 후기 자연사·박물학 연구의 소중한 징검다리입니다.", "2-39": "1. 훈민정음 해례본의 제자(글자 만든) 원리 계승 : 황윤석은 한글의 기본 모음 세 글자인 'ㆍ(아래아)', 'ㅡ(으)', 'ㅣ(이)'가 각각 둥근 하늘(天), 평평한 땅(地), 서 있는 사람(人)의 모양을 본뜬 삼재(三才) 철학의 결정체임을 깊이 탐구했습니다.\n\n2. 음양오행과 성대 울림의 수학적 배열 : 자음(ㄱ, ㄴ, ㅁ, ㅅ, ㅇ)이 어금니·혀·입술·이·목구멍의 발음 위치에 따라 오행(목·화·토·금·수)과 5음계(각·징·궁·상·우)에 1대1로 정확히 대응하는 구조를 도표로 입증했습니다.\n\n3. 기본 글자의 결합으로 무한한 소리를 만드는 조합론 : 몇 안 되는 기본 자모의 결합(초성·중성·종성)만으로 수만 가지 소리를 생성해 내는 한글의 원리를 주역의 괘 조합 수학으로 설명했습니다.\n\n4. 언어학과 수리철학의 만남 : 한글이 왜 세계에서 가장 과학적이고 철학적인 문자인지 18세기 학자의 언어로 완벽히 논증한 기록입니다.", "2-40": "1. 팔도 사람들의 말씨와 기질 비교 : 한양에서 전국 각지에서 올라온 유생·관원들과 어울린 황윤석은 전라도, 경상도, 충청도, 경기도, 평안도, 함경도 사람들의 억양과 발음 습관을 흥미롭게 비교했습니다.\n\n2. 경상도 방언의 성조(높낮이)와 전라도 방언의 고어 보존 : 경상도 말씨에는 훈민정음 창제 당시의 글자 옆점(방점·성조)처럼 소리의 높낮이 구분이 뚜렷이 남아 있고, 전라도 말씨에는 옛 어휘와 모음이 잘 살아 있다는 점을 정확히 짚어냈습니다.\n\n3. 한양 도성 말씨의 시대적 변화 포착 : 서울 사람들도 세대가 바뀌면서 옛 발음(예: 'ㆍ' 발음이나 구개음화 현상)이 점차 어떻게 변해가고 있는지 실시간으로 관찰해 적었습니다.\n\n4. 녹음기 없던 시절의 음성 기록 : 250년 전 녹음기는 없었지만, 그의 정밀한 음운학 설명 덕분에 당시 팔도 사람들이 어떤 억양으로 대화했는지 생생히 그려볼 수 있습니다.", "2-41": "1. 사역원 역관들과의 폭넓은 교류 : 황윤석은 양반 사대부이면서도 외국어 전문가들인 사역원(통역 관청) 역관들의 학식과 어학 교재를 높이 평가하고 이들과 적극 교류했습니다.\n\n2. 실전 회화 교재 《노걸대》와 《박통사》 분석 : 당시 역관들이 중국어를 배울 때 상인들이 베이징으로 여행하며 숙소 잡기, 물건 흥정하기, 밥 사 먹기 등 실전 대화를 통째로 외우던 회화책(노걸대·박통사)의 한글 발음 표기를 면밀히 연구했습니다.\n\n3. 정음(표준 발음)과 속음(실제 회화 발음)의 이중 표기 : 중국어 한자 아래에 왼쪽에는 사전식 표준 발음을, 오른쪽에는 실제 베이징 사람들이 굴려서 발음하는 회화 발음을 한글로 나란히 적은 역관들의 정교한 학습법에 감탄했습니다.\n\n4. 실용 어학의 가치 재발견 : 죽은 문법이 아니라 살아있는 발음과 회화를 중시했던 조선 시대 외국어 교육의 높은 수준을 전해줍니다.", "2-42": "1. 조선 사대부 사회의 가장 중요한 예법 오복(五服) 제도 : 친척이 세상을 떠났을 때 나와 몇 촌 관계냐에 따라 상복을 3년, 1년(기년), 9개월(대공), 5개월(소공), 3개월(시마) 동안 입는 예법(복제)은 가문과 조정의 가장 중요한 규범이었습니다.\n\n2. 촌수와 상복 기간의 알고리즘화 : 본가(친가), 외가, 처가, 시집간 고모·누이 등 복잡하게 얽힌 친족 관계를 일일이 찾기 어렵자, 황윤석은 나를 중심에 두고 상하좌우 대칭형 도표(구족오복도)로 만들어 한눈에 촌수와 복제를 찾도록 설계했습니다.\n\n3. 왕실 전례(예송논쟁)부터 향촌 상례까지 총정리 : 역사상 치열했던 왕실의 상복 논쟁(예송)과 일반 사족 가정의 실제 사례를 비교하여 예법의 수학적 일관성을 세웠습니다.\n\n4. 예학(禮學)의 시각화 : 복잡한 인문학적 예법을 기하학적 도표와 체계 분류로 명쾌하게 정리한 정보 디자인의 모범입니다.", "2-43": "1. 관청과 농가의 필수 수학 퇴적술(堆積術) : 곡식 가마니나 쌀더미, 목재, 벽돌이 창고에 피라미드 모양이나 원뿔, 사다리꼴 모양으로 쌓여 있을 때 일일이 되로 퍼서 재지 않고도 전체 양을 구하는 수학을 '퇴적술'이라 불렀습니다.\n\n2. 가로·세로·높이만 재면 나오는 부피 공식 : 황윤석은 《이수신편》에서 네모난 창고, 둥근 뒤주, 원뿔형 곡식 더미의 밑면 둘레와 높이만 자로 재면 그 안에 쌀이 정확히 몇 석 몇 두 몇 승 들어 있는지 단번에 산출하는 공식을 정리했습니다.\n\n3. 지방 수령 시절 환곡 창고 실사에 직접 활용 : 실제로 그가 목천현감과 전의현감으로 부임했을 때 관아 창고에 쌓인 환곡 더미의 가로·세로·높이만 재어보고 아전들이 보고한 장부의 허위 수량을 그 자리에서 적발해 냈습니다.\n\n4. 부패를 잡는 실전 수학 : 수학 공식 하나가 어떻게 행정의 투명성을 높이고 백성의 곡식을 지켜냈는지 보여주는 통쾌한 사례입니다.", "2-44": "1. 해 그림자 길이를 재는 규표(圭表) 관측 : 낮 12시(정오)에 수직으로 세운 막대기(표)의 그림자 길이가 일 년 중 가장 짧은 하지와 가장 긴 동지에 각각 몇 자 몇 치인지 실측하여 태양의 남중고도를 구했습니다.\n\n2. 밤하늘 북극성 고도와 위도의 일치 : 밤에는 각도기가 달린 관측 기구로 지평선에서 북극성까지의 각도(북극고도)를 재면 그것이 곧 내가 서 있는 지역의 위도가 된다는 천문 원리를 명확히 설명했습니다.\n\n3. 한양(북위 약 37.5도)과 고창(북위 약 35.5도)의 차이 인식 : 북쪽으로 갈수록 북극성이 높아지고 겨울 낮 길이가 짧아지며, 남쪽인 전라도 고창으로 내려올수록 북극성이 약 2도 낮아진다는 사실을 수치로 파악했습니다.\n\n4. 내 발밑의 위치를 우주 속에서 찾다 : GPS 위성이 없던 18세기에 오직 별빛과 해 그림자, 삼각법만으로 한반도의 정확한 지구상 좌표를 계산해 냈습니다.", "2-4
